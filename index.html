<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-main: #18100a; --bg-surface: rgba(38, 25, 16, 0.95); --bg-card: rgba(58, 39, 25, 0.85);
      --bg-elevated: #4a3220; --border: rgba(212, 168, 125, 0.22); --text: #fdfaf6; --muted: #c7ad94;
      --primary: #c88a4b; --primary-dark: #9e652b; --primary-glow: rgba(200, 138, 75, 0.35);
      --accent: #e6b88a; --emerald: #10b981; --danger: #ef4444; --amber: #f59e0b; --radius: 20px;
    }
    body.light-mode {
      --bg-main: #f6f0e8; --bg-surface: rgba(255, 255, 255, 0.96); --bg-card: #ede3d5;
      --bg-elevated: #e2d4c1; --border: rgba(110, 71, 35, 0.16); --text: #291a0d; --muted: #785a3f;
      --primary: #8c5523; --primary-dark: #663b14; --primary-glow: rgba(140, 85, 35, 0.25); --accent: #b07238;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-main) radial-gradient(at 15% 10%, rgba(200, 138, 75, 0.16) 0px, transparent 50%) fixed;
      color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
    }
    #splashScreen {
      position: fixed; inset: 0; background: var(--bg-main); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      animation: autoHide 0.4s ease 1.5s forwards;
    }
    @keyframes autoHide { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    .splash-logo {
      width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
    }
    .splash-title { font-weight: 900; font-size: 2.2rem; color: var(--text); }
    header {
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-surface);
      backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #fff;
    }
    .brand-title { font-weight: 900; font-size: 1.25rem; }
    .icon-pill {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 50px; font-size: 0.82rem; font-weight: 800; cursor: pointer;
    }
    main { max-width: 680px; width: 100%; margin: 0 auto; padding: 14px 12px 60px; flex: 1; }
    .card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 16px; margin-bottom: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }
    h2 { font-size: 1.18rem; font-weight: 900; margin-bottom: 4px; text-align: center; }
    p.sub { color: var(--muted); font-size: 0.82rem; text-align: center; margin-bottom: 14px; line-height: 1.5; }
    .welcome-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px;
      background: var(--bg-card); padding: 5px; border-radius: 14px; border: 1px solid var(--border);
    }
    .w-tab { padding: 10px 8px; border-radius: 10px; border: none; background: transparent; color: var(--muted); font-weight: 800; font-size: 0.85rem; cursor: pointer; }
    .w-tab.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
    .input {
      width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--border);
      background: var(--bg-card); color: var(--text); font-size: 0.94rem; font-weight: 700; margin-bottom: 12px; outline: none; text-align: center;
    }
    .input::placeholder { color: var(--muted); opacity: 0.8; }
    .input:focus, .input.custom-active { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .btn {
      width: 100%; padding: 13px 18px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text); font-size: 0.95rem; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 10px; box-shadow: 0 4px 0 rgba(0,0,0,0.22); transition: 0.12s;
    }
    .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: 1px solid var(--accent); color: #fff; }
    .btn-emerald { background: linear-gradient(135deg, #059669, #10b981); border: none; color: #fff; }
    .section-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
    .section-tag {
      display: inline-block; background: var(--bg-elevated); border: 1px solid var(--border);
      padding: 4px 12px; border-radius: 50px; font-size: 0.74rem; font-weight: 800; margin-bottom: 10px;
    }
    .vibe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .vibe-card { background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 6px; text-align: center; cursor: pointer; }
    .vibe-card .v-ico { font-size: 1.2rem; display: block; }
    .vibe-card strong { font-size: 0.75rem; display: block; }
    .vibe-card small { font-size: 0.63rem; color: var(--muted); display: block; }
    .vibe-card.active { background: linear-gradient(145deg, var(--primary), var(--primary-dark)); border-color: #fff; }
    .vibe-card.active strong, .vibe-card.active small { color: #fff; }
    .topic-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
    .topic-chip { padding: 7px 12px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--bg-surface); color: var(--muted); font-size: 0.78rem; font-weight: 800; cursor: pointer; }
    .topic-chip.active { background: var(--primary); border-color: #fff; color: #fff; }
    .settings-stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .setting-row-inline { background: var(--bg-card); border: 1px solid var(--border); padding: 7px 10px; border-radius: 13px; display: flex; align-items: center; justify-content: space-between; }
    .setting-row-inline label { font-size: 0.76rem; font-weight: 800; color: var(--muted); }
    .seg-group { display: flex; gap: 5px; }
    .seg-btn { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--muted); font-size: 0.75rem; font-weight: 800; cursor: pointer; }
    .seg-btn.active { background: var(--primary); color: #fff; border-color: var(--accent); }
    .qr-wrap { background: #fff; padding: 12px; border-radius: 18px; width: fit-content; margin: 8px auto 14px; border: 3px solid var(--primary); }
    .pin-boxes { display: flex; justify-content: center; gap: 8px; margin: 6px 0 14px; direction: ltr; }
    .pin-digit { width: 48px; height: 54px; border-radius: 14px; background: var(--bg-card); border: 2px solid var(--primary); font-size: 1.55rem; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .players-wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
    .p-badge { background: var(--bg-card); border: 1.5px solid var(--primary); padding: 6px 13px; border-radius: 50px; font-weight: 800; font-size: 0.84rem; display: inline-flex; align-items: center; gap: 6px; }
    .kick-btn { background: rgba(239,68,68,0.22); border: none; color: var(--danger); width: 20px; height: 20px; border-radius: 50%; cursor: pointer; }
    .quiz-top-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 800; font-size: 0.84rem; }
    .source-tag { font-size: 0.74rem; padding: 3px 10px; border-radius: 50px; background: var(--bg-card); border: 1px solid var(--border); color: var(--accent); }
    .timer-track { height: 10px; background: var(--bg-card); border-radius: 50px; overflow: hidden; margin-bottom: 14px; border: 1px solid var(--border); }
    .timer-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--primary), var(--danger)); transition: width 0.95s linear; }
    .q-banner { font-size: 1.12rem; font-weight: 900; text-align: center; padding: 18px 14px; background: var(--bg-card); border-radius: 16px; border: 1.5px solid var(--border); margin-bottom: 14px; line-height: 1.65; }
    .opts-list { display: grid; gap: 10px; }
    .opt-card { padding: 12px 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 0.94rem; font-weight: 800; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .opt-right { display: flex; align-items: center; gap: 10px; text-align: right; }
    .opt-num { width: 30px; height: 30px; border-radius: 9px; background: var(--bg-surface); border: 1px solid var(--border); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
    .opt-card.selected { border-color: var(--primary); background: var(--bg-elevated); }
    .opt-card.selected .opt-num { background: var(--primary); color: #fff; }
    .opt-card.correct { border-color: var(--emerald); background: rgba(16,185,129,0.28); }
    .opt-card.correct .opt-num { background: var(--emerald); color: #fff; }
    .opt-card.wrong { border-color: var(--danger); background: rgba(239,68,68,0.25); }
    .opt-card.wrong .opt-num { background: var(--danger); color: #fff; }
    .gain-badge { background: rgba(16,185,129,0.22); color: var(--emerald); border: 1px solid var(--emerald); padding: 2px 8px; border-radius: 50px; font-size: 0.74rem; margin-right: 6px; }
    .next-auto-banner { margin-top: 14px; padding: 10px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--primary); text-align: center; font-weight: 800; font-size: 0.85rem; }
    .leader-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 8px; font-weight: 800; font-size: 0.9rem; }
    .leader-row.first { background: linear-gradient(90deg, rgba(200,138,75,0.28), var(--bg-card)); border-color: var(--primary); }
    .comedy-grid { display: grid; gap: 12px; margin: 16px 0; text-align: right; }
    .comedy-card { padding: 15px; border-radius: 16px; line-height: 1.7; font-size: 0.92rem; font-weight: 700; }
    .comedy-card.winner-box { background: rgba(16,185,129,0.14); border: 1.5px solid var(--emerald); }
    .comedy-card.loser-box { background: rgba(200,138,75,0.15); border: 1.5px solid var(--primary); }
    .comedy-head { font-weight: 900; font-size: 0.96rem; margin-bottom: 5px; }
    .countdown-overlay { text-align: center; padding: 46px 20px; }
    .countdown-num { font-size: 4.8rem; font-weight: 900; color: var(--primary); }
    .toast-msg { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); border: 1.5px solid var(--primary); color: var(--text); padding: 10px 18px; border-radius: 50px; font-size: 0.82rem; font-weight: 800; z-index: 400; text-align: center; max-width: 90vw; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.78); display: none; align-items: center; justify-content: center; z-index: 250; padding: 14px; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 480px; width: 100%; padding: 20px; }
    .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 400px) { .vibe-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <div id="splashScreen" onclick="this.remove()">
    <div class="splash-logo">☕</div>
    <div class="splash-title">مەجلیس</div>
  </div>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="brand-icon">☕</div>
      <div class="brand-title">مەجلیس</div>
    </div>
    <button class="icon-pill" onclick="toggleModal('settingsModal', true)">⚙️ دەستکاری</button>
  </header>

  <main id="appContainer"></main>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <h3 style="margin-bottom:14px; text-align:center;">⚙️ دەستکاری و ڕێکخستن</h3>
      <button class="btn" onclick="toggleThemeMode()">🌓 گۆڕینی دۆخی قاوەیی تۆخ / سپی</button>
      <button class="btn" onclick="toggleSound()" id="soundBtnLabel">🔊 دەنگی یاری: چالاکە</button>
      <button class="btn" onclick="openCustomQModal()">✍️ زیادکردنی پرسیاری تایبەت</button>
      <button class="btn" onclick="openKeySetupModal()">🔑 دانانی کلیل</button>
      <button class="btn" onclick="clearAskedHistory(); toggleModal('settingsModal', false);">🔄 سفرکردنەوەی مێژووی پرسیارەکان</button>
      <button class="btn btn-primary" style="margin-bottom:0;" onclick="toggleModal('settingsModal', false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="keySetupModal">
    <div class="modal-box">
      <h3 style="margin-bottom:8px; text-align:center;">🔑 دانانی کلیلی تایبەت</h3>
      <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px; text-align:center;">
        کلیلەکەت لێرە دابنێ (<strong>AQ.Ab8...</strong> یان <strong>AIzaSy...</strong>):
      </p>
      <input type="text" id="masterKeyInput" class="input" dir="ltr" placeholder="AQ.Ab8... / AIzaSy..." />
      <div id="keyCheckStatus" style="font-size:0.8rem; text-align:center; margin-bottom:10px; font-weight:800;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="toggleModal('keySetupModal', false)">داخستن</button>
        <button class="btn btn-primary" id="saveKeyBtn" onclick="saveAndTestMasterKey()">💾 خەزنکردن</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="customQModal">
    <div class="modal-box">
      <h3 style="margin-bottom:8px;">✍️ زیادکردنی پرسیاری تایبەت</h3>
      <input type="text" id="cqText" class="input" placeholder="دەقی پرسیارەکە..." style="text-align:right;" />
      <input type="text" id="cqOpt0" class="input" placeholder="وەڵامی ڕاست ✅" style="text-align:right; border-color:var(--emerald);" />
      <input type="text" id="cqOpt1" class="input" placeholder="هەڵبژاردەی هەڵەی ١" style="text-align:right;" />
      <input type="text" id="cqOpt2" class="input" placeholder="هەڵبژاردەی هەڵەی ٢" style="text-align:right;" />
      <input type="text" id="cqOpt3" class="input" placeholder="هەڵبژاردەی هەڵەی ٣" style="text-align:right;" />
      <div id="customQStatus" style="font-size:0.78rem; color:var(--emerald); text-align:center; margin-bottom:8px;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="toggleModal('customQModal', false); render();">داخستن</button>
        <button class="btn btn-primary" onclick="saveCustomQuestion()">➕ زیادکردن</button>
      </div>
    </div>
  </div>

  <script>
    const KEYS = { API: 'MAJLIS_MASTER_KEY', SEEN: 'MAJLIS_SEEN_HISTORY', CUSTOM: 'MAJLIS_CUSTOM_QUESTIONS', NAME: 'MAJLIS_PLAYER_NAME', ID: 'MAJLIS_PLAYER_ID', THEME: 'MAJLIS_THEME_MODE' };
    function safeGetJSON(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch (e) { return def; } }

    if (localStorage.getItem(KEYS.THEME) === 'light') document.body.classList.add('light-mode');
    setTimeout(() => document.getElementById('splashScreen')?.remove(), 1800);

    function extractCleanKey(raw) {
      if (!raw) return '';
      const s = String(raw).trim();
      const m = s.match(/(?:AQ\.|AIza|sk-or-)[A-Za-z0-9_-]{20,}/);
      return m ? m[0] : s.replace(/['"\s]/g, '');
    }

    let persistentId = localStorage.getItem(KEYS.ID) || ('U_' + Math.random().toString(36).substring(2, 9));
    localStorage.setItem(KEYS.ID, persistentId);
    let customQuestions = safeGetJSON(KEYS.CUSTOM, []);
    let seenQuestions = safeGetJSON(KEYS.SEEN, []);

    function normalizeDigits(str) {
      const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
      return String(str || '').replace(/[٠-٩۰-۹]/g, d => map[d] || d).trim();
    }

    const QUESTION_VIBES = [
      { id: 'friends', icon: '☕', title: 'دانیشتنی هاوڕێیان', desc: 'گەنجانە و گەعدە', hint: 'دانیشتنی گەنجانە و کافتریا' },
      { id: 'camping', icon: '🏕️', title: 'گەشت و کامپینگ', desc: 'سەیران و سروشت', hint: 'کەشی سەیران و چای سەر خەڵووز' },
      { id: 'family', icon: '👨‍👩‍👧‍👦', title: 'دانیشتنی خێزانی', desc: 'کەلتووری و خێزانی', hint: 'دانیشتنی خێزانیی کوردەواری' },
      { id: 'academic', icon: '🎓', title: 'زانکۆ و ڕۆشنبیری', desc: 'ئەکادیمی و خوێندکاری', hint: 'خوێندکارانی زانکۆ و تاقیکردنەوە' },
      { id: 'funny', icon: '😂', title: 'کۆمیدی', desc: 'تەنز و پێکەنین', hint: 'شێوازێکی زۆر کۆمیدی و نوکتەئامێز' },
      { id: 'challenge', icon: '🔥', title: 'تەحەدای بلیمەتەکان', desc: 'کێبڕکێی توند', hint: 'تەحەدای پاڵەوانان و بلیمەتەکان' }
    ];

    const PRESET_TOPICS = [
      'یاسا و دادگا و دەستوور', 'گەشت و کامپینگ و سروشت', 'مێژوو و جوگرافیای کوردستان',
      'زانیاری گشتی جۆراوجۆر', 'تۆپی پێ و وەرزشی جیهانی', 'مەتەڵ و زیرەکی',
      'زانیاری ئایینی و قورئان', 'پرسیارەکانی خۆم (تایبەت)'
    ];

    let state = {
      welcomeTab: 'host', role: null, screen: 'welcome', myId: persistentId,
      myName: localStorage.getItem(KEYS.NAME) || '', masterKey: extractCleanKey(localStorage.getItem(KEYS.API) || ''),
      roomCode: '', selectedVibeIds: ['friends'], selectedTopics: [PRESET_TOPICS[0]], customTopicText: '',
      difficulty: 'مامناوەند', questionLimit: 6, questionDuration: 15, soundOn: true,
      generatingAI: false, generatingComedy: false, connecting: false, countdownVal: 10, revealCountdown: 5,
      timerInterval: null, revealInterval: null, mqttClient: null, players: [], questions: [],
      qIndex: 0, timeLeft: 15, revealAnswer: false, comedyResult: { winnerJoke: '', loserJoke: '' }
    };

    const urlRoom = new URLSearchParams(window.location.search).get('room');
    if (urlRoom) {
      state.roomCode = normalizeDigits(urlRoom);
      state.welcomeTab = 'join';
      setTimeout(() => { if (state.myName.trim() && state.screen === 'welcome') joinHostRoom(); }, 1900);
    }

    function toggleModal(id, show) { document.getElementById(id)?.classList.toggle('open', show); }
    function showToast(msg) {
      document.querySelector('.toast-msg')?.remove();
      const t = document.createElement('div'); t.className = 'toast-msg'; t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
    }

    let audioCtx = null;
    function playTone(type) {
      if (!state.soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        osc.frequency.setValueAtTime(type === 'correct' ? 650 : (type === 'wrong' ? 180 : 800), now);
        gain.gain.setValueAtTime(type === 'tick' ? 0.04 : 0.12, now);
        osc.start(); osc.stop(now + (type === 'tick' ? 0.05 : 0.25));
      } catch (e) {}
    }

    function toggleThemeMode() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem(KEYS.THEME, isLight ? 'light' : 'dark');
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      document.getElementById('soundBtnLabel').textContent = state.soundOn ? '🔊 دەنگی یاری: چالاکە' : '🔇 دەنگی یاری: بێدەنگە';
    }

    function markQuestionSeen(qText) {
      if (!seenQuestions.includes(qText)) {
        seenQuestions.push(qText);
        if (seenQuestions.length > 400) seenQuestions.shift();
        try { localStorage.setItem(KEYS.SEEN, JSON.stringify(seenQuestions)); } catch (e) {}
      }
    }

    function clearAskedHistory() { seenQuestions = []; localStorage.removeItem(KEYS.SEEN); showToast('✅ مێژووی پرسیارەکان سفر کرایەوە!'); }

    function toggleMultiSelect(arr, item) {
      const i = arr.indexOf(item);
      if (i > -1) { if (arr.length > 1) arr.splice(i, 1); } else arr.push(item);
      render();
    }

    function handleTopicChipClick(t) { state.customTopicText = ''; toggleMultiSelect(state.selectedTopics, t); }
    function handleCustomTopicInput(v) {
      state.customTopicText = v;
      const has = v.trim().length > 0;
      document.querySelectorAll('.topic-chip').forEach(c => has && c.classList.remove('active'));
      document.getElementById('customTopicInp')?.classList.toggle('custom-active', has);
      if (!has) render();
    }

    const getActiveTopicsSummary = () => state.customTopicText.trim() || state.selectedTopics.join(' + ');
    const getActiveVibesObjects = () => {
      const l = QUESTION_VIBES.filter(v => state.selectedVibeIds.includes(v.id));
      return l.length ? l : [QUESTION_VIBES[0]];
    };

    function fetchTimeout(url, opts, ms = 11000) {
      return Promise.race([fetch(url, opts), new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout')), ms))]);
    }

    async function callGoogleWithKey(key, prompt) {
      const endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';
      const body = JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] });
      const attempts = [
        () => fetchTimeout(`${endpoint}?key=${encodeURIComponent(key)}`, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body }, 9000),
        () => fetchTimeout(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-goog-api-key': key }, body }, 9000),
        () => fetchTimeout(`https://corsproxy.io/?${encodeURIComponent(endpoint)}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-goog-api-key': key }, body }, 11000),
        () => fetchTimeout(`https://corsproxy.io/?${encodeURIComponent(`${endpoint}?key=${key}`)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }, 11000)
      ];
      for (const fn of attempts) {
        try {
          const r = await fn();
          if (r.ok) {
            const d = await r.json();
            const txt = d?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            if (txt) return txt;
          }
        } catch (e) {}
      }
      throw new Error('KEY_FAILED');
    }

    async function callAIRawText(prompt, shortPrompt) {
      if (state.masterKey) {
        try { return await callGoogleWithKey(state.masterKey, prompt); } catch (e) {}
      }
      const seed = Math.floor(Math.random() * 999999);
      const urls = [
        () => fetchTimeout('https://text.pollinations.ai/openai', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'openai', messages: [{ role: 'user', content: prompt }], seed })
        }, 11000).then(r => r.json()).then(d => d?.choices?.[0]?.message?.content || ''),
        () => fetchTimeout(`https://text.pollinations.ai/${encodeURIComponent(shortPrompt)}?model=openai&seed=${seed}`, { method: 'GET' }, 11000).then(r => r.text())
      ];
      for (const fn of urls) {
        try { const txt = await fn(); if (txt && txt.length > 10) return txt; } catch (e) {}
      }
      return null;
    }

    function parseQuestions(rawText, count) {
      if (!rawText) return null;
      const text = String(rawText).replace(/```json|```/gi, '').trim();
      let items = [];
      try {
        const s = text.indexOf('['), e = text.lastIndexOf(']');
        if (s !== -1 && e !== -1) items = JSON.parse(text.substring(s, e + 1));
      } catch (_) {
        items = (text.match(/\{[^{}]*"(?:q|question)"[^{}]*\}/g) || []).map(m => { try { return JSON.parse(m); } catch (e) { return null; } });
      }
      if (!Array.isArray(items)) return null;
      const out = [];
      for (const it of items) {
        if (!it) continue;
        const q = String(it.q || it.question || '').trim();
        const optsRaw = it.opts || it.options || it.choices;
        if (!q || !Array.isArray(optsRaw) || optsRaw.length < 4) continue;
        const opts = optsRaw.slice(0, 4).map(o => String(o).trim());
        const ansIdx = (typeof it.ans === 'number' && it.ans >= 0 && it.ans < 4) ? it.ans : 0;
        const correct = opts[ansIdx];
        const shuffled = [...opts].sort(() => Math.random() - 0.5);
        markQuestionSeen(q);
        out.push({ q, opts: shuffled, ans: shuffled.indexOf(correct) });
      }
      return out.length ? out.slice(0, count) : null;
    }

    async function generateAIQuestions(topicsList, customTopic, count, difficulty) {
      const topic = customTopic || topicsList.join(' و ');
      if (!customTopic && topicsList.length === 1 && topicsList[0] === 'پرسیارەکانی خۆم (تایبەت)') {
        if (!customQuestions.length) return showToast('⚠️ هیچ پرسیارێکی تایبەتت زیاد نەکردووە!'), null;
        return [...customQuestions].sort(() => Math.random() - 0.5).slice(0, count);
      }
      const seed = Math.floor(Math.random() * 9999999);
      const avoid = seenQuestions.slice(-15).join(' | ');
      const prompt = `تکایە رێک ${count} پرسیاری هەڵبژاردن (٤ هەڵبژاردەیی) بە کوردیی سۆرانی تەنها لەسەر (${topic}) بە ئاستی (${difficulty}) دروست بکە (ژمارە: ${seed}). دووربە لەم پرسیارانە: [${avoid}]. تەنها JSON Array بنێرە: [{"q":"پرسیار؟","opts":["١","٢","٣","٤"],"ans":0}]`;
      const shortP = `Generate ${count} unique Kurdish Sorani multiple choice questions about (${topic}), difficulty (${difficulty}), seed ${seed}. Return ONLY raw JSON array: [{"q":"...","opts":["1","2","3","4"],"ans":0}]`;

      const parsed = parseQuestions(await callAIRawText(prompt, shortP), count);
      if (parsed?.length) return parsed;
      showToast('⚠️ پەیوەندی سەرکەوتوو نەبوو، تکایە دووبارە هەوڵ بدەرەوە');
      return null;
    }

    async function generateAIComedyCommentary() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0] || { name: 'پاڵەوان', score: 0 };
      const loserNames = state.players.length > 1 ? sorted.slice(1).map(p => p.name).join(' و ') : 'ئەوانی تر';
      const vibe = getActiveVibesObjects().map(v => v.hint).join(' و ');
      const seed = Math.floor(Math.random() * 999999);
      const prompt = `بە کوردیی سۆرانی دوو ڕستەی کۆمیدی بنووسە بە شێوازی (${vibe}) بۆ براوە (${winner.name}) و دۆڕاوەکان (${loserNames}) کۆد ${seed}. تەنها JSON: {"winnerJoke":"...","loserJoke":"..."}`;
      const raw = await callAIRawText(prompt, prompt);
      try {
        const s = raw.indexOf('{'), e = raw.lastIndexOf('}');
        if (s !== -1 && e !== -1) {
          const obj = JSON.parse(raw.substring(s, e + 1));
          if (obj.winnerJoke && obj.loserJoke) return obj;
        }
      } catch (e) {}
      return {
        winnerJoke: `بژی ${winner.name}! بەم زیرەکییەت سەلماندت کە سەردەستەی ئەم مەجلیسەیت!`,
        loserJoke: `بەداخەوە بۆ (${loserNames})! ئەمشەو چا لێنان و خزمەتکردنی مەجلیسەکە لەسەر ئێوەیە!`
      };
    }

        </div>
        <div class="settings-stack">
          <div class="setting-row-inline"><label>ژمارەی پرسیار:</label><div class="seg-group">${[6, 8, 10, 14].map(n => `<button class="seg-btn ${state.questionLimit === n ? 'active' : ''}" onclick="state.questionLimit=${n}; render();">${n}</button>`).join('')}</div></div>
          <div class="setting-row-inline"><label>ئاستی قورسی:</label><div class="seg-group">${[{v:'ئاسان',l:'ئاسان'},{v:'مامناوەند',l:'مامناوەند'},{v:'قورس و زیرەکانە',l:'قورس'}].map(d => `<button class="seg-btn ${state.difficulty === d.v ? 'active' : ''}" onclick="state.difficulty='${d.v}'; render();">${d.l}</button>`).join('')}</div></div>

    async function shareInviteNative(url) {
      const text = `☕ وەرنە ناو پێشبڕکێی مەجلیس! کۆدی ژوور: (${state.roomCode})`;
      if (navigator.share) { try { await navigator.share({ title: 'مەجلیس', text, url }); return; } catch (e) {} }

    function kickPlayer(id) { state.players = state.players.filter(p => p.id !== id); syncAllPlayers(); render(); }

    function connectMqttBroker(cb) {
      try { state.mqttClient?.end(true); } catch (e) {}
      if (typeof mqtt === 'undefined') { state.connecting = false; render(); return showToast('⚠️ تکایە پەڕەکە ڕیفرێش بکەرەوە'); }
      const c = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: 'mj_' + state.myId + '_' + Math.random().toString(16).slice(2, 6), clean: true, connectTimeout: 7000 });
      state.mqttClient = c;
      c.on('connect', () => cb(c));
      c.on('error', () => { if (state.connecting) { state.connecting = false; showToast('⚠️ کێشە لە پەیوەندیی ئینتەرنێتدا هەیە'); render(); } });
    }

    function startHostRoom() {
      const name = state.myName.trim();
      if (!name) return showToast('⚠️ تکایە سەرەتا ناوی خۆت بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      Object.assign(state, { role: 'host', connecting: true, roomCode: String(Math.floor(1000 + Math.random() * 9000)) });
      render();
      const actTopic = `majlis_v18/room/${state.roomCode}/action`;
      connectMqttBroker(c => {
        c.subscribe(actTopic, { qos: 1 }, () => {
          state.connecting = false;
          state.players = [{ id: state.myId, name, score: 0, lastGain: 0, streak: 0, currentAnswer: null, answerTime: 0 }];
          state.screen = 'lobby'; syncAllPlayers(); render();
        });
        c.on('message', (t, m) => { if (t === actTopic) { try { onHostReceiveData(JSON.parse(m.toString())); } catch (e) {} } });
      });
    }

    function joinHostRoom() {
      const name = state.myName.trim(), code = normalizeDigits(state.roomCode);
      state.roomCode = code;
      if (!name || !code) return showToast('⚠️ تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      Object.assign(state, { role: 'player', connecting: true }); render();
      const stTopic = `majlis_v18/room/${code}/state`, actTopic = `majlis_v18/room/${code}/action`;
      connectMqttBroker(c => {
        let ok = false;
        const tm = setTimeout(() => { if (!ok && state.connecting) { state.connecting = false; showToast('⚠️ ئەم کۆدی ژوورە نەدۆزرایەوە!'); render(); } }, 7000);
        c.subscribe(stTopic, { qos: 1 }, () => c.publish(actTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name }), { qos: 1 }));
        c.on('message', (t, m) => {
          if (t === stTopic) {
            try {
              const d = JSON.parse(m.toString()); ok = true; clearTimeout(tm); state.connecting = false;
              onPlayerReceiveData(d);
              if (d.players && !d.players.some(p => p.id === state.myId)) c.publish(actTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name }), { qos: 1 });
            } catch (e) {}
          }
        });
      });
    }

    function onHostReceiveData(d) {
      if (d.type === 'JOIN') {
        const ex = state.players.find(p => p.id === d.id);
        if (ex) ex.name = d.name;
        else state.players.push({ id: d.id, name: d.name, score: 0, lastGain: 0, streak: 0, currentAnswer: null, answerTime: 0 });
        syncAllPlayers(); render();
      } else if (d.type === 'ANSWER') {
        const p = state.players.find(x => x.id === d.id);
        if (p && !state.revealAnswer) Object.assign(p, { currentAnswer: d.ansIdx, answerTime: state.timeLeft });
      }
    }

    function onPlayerReceiveData(d) {
      if (d.type === 'TIMER_TICK') {
        state.timeLeft = d.timeLeft;
        const l = document.getElementById('liveTimeLabel'), f = document.getElementById('liveTimeFill');
        if (l) l.textContent = `⏱️ ${state.timeLeft} چرکە`;
        if (f) f.style.width = `${Math.max(0, (state.timeLeft / state.questionDuration) * 100)}%`;
        return;
      }
      if (d.type === 'REVEAL_TICK') {
        state.revealCountdown = d.revealCountdown;
        const el = document.getElementById('autoNextBanner');
        if (el) el.textContent = state.qIndex + 1 < state.questions.length ? `⏳ پرسیاری دواتر دوای ${state.revealCountdown} چرکەی تر...` : `🏆 ئەنجامی کۆتایی دوای ${state.revealCountdown} چرکەی تر...`;
        return;
      }
      if (d.type === 'SYNC') {
        const prevRev = state.revealAnswer, prevQ = state.qIndex;
        Object.assign(state, { screen: d.screen, countdownVal: d.countdownVal, qIndex: d.qIndex, timeLeft: d.timeLeft, questionDuration: d.questionDuration, revealAnswer: d.revealAnswer, revealCountdown: d.revealCountdown || 5, comedyResult: d.comedyResult || state.comedyResult });
        const myOld = state.players.find(p => p.id === state.myId);
        const keep = !d.revealAnswer && prevQ === d.qIndex && myOld;
        state.players = d.players.map(p => (p.id === state.myId && keep) ? { ...p, currentAnswer: myOld.currentAnswer } : p);
        if (d.currentQuestion) { state.questions = new Array(d.totalQuestions).fill(null); state.questions[state.qIndex] = d.currentQuestion; }
        if (!prevRev && state.revealAnswer && state.screen === 'playing') {
          const me = state.players.find(p => p.id === state.myId);
          playTone(me && me.currentAnswer === state.questions[state.qIndex]?.ans ? 'correct' : 'wrong');
        }
        render();
      }
    }

    function broadcastPayload(p, retain = false) {
      if (state.role === 'host' && state.mqttClient && state.roomCode) {
        state.mqttClient.publish(`majlis_v18/room/${state.roomCode}/state`, JSON.stringify(p), { qos: retain ? 1 : 0, retain });
      }
    }

    function syncAllPlayers() {
      if (state.role !== 'host') return;
      const q = state.questions[state.qIndex];
      broadcastPayload({
        type: 'SYNC', screen: state.screen, countdownVal: state.countdownVal,
        players: state.players.map(p => ({ id: p.id, name: p.name, score: p.score, lastGain: state.revealAnswer ? p.lastGain : 0, streak: p.streak, currentAnswer: state.revealAnswer ? p.currentAnswer : null })),
        currentQuestion: q ? { q: q.q, opts: q.opts, ans: state.revealAnswer ? q.ans : null } : null,
        totalQuestions: state.questions.length, qIndex: state.qIndex, timeLeft: state.timeLeft,
        questionDuration: state.questionDuration, revealAnswer: state.revealAnswer, revealCountdown: state.revealCountdown, comedyResult: state.comedyResult
      }, true);
    }

    async function hostStartCompetition() {
      if (state.generatingAI) return;
      state.generatingAI = true; render();
      const gen = await generateAIQuestions(state.selectedTopics, state.customTopicText.trim(), state.questionLimit, state.difficulty);
      state.generatingAI = false;
      if (!gen?.length) return render();
      state.questions = gen; state.qIndex = 0;
      state.players.forEach(p => Object.assign(p, { score: 0, lastGain: 0, streak: 0, currentAnswer: null }));
      clearInterval(state.timerInterval); Object.assign(state, { screen: 'countdown', countdownVal: 10 });
      syncAllPlayers(); render(); playTone('tick');
      state.timerInterval = setInterval(() => {
        state.countdownVal--;
        if (state.countdownVal <= 0) { clearInterval(state.timerInterval); state.screen = 'playing'; beginQuestionCountdown(); }
        else { playTone('tick'); syncAllPlayers(); render(); }
      }, 1000);
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { timeLeft: state.questionDuration, revealAnswer: false });
      state.players.forEach(p => Object.assign(p, { currentAnswer: null, answerTime: 0, lastGain: 0 }));
      syncAllPlayers(); render();
      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');
        if (state.timeLeft <= 0) revealQuestionResult();
        else {
          onPlayerReceiveData({ type: 'TIMER_TICK', timeLeft: state.timeLeft });
          broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft }, false);
        }
      }, 1000);
    }

    function submitPlayerAnswer(idx) {
      const me = state.players.find(p => p.id === state.myId);
      if (!me || state.revealAnswer) return;
      Object.assign(me, { currentAnswer: idx, answerTime: state.timeLeft }); render();
      if (state.role === 'player' && state.mqttClient && state.roomCode) {
        state.mqttClient.publish(`majlis_v18/room/${state.roomCode}/action`, JSON.stringify({ type: 'ANSWER', id: state.myId, ansIdx: idx }), { qos: 1 });
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { revealAnswer: true, revealCountdown: 5 });
      const q = state.questions[state.qIndex];
      state.players.forEach(p => {
        if (p.currentAnswer === q.ans) {
          p.streak = (p.streak || 0) + 1;
          p.lastGain = 100 + Math.round((p.answerTime / state.questionDuration) * 60) + (p.streak >= 2 ? 25 : 0);
          p.score += p.lastGain;
        } else { p.streak = 0; p.lastGain = 0; }
      });
      const me = state.players.find(p => p.id === state.myId);
      playTone(me && me.currentAnswer === q.ans ? 'correct' : 'wrong');
      syncAllPlayers(); render();
      if (state.role === 'host') {
        state.revealInterval = setInterval(() => {
          state.revealCountdown--;
          if (state.revealCountdown <= 0) { clearInterval(state.revealInterval); advanceToNextQuestion(); }
          else {
            onPlayerReceiveData({ type: 'REVEAL_TICK', revealCountdown: state.revealCountdown });
            broadcastPayload({ type: 'REVEAL_TICK', revealCountdown: state.revealCountdown }, false);
          }
        }, 1000);
      }
    }

    async function advanceToNextQuestion() {
      clearInterval(state.revealInterval);
      if (state.qIndex + 1 < state.questions.length) { state.qIndex++; beginQuestionCountdown(); }
      else {
        state.generatingComedy = true; render();
        state.comedyResult = await generateAIComedyCommentary();
        Object.assign(state, { generatingComedy: false, screen: 'finished' });
        syncAllPlayers(); render();
      }
    }

    async function regenerateComedyNow() {
      state.generatingComedy = true; render();
      state.comedyResult = await generateAIComedyCommentary();
      state.generatingComedy = false; syncAllPlayers(); render();
    }

    function openKeySetupModal() {
      toggleModal('settingsModal', false);
      document.getElementById('masterKeyInput').value = state.masterKey;
      document.getElementById('keyCheckStatus').textContent = '';
      toggleModal('keySetupModal', true);
    }

    async function saveAndTestMasterKey() {
      const cleanVal = extractCleanKey(document.getElementById('masterKeyInput').value);
      const st = document.getElementById('keyCheckStatus'), btn = document.getElementById('saveKeyBtn');
      state.masterKey = cleanVal; localStorage.setItem(KEYS.API, cleanVal);
      if (!cleanVal) { toggleModal('keySetupModal', false); return showToast('✅ کلیل لابرا'); }
      btn.disabled = true; st.style.color = 'var(--amber)'; st.textContent = '⏳ خەریکی پشکنینە...';
      try {
        await callGoogleWithKey(cleanVal, 'OK');
        st.style.color = 'var(--emerald)'; st.textContent = '✅ کلیلەکەت کارایە و خەزن کرا!';
        setTimeout(() => { btn.disabled = false; toggleModal('keySetupModal', false); }, 900);
      } catch (e) {
        btn.disabled = false; st.style.color = 'var(--emerald)';
        st.textContent = '💾 کلیلەکە خەزن کرا!';
        setTimeout(() => toggleModal('keySetupModal', false), 900);
      }
    }

    function openCustomQModal() {
      toggleModal('settingsModal', false);
      document.getElementById('customQStatus').textContent = `کۆی پرسیارەکانت: ${customQuestions.length}`;
      toggleModal('customQModal', true);
    }

    function saveCustomQuestion() {
      const ids = ['cqText', 'cqOpt0', 'cqOpt1', 'cqOpt2', 'cqOpt3'];
      const [q, o0, o1, o2, o3] = ids.map(id => document.getElementById(id).value.trim());
      if (!q || !o0 || !o1 || !o2 || !o3) return showToast('⚠️ هەموو خانەکان پڕ بکەرەوە!');
      const opts = [o0, o1, o2, o3].sort(() => Math.random() - 0.5);
      customQuestions.push({ q, opts, ans: opts.indexOf(o0) });
      localStorage.setItem(KEYS.CUSTOM, JSON.stringify(customQuestions));
      ids.forEach(id => document.getElementById(id).value = '');
      document.getElementById('customQStatus').textContent = `✅ زیادکرا! کۆی پرسیارەکانت: ${customQuestions.length}`;
    }

    render();
  </script>
</body>
</html>
