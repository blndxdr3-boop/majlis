<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دیوەخان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #0f172a;
      --bg-elevated: #334155;
      --border: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-card: #f8fafc;
      --muted-main: #94a3b8;
      --muted-card: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.28);
      --emerald: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius: 18px;
    }

    body.light-mode {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #f1f5f9;
      --bg-elevated: #e2e8f0;
      --border: rgba(15, 23, 42, 0.1);
      --text-main: #0f172a;
      --text-card: #0f172a;
      --muted-main: #64748b;
      --muted-card: #475569;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow: rgba(124, 58, 237, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; transition: background 0.25s, color 0.25s; }

    .flex-center, .splash-logo, .brand-icon, .menu-lines-btn, .proj-toggle-btn, .btn, .pin-digit, .opt-num, .modal-backdrop.open {
      display: flex; align-items: center; justify-content: center;
    }

    #splashScreen { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; flex-direction: column; gap: 14px; animation: autoHideSplash 0.4s ease 1.7s forwards; }
    @keyframes autoHideSplash { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    .splash-logo { width: 82px; height: 82px; border-radius: 24px; background: var(--accent); color: #fff; font-size: 2.5rem; box-shadow: 0 10px 30px var(--accent-glow); }
    .splash-title { font-weight: 900; font-size: 2.2rem; }

    header { padding: 10px 14px; border-bottom: 1.5px solid var(--border); background: var(--bg-surface); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 1.2rem; box-shadow: 0 4px 12px var(--accent-glow); }
    .brand-title { font-weight: 900; font-size: 1.25rem; }

    .menu-lines-btn { width: 40px; height: 40px; border-radius: 11px; background: var(--bg-card); border: 1.5px solid var(--border); flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
    .menu-lines-btn span { width: 20px; height: 2.8px; background: var(--text-card); border-radius: 3px; }
    .menu-lines-btn:active, .cycle-btn:active, .mini-icon-btn:active { transform: scale(0.94); }

    main { max-width: 640px; width: 100%; margin: 0 auto; padding: 12px 12px 50px; flex: 1; }
    .card { background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 14px; margin-bottom: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14); }
    h2 { font-size: 1.15rem; font-weight: 900; margin-bottom: 4px; text-align: center; }
    p.sub { color: var(--muted-main); font-size: 0.8rem; text-align: center; margin-bottom: 12px; line-height: 1.45; font-weight: 600; }

    .welcome-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 12px; background: var(--bg-card); padding: 5px; border-radius: 13px; border: 1px solid var(--border); }
    .w-tab { padding: 9px 4px; border-radius: 9px; border: none; background: transparent; color: var(--muted-card); font-weight: 800; font-size: 0.76rem; cursor: pointer; transition: 0.2s; text-align: center; }
    .w-tab.active, .proj-toggle-btn.active, .chip-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

    .host-top-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .host-top-row .input { margin-bottom: 0; flex: 1; }
    .proj-toggle-btn { padding: 0 13px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--muted-card); font-size: 0.78rem; font-weight: 800; cursor: pointer; gap: 5px; white-space: nowrap; }
    .proj-toggle-btn.active { width: 100%; padding: 11px 14px; }

    .input { width: 100%; padding: 11px 13px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; margin-bottom: 10px; outline: none; text-align: center; transition: 0.2s; }
    .input::placeholder { color: var(--muted-card); opacity: 0.85; }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .btn { width: 100%; padding: 12px 16px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; cursor: pointer; gap: 8px; margin-bottom: 8px; transition: 0.15s; }
    .btn:active:not(:disabled) { transform: translateY(2px); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .btn-primary { background: var(--accent); color: #fff; border: none; box-shadow: 0 6px 18px var(--accent-glow); }
    .btn-emerald { background: var(--emerald); border: none; color: #fff; }
    .btn-amber { background: var(--amber); border: none; color: #fff; }
    .btn-danger { background: var(--danger); border: none; color: #fff; }

    .section-box, .cycle-btn, .q-banner, .next-auto-banner, .comedy-card, .about-info-box { background: var(--bg-card); color: var(--text-card); border-radius: 14px; }
    .section-box { border: 1.5px solid var(--border); padding: 10px; margin-bottom: 10px; }
    .section-label { font-size: 0.74rem; font-weight: 800; color: var(--muted-card); text-align: center; margin-bottom: 7px; }

    .chips-wrap, .players-wrap { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .chip-btn { padding: 6px 11px; border-radius: 50px; border: 1.5px solid transparent; background: var(--bg-elevated); color: var(--text-card); font-size: 0.77rem; font-weight: 800; cursor: pointer; transition: 0.15s; }

    .cycle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 12px; }
    .cycle-btn { border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 6px; text-align: center; cursor: pointer; }
    .cycle-btn small { display: block; font-size: 0.66rem; color: var(--muted-card); font-weight: 700; margin-bottom: 2px; }
    .cycle-btn strong { display: block; font-size: 0.82rem; font-weight: 900; color: var(--accent); }

    .qr-wrap { background: #fff; padding: 11px; border-radius: 16px; width: fit-content; margin: 6px auto 12px; border: 3px solid var(--accent); }
    .pin-boxes { display: flex; justify-content: center; gap: 8px; margin: 4px 0 12px; direction: ltr; }
    .pin-digit { width: 46px; height: 52px; border-radius: 12px; background: var(--bg-card); color: var(--accent); border: 2px solid var(--accent); font-size: 1.5rem; font-weight: 900; }

    .players-wrap { margin: 8px 0; }
    .p-badge { background: var(--bg-card); color: var(--text-card); border: 1.5px solid var(--accent); padding: 5px 12px; border-radius: 50px; font-weight: 800; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; }
    .kick-btn { background: var(--danger); border: none; color: #fff; width: 19px; height: 19px; border-radius: 50%; font-size: 0.68rem; cursor: pointer; }

    .quiz-top-meta, .opt-card, .leader-row, .comedy-head { display: flex; justify-content: space-between; align-items: center; }
    .quiz-top-meta { margin-bottom: 7px; font-weight: 800; font-size: 0.82rem; }
    .source-tag { font-size: 0.72rem; padding: 3px 9px; border-radius: 50px; background: var(--bg-card); color: var(--accent); border: 1px solid var(--border); }
    .timer-track { height: 9px; background: var(--bg-card); border-radius: 50px; overflow: hidden; margin-bottom: 12px; }
    .timer-fill { height: 100%;ئەمە **بەشی یەکەمە لە ١٢ بەش** (پێکهاتەی سەرەکی، دیزاین، گۆڕینی ناوی ئەپەکە بۆ **دیوەخان**، دانانی **هەمەجۆر** لە سەرەتا، و هەر ٦٠ پرسیارەکەی بەشی **یاسایی** بە ٢٠ ئاسان، ٢٠ مامناوەند و ٢٠ قورس):

<body>

  <script>
    const KEYS = {

    setTimeout(() => document.getElementById('splashScreen')?.remove(), 1900);

    let wakeLock = null;
    async function requestScreenWakeLock() {

    let persistentId = localStorage.getItem(KEYS.ID) || ('U_' + Math.random().toString(36).substring(2, 10));

    const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
    let customQuestions = loadJSON(KEYS.CUSTOM), seenQuestions = loadJSON(KEYS.SEEN), gameHistory = loadJSON(KEYS.HISTORY);

    const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    const toggleModal = (id, show) => document.getElementById(id)?.classList.toggle('open', show);

    const Q = (q, opts, diff) => ({ q, opts, ans: 0, diff });

    const QUESTION_VIBES = [

    };

    const PRESET_TOPICS = [

    ];

    const QUESTION_BANK = {
      'یاسایی': [
        Q('لە یاسای شارستانیدا، تەمەنی یاسایی کامڵبوون (سن الرشد) لە عێراق چەند ساڵە؟', ['١٨ ساڵی تەواو', '١٥ ساڵ', '٢١ ساڵ', '٢٠ ساڵ'], 'ئاسان'),

        Q('لە یاسادا، بنەمای "المتهم بريء حتى تثبت إدانته" بە واتای چی دێت؟', ['تۆمەتبار بێتاوانە تا تاوانەکەی لە دادگا دەسەلمێنرێت', 'هەموو تۆمەتبارێک زیندانی دەکرێت', 'پۆلیس بڕیار دەدات', 'شاهید پێویست نییە'], 'ئاسان'),
