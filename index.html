<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گۆڕینی ڕووکاری وێب</title>
    <style>
        /* =========================================
           ڕێکخستنە گشتییەکان و گۆڕاوەکان (Variables)
           ========================================= */
        :root {
            --bg-color: #f4f4f4;
            --btn-bg: #ffffff;
            --btn-text: #333333;
            --btn-border: 2px solid #ccc;
            --layer-front: none;
            --layer-mid: none;
            --layer-sky: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            transition: all 0.8s ease-in-out; /* بۆ گۆڕانی نەرمی نێوان جەوێک بۆ جەوێکی تر */
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            overflow: hidden; /* بۆ ڕێگریکردن لە سکڕۆڵ کاتێک ئەنیمەیشن کار دەکات */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================================
           سیستەمی چینەکان بۆ باکگراوند (Layering)
           ========================================= */
        .bg-layers {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .layer-sky {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: var(--layer-sky);
        }

        .layer-mid {
            position: absolute;
            bottom: 20%; left: 0; width: 100%; height: 50%;
            background: var(--layer-mid);
            background-size: cover;
            background-position: bottom;
        }

        .layer-front {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 30%;
            background: var(--layer-front);
            background-size: contain;
            background-position: bottom;
            background-repeat: repeat-x;
        }

        /* =========================================
           ڕووکار و دوگمەکان
           ========================================= */
        .content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); /* ئیفێکتی شووشەیی بۆ ئەوەی باکگراوندەکە دەرکەوێت */
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: var(--btn-border);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        /* =========================================
           1. دیزاینی چادرگە (سروشت و دارستان)
           ========================================= */
        body.theme-camping {
            --bg-color: #1a4d2e; /* سەوزی تۆخ */
            
            /* چینی پێشەوە: سێبەری دار و چادر (لێرەدا وێنەی SVG بەکاردێت) */
            --layer-front: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg"><polygon fill="%230f2e1b" points="10,30 20,10 30,30"/><polygon fill="%230f2e1b" points="70,30 80,5 90,30"/><path fill="%232c1b12" d="M45,30 L50,20 L55,30 Z"/></svg>');
            
            /* چینی ئاسمان: باڵندەکان دەخرێنە ئێرەوە لەڕێگەی ئەنیمەیشنەوە */
            --layer-sky: transparent;

            --btn-bg: #8b5a2b; /* قاوەیی تەختە */
            --btn-text: #fff;
            --btn-border: 2px solid #4a3014;
        }

        /* لێواری تایبەتی دوگمەی چادرگە (گەڵا و گژوگیا) */
        body.theme-camping button {
            border-radius: 12px;
            border-bottom: 4px solid #2e1c0c;
        }
        body.theme-camping button::after {
            content: '🌿'; /* ئایکۆنی گەڵا بۆ گۆشەکان */
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 18px;
        }

        /* =========================================
           2. دیزاینی شەوبێداری (مانگەشەو و بێداری)
           ========================================= */
        body.theme-night {
            --bg-color: #0b132b; /* شینی تاریکی شەو */
            
            /* چینی پێشەوە: سێبەری منارە و قوبە */
            --layer-front: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg"><path fill="%23050914" d="M20,40 L20,20 C25,10 35,10 40,20 L40,40 Z"/><rect fill="%23050914" x="70" y="10" width="5" height="30"/><circle fill="%23050914" cx="72.5" cy="10" r="4"/></svg>');
            
            /* چینی ناوەڕاست: مانگ و ئەستێرەکان */
            --layer-mid: radial-gradient(circle at 80% 20%, rgba(255,255,200,1) 0%, rgba(255,255,200,0.8) 5%, transparent 10%), 
                         radial-gradient(1px 1px at 20% 30%, #fff 100%, transparent),
                         radial-gradient(2px 2px at 50% 50%, #fff 100%, transparent);

            --btn-bg: #1c2541;
            --btn-text: #e6b800; /* ڕەنگی زێڕین */
            --btn-border: 2px solid #e6b800;
        }

        /* لێواری زەخرەفە بۆ دوگمەی شەوبێداری بەکارهێنای زێڕین و بریسکانەوە */
        body.theme-night button {
            border: 2px solid transparent;
            /* لێرەدا دەتوانیت وێنەی زەخرەفە بەکاربهێنیت بۆ چوارچێوە لە ڕێگەی border-image */
            background-clip: padding-box;
            box-shadow: 0 0 10px rgba(230, 184, 0, 0.5), inset 0 0 5px rgba(230, 184, 0, 0.3);
            border-radius: 5px;
        }

    </style>
</head>
<body class="theme-camping">

    <!-- باکگراوندی دابەشکراو بۆ سێ چین -->
    <div class="bg-layers">
        <div class="layer-sky" id="sky-elements"></div>
        <div class="layer-mid" id="mid-elements"></div>
        <div class="layer-front" id="front-elements"></div>
    </div>

    <!-- پێکهاتەی ناوەڕاست -->
    <div class="content">
        <h1>کەش و جەوی وێبەکە هەڵبژێرە</h1>
        <div class="buttons-container">
            <button onclick="setTheme('theme-camping')">چادرگە ⛺</button>
            <button onclick="setTheme('theme-night')">شەوبێداری 🌙</button>
            <button onclick="setTheme('theme-formal')">فەرمی 💼</button>
            <button onclick="setTheme('theme-family')">خێزانی 👨‍👩‍👧‍👦</button>
        </div>
    </div>

    <!-- شوێنی کۆدی جاڤاسکریپت (لە بەشی دووەم دادەنرێت) -->
    <!-- درێژەی بەشی Style کە لە سەرەوە دەستمان پێکرد -->
    <style>
        /* =========================================
           3. دانیشتنە فەرمییەکان (دیوان و پرۆتۆکۆڵ)
           ========================================= */
        body.theme-formal {
            --bg-color: #001f3f; /* شینی شاهانە Navy Blue */
            
            /* چینی ناوەڕاست: نەخشی ئەندازەیی مەڕمەڕی فەرمی */
            --layer-mid: linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.03) 75%, rgba(255,255,255,0.03)), 
                         linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.03) 75%, rgba(255,255,255,0.03));
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            
            --layer-front: none; /* پێویست بە سێبەری خوارەوە ناکات لە هۆڵی فەرمی */
            --layer-sky: none;

            --btn-bg: #1a1a1a;
            --btn-text: #d4af37; /* زێڕینی مات */
            --btn-border: 4px double #c0c0c0; /* لێواری دووانەی زیوی */
        }

        body.theme-formal button {
            border-radius: 2px; /* گۆشەکان ڕێک و سەنگین دەبن */
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* =========================================
           4. دانیشتنی خێزانی (دیوەخان و مافووری کوردی)
           ========================================= */
        body.theme-family {
            --bg-color: #6b1414; /* سووری عەنابی / خێزانی */
            
            /* چینی پێشەوە و دواوە: نەخشی مافووری سادەکراو بە ڕەنگی کرێمی */
            --layer-mid: repeating-linear-gradient( 45deg, transparent, transparent 15px, rgba(245, 222, 179, 0.1) 15px, rgba(245, 222, 179, 0.1) 30px );
            
            --layer-front: none;
            --layer-sky: none;

            --btn-bg: #fff8dc; /* کرێمی */
            --btn-text: #4a0404; /* قاوەیی تۆخ */
            --btn-border: 3px dashed #8b0000; /* شێوەی زنجیرەیی یان دەزووی فەرش */
        }

        body.theme-family button {
            border-radius: 8px;
            box-shadow: inset 0 0 0 3px #deb887; /* لێواری ناوەوەی زیادە بۆ پێدانی هەستی جاجم */
        }

        /* =========================================
           جووڵەکان (Keyframes Animations)
           ========================================= */
        /* جووڵەی فڕینی باڵندەکان */
        @keyframes fly {
            0% { transform: translateX(110vw) translateY(10px) scale(0.8); }
            50% { transform: translateX(50vw) translateY(-20px) scale(1); }
            100% { transform: translateX(-10vw) translateY(0) scale(0.9); }
        }

        .bird {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            animation: fly 12s linear infinite;
        }

        /* جووڵەی کڵپەی ئاگر */
        @keyframes flicker {
            0% { opacity: 0.8; transform: scale(0.9); filter: brightness(0.8); }
            50% { opacity: 1; transform: scale(1.1); filter: brightness(1.2); }
            100% { opacity: 0.9; transform: scale(1); filter: brightness(1); }
        }

        .fire {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            animation: flicker 0.6s infinite alternate;
        }
    </style>

    <!-- کۆدی جاڤاسکریپت بۆ کۆنترۆڵکردنی جەو و جووڵەکان -->
    <script>
        function setTheme(themeName) {
            // گۆڕینی کلاسی body بۆ گۆڕینی ڕەنگ و دیزاینەکان بە یەکجار
            document.body.className = themeName;

            // پاککردنەوەی هەموو ئەو شتانەی پێشتر لە ئاسمان یان خوارەوە هەبوون
            const sky = document.getElementById('sky-elements');
            const front = document.getElementById('front-elements');
            sky.innerHTML = '';
            front.innerHTML = '';

            // زیادکردنی پێکهاتەی جووڵاو بەپێی ئەو جەوەی هەڵبژێردراوە
            if (themeName === 'theme-camping') {
                // باڵندەکان بۆ جەوی چادرگە
                sky.innerHTML = `
                    <div class="bird" style="top: 20%; animation-delay: 0s;">🦅</div>
                    <div class="bird" style="top: 30%; animation-delay: 2s; font-size: 16px;">🦅</div>
                    <div class="bird" style="top: 15%; animation-delay: 5s; font-size: 14px;">🦅</div>
                `;
                // ئاگرەکە بۆ جەوی چادرگە
                front.innerHTML = `<div class="fire">🔥</div>`;
            } 
            else if (themeName === 'theme-night') {
                // مانگ و ئەستێرەی زیادە بۆ شەوبێداری (لە چینی ئاسمان)
                sky.innerHTML = `
                    <div style="position: absolute; top: 10%; right: 10%; font-size: 50px; text-shadow: 0 0 20px #fff;">🌙</div>
                `;
            }
            // فەرمی و خێزانی لێرەدا پێویستیان بە جووڵەی زیادە نییە بەڵام دەتوانیت بۆیان زیاد بکەیت
        }

        // کاتێک پەڕەکە دەکرێتەوە ڕاستەوخۆ جەوی چادرگە ئامادە دەکات
        window.onload = function() {
            setTheme('theme-camping');
        };
    </script>

</body>
</html>
