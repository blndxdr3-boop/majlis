<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس Pro | پێشبڕکێی ڕاستەوخۆی هاوڕێیان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-dark: #070a14;
      --bg-surface: rgba(17, 24, 39, 0.88);
      --bg-card: rgba(30, 41, 59, 0.75);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.4);
      --accent: #ec4899;
      --emerald: #10b981;
      --danger: #f43f5e;
      --amber: #f59e0b;
      --cyan: #06b6d4;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.22) 0px, transparent 45%),
        radial-gradient(at 90% 85%, rgba(236, 72, 153, 0.18) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.1) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 10, 20, 0.85);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 6px 18px var(--primary-glow);
    }

    .brand-title {
      font-weight: 900;
      font-size: 1.25rem;
      background: linear-gradient(90deg, #e9d5ff, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    main {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 14px 70px;
      flex: 1;
    }

    .card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    h2 {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 6px;
      text-align: center;
    }

    p.sub {
      color: var(--muted);
      font-size: 0.86rem;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* تابی سەرەتایی */
    .welcome-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.8);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .w-tab {
      padding: 10px 6px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .w-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(9, 13, 24, 0.9);
      color: #fff;
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: #fff;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
      margin-bottom: 10px;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #059669, #10b981);
      border: none;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
    }

    .btn-cyan {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border: none;
    }

    /* بەشەکانی پرسیار */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .cat-item {
      padding: 11px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.65);
      text-align: center;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.84rem;
      transition: 0.2s;
    }

    .cat-item.active {
      border-color: var(--primary);
      background: rgba(139, 92, 246, 0.22);
      color: #e9d5ff;
    }

    .settings-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .setting-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }

    .setting-box label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .setting-box select {
      background: var(--bg-card);
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 800;
      width: 100%;
      outline: none;
    }

    /* QR Code & Lobby */
    .qr-wrap {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      width: fit-content;
      margin: 10px auto 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .room-pin {
      background: rgba(139, 92, 246, 0.16);
      border: 2px dashed var(--primary);
      color: #f3e8ff;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-align: center;
      padding: 8px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 12px 0;
    }

    .p-badge {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid var(--emerald);
      color: #a7f3d0;
      padding: 7px 14px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.75); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* پرسیار و وەڵام */
    .quiz-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .timer-track {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald), var(--amber), var(--danger));
      transition: width 0.95s linear;
    }

    .q-banner {
      font-size: 1.18rem;
      font-weight: 900;
      text-align: center;
      padding: 20px 14px;
      background: rgba(9, 13, 24, 0.85);
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .opts-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .opt-card {
      padding: 15px 16px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: rgba(30, 41, 59, 0.85);
      color: #fff;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      text-align: right;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s;
    }

    .opt-card:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .opt-card.selected {
      border-color: var(--cyan);
      background: rgba(6, 182, 212, 0.22);
    }

    .opt-card.correct {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.32);
      color: #a7f3d0;
    }

    .opt-card.wrong {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.28);
      color: #fecdd3;
    }

    /* ڕیزبەندی خاڵەکان */
    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(9, 13, 24, 0.75);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .leader-row.first {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.25), rgba(9, 13, 24, 0.85));
      border-color: var(--amber);
    }

    /* شریتی ئیمۆجی زیندوو */
    .emoji-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .emoji-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .emoji-btn:active { transform: scale(1.3); }

    .floating-emoji {
      position: fixed;
      bottom: 40px;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 300;
      animation: floatUp 2.4s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-340px) scale(1.4); opacity: 0; }
    }

    /* مۆداڵی زیادکردنی پرسیاری تایبەت */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="brand-icon">🎲</div>
      <div>
        <div class="brand-title">مەجلیس Pro</div>
      </div>
    </div>
    <div class="header-controls">
      <button class="icon-pill" onclick="openCustomQModal()">➕ پرسیاری خۆت</button>
      <button class="icon-pill" id="soundBtn" onclick="toggleSound()">🔊</button>
    </div>
  </header>

  <main id="appContainer"></main>

  <!-- مۆداڵی زیادکردنی پرسیاری تایبەت لەسەر هاوڕێکان -->
  <div class="modal-backdrop" id="customQModal">
    <div class="modal-box">
      <h3 style="margin-bottom:10px;">✍️ زیادکردنی پرسیاری تایبەت بۆ مەجلیس</h3>
      <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px;">
        دەتوانیت پرسیار لەسەر هاوڕێکانت یان هەر بابەتێکی دڵخواز بنووسیت تا لە کاتی یاریکردندا بێتە پێشەوە:
      </p>
      <input type="text" id="cqText" class="input" placeholder="پرسیارەکە لێرە بنووسە..." style="text-align:right;" />
      <input type="text" id="cqOpt0" class="input" placeholder="هەڵبژاردەی ١ (وەڵامی ڕاست)" style="text-align:right; border-color:var(--emerald);" />
      <input type="text" id="cqOpt1" class="input" placeholder="هەڵبژاردەی ٢" style="text-align:right;" />
      <input type="text" id="cqOpt2" class="input" placeholder="هەڵبژاردەی ٣" style="text-align:right;" />
      <input type="text" id="cqOpt3" class="input" placeholder="هەڵبژاردەی ٤" style="text-align:right;" />
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn" onclick="closeCustomQModal()">داخستن</button>
        <button class="btn btn-primary" onclick="saveCustomQuestion()">💾 زیادکردنی پرسیار</button>
      </div>
      <div id="customQCountLabel" style="text-align:center; font-size:0.8rem; color:var(--emerald); margin-top:6px;"></div>
    </div>
  </div>

  <script>
    // بانکی دەوڵەمەندی پرسیارەکان (٦ بەش)
    const DEFAULT_QUESTIONS = {
      general: [
        { q: 'پایتەختی ڕۆشنبیری هەرێمی کوردستان کام شارە؟', opts: ['هەولێر', 'سلێمانی', 'دهۆک', 'هەڵەبجە'], ans: 1 },
        { q: 'درێژترین ڕووباری جیهان کامەیە؟', opts: ['ئەمازۆن', 'نیل', 'فورات', 'میسیسیپی'], ans: 1 },
        { q: 'گەورەترین زەریای سەر ڕووی زەوی کامەیە؟', opts: ['زەریای ئەتڵەسی', 'زەریای هێمن (پاسیفیک)', 'زەریای هیندی', 'زەریای بەستەڵەک'], ans: 1 },
        { q: 'هێمای کیمیایی توخمی "زێڕ" چییە؟', opts: ['Ag', 'Fe', 'Au', 'Cu'], ans: 2 },
        { q: 'پایتەختی وڵاتی ژاپۆن کام شارە؟', opts: ['سیئۆل', 'پەکین', 'تۆکیۆ', 'بانکۆک'], ans: 2 },
        { q: 'بەرزترین چیای جیهان کامەیە؟', opts: ['ئێڤرێست', 'کلیمانجارۆ', 'ئەڵپ', 'هەڵگورد'], ans: 0 },
        { q: 'چەند کیشوەر لە جیهاندا هەیە؟', opts: ['٥ کیشوەر', '٦ کیشوەر', '٧ کیشوەر', '٨ کیشوەر'], ans: 2 },
        { q: 'یەکەم مرۆڤ کە پێی نایە سەر ڕووی مانگ کێ بوو؟', opts: ['یوری گاگارین', 'نیڵ ئارمسترۆنگ', 'باز ئۆڵدرین', 'ئیلۆن مەسک'], ans: 1 }
      ],
      kurdish: [
        { q: 'شاعیری گەورەی کورد "نالی" ناوی تەواوی چییە؟', opts: ['مەلا خدری ئەحمەدی شاوەیسی مکایەڵی', 'عەبدولڕەحمان بەگی ساحێبقڕان', 'تاهیر بەگی جاف', 'مەلا محەمەدی کۆیی'], ans: 0 },
        { q: 'یەکەم ڕۆژنامەی کوردی لە ساڵی ١٨٩٨ لە قاهیرە دەرچوو ناوی چی بوو؟', opts: ['ژیان', 'کوردستان', 'هاوار', 'ڕۆژی کورد'], ans: 1 },
        { q: 'داستانی "مەم و زین" شاکاری کام شاعیری ناوداری کوردە؟', opts: ['ئەحمەدی خانی', 'مەلای جزیری', 'فەقێ تەیران', 'وەفایی'], ans: 0 },
        { q: 'بەرزترین لووتکە چیا لە هەرێمی کوردستان کامەیە؟', opts: ['پیرەمەگروون', 'هەڵگورد', 'کۆڕەک', 'گارە'], ans: 1 },
        { q: 'پردی مێژوویی "دەلال" دەکەوێتە کام شاری کوردستان؟', opts: ['ئامێدی', 'زاخۆ', 'ئاکرێ', 'ڕواندز'], ans: 1 },
        { q: 'ئەشکەوتی مێژوویی شانەدەر دەکەوێتە کام پارێزگای کوردستان؟', opts: ['سلێمانی', 'هەولێر', 'دهۆک', 'کەرکووک'], ans: 1 },
        { q: 'کۆماری کوردستان لە مەهاباد لە چ ساڵێکدا دامەزرا؟', opts: ['١٩٤٥', '١٩٤٦', '١٩٤٧', '١٩٥٨'], ans: 1 },
        { q: 'بەنداوی دوکان لەسەر کام زێ دروست کراوە؟', opts: ['زێی گەورە', 'زێی بچووک', 'ڕووباری سیروان', 'خابوور'], ans: 1 }
      ],
      islamic: [
        { q: 'قورئانی پیرۆز لە چەند سورەت پێکهاتووە؟', opts: ['١١٠ سورەت', '١١٤ سورەت', '١٢٠ سورەت', '٩٩ سورەت'], ans: 1 },
        { q: 'درێژترین سورەتی قورئانی پیرۆز کامەیە؟', opts: ['ئالی عیمران', 'نیساء', 'بەقەرە', 'مائیدە'], ans: 2 },
        { q: 'کورتترین سورەتی قورئانی پیرۆز کامەیە؟', opts: ['ئیخلاس', 'فەلەق', 'کەوسەر', 'عەسر'], ans: 2 },
        { q: 'یەکەم جەنگ لە مێژووی ئیسلامدا ناوی چی بوو؟', opts: ['جەنگی ئوحود', 'جەنگی بەدر', 'جەنگی خەندەق', 'فەتحی مەککە'], ans: 1 },
        { q: 'کام سورەتی قورئانی پیرۆز بە "دڵی قورئان" ناسراوە؟', opts: ['سورەتی کەهف', 'سورەتی یس (یاسین)', 'سورەتی مولک', 'سورەتی ڕەحمان'], ans: 1 },
        { q: 'تاکە سورەت لە قورئانی پیرۆزدا کە بە بسم اللە دەست پێ ناکات کامەیە؟', opts: ['سورەتی تەوبە', 'سورەتی ئەنفال', 'سورەتی فاتیحە', 'سورەتی نەمل'], ans: 0 },
        { q: 'یەکەم بانگبێژ (مؤذن) لە ئیسلامدا کێ بوو؟', opts: ['عومەری کوڕی خەتاب', 'بیلالی حەبەشی', 'ئەبوبەکری سدیق', 'عەلی کوڕی ئەبو تاڵیب'], ans: 1 }
      ],
      sports: [
        { q: 'کام وڵات زۆرترین جار جامی جیهانی (مۆندیال)ی بردووەتەوە؟', opts: ['ئەڵمانیا', 'بەڕازیل', 'ئەرجەنتین', 'ئیتاڵیا'], ans: 1 },
        { q: 'کێ بوو پاڵەوانی مۆندیالی ٢٠٢٢ی قەتەر؟', opts: ['فەڕەنسا', 'ئەرجەنتین', 'کرواتیا', 'مەغریب'], ans: 1 },
        { q: 'کام یانە زۆرترین نازناوی چامپیۆنزلیگی ئەوروپای بەدەستهێناوە؟', opts: ['بەرشەلۆنە', 'بایرن میونشن', 'ڕیاڵ مەدرید', 'ئەی سی میلان'], ans: 2 },
        { q: 'ماوەی یاسایی یارییەکی تۆپی پێ بەبێ کاتی زیادکراو چەند خولەکە؟', opts: ['٨٠ خولەک', '٩٠ خولەک', '١٠٠ خولەک', '١٢٠ خولەک'], ans: 1 },
        { q: 'ئەلقەکانی ئاڵای ئۆڵۆمپیاد لە چەند ئەلقە پێکهاتوون؟', opts: ['٤ ئەلقە', '٥ ئەلقە', '٦ ئەلقە', '٧ ئەلقە'], ans: 1 }
      ],
      science: [
        { q: 'کام هەسارە لە کۆمەڵەی خۆردا بە "هەسارەی سوور" دەناسرێت؟', opts: ['مەریخ', 'زوهرە', 'موشتەری', 'عوتارد'], ans: 0 },
        { q: 'خێرایی ڕووناکی لە بۆشاییدا نزیکەی چەندە لە چرکەیەکدا؟', opts: ['٣٠٠ هەزار کیلۆمەتر', '١٠٠ هەزار کیلۆمەتر', '١ ملیۆن کیلۆمەتر', '٣٠ هەزار کیلۆمەتر'], ans: 0 },
        { q: 'مێشک و ناوەندی لێکدانەوەی کۆمپیوتەر بە چی دەناسرێت؟', opts: ['RAM', 'CPU', 'SSD', 'GPU'], ans: 1 },
        { q: 'ئاو لە پلەی سەدی چەنددا دەکوڵێت؟', opts: ['٥٠ پلە', '٩٠ پلە', '١٠٠ پلە', '١٢٠ پلە'], ans: 2 },
        { q: 'کام گاز زۆرترین ڕێژەی هەوای بەرگەهەوای زەوی پێکدەهێنێت (٧٨٪)؟', opts: ['ئۆکسجین', 'نایترۆجین', 'دووانەئۆکسیدی کاربۆن', 'هایدرۆجین'], ans: 1 }
      ],
      riddles: [
        { q: 'ئەو شتە چییە کە هەمیشە بەرەو پێشەوە دەڕوات و هەرگیز ناگەڕێتەوە دواوە؟', opts: ['ئاو', 'تەمەن و کات', 'با', 'سێبەر'], ans: 1 },
        { q: 'ئەو شتە چییە کە تا زیاتری لێ ببەیت، گەورەتر دەبێت؟', opts: ['ئاگر', 'چاڵ', 'شاخ', 'بەفر'], ans: 1 },
        { q: 'ملی هەیە و سەری نییە، دوو دەستی هەیە و پەنجەی نییە؛ چییە؟', opts: ['کراسی بەرم', 'کاتژمێر', 'کورسی', 'گۆزە'], ans: 0 },
        { q: 'ئەگەر لە پێشبڕکێیەکدا پێش کەسی دووەم بکەویت، تۆ لە پلەی چەندەمیت؟', opts: ['یەکەم', 'دووەم', 'سێیەم', 'چوارەم'], ans: 1 },
        { q: 'مانگێک لە ساڵدا ٢٨ ڕۆژی تێدایە؛ کام مانگەیە؟', opts: ['تەنها مانگی شوبات', 'هەموو ١٢ مانگەکە ٢٨ ڕۆژیان تێدایە', 'مانگی نیسان', 'مانگی ئایار'], ans: 1 }
      ]
    };

    const CUSTOM_Q_KEY = 'MAJLIS_CUSTOM_QUESTIONS_V2';
    const USER_NAME_KEY = 'MAJLIS_SAVED_NAME';

    let customQuestions = [];
    try {
      const savedQ = localStorage.getItem(CUSTOM_Q_KEY);
      if (savedQ) customQuestions = JSON.parse(savedQ);
    } catch (e) {}

    let state = {
      welcomeTab: 'host', // 'host' | 'join' | 'solo'
      role: null, // 'host' | 'player' | 'solo'
      screen: 'welcome', // 'welcome' | 'lobby' | 'playing' | 'finished'
      myId: 'P_' + Math.random().toString(36).substring(2, 9),
      myName: localStorage.getItem(USER_NAME_KEY) || '',
      roomCode: '',
      category: 'all',
      questionLimit: 8,
      questionDuration: 15,
      soundOn: true,
      peer: null,
      hostConn: null,
      connections: {},
      players: [], // { id, name, score, streak, currentAnswer, answerTime }
      questions: [],
      qIndex: 0,
      timeLeft: 15,
      timerInterval: null,
      revealAnswer: false,
      connecting: false
    };

    // ئەگەر هاوڕێکانت بارکۆدیان سکان کردبوو، ڕاستەوخۆ تابی Join بکاتەوە
    const params = new URLSearchParams(window.location.search);
    const urlRoom = params.get('room');
    if (urlRoom) {
      state.roomCode = urlRoom.toUpperCase();
      state.welcomeTab = 'join';
    }

    let audioCtx = null;
    function playTone(type) {
      if (!state.soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.32);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, audioCtx.currentTime);
          osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'tick') {
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        }
      } catch (e) {}
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      document.getElementById('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
    }

    function resetToHome() {
      clearInterval(state.timerInterval);
      if (state.peer) {
        try { state.peer.destroy(); } catch (e) {}
      }
      window.history.replaceState({}, document.title, window.location.pathname);
      state.screen = 'welcome';
      state.role = null;
      state.connecting = false;
      render();
    }

    function showFloatingEmoji(emoji, senderName) {
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.style.left = (15 + Math.random() * 70) + '%';
      el.innerHTML = `${emoji} <small style="font-size:0.75rem; background:rgba(0,0,0,0.7); padding:2px 8px; border-radius:20px; color:#fff;">${senderName}</small>`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2400);
    }

    function sendEmojiReaction(emoji) {
      showFloatingEmoji(emoji, state.myName || 'تۆ');
      if (state.role === 'host') {
        broadcastPayload({ type: 'EMOJI', emoji, sender: state.myName });
      } else if (state.role === 'player' && state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'EMOJI', emoji, sender: state.myName });
      }
    }

    function render() {
      const box = document.getElementById('appContainer');
      if (state.screen === 'welcome') box.innerHTML = renderWelcomeScreen();
      else if (state.screen === 'lobby') box.innerHTML = renderLobbyScreen();
      else if (state.screen === 'playing') box.innerHTML = renderPlayingScreen();
      else if (state.screen === 'finished') box.innerHTML = renderFinishedScreen();

      if (state.screen === 'lobby' && state.role === 'host') {
        setTimeout(drawQRCode, 50);
      }
    }

    // نوێکردنەوەی تەنها تایمەر بەبێ دروستکردنەوەی تەواوی شاشەکە (چارەسەری لەرزینی شاشە)
    function updateTimerUIOnly() {
      const timeLabel = document.getElementById('liveTimeLabel');
      const timeFill = document.getElementById('liveTimeFill');
      if (timeLabel) timeLabel.textContent = `⏱️ ${state.timeLeft} چرکە`;
      if (timeFill) {
        const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);
        timeFill.style.width = `${pct}%`;
      }
    }

    function renderWelcomeScreen() {
      const tabsHtml = `
        <div class="welcome-tabs">
          <button class="w-tab ${state.welcomeTab === 'host' ? 'active' : ''}" onclick="state.welcomeTab='host'; render();">👑 دروستکردنی مەجلیس</button>
          <button class="w-tab ${state.welcomeTab === 'join' ? 'active' : ''}" onclick="state.welcomeTab='join'; render();">📲 چوونە ژوورەوە</button>
          <button class="w-tab ${state.welcomeTab === 'solo' ? 'active' : ''}" onclick="state.welcomeTab='solo'; render();">🎮 یاریی تاکەکەسی</button>
        </div>
      `;

      const categoriesHtml = `
        <div style="margin-bottom:8px; font-weight:800; font-size:0.84rem; color:var(--muted); text-align:center;">بەشی پرسیارەکان هەڵبژێرە:</div>
        <div class="cat-grid">
          <div class="cat-item ${state.category === 'all' ? 'active' : ''}" onclick="state.category='all'; render();">🌟 تێکەڵ (هەموو بەشەکان)</div>
          <div class="cat-item ${state.category === 'general' ? 'active' : ''}" onclick="state.category='general'; render();">🌍 زانیاری گشتی</div>
          <div class="cat-item ${state.category === 'kurdish' ? 'active' : ''}" onclick="state.category='kurdish'; render();">☀️ کوردستان و مێژوو</div>
          <div class="cat-item ${state.category === 'islamic' ? 'active' : ''}" onclick="state.category='islamic'; render();">🕌 زانیاری ئایینی</div>
          <div class="cat-item ${state.category === 'sports' ? 'active' : ''}" onclick="state.category='sports'; render();">⚽ وەرزش و تۆپی پێ</div>
          <div class="cat-item ${state.category === 'science' ? 'active' : ''}" onclick="state.category='science'; render();">🔬 زانست و تەکنەلۆژیا</div>
          <div class="cat-item ${state.category === 'riddles' ? 'active' : ''}" onclick="state.category='riddles'; render();">🧠 مەتەڵ و زیرەکی</div>
          <div class="cat-item ${state.category === 'custom' ? 'active' : ''}" onclick="state.category='custom'; render();">✍️ پرسیارەکانی خۆم (${customQuestions.length})</div>
        </div>
      `;

      const settingsHtml = `
        <div class="settings-row">
          <div class="setting-box">
            <label>ژمارەی پرسیارەکان</label>
            <select onchange="state.questionLimit = parseInt(this.value, 10);">
              <option value="5" ${state.questionLimit === 5 ? 'selected' : ''}>٥ پرسیار</option>
              <option value="8" ${state.questionLimit === 8 ? 'selected' : ''}>٨ پرسیار</option>
              <option value="12" ${state.questionLimit === 12 ? 'selected' : ''}>١٢ پرسیار</option>
              <option value="16" ${state.questionLimit === 16 ? 'selected' : ''}>١٦ پرسیار</option>
            </select>
          </div>
          <div class="setting-box">
            <label>کاتی هەر پرسیارێک</label>
            <select onchange="state.questionDuration = parseInt(this.value, 10);">
              <option value="10" ${state.questionDuration === 10 ? 'selected' : ''}>١٠ چرکە (خێرا)</option>
              <option value="15" ${state.questionDuration === 15 ? 'selected' : ''}>١٥ چرکە (ئاسایی)</option>
              <option value="25" ${state.questionDuration === 25 ? 'selected' : ''}>٢٥ چرکە (ئارام)</option>
            </select>
          </div>
        </div>
      `;

      if (state.welcomeTab === 'host') {
        return `
          <div class="card">
            ${tabsHtml}
            <h2>👑 دروستکردنی مەجلیس بۆ هاوڕێیان</h2>
            <p class="sub">ژوورێک دروست بکە و با هاوڕێکانت بە کامێرای مۆبایلەکانیان بارکۆدەکە (QR) سکان بکەن!</p>
            <input type="text" id="nameInp" class="input" placeholder="ناوی خۆت بنووسە..." value="${state.myName}" />
            ${categoriesHtml}
            ${settingsHtml}
            <button class="btn btn-primary" ${state.connecting ? 'disabled' : ''} onclick="startHostRoom()">
              ${state.connecting ? '⏳ خەریکی دروستکردنی ژوورە...' : '🚀 دروستکردنی ژوور و بارکۆد'}
            </button>
          </div>
        `;
      } else if (state.welcomeTab === 'join') {
        return `
          <div class="card">
            ${tabsHtml}
            <h2>📲 پەیوەستبوون بە مەجلیسی هاوڕێکەت</h2>
            <p class="sub">ناوی خۆت و کۆدی ٤ پیتیی ژوورەکە بنووسە بۆ چوونە ناو پێشبڕکێکە:</p>
            <input type="text" id="nameInp" class="input" placeholder="ناوی خۆت بنووسە (بۆ نموونە: ئومێد)..." value="${state.myName}" />
            <input type="text" id="codeInp" class="input" placeholder="کۆدی ژوور (بۆ نموونە: A7K9)" value="${state.roomCode}" style="text-transform:uppercase; letter-spacing:2px;" />
            <button class="btn btn-emerald" ${state.connecting ? 'disabled' : ''} onclick="joinHostRoom()">
              ${state.connecting ? '⏳ خەریکی پەیوەستبوونە...' : '🔗 چوونە ناو یارییەکە'}
            </button>
          </div>
        `;
      } else {
        return `
          <div class="card">
            ${tabsHtml}
            <h2>🎮 تاقیکردنەوەی زیرەکی (بە تەنها)</h2>
            <p class="sub">بەبێ چاوەڕوانکردنی کەس، دەستبەجێ زانیارییەکانی خۆت تاقی بکەرەوە و خاڵ کۆبکەرەوە!</p>
            <input type="text" id="nameInp" class="input" placeholder="ناوی خۆت بنووسە..." value="${state.myName || 'یاریزان'}" />
            ${categoriesHtml}
            ${settingsHtml}
            <button class="btn btn-cyan" onclick="startSoloGame()">▶️ دەستپێکردنی یاریی تاکەکەسی</button>
          </div>
        `;
      }
    }

    function renderLobbyScreen() {
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      const playersChips = state.players.map(p => `<div class="p-badge">👤 ${p.name}</div>`).join('');

      const emojiStrip = `
        <div class="emoji-bar">
          <button class="emoji-btn" onclick="sendEmojiReaction('🔥')">🔥</button>
          <button class="emoji-btn" onclick="sendEmojiReaction('😂')">😂</button>
          <button class="emoji-btn" onclick="sendEmojiReaction('👏')">👏</button>
          <button class="emoji-btn" onclick="sendEmojiReaction('😎')">😎</button>
          <button class="emoji-btn" onclick="sendEmojiReaction('⚡')">⚡</button>
        </div>
      `;

      if (state.role === 'host') {
        return `
          <div class="card" style="text-align:center;">
            <h2>📱 بارکۆدی هاتنەژوورەوەی هاوڕێیان</h2>
            <p class="sub">با هاوڕێکانت کامێرای مۆبایلەکانیان بگرنە ئەم بارکۆدە یان لینکەکەیان بۆ بنێرە:</p>
            
            <div class="qr-wrap" id="qrcode"></div>

            <div style="font-size:0.78rem; color:var(--muted); margin-bottom:4px;">کۆدی ژوور:</div>
            <div class="room-pin">${state.roomCode}</div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
              <button class="btn" onclick="copyInvite('${joinUrl}')">📋 کۆپیکردنی لینک</button>
              <button class="btn btn-emerald" onclick="shareInviteWA('${joinUrl}')">💬 ناردن لە واتسئەپ</button>
            </div>

            <h3>👥 ئامادەبووانی ناو مەجلیس (${state.players.length} کەس):</h3>
            <div class="players-wrap">${playersChips}</div>

            ${emojiStrip}

            <button class="btn btn-primary" style="margin-top:16px; font-size:1.05rem;" onclick="hostStartCompetition()">
              ▶️ دەستپێکردنی پێشبڕکێ بۆ هەمووان!
            </button>
          </div>
        `;
      } else {
        return `
          <div class="card" style="text-align:center;">
            <h2>✅ تۆ لە ناو مەجلیسەکەدایت!</h2>
            <p class="sub">چاوەڕێ بکە تا سەرپەرشتیاری ژوورەکە دوگمەی دەستپێکردن دادەگرێت...</p>
            <div class="room-pin">${state.roomCode}</div>
            <h3>👥 هاوڕێیانی ئامادەبوو (${state.players.length}):</h3>
            <div class="players-wrap">${playersChips}</div>
            <p style="font-size:0.8rem; color:var(--muted); margin-top:10px;">ئیمۆجی بنێرە بۆ سەر شاشەی هاوڕێکانت:</p>
            ${emojiStrip}
          </div>
        `;
      }
    }

    function renderPlayingScreen() {
      const qObj = state.questions[state.qIndex];
      const me = state.players.find(p => p.id === state.myId);
      const myAns = me ? me.currentAnswer : null;
      const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);
      const answeredCount = state.players.filter(p => p.currentAnswer !== null).length;

      const optsHtml = qObj.opts.map((opt, idx) => {
        let cls = 'opt-card';
        if (state.revealAnswer) {
          if (idx === qObj.ans) cls += ' correct';
          else if (myAns === idx) cls += ' wrong';
        } else if (myAns === idx) {
          cls += ' selected';
        }

        return `
          <button class="${cls}" ${myAns !== null || state.revealAnswer ? 'disabled' : ''} onclick="submitPlayerAnswer(${idx})">
            <span>${idx + 1}. ${opt}</span>
            <span>${state.revealAnswer && idx === qObj.ans ? '✅' : (state.revealAnswer && myAns === idx ? '❌' : (myAns === idx ? '👈 هەڵبژێردرا' : ''))}</span>
          </button>
        `;
      }).join('');

      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const leaderboardHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">
          <span>
            ${i === 0 ? '👑' : `${i + 1}.`} ${p.name}
            ${p.streak >= 2 ? `<small style="color:var(--amber);">🔥x${p.streak}</small>` : ''}
            ${p.currentAnswer !== null && !state.revealAnswer ? ' ✅' : ''}
          </span>
          <span style="color:var(--amber);">${p.score} خاڵ</span>
        </div>
      `).join('');

      return `
        <div class="card">
          <div class="quiz-top-meta">
            <span>پرسیاری ${state.qIndex + 1} لە ${state.questions.length}</span>
            <span style="color:var(--cyan);">وەڵامدەرەوە: ${answeredCount}/${state.players.length}</span>
            <span id="liveTimeLabel" style="color:var(--amber);">⏱️ ${state.timeLeft} چرکە</span>
          </div>
          <div class="timer-track">
            <div class="timer-fill" id="liveTimeFill" style="width:${pct}%"></div>
          </div>

          <div class="q-banner">${qObj.q}</div>
          <div class="opts-list">${optsHtml}</div>

          ${(state.role === 'host' || state.role === 'solo') && state.revealAnswer ? `
            <button class="btn btn-primary" style="margin-top:16px;" onclick="advanceToNextQuestion()">
              ${state.qIndex + 1 < state.questions.length ? '⬅️ پرسیاری دواتر' : '🏆 بینینی ئەنجامی کۆتایی و براوە'}
            </button>
          ` : ''}

          <div class="emoji-bar">
            <button class="emoji-btn" onclick="sendEmojiReaction('🔥')">🔥</button>
            <button class="emoji-btn" onclick="sendEmojiReaction('😂')">😂</button>
            <button class="emoji-btn" onclick="sendEmojiReaction('👏')">👏</button>
            <button class="emoji-btn" onclick="sendEmojiReaction('😱')">😱</button>
          </div>
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px; font-size:0.95rem;">📊 ڕیزبەندی ڕاستەوخۆی یاریزانەکان:</h3>
          ${leaderboardHtml}
        </div>
      `;
    }

    function renderFinishedScreen() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0];

      const ranksHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">
          <span>${i === 0 ? '🥇 یەکەم:' : (i === 1 ? '🥈 دووەم:' : (i === 2 ? '🥉 سێیەم:' : `${i + 1}.`))} ${p.name}</span>
          <span style="color:var(--emerald);">${p.score} خاڵ</span>
        </div>
      `).join('');

      return `
        <div class="card" style="text-align:center;">
          <div style="font-size:3.6rem; margin-bottom:4px;">🏆</div>
          <h2>پاڵەوانی مەجلیس: ${winner ? winner.name : ''}!</h2>
          <p class="sub">بە کۆکردنەوەی <strong>${winner ? winner.score : 0} خاڵ</strong> پلەی یەکەمی بەدەستهێنا!</p>

          <div style="text-align:right; margin:16px 0;">
            ${ranksHtml}
          </div>

          ${state.role === 'host' ? `
            <button class="btn btn-primary" onclick="hostStartCompetition()">🔄 یاریکردنەوەی خولێکی نوێ لەگەڵ هاوڕێیان</button>
          ` : ''}
          ${state.role === 'solo' ? `
            <button class="btn btn-primary" onclick="startSoloGame()">🔄 دووبارەکردنەوەی یاری</button>
          ` : ''}
          <button class="btn" onclick="resetToHome()">🏠 گەڕانەوە بۆ پەڕەی سەرەکی</button>
        </div>
      `;
    }

    function drawQRCode() {
      const box = document.getElementById('qrcode');
      if (!box) return;
      box.innerHTML = '';
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      new QRCode(box, {
        text: joinUrl,
        width: 185,
        height: 185,
        colorDark: "#070a14",
        colorLight: "#ffffff"
      });
    }

    function copyInvite(url) {
      navigator.clipboard.writeText(url);
      alert('لینکی مەجلیس کۆپی کرا!');
    }

    function shareInviteWA(url) {
      const msg = `🎲 وەرنە ناو پێشبڕکێی مەجلیس! کۆدی ژوور: (${state.roomCode})\nکلیک لەم لینکە بکەن:\n${url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function buildQuestionSet() {
      let pool = [];
      if (state.category === 'custom') {
        if (customQuestions.length === 0) {
          alert('هیچ پرسیارێکی تایبەتت زیاد نەکردووە! پرسیاری گشتی دادەنرێت.');
          pool = [...DEFAULT_QUESTIONS.general];
        } else {
          pool = [...customQuestions];
        }
      } else if (state.category === 'all') {
        pool = [
          ...DEFAULT_QUESTIONS.general,
          ...DEFAULT_QUESTIONS.kurdish,
          ...DEFAULT_QUESTIONS.islamic,
          ...DEFAULT_QUESTIONS.sports,
          ...DEFAULT_QUESTIONS.science,
          ...DEFAULT_QUESTIONS.riddles,
          ...customQuestions
        ];
      } else {
        pool = [...(DEFAULT_QUESTIONS[state.category] || DEFAULT_QUESTIONS.general)];
      }

      // تێکەڵکردنی پرسیارەکان و هەڵبژاردنی ژمارەی دیاریکراو
      return pool.sort(() => Math.random() - 0.5).slice(0, state.questionLimit);
    }

    // ١. دەستپێکردنی یاریی تاکەکەسی (Solo Mode)
    function startSoloGame() {
      const name = document.getElementById('nameInp').value.trim() || 'یاریزان';
      state.myName = name;
      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'solo';
      state.players = [{ id: state.myId, name: state.myName, score: 0, streak: 0, currentAnswer: null, answerTime: 0 }];
      state.questions = buildQuestionSet();
      state.qIndex = 0;
      state.screen = 'playing';
      beginQuestionCountdown();
    }

    // ٢. دروستکردنی ژووری ڕاستەوخۆ (Host Mode)
    function startHostRoom() {
      const name = document.getElementById('nameInp').value.trim();
      if (!name) return alert('تکایە سەرەتا ناوی خۆت بنووسە!');
      state.myName = name;
      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'host';
      state.connecting = true;
      render();

      state.roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      const peerId = 'MAJLIS_V2_' + state.roomCode;
      state.peer = new Peer(peerId);

      state.peer.on('open', () => {
        state.connecting = false;
        state.players = [{ id: state.myId, name: state.myName, score: 0, streak: 0, currentAnswer: null, answerTime: 0 }];
        state.screen = 'lobby';
        render();
      });

      state.peer.on('error', () => {
        state.connecting = false;
        alert('کێشەیەک لە هێڵی ئینتەرنێتدا هەیە، تکایە دووبارە هەوڵ بدەرەوە.');
        render();
      });

      state.peer.on('connection', (conn) => {
        conn.on('data', (data) => onHostReceiveData(conn, data));
      });
    }

    // ٣. پەیوەستبوونی یاریزان (Player Mode)
    function joinHostRoom() {
      const name = document.getElementById('nameInp').value.trim();
      const code = document.getElementById('codeInp').value.trim().toUpperCase();
      if (!name || !code) return alert('تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');

      state.myName = name;
      state.roomCode = code;
      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'player';
      state.connecting = true;
      render();

      state.peer = new Peer();
      state.peer.on('open', () => {
        const conn = state.peer.connect('MAJLIS_V2_' + code, { reliable: true });
        state.hostConn = conn;

        const timeout = setTimeout(() => {
          if (state.connecting) {
            state.connecting = false;
            alert('ئەم کۆدی ژوورە نەدۆزرایەوە! دڵنیابە لە کۆدەکە.');
            render();
          }
        }, 8000);

        conn.on('open', () => {
          clearTimeout(timeout);
          state.connecting = false;
          conn.send({ type: 'JOIN', id: state.myId, name: state.myName });
        });

        conn.on('data', (data) => onPlayerReceiveData(data));
      });
    }

    function onHostReceiveData(conn, data) {
      if (data.type === 'JOIN') {
        state.connections[data.id] = conn;
        const exists = state.players.find(p => p.id === data.id);
        if (!exists) {
          // ئەگەر ناوێکی دووبارە هەبوو ژمارەیەکی بۆ زیاد دەکات
          let cleanName = data.name;
          if (state.players.some(p => p.name === cleanName)) {
            cleanName = `${data.name} (${state.players.length + 1})`;
          }
          state.players.push({ id: data.id, name: cleanName, score: 0, streak: 0, currentAnswer: null, answerTime: 0 });
        }
        syncAllPlayers(true);
        render();
      } else if (data.type === 'ANSWER') {
        const p = state.players.find(x => x.id === data.id);
        if (p && p.currentAnswer === null && !state.revealAnswer) {
          p.currentAnswer = data.ansIdx;
          p.answerTime = state.timeLeft;
          checkAllPlayersAnswered();
          syncAllPlayers(false);
          render();
        }
      } else if (data.type === 'EMOJI') {
        showFloatingEmoji(data.emoji, data.sender);
        broadcastPayload(data);
      }
    }

    function onPlayerReceiveData(data) {
      if (data.type === 'EMOJI') {
        showFloatingEmoji(data.emoji, data.sender);
        return;
      }
      if (data.type === 'TIMER_TICK') {
        state.timeLeft = data.timeLeft;
        updateTimerUIOnly();
        return;
      }
      if (data.type === 'SYNC') {
        const prevReveal = state.revealAnswer;
        state.screen = data.screen;
        state.players = data.players;
        if (data.questions) state.questions = data.questions;
        state.qIndex = data.qIndex;
        state.timeLeft = data.timeLeft;
        state.questionDuration = data.questionDuration;
        state.revealAnswer = data.revealAnswer;

        if (!prevReveal && state.revealAnswer && state.screen === 'playing') {
          const me = state.players.find(p => p.id === state.myId);
          const qObj = state.questions[state.qIndex];
          if (me && me.currentAnswer === qObj.ans) playTone('correct');
          else playTone('wrong');
        }
        render();
      }
    }

    function broadcastPayload(payload) {
      Object.values(state.connections).forEach(c => {
        if (c && c.open) c.send(payload);
      });
    }

    function syncAllPlayers(includeQuestions = false) {
      if (state.role !== 'host') return;
      broadcastPayload({
        type: 'SYNC',
        screen: state.screen,
        players: state.players,
        questions: includeQuestions ? state.questions : null,
        qIndex: state.qIndex,
        timeLeft: state.timeLeft,
        questionDuration: state.questionDuration,
        revealAnswer: state.revealAnswer
      });
    }

    function hostStartCompetition() {
      state.questions = buildQuestionSet();
      state.qIndex = 0;
      state.players.forEach(p => { p.score = 0; p.streak = 0; p.currentAnswer = null; });
      state.screen = 'playing';
      syncAllPlayers(true);
      beginQuestionCountdown();
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval);
      state.timeLeft = state.questionDuration;
      state.revealAnswer = false;
      state.players.forEach(p => { p.currentAnswer = null; p.answerTime = 0; });
      syncAllPlayers(false);
      render();

      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');

        if (state.timeLeft <= 0) {
          revealQuestionResult();
        } else {
          updateTimerUIOnly();
          if (state.role === 'host') {
            broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft });
          }
        }
      }, 1000);
    }

    function submitPlayerAnswer(optIdx) {
      const me = state.players.find(p => p.id === state.myId);
      if (!me || me.currentAnswer !== null || state.revealAnswer) return;

      me.currentAnswer = optIdx;
      me.answerTime = state.timeLeft;
      render();

      if (state.role === 'host' || state.role === 'solo') {
        checkAllPlayersAnswered();
        syncAllPlayers(false);
      } else if (state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'ANSWER', id: state.myId, ansIdx: optIdx });
      }
    }

    function checkAllPlayersAnswered() {
      if (state.players.every(p => p.currentAnswer !== null)) {
        revealQuestionResult();
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval);
      state.revealAnswer = true;
      const qObj = state.questions[state.qIndex];

      state.players.forEach(p => {
        if (p.currentAnswer === qObj.ans) {
          p.streak = (p.streak || 0) + 1;
          const speedBonus = Math.round((p.answerTime / state.questionDuration) * 60);
          const streakBonus = p.streak >= 2 ? 25 : 0;
          p.score += 100 + speedBonus + streakBonus;
        } else {
          p.streak = 0;
        }
      });

      const me = state.players.find(p => p.id === state.myId);
      if (me && me.currentAnswer === qObj.ans) playTone('correct');
      else playTone('wrong');

      syncAllPlayers(false);
      render();
    }

    function advanceToNextQuestion() {
      if (state.qIndex + 1 < state.questions.length) {
        state.qIndex++;
        beginQuestionCountdown();
      } else {
        state.screen = 'finished';
        syncAllPlayers(false);
        render();
      }
    }

    // مۆداڵی زیادکردنی پرسیاری تایبەت
    function openCustomQModal() {
      document.getElementById('customQCountLabel').textContent = `ژمارەی پرسیارە تایبەتەکانت تا ئێستا: ${customQuestions.length} پرسیار`;
      document.getElementById('customQModal').classList.add('open');
    }

    function closeCustomQModal() {
      document.getElementById('customQModal').classList.remove('open');
    }

    function saveCustomQuestion() {
      const q = document.getElementById('cqText').value.trim();
      const o0 = document.getElementById('cqOpt0').value.trim();
      const o1 = document.getElementById('cqOpt1').value.trim();
      const o2 = document.getElementById('cqOpt2').value.trim();
      const o3 = document.getElementById('cqOpt3').value.trim();

      if (!q || !o0 || !o1 || !o2 || !o3) {
        return alert('تکایە دەقی پرسیارەکە و هەر ٤ هەڵبژاردەکە بنووسە!');
      }

      // تێکەڵکردنی شوێنی وەڵامە ڕاستەکە بۆ ئەوەی هەمیشە ژمارە ١ نەبێت
      const rawOpts = [
        { text: o0, isCorrect: true },
        { text: o1, isCorrect: false },
        { text: o2, isCorrect: false },
        { text: o3, isCorrect: false }
      ].sort(() => Math.random() - 0.5);

      const ansIndex = rawOpts.findIndex(x => x.isCorrect);

      customQuestions.push({
        q,
        opts: rawOpts.map(x => x.text),
        ans: ansIndex
      });

      localStorage.setItem(CUSTOM_Q_KEY, JSON.stringify(customQuestions));
      document.getElementById('cqText').value = '';
      document.getElementById('cqOpt0').value = '';
      document.getElementById('cqOpt1').value = '';
      document.getElementById('cqOpt2').value = '';
      document.getElementById('cqOpt3').value = '';
      document.getElementById('customQCountLabel').textContent = `✅ زیادکرا! کۆی پرسیارەکانت: ${customQuestions.length} پرسیار`;
      render();
    }

    render();
  </script>
</body>
</html>
