<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #18100a;
      --bg-surface: rgba(38, 25, 16, 0.95);
      --bg-card: rgba(58, 39, 25, 0.85);
      --bg-elevated: #4a3220;
      --border: rgba(212, 168, 125, 0.22);
      --text: #fdfaf6;
      --muted: #c7ad94;
      --primary: #c88a4b;
      --primary-dark: #9e652b;
      --primary-glow: rgba(200, 138, 75, 0.35);
      --accent: #e6b88a;
      --emerald: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius: 20px;
    }

    body.light-mode {
      --bg-main: #f6f0e8;
      --bg-surface: rgba(255, 255, 255, 0.96);
      --bg-card: #ede3d5;
      --bg-elevated: #e2d4c1;
      --border: rgba(110, 71, 35, 0.16);
      --text: #291a0d;
      --muted: #785a3f;
      --primary: #8c5523;
      --primary-dark: #663b14;
      --primary-glow: rgba(140, 85, 35, 0.25);
      --accent: #b07238;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-main) radial-gradient(at 15% 10%, rgba(200, 138, 75, 0.16) 0px, transparent 50%) fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    #splashScreen {
      position: fixed; inset: 0; background: var(--bg-main); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      animation: autoHideSplash 0.45s ease 1.8s forwards;
    }
    @keyframes autoHideSplash { to { opacity: 0; visibility: hidden; pointer-events: none; } }

    .splash-logo {
      width: 86px; height: 86px; border-radius: 26px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 2.6rem; box-shadow: 0 14px 34px var(--primary-glow);
      animation: pulseSplash 0.9s infinite alternate;
    }
    @keyframes pulseSplash { from { transform: scale(0.94); } to { transform: scale(1.06); } }
    .splash-title { font-weight: 900; font-size: 2.3rem; color: var(--text); }

    header {
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg-surface);
      backdrop-filter: blur(14px); display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; box-shadow: 0 4px 12px var(--primary-glow); color: #fff;
    }
    .brand-title { font-weight: 900; font-size: 1.28rem; }
    .icon-pill {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 50px; font-size: 0.82rem; font-weight: 800;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .icon-pill:active { transform: scale(0.96); }

    main { max-width: 680px; width: 100%; margin: 0 auto; padding: 14px 12px 60px; flex: 1; }
    .card {
      background: var(--bg-surface); backdrop-filter: blur(16px); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 16px; margin-bottom: 14px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    h2 { font-size: 1.2rem; font-weight: 900; margin-bottom: 4px; text-align: center; }
    p.sub { color: var(--muted); font-size: 0.82rem; text-align: center; margin-bottom: 14px; line-height: 1.5; }

    .welcome-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px;
      background: var(--bg-card); padding: 5px; border-radius: 14px; border: 1px solid var(--border);
    }
    .w-tab {
      padding: 10px 8px; border-radius: 10px; border: none; background: transparent;
      color: var(--muted); font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
    }
    .w-tab.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 12px var(--primary-glow); }

    .input {
      width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--border);
      background: var(--bg-card); color: var(--text); font-size: 0.94rem; font-weight: 700;
      margin-bottom: 12px; outline: none; text-align: center; transition: 0.2s;
    }
    .input::placeholder { color: var(--muted); opacity: 0.8; }
    .input:focus, .input.custom-active { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

    .btn {
      width: 100%; padding: 13px 18px; border-radius: 14px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text); font-size: 0.95rem; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 0.12s, box-shadow 0.2s; margin-bottom: 10px; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
    }
    .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.22); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: 1px solid var(--accent); color: #fff; box-shadow: 0 4px 0 #593310, 0 8px 20px var(--primary-glow); }
    .btn-emerald { background: linear-gradient(135deg, #059669, #10b981); border: none; color: #fff; box-shadow: 0 4px 0 #065f46; }

    .section-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
    .section-tag {
      display: inline-flex; align-items: center; gap: 6px; background: var(--bg-elevated);
      border: 1px solid var(--border); padding: 4px 12px; border-radius: 50px;
      font-size: 0.74rem; font-weight: 800; margin-bottom: 10px;
    }

    .vibe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .vibe-card {
      background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 8px 6px; text-align: center; cursor: pointer; transition: 0.18s;
    }
    .vibe-card .v-ico { font-size: 1.2rem; display: block; margin-bottom: 2px; }
    .vibe-card strong { font-size: 0.76rem; display: block; }
    .vibe-card small { font-size: 0.64rem; color: var(--muted); display: block; margin-top: 2px; }
    .vibe-card.active { background: linear-gradient(145deg, var(--primary), var(--primary-dark)); border-color: #fff; box-shadow: 0 4px 12px var(--primary-glow); }
    .vibe-card.active strong, .vibe-card.active small { color: #fff; }

    .topic-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
    .topic-chip {
      padding: 7px 12px; border-radius: 50px; border: 1.5px solid var(--border);
      background: var(--bg-surface); color: var(--muted); font-size: 0.78rem; font-weight: 800; cursor: pointer;
    }
    .topic-chip.active { background: var(--primary); border-color: #fff; color: #fff; box-shadow: 0 3px 10px var(--primary-glow); }

    .settings-stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .setting-row-inline {
      background: var(--bg-card); border: 1px solid var(--border); padding: 7px 10px;
      border-radius: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .setting-row-inline label { font-size: 0.76rem; font-weight: 800; color: var(--muted); }
    .seg-group { display: flex; gap: 5px; }
    .seg-btn {
      padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-surface); color: var(--muted); font-size: 0.75rem; font-weight: 800; cursor: pointer;
    }
    .seg-btn.active { background: var(--primary); color: #fff; border-color: var(--accent); }

    .qr-wrap {
      background: #fff; padding: 12px; border-radius: 18px; width: fit-content;
      margin: 8px auto 14px; box-shadow: 0 10px 26px rgba(0,0,0,0.3); border: 3px solid var(--primary);
    }
    .pin-boxes { display: flex; justify-content: center; gap: 8px; margin: 6px 0 14px; direction: ltr; }
    .pin-digit {
      width: 48px; height: 54px; border-radius: 14px; background: var(--bg-card);
      border: 2px solid var(--primary); font-size: 1.55rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
    }

    .players-wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
    .p-badge {
      background: var(--bg-card); border: 1.5px solid var(--primary); padding: 6px 13px;
      border-radius: 50px; font-weight: 800; font-size: 0.84rem; display: inline-flex; align-items: center; gap: 6px;
    }
    .kick-btn {
      background: rgba(239, 68, 68, 0.22); border: none; color: var(--danger);
      width: 20px; height: 20px; border-radius: 50%; font-size: 0.7rem; cursor: pointer;
    }

    .quiz-top-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 800; font-size: 0.84rem; }
    .source-tag { font-size: 0.74rem; padding: 3px 10px; border-radius: 50px; background: var(--bg-card); border: 1px solid var(--border); color: var(--accent); }
    .timer-track { height: 10px; background: var(--bg-card); border-radius: 50px; overflow: hidden; margin-bottom: 14px; border: 1px solid var(--border); }
    .timer-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--primary), var(--danger)); transition: width 0.95s linear; }

    .q-banner {
      font-size: 1.12rem; font-weight: 900; text-align: center; padding: 18px 14px;
      background: var(--bg-card); border-radius: 16px; border: 1.5px solid var(--border);
      margin-bottom: 14px; line-height: 1.65;
    }
    .opts-list { display: grid; gap: 10px; }
    .opt-card {
      padding: 12px 14px; border-radius: 14px; border: 2px solid var(--border);
      background: var(--bg-card); color: var(--text); font-size: 0.94rem; font-weight: 800;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      gap: 10px; box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    }
    .opt-right { display: flex; align-items: center; gap: 10px; text-align: right; }
    .opt-num {
      width: 30px; height: 30px; border-radius: 9px; background: var(--bg-surface);
      border: 1px solid var(--border); color: var(--primary); display: inline-flex;
      align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; flex-shrink: 0;
    }
    .opt-card.selected { border-color: var(--primary); background: var(--bg-elevated); }
    .opt-card.selected .opt-num { background: var(--primary); color: #fff; border-color: #fff; }
    .opt-card.correct { border-color: var(--emerald); background: rgba(16, 185, 129, 0.28); }
    .opt-card.correct .opt-num { background: var(--emerald); color: #fff; }
    .opt-card.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.25); }
    .opt-card.wrong .opt-num { background: var(--danger); color: #fff; }

    .gain-badge {
      display: inline-block; background: rgba(16, 185, 129, 0.22); color: var(--emerald);
      border: 1px solid var(--emerald); padding: 2px 8px; border-radius: 50px; font-size: 0.74rem; margin-right: 6px;
    }
    .next-auto-banner {
      margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--bg-card);
      border: 1px solid var(--primary); text-align: center; font-weight: 800; font-size: 0.85rem;
    }

    .leader-row {
      display: flex; justify-content: space-between; align-items: center; padding: 11px 14px;
      border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border);
      margin-bottom: 8px; font-weight: 800; font-size: 0.9rem;
    }
    .leader-row.first { background: linear-gradient(90deg, rgba(200, 138, 75, 0.28), var(--bg-card)); border-color: var(--primary); }

    .comedy-grid { display: grid; gap: 12px; margin: 16px 0; text-align: right; }
    .comedy-card { padding: 15px; border-radius: 16px; line-height: 1.7; font-size: 0.92rem; font-weight: 700; }
    .comedy-card.winner-box { background: rgba(16, 185, 129, 0.14); border: 1.5px solid var(--emerald); }
    .comedy-card.loser-box { background: rgba(200, 138, 75, 0.15); border: 1.5px solid var(--primary); }
    .comedy-head { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 0.96rem; margin-bottom: 5px; }

    .countdown-overlay { text-align: center; padding: 46px 20px; }
    .countdown-num { font-size: 4.8rem; font-weight: 900; color: var(--primary); animation: popIn 0.4s ease; }
    @keyframes popIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .confetti-piece { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 280; pointer-events: none; animation: fallDown 3.2s linear forwards; }
    @keyframes fallDown { to { transform: translateY(105vh) rotate(720deg); opacity: 0; } }

    .toast-msg {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
      background: var(--bg-surface); border: 1.5px solid var(--primary); color: var(--text);
      padding: 10px 18px; border-radius: 50px; font-size: 0.82rem; font-weight: 800;
      z-index: 400; box-shadow: 0 10px 25px rgba(0,0,0,0.4); animation: popIn 0.25s ease; text-align: center; max-width: 90vw;
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 250; padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
      max-width: 480px; width: 100%; padding: 20px; max-height: 88vh; overflow-y: auto;
    }

    .spinner {
      width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 400px) { .vibe-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <div id="splashScreen" onclick="this.remove()">
    <div class="splash-logo">☕</div>
    <div class="splash-title">مەجلیس</div>
  </div>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="brand-icon">☕</div>
      <div class="brand-title">مەجلیس</div>
    </div>
    <button class="icon-pill" onclick="toggleModal('settingsModal', true)">⚙️ دەستکاری</button>
  </header>

  <main id="appContainer"></main>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <h3 style="margin-bottom:14px; text-align:center;">⚙️ دەستکاری و ڕێکخستن</h3>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn" onclick="toggleThemeMode()">🌓 گۆڕینی دۆخی قاوەیی تۆخ / سپی</button>
        <button class="btn" onclick="toggleSound()" id="soundBtnLabel">🔊 دەنگی یاری: چالاکە</button>
        <button class="btn" onclick="openCustomQModal()">✍️ زیادکردنی پرسیاری تایبەت</button>
        <button class="btn" onclick="openKeySetupModal()">🔑 دانان و پشکنینی کلیل</button>
        <button class="btn" onclick="clearAskedHistory(); toggleModal('settingsModal', false);">🔄 سفرکردنەوەی مێژووی پرسیارەکان</button>
      </div>
      <button class="btn btn-primary" style="margin-top:12px; margin-bottom:0;" onclick="toggleModal('settingsModal', false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="keySetupModal">
    <div class="modal-box">
      <h3 style="margin-bottom:8px; text-align:center;">🔑 دانان و پشکنینی کلیل</h3>
      <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px; text-align:center; line-height:1.6;">
        کلیلەکەت لێرە دابنێ (دەتوانیت کلیلی <strong>AIzaSy...</strong> یان <strong>gsk_...</strong> یان <strong>AQ.Ab8...</strong> دابنێیت):
      </p>
      <input type="text" id="masterKeyInput" class="input" dir="ltr" placeholder="AIzaSy... / gsk_... / AQ.Ab8..." />
      <div id="keyCheckStatus" style="font-size:0.8rem; text-align:center; margin-bottom:10px; font-weight:800;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="toggleModal('keySetupModal', false)">داخستن</button>
        <button class="btn btn-primary" id="saveKeyBtn" onclick="saveAndTestMasterKey()">💾 خەزنکردن و پشکنین</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="customQModal">
    <div class="modal-box">
      <h3 style="margin-bottom:8px;">✍️ زیادکردنی پرسیاری تایبەتی خۆت</h3>
      <p style="font-size:0.78rem; color:var(--muted); margin-bottom:10px;">
        پرسیار لەسەر هاوڕێکانت یان هەر بابەتێک بنووسە بۆ ئەوەی لە بەشی (پرسیارەکانی خۆم) یاری پێ بکەن:
      </p>
      <input type="text" id="cqText" class="input" placeholder="دەقی پرسیارەکە بنووسە..." style="text-align:right;" />
      <input type="text" id="cqOpt0" class="input" placeholder="وەڵامی ڕاست لێرە بنووسە ✅" style="text-align:right; border-color:var(--emerald);" />
      <input type="text" id="cqOpt1" class="input" placeholder="هەڵبژاردەی هەڵەی ١" style="text-align:right;" />
      <input type="text" id="cqOpt2" class="input" placeholder="هەڵبژاردەی هەڵەی ٢" style="text-align:right;" />
      <input type="text" id="cqOpt3" class="input" placeholder="هەڵبژاردەی هەڵەی ٣" style="text-align:right;" />
      <div id="customQStatus" style="font-size:0.78rem; color:var(--emerald); text-align:center; margin-bottom:8px;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="toggleModal('customQModal', false); render();">داخستن</button>
        <button class="btn btn-primary" onclick="saveCustomQuestion()">➕ زیادکردن</button>
      </div>
    </div>
  </div>

  <script>
    const KEYS = {
      API: 'MAJLIS_MASTER_KEY',
      SEEN: 'MAJLIS_SEEN_HISTORY',
      CUSTOM: 'MAJLIS_CUSTOM_QUESTIONS',
      NAME: 'MAJLIS_PLAYER_NAME',
      ID: 'MAJLIS_PLAYER_ID',
      THEME: 'MAJLIS_THEME_MODE'
    };

    if (localStorage.getItem(KEYS.THEME) === 'light') document.body.classList.add('light-mode');
    setTimeout(() => document.getElementById('splashScreen')?.remove(), 2200);

    let wakeLock = null;
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) {}
    }

    function extractCleanKey(raw) {
      if (!raw) return '';
      const str = String(raw).trim();
      const m = str.match(/(?:gsk_|AQ\.|AIza)[A-Za-z0-9_-]{20,}/);
      return m ? m[0] : str.replace(/['"\s]/g, '');
    }

    let persistentId = localStorage.getItem(KEYS.ID);
    if (!persistentId) {
      persistentId = 'U_' + Math.random().toString(36).substring(2, 10);
      localStorage.setItem(KEYS.ID, persistentId);
    }

    let customQuestions = JSON.parse(localStorage.getItem(KEYS.CUSTOM) || '[]');
    let seenQuestions = JSON.parse(localStorage.getItem(KEYS.SEEN) || '[]');

    function normalizeDigits(str) {
      if (!str) return '';
      const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
      return String(str).replace(/[٠-٩۰-۹]/g, d => map[d] || d).trim().toUpperCase();
    }

    const QUESTION_VIBES = [

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.14, now);
          osc.start(); osc.stop(now + 0.32);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);

          gain.gain.setValueAtTime(0.14, now);

      return list.length ? list : [QUESTION_VIBES[0]];
    };

    function fetchWithTimeout(url, options, timeoutMs = 9500) {
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeoutMs))
      ]);
    }

    function parseFlexibleQuestions(rawText, count) {
      if (!rawText) return null;
      const text = String(rawText).replace(/```json|```/gi, '').trim();
      let items = [];
      try {
        const s = text.indexOf('['), e = text.lastIndexOf(']');
        if (s !== -1 && e !== -1) items = JSON.parse(text.substring(s, e + 1));
      } catch (_) {
        items = (text.match(/\{[\s\S]*?"(?:q|question)"[\s\S]*?\}/g) || []).map(m => { try { return JSON.parse(m); } catch (e) { return null; } });
      }
      if (!Array.isArray(items)) return null;

      const cleaned = [];
      for (const item of items) {
        if (!item || typeof item !== 'object') continue;
        const qText = String(item.q || item.question || item.text || '').trim();
        const rawOpts = item.opts || item.options || item.choices || item.answers;
        if (!qText || !Array.isArray(rawOpts) || rawOpts.length < 4) continue;
        const opts = rawOpts.slice(0, 4).map(o => String(o).trim());
        const rawAns = item.ans ?? item.answer ?? item.correct ?? 0;
        let ansIdx = typeof rawAns === 'number' && rawAns >= 0 && rawAns < 4 ? rawAns : (opts.indexOf(String(rawAns).trim()) !== -1 ? opts.indexOf(String(rawAns).trim()) : (parseInt(rawAns, 10) || 0));
        if (ansIdx < 0 || ansIdx > 3) ansIdx = 0;

        const correctText = opts[ansIdx];
        const shuffledOpts = [...opts].sort(() => Math.random() - 0.5);
        markQuestionSeen(qText);
        cleaned.push({ q: qText, opts: shuffledOpts, ans: shuffledOpts.indexOf(correctText) });
      }
      return cleaned.length ? cleaned.slice(0, count) : null;
    }

    function parseFlexibleComedy(rawText) {
      if (!rawText) return null;
      try {
        const text = String(rawText).replace(/```json|```/gi, '').trim();
        const s = text.indexOf('{'), e = text.lastIndexOf('}');
        if (s === -1 || e === -1) return null;
        const obj = JSON.parse(text.substring(s, e + 1));
        return (obj && obj.winnerJoke && obj.loserJoke) ? obj : null;
      } catch (e) { return null; }
    }

    async function requestWithSingleKey(key, prompt) {
      if (!key) throw new Error('NO_KEY');

      if (key.startsWith('gsk_')) {
        const r = await fetchWithTimeout('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [{ role: 'system', content: 'Return ONLY valid raw JSON in Kurdish Sorani.' }, { role: 'user', content: prompt }],
            temperature: 0.9
          })
        }, 9000);
        if (!r.ok) throw new Error('GROQ_' + r.status);
        const d = await r.json();
        return d?.choices?.[0]?.message?.content || '';
      }

      const models = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
      for (const m of models) {
        try {
          const isStandardKey = key.startsWith('AIza');
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent${isStandardKey ? `?key=${encodeURIComponent(key)}` : ''}`;
          const headers = { 'Content-Type': 'application/json' };
          if (!isStandardKey) headers['X-goog-api-key'] = key;

          const r = await fetchWithTimeout(url, {
            method: 'POST', headers,
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          }, 8500);
          if (r.ok) {
            const d = await r.json();
            const t = d?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            if (t) return t;
          }
        } catch (e) {}
      }
      throw new Error('GEMINI_FAILED');
    }

    async function callAIRawText(prompt, shortPromptForGet) {
      if (state.masterKey) {
        try {
          const res = await requestWithSingleKey(state.masterKey, prompt);
          if (res) return res;
        } catch (e) {}
      }

      const seed = Math.floor(Math.random() * 999999);
      try {
        return await Promise.any([
          (async () => {
            const r = await fetchWithTimeout('https://text.pollinations.ai/openai', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: 'openai',
                messages: [{ role: 'system', content: 'Output ONLY valid raw JSON in Kurdish Sorani.' }, { role: 'user', content: prompt }],
                seed
              })
            }, 9500);
            if (!r.ok) throw new Error();
            const raw = await r.text();
            try { return JSON.parse(raw)?.choices?.[0]?.message?.content || raw; } catch (_) { return raw; }
          })(),
          (async () => {
            const concise = shortPromptForGet || prompt.substring(0, 300);
            const r = await fetchWithTimeout(`https://text.pollinations.ai/${encodeURIComponent(concise)}?model=openai&seed=${seed}`, { method: 'GET' }, 9500);
            if (!r.ok) throw new Error();
            return await r.text();
          })()
        ]);
      } catch (e) { return null; }
    }

    async function generateAIQuestions(topicsList, customTopic, count, difficulty) {
      const effectiveTopic = customTopic || topicsList.join(' و ');
      if (!customTopic && topicsList.length === 1 && topicsList[0] === 'پرسیارەکانی خۆم (تایبەت)') {
        if (!customQuestions.length) return showToast('⚠️ هیچ پرسیارێکی تایبەتت زیاد نەکردووە!'), null;
        return [...customQuestions].sort(() => Math.random() - 0.5).slice(0, count);
      }

      const seed = Math.floor(Math.random() * 9999999);
      const angle = CREATIVE_ANGLES[seed % CREATIVE_ANGLES.length];
      const avoid = seenQuestions.slice(-20).join(' | ');

      const prompt = `تۆ پسپۆڕی دروستکردنی پرسیاری پێشبڕکێیت بە زمانی کوردیی سۆرانیی پاراو.
تکایە رێک ${count} پرسیاری هەڵبژاردن (٤ هەڵبژاردەیی) تەنها لەسەر ئەم بابەتە دروست بکە: "${effectiveTopic}".
- ئاستی قورسی: "${difficulty}" | گۆشەنیگا: (${angle}) | کۆد: ${seed}.
- ئەم پرسیارانە دووبارە مەکەرەوە: [${avoid}].
تەنها JSON Array بنێرەوە بێ هیچ قسەیەکی زیادە:
[{"q":"دەقی پرسیار؟","opts":["هەڵبژاردەی ١","هەڵبژاردەی ٢","هەڵبژاردەی ٣","هەڵبژاردەی ٤"],"ans":0}]`;

      const shortPrompt = `Create ${count} unique Kurdish Sorani multiple choice questions about (${effectiveTopic}), difficulty (${difficulty}), seed ${seed}. Return ONLY raw JSON array: [{"q":"...","opts":["1","2","3","4"],"ans":0}]`;

      const parsed = parseFlexibleQuestions(await callAIRawText(prompt, shortPrompt), count);
      if (parsed?.length) return parsed;

      let pool = [];
      topicsList.forEach(t => {
        if (t === 'پرسیارەکانی خۆم (تایبەت)') pool.push(...customQuestions);
        else if (EMERGENCY_POOL[t]) pool.push(...EMERGENCY_POOL[t]);
      });
      if (!pool.length) Object.values(EMERGENCY_POOL).forEach(arr => pool.push(...arr));

      let unseen = pool.filter(i => !seenQuestions.includes(i.q));
      if (unseen.length < count) { seenQuestions = []; unseen = [...pool]; }

      return unseen.sort(() => Math.random() - 0.5).slice(0, count).map(item => {
        const correctText = item.opts[item.ans];
        const shuffledOpts = [...item.opts].sort(() => Math.random() - 0.5);
        markQuestionSeen(item.q);
        return { q: item.q, opts: shuffledOpts, ans: shuffledOpts.indexOf(correctText) };
      });
    }

    async function generateAIComedyCommentary() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0] || { name: 'پاڵەوان', score: 0 };
      const losers = sorted.slice(1);
      const loserNames = state.players.length > 1 ? losers.map(p => p.name).join(' و ') : 'ئەوانی تر';
      const vibes = getActiveVibesObjects();
      const vibeTitles = vibes.map(v => v.title).join(' و ');
      const vibeHints = vibes.map(v => v.comedyHint).join(' + ');
      const seed = Math.floor(Math.random() * 9999999);

      const prompt = `تۆ پێشکەشکارێکی کۆمیدیی کوردیت لە یاریی "مەجلیس". شێوازی دانیشتنەکە: "${vibeTitles}" (${vibeHints}).
براوەی یەکەم: "${winner.name}" (${winner.score} خاڵ). دۆڕاوەکان: "${loserNames}".
دوو ڕستەی زۆر کۆمیدی و نوێ بە کوردیی سۆرانی بنووسە (ژمارە: ${seed}):
- winnerJoke: پیرۆزبایی و پیاهەڵدانێکی کۆمیدی بۆ براوەکە (${winner.name}).
- loserJoke: قسەیەکی خۆش و سزایەکی کۆمیدی بۆ دۆڕاوەکان (${loserNames}).
تەنها JSON بنێرە: {"winnerJoke":"...","loserJoke":"..."}`;

      const shortComedy = `Write funny Kurdish Sorani quiz commentary for winner (${winner.name}) and losers (${loserNames}) in vibe (${vibeTitles}), seed ${seed}. Return ONLY JSON: {"winnerJoke":"...","loserJoke":"..."}`;

      return parseFlexibleComedy(await callAIRawText(prompt, shortComedy)) || {
        winnerJoke: `بژی ${winner.name}! بەم زیرەکییەت سەلماندت کە سەردەستەی ئەم مەجلیسەیت!`,
        loserJoke: `بەداخەوە بۆ (${loserNames})! ئەمشەو چا لێنان و خزمەتکردنی مەجلیسەکە لەسەر ئێوەیە!`
      };
    }

        </div>`;
    }

    function renderFinishedScreen() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0];
      const medals = ['🥇 براوەی یەکەم:', '🥈 دووەم:', '🥉 سێیەم:'];

      return `
        <div class="card" style="text-align:center;">
          <div style="font-size:3.5rem; margin-bottom:2px;">🏆</div>
          <h2>پاڵەوانی مەجلیس: ${winner?.name || ''}!</h2>
          <p class="sub">کۆی خاڵی بەدەستهاتوو: <strong>${winner?.score || 0} خاڵ</strong></p>

          <div class="comedy-grid">
            <div class="comedy-card winner-box">
              <div class="comedy-head">👑 براوەی مەجلیس:</div>
              <div>"${state.comedyResult.winnerJoke || 'بژی پاڵەوان!'}"</div>
            </div>
            <div class="comedy-card loser-box">
              <div class="comedy-head">☕ بڕیاری مەجلیس بۆ دۆڕاوەکان:</div>
              <div>"${state.comedyResult.loserJoke || 'جاری داهاتوو هەوڵ بدەنەوە!'}"</div>
            </div>
          </div>

          <div style="text-align:right; margin:16px 0;">
            <h3 style="font-size:0.95rem; margin-bottom:8px;">📋 ڕیزبەندی کۆتایی یاریزانەکان:</h3>
            ${sorted.map((p, i) => `
              <div class="leader-row ${i === 0 ? 'first' : ''}">
                <span>${medals[i] || `🐢 ${i + 1}.`} ${p.name}</span>
                <span style="color:var(--emerald);">${p.score} خاڵ</span>
              </div>`).join('')}
          </div>

          ${state.role === 'host' ? `
            <button class="btn" onclick="regenerateComedyNow()" ${state.generatingComedy ? 'disabled' : ''}>
              ${state.generatingComedy ? '<span class="spinner"></span> چاوەڕوان بە...' : '🎲 گۆڕینی قسەی مەجلیس (شتێکی تر بڵێ!)'}
            </button>
            <button class="btn btn-primary" ${state.generatingAI ? 'disabled' : ''} onclick="hostStartCompetition()">
              ${state.generatingAI ? '<span class="spinner"></span> پرسیار ئامادە دەکرێ...' : '✨ خولێکی نوێ لەگەڵ هاوڕێیان'}
            </button>` : ''}
          <button class="btn" onclick="resetToHome()">🏠 گەڕانەوە بۆ پەڕەی سەرەکی</button>
        </div>`;
    }

    function drawQRCode() {
      const box = document.getElementById('qrcode');
      if (!box || typeof QRCode === 'undefined') return;
      box.innerHTML = '';
      new QRCode(box, {
        text: `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`,
        width: 180, height: 180, colorDark: "#291a0d", colorLight: "#ffffff"
      });
    }

    function copyInvite(url) {
      navigator.clipboard.writeText(url);
      showToast('📋 لینکی مەجلیس کۆپی کرا!');
    }

    async function shareInviteNative(url) {
      const text = `☕ وەرنە ناو پێشبڕکێی مەجلیس! کۆدی ژوور: (${state.roomCode})`;
      if (navigator.share) { try { await navigator.share({ title: 'مەجلیس', text, url }); return; } catch (e) {} }
      window.open(`https://wa.me/?text=${encodeURIComponent(text + '\n' + url)}`, '_blank');
    }

    function kickPlayer(playerId) {
      state.players = state.players.filter(p => p.id !== playerId);
      syncAllPlayers(); render();
    }

    function connectMqttBroker(onConnected) {
      try { state.mqttClient?.end(true); } catch (e) {}
      if (typeof mqtt === 'undefined') {
        state.connecting = false; render();
        return showToast('⚠️ تکایە پەڕەکە ڕیفرێش بکەرەوە');
      }
      const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: 'majlis_' + state.myId + '_' + Math.random().toString(16).slice(2, 6),
        clean: true, connectTimeout: 7000, reconnectPeriod: 1500
      });
      state.mqttClient = client;
      client.on('connect', () => onConnected(client));
      client.on('error', () => {
        if (state.connecting) { state.connecting = false; showToast('⚠️ کێشە لە پەیوەندیی ئینتەرنێتدا هەیە.'); render(); }
      });
    }

    function startHostRoom() {
      const name = state.myName.trim();
      if (!name) return showToast('⚠️ تکایە سەرەتا ناوی خۆت بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();
      Object.assign(state, { role: 'host', connecting: true, roomCode: String(Math.floor(1000 + Math.random() * 9000)) });
      render();

      const actionTopic = `majlis_ku_v17/room/${state.roomCode}/action`;
      connectMqttBroker(client => {
        client.subscribe(actionTopic, { qos: 1 }, () => {
          state.connecting = false;
          state.players = [{ id: state.myId, name, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 }];
          state.screen = 'lobby';
          syncAllPlayers(); render();
        });
        client.on('message', (t, msg) => {
          if (t === actionTopic) { try { onHostReceiveData(JSON.parse(msg.toString())); } catch (e) {} }
        });
      });
    }

    function joinHostRoom() {
      const name = state.myName.trim();
      const code = normalizeDigits(state.roomCode);
      state.roomCode = code;
      if (!name || !code) return showToast('⚠️ تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();
      Object.assign(state, { role: 'player', connecting: true });
      render();

      const stateTopic = `majlis_ku_v17/room/${code}/state`;
      const actionTopic = `majlis_ku_v17/room/${code}/action`;

      connectMqttBroker(client => {
        let joined = false;
        const timeout = setTimeout(() => {
          if (!joined && state.connecting) { state.connecting = false; showToast('⚠️ ئەم کۆدی ژوورە نەدۆزرایەوە!'); render(); }
        }, 7000);

        client.subscribe(stateTopic, { qos: 1 }, () => {
          client.publish(actionTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name }), { qos: 1 });
        });

        client.on('message', (t, msg) => {
          if (t === stateTopic) {
            try {
              const data = JSON.parse(msg.toString());
              joined = true; clearTimeout(timeout); state.connecting = false;
              onPlayerReceiveData(data);
              if (data.players && !data.players.some(p => p.id === state.myId)) {
                client.publish(actionTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name }), { qos: 1 });
              }
            } catch (e) {}
          }
        });
      });
    }

    function onHostReceiveData(data) {
      if (data.type === 'JOIN') {
        const existing = state.players.find(p => p.id === data.id);
        if (existing) existing.name = data.name;
        else {
          const cleanName = state.players.some(p => p.name === data.name) ? `${data.name} (${state.players.length + 1})` : data.name;
          state.players.push({ id: data.id, name: cleanName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 });
        }
        syncAllPlayers(); render();
      } else if (data.type === 'ANSWER') {
        const p = state.players.find(x => x.id === data.id);
        if (p && !state.revealAnswer) Object.assign(p, { currentAnswer: data.ansIdx, hasAnswered: true, answerTime: state.timeLeft });
      }
    }

    function onPlayerReceiveData(data) {
      if (data.type === 'TIMER_TICK') { state.timeLeft = data.timeLeft; return updateTimerUIOnly(); }
      if (data.type === 'REVEAL_TICK') { state.revealCountdown = data.revealCountdown; return updateRevealCountdownUIOnly(); }
      if (data.type === 'SYNC') {
        const prevReveal = state.revealAnswer, prevScreen = state.screen, prevQ = state.qIndex;
        Object.assign(state, {
          screen: data.screen, countdownVal: data.countdownVal, qIndex: data.qIndex,
          timeLeft: data.timeLeft, questionDuration: data.questionDuration,
          revealAnswer: data.revealAnswer, revealCountdown: data.revealCountdown || 5,
          comedyResult: data.comedyResult || state.comedyResult
        });

        const myOld = state.players.find(p => p.id === state.myId);
        const keepChoice = !data.revealAnswer && prevQ === data.qIndex && myOld;
        state.players = data.players.map(p => (p.id === state.myId && keepChoice) ? { ...p, currentAnswer: myOld.currentAnswer, hasAnswered: myOld.hasAnswered } : p);

        if (!state.players.some(p => p.id === state.myId)) {
          state.players.push({ id: state.myId, name: state.myName, score: 0, lastGain: 0, streak: 0, hasAnswered: keepChoice ? myOld.hasAnswered : false, currentAnswer: keepChoice ? myOld.currentAnswer : null });
        }
        if (data.currentQuestion) {
          state.questions = new Array(data.totalQuestions).fill(null);
          state.questions[state.qIndex] = data.currentQuestion;
        }
        if (!prevReveal && state.revealAnswer && state.screen === 'playing') {
          const me = state.players.find(p => p.id === state.myId);
          playTone(me && me.currentAnswer === state.questions[state.qIndex]?.ans ? 'correct' : 'wrong');
        }
        if (prevScreen !== 'finished' && state.screen === 'finished') launchConfetti();
        render();
      }
    }

    function broadcastPayload(payload, retain = false) {
      if (state.role === 'host' && state.mqttClient && state.roomCode) {
        state.mqttClient.publish(`majlis_ku_v17/room/${state.roomCode}/state`, JSON.stringify(payload), { qos: retain ? 1 : 0, retain });
      }
    }

    function syncAllPlayers() {
      if (state.role !== 'host') return;
      const qObj = state.questions[state.qIndex];
      broadcastPayload({
        type: 'SYNC', screen: state.screen, countdownVal: state.countdownVal,
        players: state.players.map(p => ({
          id: p.id, name: p.name, score: p.score,
          lastGain: state.revealAnswer ? p.lastGain : 0, streak: p.streak,
          hasAnswered: false, currentAnswer: state.revealAnswer ? p.currentAnswer : null
        })),
        currentQuestion: qObj ? { q: qObj.q, opts: qObj.opts, ans: state.revealAnswer ? qObj.ans : null } : null,
        totalQuestions: state.questions.length, qIndex: state.qIndex,
        timeLeft: state.timeLeft, questionDuration: state.questionDuration,
        revealAnswer: state.revealAnswer, revealCountdown: state.revealCountdown,
        comedyResult: state.comedyResult
      }, true);
    }

    async function hostStartCompetition() {
      if (state.generatingAI) return;
      requestScreenWakeLock();
      state.generatingAI = true; render();

      const generated = await generateAIQuestions(state.selectedTopics, state.customTopicText.trim(), state.questionLimit, state.difficulty);
      state.generatingAI = false;
      if (!generated?.length) return render();

      state.questions = generated; state.qIndex = 0;
      state.players.forEach(p => Object.assign(p, { score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null }));
      runPreGameCountdown();
    }

    function runPreGameCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { screen: 'countdown', countdownVal: 10 });
      syncAllPlayers(); render(); playTone('tick');

      state.timerInterval = setInterval(() => {
        state.countdownVal--;
        if (state.countdownVal <= 0) {
          clearInterval(state.timerInterval);
          state.screen = 'playing';
          beginQuestionCountdown();
        } else { playTone('tick'); syncAllPlayers(); render(); }
      }, 1000);
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { timeLeft: state.questionDuration, revealAnswer: false });
      state.players.forEach(p => Object.assign(p, { hasAnswered: false, currentAnswer: null, answerTime: 0, lastGain: 0 }));
      syncAllPlayers(); render();

      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');
        if (state.timeLeft <= 0) revealQuestionResult();
        else {
          updateTimerUIOnly();
          if (state.role === 'host') broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft }, false);
        }
      }, 1000);
    }

    function submitPlayerAnswer(optIdx) {
      const me = state.players.find(p => p.id === state.myId);
      if (!me || state.revealAnswer) return;
      Object.assign(me, { currentAnswer: optIdx, hasAnswered: true, answerTime: state.timeLeft });
      render();
      if (state.role === 'player' && state.mqttClient && state.roomCode) {
        state.mqttClient.publish(`majlis_ku_v17/room/${state.roomCode}/action`, JSON.stringify({ type: 'ANSWER', id: state.myId, ansIdx: optIdx }), { qos: 1 });
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { revealAnswer: true, revealCountdown: 5 });
      const qObj = state.questions[state.qIndex];

      state.players.forEach(p => {
        if (p.currentAnswer === qObj.ans) {
          p.streak = (p.streak || 0) + 1;
          p.lastGain = 100 + Math.round((p.answerTime / state.questionDuration) * 60) + (p.streak >= 2 ? 25 : 0);
          p.score += p.lastGain;
        } else { p.streak = 0; p.lastGain = 0; }
      });

      const me = state.players.find(p => p.id === state.myId);
      playTone(me && me.currentAnswer === qObj.ans ? 'correct' : 'wrong');
      syncAllPlayers(); render();

      if (state.role === 'host') {
        state.revealInterval = setInterval(() => {
          state.revealCountdown--;
          if (state.revealCountdown <= 0) { clearInterval(state.revealInterval); advanceToNextQuestion(); }
          else { updateRevealCountdownUIOnly(); broadcastPayload({ type: 'REVEAL_TICK', revealCountdown: state.revealCountdown }, false); }
        }, 1000);
      }
    }

    async function advanceToNextQuestion() {
      clearInterval(state.revealInterval);
      if (state.qIndex + 1 < state.questions.length) {
        state.qIndex++; beginQuestionCountdown();
      } else {
        state.generatingComedy = true; render();
        state.comedyResult = await generateAIComedyCommentary();
        Object.assign(state, { generatingComedy: false, screen: 'finished' });
        launchConfetti(); syncAllPlayers(); render();
      }
    }

    async function regenerateComedyNow() {
      state.generatingComedy = true; render();
      state.comedyResult = await generateAIComedyCommentary();
      state.generatingComedy = false;
      syncAllPlayers(); render();
    }

    function openKeySetupModal() {
      toggleModal('settingsModal', false);
      document.getElementById('masterKeyInput').value = state.masterKey;
      document.getElementById('keyCheckStatus').textContent = '';
      toggleModal('keySetupModal', true);
    }

    async function saveAndTestMasterKey() {
      const cleanVal = extractCleanKey(document.getElementById('masterKeyInput').value);
      const statusEl = document.getElementById('keyCheckStatus');
      const btn = document.getElementById('saveKeyBtn');
      state.masterKey = cleanVal;
      localStorage.setItem(KEYS.API, cleanVal);

      if (!cleanVal) { toggleModal('keySetupModal', false); return showToast('✅ کلیل لابرا'); }

      btn.disabled = true;
      statusEl.style.color = 'var(--amber)';
      statusEl.textContent = '⏳ خەریکی پشکنینی کلیلەکەیە...';

      try {
        await requestWithSingleKey(cleanVal, 'Say OK');
        statusEl.style.color = 'var(--emerald)';
        statusEl.textContent = '✅ کلیلەکەت ١٠٠٪ کارایە و خەزن کرا!';
        setTimeout(() => { btn.disabled = false; toggleModal('keySetupModal', false); showToast('✅ کلیلەکەت چالاکە!'); }, 1000);
      } catch (e) {
        btn.disabled = false;
        statusEl.style.color = 'var(--danger)';
        statusEl.textContent = '⚠️ ئەم کلیلە کار ناکات، تکایە کلیلێکی نوێ دروست بکە!';
      }
    }

    function openCustomQModal() {
      toggleModal('settingsModal', false);
      document.getElementById('customQStatus').textContent = `کۆی پرسیارە تایبەتەکانت: ${customQuestions.length} پرسیار`;
      toggleModal('customQModal', true);
    }

    function saveCustomQuestion() {
      const ids = ['cqText', 'cqOpt0', 'cqOpt1', 'cqOpt2', 'cqOpt3'];
      const [q, o0, o1, o2, o3] = ids.map(id => document.getElementById(id).value.trim());
      if (!q || !o0 || !o1 || !o2 || !o3) return showToast('⚠️ تکایە پرسیارەکە و هەر ٤ هەڵبژاردەکە پڕ بکەرەوە!');

      const opts = [o0, o1, o2, o3].sort(() => Math.random() - 0.5);
      customQuestions.push({ q, opts, ans: opts.indexOf(o0) });
      localStorage.setItem(KEYS.CUSTOM, JSON.stringify(customQuestions));
      ids.forEach(id => document.getElementById(id).value = '');
      document.getElementById('customQStatus').textContent = `✅ زیادکرا! کۆی پرسیارە تایبەتەکانت: ${customQuestions.length}`;
      if (!state.selectedTopics.includes('پرسیارەکانی خۆم (تایبەت)')) state.selectedTopics.push('پرسیارەکانی خۆم (تایبەت)');
      state.customTopicText = '';
    }

    render();
  </script>
</body>
</html>
