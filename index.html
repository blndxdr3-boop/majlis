<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس AI Pro V5 | پێشبڕکێی زیرەکی دەستکرد</title>
  <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
  <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
  <link href="[https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap](https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap)" rel="stylesheet">
  <script src="[https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js](https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js](https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js)"></script>

  <style>
    :root {
      --bg-dark: #070a14;
      --bg-surface: rgba(17, 24, 39, 0.92);
      --bg-card: rgba(30, 41, 59, 0.78);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.4);
      --accent: #ec4899;
      --emerald: #10b981;
      --danger: #f43f5e;
      --amber: #f59e0b;
      --cyan: #06b6d4;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.24) 0px, transparent 45%),
        radial-gradient(at 90% 85%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.12) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 10, 20, 0.88);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 6px 18px var(--primary-glow);
    }

    .brand-title {
      font-weight: 900;
      font-size: 1.2rem;
      background: linear-gradient(90deg, #e9d5ff, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    main {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 14px 70px;
      flex: 1;
    }

    .card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    h2 {
      font-size: 1.28rem;
      font-weight: 900;
      margin-bottom: 6px;
      text-align: center;
    }

    p.sub {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .welcome-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .w-tab {
      padding: 10px 6px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .w-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(9, 13, 24, 0.92);
      color: #fff;
      font-size: 0.94rem;
      font-weight: 700;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: #fff;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
      margin-bottom: 10px;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #059669, #10b981);
      border: none;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
    }

    .btn-cyan {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border: none;
    }

    .vibe-section {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.2);
      color: #a5f3fc;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.76rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .vibe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
    }

    .vibe-card {
      background: rgba(9, 13, 24, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .vibe-card .v-ico {
      font-size: 1.45rem;
      display: block;
      margin-bottom: 3px;
    }

    .vibe-card strong {
      font-size: 0.82rem;
      display: block;
      color: #fff;
    }

    .vibe-card small {
      font-size: 0.68rem;
      color: var(--muted);
      display: block;
    }

    .vibe-card.active {
      background: linear-gradient(145deg, rgba(6, 182, 212, 0.28), rgba(139, 92, 246, 0.25));
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
    }

    .ai-config-box {
      background: linear-gradient(145deg, rgba(139, 92, 246, 0.14), rgba(236, 72, 153, 0.08));
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.25);
      color: #e9d5ff;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.76rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .topic-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      justify-content: center;
    }

    .topic-chip {
      padding: 7px 12px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .topic-chip.active {
      background: var(--primary);
      border-color: #c084fc;
      color: #fff;
    }

    .settings-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .setting-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 12px;
      text-align: center;
    }

    .setting-box label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .setting-box select {
      background: var(--bg-card);
      color: #fff;
      border: 1px solid var(--border);
      padding: 5px 6px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.8rem;
      width: 100%;
      outline: none;
    }

    .qr-wrap {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      width: fit-content;
      margin: 10px auto 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .room-pin {
      background: rgba(139, 92, 246, 0.16);
      border: 2px dashed var(--primary);
      color: #f3e8ff;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-align: center;
      padding: 8px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 12px 0;
    }

    .p-badge {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid var(--emerald);
      color: #a7f3d0;
      padding: 7px 14px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .quiz-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.86rem;
      flex-wrap: wrap;
      gap: 6px;
    }

    .timer-track {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald), var(--amber), var(--danger));
      transition: width 0.95s linear;
    }

    .q-banner {
      font-size: 1.15rem;
      font-weight: 900;
      text-align: center;
      padding: 20px 14px;
      background: rgba(9, 13, 24, 0.85);
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      line-height: 1.65;
    }

    .opts-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .opt-card {
      padding: 15px 16px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: rgba(30, 41, 59, 0.85);
      color: #fff;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      text-align: right;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s;
    }

    .opt-card.selected {
      border-color: var(--cyan);
      background: rgba(6, 182, 212, 0.22);
    }

    .opt-card.correct {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.32);
      color: #a7f3d0;
    }

    .opt-card.wrong {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.28);
      color: #fecdd3;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(9, 13, 24, 0.75);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .leader-row.first {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.25), rgba(9, 13, 24, 0.85));
      border-color: var(--amber);
    }

    .comedy-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 16px 0;
      text-align: right;
    }

    .comedy-card {
      padding: 16px;
      border-radius: 16px;
      position: relative;
      line-height: 1.7;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .comedy-card.winner-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(6, 182, 212, 0.1));
      border: 1px solid var(--emerald);
      color: #d1fae5;
    }

    .comedy-card.loser-box {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(245, 158, 11, 0.1));
      border: 1px solid var(--danger);
      color: #ffe4e6;
    }

    .comedy-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .emoji-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .emoji-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .floating-emoji {
      position: fixed;
      bottom: 40px;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 300;
      animation: floatUp 2.4s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-340px) scale(1.4); opacity: 0; }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="brand-icon">🎭</div>
      <div>
        <div class="brand-title">مەجلیس AI Pro V5</div>
      </div>
    </div>
    <div class="header-controls">
      <button class="icon-pill" onclick="openApiModal()">🔑 کلیلی AI</button>
      <button class="icon-pill" onclick="clearAskedHistory()" title="سڕینەوەی مێژووی پرسیارەکان">🔄 پاککردنەوە</button>
      <button class="icon-pill" id="soundBtn" onclick="toggleSound()">🔊</button>
    </div>
  </header>

  <main id="appContainer"></main>

  <div class="modal-backdrop" id="apiModal">
    <div class="modal-box">
      <h3 style="margin-bottom:8px;">🔑 ڕێکخستنی کلیلی Google Gemini AI</h3>
      <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px;">
        ئەپەکە خۆی بێ کلیل کار دەکات، بەڵام ئەگەر کلیلی فەرمی Google AI Studio ت هەیە (کە بە <strong>AIzaSy...</strong> دەست پێ دەکات) لێرە دایبنێ بۆ خێرایی زیاتر:
      </p>
      <input type="text" id="apiKeyInput" class="input" dir="ltr" placeholder="AIzaSy..." />
      <div style="font-size:0.76rem; color:var(--emerald); margin-bottom:12px; text-align:center;">
        ژمارەی ئەو پرسیارانەی کراون و دووبارە نابنەوە: <strong id="seenCountTxt">0</strong> پرسیار
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="closeApiModal()">داخستن</button>
        <button class="btn btn-primary" onclick="saveApiKey()">💾 پاشەکەوتکردن</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_API_KEY = 'MAJLIS_GEMINI_KEY_V5';
    const STORAGE_SEEN_Q = 'MAJLIS_SEEN_QUESTIONS_V5';
    const USER_NAME_KEY = 'MAJLIS_USER_NAME_V5';

    const QUESTION_VIBES = [
      {
        id: 'friends',
        icon: '☕',
        title: 'دانیشتنی هاوڕێیان',
        desc: 'گەنجانە و گەعدە و قسەی خۆش',
        promptHint: 'بە شێوازی دانیشتنی گەنجانە و هاوڕێیانە، پرسیارەکان با سەرنجڕاکێش و کۆمەڵایەتی بن'
      },
      {
        id: 'camping',
        icon: '🏕️',
        title: 'گەشت و کامپینگ',
        desc: 'سەیران، چادر، ئاگر و سروشت',
        promptHint: 'تایبەت بە کەشی کامپینگ و شاخەوانی و سەیران و چادر و ئاگرکردنەوە و سروشتی کوردستان'
      },
      {
        id: 'family',
        icon: '👨‍👩‍👧‍👦',
        title: 'دانیشتنی خێزانی',
        desc: 'کەلتووری، پەند و هەموو تەمەنێک',
        promptHint: 'بە شێوازی دانیشتنی خێزانیی کوردەواری، پرسیار لەسەر کەلتوور و خواردنی کوردی و پەندی پێشینان'
      },
      {
        id: 'funny',
        icon: '😂',
        title: 'قەشمەری و کۆمیدی',
        desc: 'پرسیاری سەیر و پێکەنیناوی',
        promptHint: 'بە شێوازێکی زۆر کۆمیدی و قەشمەری و تەنزئامێز، کە هەڵبژاردەکانیش پێکەنیناوی بن'
      },
      {
        id: 'academic',
        icon: '🎓',
        title: 'زانکۆ و ڕۆشنبیری',
        desc: 'پرسیاری قووڵ، زانستی و یاسایی',
        promptHint: 'بە شێوازی ئەکادیمی و خوێندکارانی زانکۆ و ڕۆشنبیریی بەرز و یاسایی'
      },
      {
        id: 'challenge',
        icon: '🔥',
        title: 'تەحەدای بلیمەتەکان',
        desc: 'پرسیاری قورس و فێڵاوی',
        promptHint: 'بە شێوازی تەحەدای قورس و پرسیاری زیرەکی و مەتەڵی قورس'
      }
    ];

    const PRESET_TOPICS = [
      'یاسا و دادگا و دەستوور',
      'گەشت و کامپینگ و سروشت',
      'مێژوو و جوگرافیای کوردستان',
      'زانیاری گشتی جۆراوجۆر',
      'تۆپی پێ و وەرزشی جیهانی',
      'مەتەڵ و زیرەکی',
      'زانیاری ئایینی و قورئان',
      'ئەدەب و شاعیرانی کورد'
    ];

    // بانکی پرسیاری جیاکراوە بەپێی بابەت (بۆ ئەوەی هەرگیز بابەتەکان تێکەڵ نەبن!)
    const TOPIC_FALLBACK_BANKS = {
