<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>دیوەخان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #0f172a;
      --bg-elevated: #334155;
      --border: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-card: #f8fafc;
      --muted-main: #94a3b8;
      --muted-card: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.28);
      --emerald: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius: 18px;
    }

    body.light-mode {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #f1f5f9;
      --bg-elevated: #e2e8f0;
      --border: rgba(15, 23, 42, 0.1);
      --text-main: #0f172a;
      --text-card: #0f172a;
      --muted-main: #64748b;
      --muted-card: #475569;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow: rgba(124, 58, 237, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; transition: background 0.25s, color 0.25s; }

    .flex-center, .splash-logo, .brand-icon, .menu-lines-btn, .proj-toggle-btn, .btn, .pin-digit, .opt-num, .modal-backdrop.open {
      display: flex; align-items: center; justify-content: center;
    }

    #splashScreen { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; flex-direction: column; gap: 14px; animation: autoHideSplash 0.4s ease 1.7s forwards; }
    @keyframes autoHideSplash { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    .splash-logo { width: 82px; height: 82px; border-radius: 24px; background: var(--accent); color: #fff; font-size: 2.5rem; box-shadow: 0 10px 30px var(--accent-glow); }
    .splash-title { font-weight: 900; font-size: 2.2rem; }

    header { padding: 10px 14px; border-bottom: 1.5px solid var(--border); background: var(--bg-surface); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 1.2rem; box-shadow: 0 4px 12px var(--accent-glow); }
    .brand-title { font-weight: 900; font-size: 1.25rem; }

    .menu-lines-btn { width: 40px; height: 40px; border-radius: 11px; background: var(--bg-card); border: 1.5px solid var(--border); flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
    .menu-lines-btn span { width: 20px; height: 2.8px; background: var(--text-card); border-radius: 3px; }
    .menu-lines-btn:active, .cycle-btn:active, .mini-icon-btn:active { transform: scale(0.94); }

    main { max-width: 640px; width: 100%; margin: 0 auto; padding: 12px 12px 50px; flex: 1; }
    .card { background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 14px; margin-bottom: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14); }
    h2 { font-size: 1.15rem; font-weight: 900; margin-bottom: 4px; text-align: center; }
    p.sub { color: var(--muted-main); font-size: 0.8rem; text-align: center; margin-bottom: 12px; line-height: 1.45; font-weight: 600; }

    .welcome-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 12px; background: var(--bg-card); padding: 5px; border-radius: 13px; border: 1px solid var(--border); }
    .w-tab { padding: 9px 4px; border-radius: 9px; border: none; background: transparent; color: var(--muted-card); font-weight: 800; font-size: 0.76rem; cursor: pointer; transition: 0.2s; text-align: center; }
    .w-tab.active, .proj-toggle-btn.active, .chip-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

    .host-top-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .host-top-row .input { margin-bottom: 0; flex: 1; }
    .proj-toggle-btn { padding: 0 13px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--muted-card); font-size: 0.78rem; font-weight: 800; cursor: pointer; gap: 5px; white-space: nowrap; }
    .proj-toggle-btn.active { width: 100%; padding: 11px 14px; }

    .input { width: 100%; padding: 11px 13px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; margin-bottom: 10px; outline: none; text-align: center; transition: 0.2s; }
    .input::placeholder { color: var(--muted-card); opacity: 0.85; }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .btn { width: 100%; padding: 12px 16px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; cursor: pointer; gap: 8px; margin-bottom: 8px; transition: 0.15s; }
    .btn:active:not(:disabled) { transform: translateY(2px); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .btn-primary { background: var(--accent); color: #fff; border: none; box-shadow: 0 6px 18px var(--accent-glow); }
    .btn-emerald { background: var(--emerald); border: none; color: #fff; }
    .btn-amber { background: var(--amber); border: none; color: #fff; }
    .btn-danger { background: var(--danger); border: none; color: #fff; }

    .section-box, .cycle-btn, .q-banner, .next-auto-banner, .comedy-card, .about-info-box { background: var(--bg-card); color: var(--text-card); border-radius: 14px; }
    .section-box { border: 1.5px solid var(--border); padding: 10px; margin-bottom: 10px; }
    .section-label { font-size: 0.74rem; font-weight: 800; color: var(--muted-card); text-align: center; margin-bottom: 7px; }

    .chips-wrap, .players-wrap { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .chip-btn { padding: 6px 11px; border-radius: 50px; border: 1.5px solid transparent; background: var(--bg-elevated); color: var(--text-card); font-size: 0.77rem; font-weight: 800; cursor: pointer; transition: 0.15s; }

    .cycle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 12px; }
    .cycle-btn { border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 6px; text-align: center; cursor: pointer; }
    .cycle-btn small { display: block; font-size: 0.66rem; color: var(--muted-card); font-weight: 700; margin-bottom: 2px; }
    .cycle-btn strong { display: block; font-size: 0.82rem; font-weight: 900; color: var(--accent); }

    .qr-wrap { background: #fff; padding: 11px; border-radius: 16px; width: fit-content; margin: 6px auto 12px; border: 3px solid var(--accent); }
    .pin-boxes { display: flex; justify-content: center; gap: 8px; margin: 4px 0 12px; direction: ltr; }
    .pin-digit { width: 46px; height: 52px; border-radius: 12px; background: var(--bg-card); color: var(--accent); border: 2px solid var(--accent); font-size: 1.5rem; font-weight: 900; }

    .players-wrap { margin: 8px 0; }
    .p-badge { background: var(--bg-card); color: var(--text-card); border: 1.5px solid var(--accent); padding: 5px 12px; border-radius: 50px; font-weight: 800; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; }
    .kick-btn { background: var(--danger); border: none; color: #fff; width: 19px; height: 19px; border-radius: 50%; font-size: 0.68rem; cursor: pointer; }

    .quiz-top-meta, .opt-card, .leader-row, .comedy-head { display: flex; justify-content: space-between; align-items: center; }
    .quiz-top-meta { margin-bottom: 7px; font-weight: 800; font-size: 0.82rem; }
    .source-tag { font-size: 0.72rem; padding: 3px 9px; border-radius: 50px; background: var(--bg-card); color: var(--accent); border: 1px solid var(--border); }
    .timer-track { height: 9px; background: var(--bg-card); border-radius: 50px; overflow: hidden; margin-bottom: 12px; }
    .timer-fill { height: 100%;ئەمە **بەشی یەکەمە لە ١٢ بەش** (پێکهاتەی سەرەکی، دیزاین، گۆڕینی ناوی ئەپەکە بۆ **دیوەخان**، دانانی **هەمەجۆر** لە سەرەتا، و هەر ٦٠ پرسیارەکەی بەشی **یاسایی** بە ٢٠ ئاسان، ٢٠ مامناوەند و ٢٠ قورس):

<body>

  <script>
    const KEYS = {

    setTimeout(() => document.getElementById('splashScreen')?.remove(), 1900);

    let wakeLock = null;
    async function requestScreenWakeLock() {

    let persistentId = localStorage.getItem(KEYS.ID) || ('U_' + Math.random().toString(36).substring(2, 10));

    const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
    let customQuestions = loadJSON(KEYS.CUSTOM), seenQuestions = loadJSON(KEYS.SEEN), gameHistory = loadJSON(KEYS.HISTORY);

    const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    const toggleModal = (id, show) => document.getElementById(id)?.classList.toggle('open', show);

    const Q = (q, opts, diff) => ({ q, opts, ans: 0, diff });

    const QUESTION_VIBES = [

    };

    const PRESET_TOPICS = [

    ];

    const QUESTION_BANK = {
      'یاسایی': [
        Q('لە یاسای شارستانیدا، تەمەنی یاسایی کامڵبوون (سن الرشد) لە عێراق چەند ساڵە؟', ['١٨ ساڵی تەواو', '١٥ ساڵ', '٢١ ساڵ', '٢٠ ساڵ'], 'ئاسان'),

        Q('لە یاسادا، بنەمای "المتهم بريء حتى تثبت إدانته" بە واتای چی دێت؟', ['تۆمەتبار بێتاوانە تا تاوانەکەی لە دادگا دەسەلمێنرێت', 'هەموو تۆمەتبارێک زیندانی دەکرێت', 'پۆلیس بڕیار دەدات', 'شاهید پێویست نییە'], 'ئاسان'),

    function getPlayerRankTitle(rankIndex, total) {
      const t = VIBE_RANK_TITLES[state.vibeId] || VIBE_RANK_TITLES.friends_funny;
      return rankIndex === 0 ? t.first : (total > 1 && rankIndex === total - 1) ? t.last : (total > 2 && rankIndex === total - 2) ? t.secondLast : t.mid;
    }

    function showToast(textContent) {
      document.querySelector('.toast-msg')?.remove();
      const t = Object.assign(document.createElement('div'), { className: 'toast-msg', textContent });
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    let audioCtx = null;
    function playTone(type) {
      if (!state.soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), now = audioCtx.currentTime;
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
          [523.25, 659.25, 783.99].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.1));
          gain.gain.setValueAtTime(0.14, now); osc.start(); osc.stop(now + 0.32);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.setValueAtTime(150, now + 0.15);
          gain.gain.setValueAtTime(0.14, now); osc.start(); osc.stop(now + 0.3);
        } else {
          osc.frequency.setValueAtTime(680, now); gain.gain.setValueAtTime(0.04, now); osc.start(); osc.stop(now + 0.05);
        }
      } catch (e) {}
    }

    function toggleThemeMode() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem(KEYS.THEME, isLight ? 'light' : 'dark');
      showToast(isLight ? '☀️ دۆخی ڕۆژ چالاک کرا' : '🌙 دۆخی شەو چالاک کرا');

    }

    function markQuestionSeen(qText) {
      if (!seenQuestions.includes(qText)) {
        seenQuestions.push(qText);
        if (seenQuestions.length > 700) seenQuestions.shift();
        try { localStorage.setItem(KEYS.SEEN, JSON.stringify(seenQuestions)); } catch (e) {}
      }
    }

    function handleTopicChipClick(topic) {
      if (topic === 'هەمەجۆر') {
        state.selectedTopics = ['هەمەجۆر'];
      } else {
        state.selectedTopics = state.selectedTopics.filter(t => t !== 'هەمەجۆر');
        const idx = state.selectedTopics.indexOf(topic);
        if (idx > -1) {
          state.selectedTopics.splice(idx, 1);
          if (state.selectedTopics.length === 0) state.selectedTopics = ['هەمەجۆر'];
        } else {
          state.selectedTopics.push(topic);
        }
      }
      render();
    }

    function getLocalQuestions(topicsList, count, difficulty) {
      let pool = [];
      if (topicsList.includes('هەمەجۆر')) {
        Object.values(QUESTION_BANK).forEach(arr => pool.push(...arr));
        if (customQuestions.length) pool.push(...customQuestions);
      } else {
        topicsList.forEach(t => {
          pool.push(...(t === 'پرسیارەکانی خۆم (تایبەت)' ? customQuestions : (QUESTION_BANK[t] || [])));
        });
      }
      if (!pool.length) Object.values(QUESTION_BANK).forEach(arr => pool.push(...arr));

      let diffFiltered = pool.filter(i => i.diff === difficulty);
      let sourcePool = diffFiltered.length >= count ? diffFiltered : pool;

      let unseen = sourcePool.filter(i => !seenQuestions.includes(i.q));
      if (unseen.length < count) {
        const poolTexts = sourcePool.map(x => x.q);
        seenQuestions = seenQuestions.filter(q => !poolTexts.includes(q));
        try { localStorage.setItem(KEYS.SEEN, JSON.stringify(seenQuestions)); } catch (e) {}
        unseen = [...sourcePool];
      }

      return unseen
        .sort(() => Math.random() - 0.5)
        .slice(0, count)
        .map(item => {
          const correctText = item.opts[item.ans ?? 0], opts = [...item.opts].sort(() => Math.random() - 0.5);
          markQuestionSeen(item.q);
          return { q: item.q, opts, ans: opts.indexOf(correctText) };
        });
    }

    function getLocalComedyCommentary() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0] || { name: 'پاڵەوان', score: 0 };
      const bank = VIBE_COMEDY_BANK[state.vibeId] || VIBE_COMEDY_BANK.friends_funny;
      return {
        winnerJoke: pickRand(bank.win).replace('{winner}', winner.name),
        loserJoke: state.players.length <= 1
          ? `چونکە بە تەنها یاریت کرد (${winner.name})، هەم براوەیت و هەم دۆڕاو! دەبێت خۆت چایەک بۆ خۆت تێبکەیت و دەستخۆشی لە خۆت بکەیت!`
          : pickRand(bank.lose).replace('{losers}', sorted.slice(1).map(p => p.name).join(' و '))
      };
    }

    function getLosersList() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      return sorted.length > 1 ? sorted.slice(1) : sorted;
    }

    function startLocalBounceEffect() {
      clearInterval(state.bounceInterval);
      const losers = getLosersList();
      if (!losers.length) return;
      let i = 0;
      state.bouncingName = losers[0].name;
      state.bounceInterval = setInterval(() => {
        i = (i + 1) % losers.length;
        state.bouncingName = losers[i].name;
        setText('bouncingNameEl', `🎲 ${state.bouncingName}`);
        playTone('tick');
      }, 130);
    }

    function stopLocalBounceEffect() {
      clearInterval(state.bounceInterval);
      state.bounceInterval = null;
    }

    function spinVibePenaltyTask() {
      if (!isHostRole() || state.isSpinning) return;
      const losers = getLosersList();
      const target = pickRand(losers) || { name: 'دۆڕاو' };
      const bank = VIBE_COMEDY_BANK[state.vibeId] || VIBE_COMEDY_BANK.friends_funny;
      const task = pickRand(bank.tasks);

      state.isSpinning = true;
      state.spunPlayerName = '';
      state.spunTask = '';
      state.taskResult = '';
      syncAllPlayers();
      render();
      startLocalBounceEffect();

      setTimeout(() => {
        stopLocalBounceEffect();
        state.isSpinning = false;
        state.spunPlayerName = `🎯 قوربانیی تیروپشک: ${target.name}`;
        state.spunTask = task;
        state.taskResult = `${state.spunPlayerName} - ${task}`;
        playTone('correct');
        syncAllPlayers();
        render();
      }, 2600);
    }

    function regenerateComedyNow() {
      if (!isHostRole()) return;
      state.comedyResult = getLocalComedyCommentary();
      syncAllPlayers();
      render();
    }

    function saveCurrentGameToHistory() {
      if (state.historySavedForRound || !state.players.length) return;
      state.historySavedForRound = true;
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0];
      const now = new Date();
      const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} - ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
      const vibeObj = QUESTION_VIBES.find(v => v.id === state.vibeId) || QUESTION_VIBES[0];

      const record = {
        id: Date.now(),
        date: dateStr,
        vibe: `${vibeObj.icon} ${vibeObj.title}`,
        winnerName: winner ? winner.name : 'بێ براوە',
        winnerScore: winner ? winner.score : 0,
        players: sorted.map(p => ({ name: p.name, score: p.score }))
      };

      gameHistory.unshift(record);
      if (gameHistory.length > 50) gameHistory.pop();
      try { localStorage.setItem(KEYS.HISTORY, JSON.stringify(gameHistory)); } catch (e) {}
    }

    function clearGameHistory() {
      gameHistory = [];
      localStorage.removeItem(KEYS.HISTORY);
      showToast('🗑️ مێژووی یارییەکان سڕایەوە');
      render();
    }

      render();

      setText('autoNextBanner', state.qIndex + 1 < state.questions.length

    function render() {
      const vibeObj = QUESTION_VIBES.find(v => v.id === state.vibeId) || QUESTION_VIBES[0];
      setText('headerBrandIcon', vibeObj.icon);

      const headerMenu = document.getElementById('headerMenuContainer');
      if (headerMenu) {
        const hideMenu = state.role === 'player' || (state.screen === 'welcome' && state.welcomeTab === 'join');

      const vibesChipsHtml = QUESTION_VIBES.map(v => `
        <button class="chip-btn ${state.vibeId === v.id ? 'active' : ''}" onclick="state.vibeId='${v.id}';render();">${v.icon} ${v.title}</button>
      `).join('');

      const visibleTopics = PRESET_TOPICS.filter(t => t !== 'پرسیارەکانی خۆم (تایبەت)' || customQuestions.length > 0);
      const topicChipsHtml = visibleTopics.map(t => `
        <button class="chip-btn ${state.selectedTopics.includes(t) ? 'active' : ''}" onclick="handleTopicChipClick('${t}')">

    function renderPlayingScreen() {
      const qObj = state.questions[state.qIndex] || { q: '...', opts: ['', '', '', ''], ans: null };
      const myAns = state.players.find(p => p.id === state.myId)?.currentAnswer ?? null;
      const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);
      const vibeObj = QUESTION_VIBES.find(v => v.id === state.vibeId) || QUESTION_VIBES[0];
      const isProjHost = isProjectorRole();

      const optsHtml = qObj.opts.map((opt, idx) => {
        const cls = 'opt-card' + (state.revealAnswer ? (idx === qObj.ans ? ' correct' : (myAns === idx ? ' wrong' : '')) : (myAns === idx ? ' selected' : ''));
        const icon = state.revealAnswer ? (idx === qObj.ans ? '✅' : (myAns === idx ? '❌' : '')) : '';
        return `
          <button class="${cls}" ${state.revealAnswer || isProjHost || state.isPaused ? 'disabled' : ''} onclick="submitPlayerAnswer(${idx})">
            <div class="opt-right"><span class="opt-num">${idx + 1}</span><span>${opt}</span></div>
            <span>${icon}</span>
          </button>
        `;
      }).join('');

      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const leaderboardCardHtml = sorted.length ? `
        <div class="card" style="margin-top:12px;">
          <h3 style="margin-bottom:8px;font-size:0.9rem;">📊 ڕیزبەندی بەردەوام:</h3>
          ${sorted.map((p, i) => `
            <div class="leader-row ${i === 0 ? 'first' : ''}">
              <span>
                ${i === 0 ? '👑' : `${i + 1}.`} ${p.name}
                ${state.revealAnswer && p.lastGain > 0 ? `<span class="gain-badge">+${p.lastGain}</span>` : ''}
              </span>

      const sorted = [...state.players].sort((a, b) => b.score - a.score);

      let lotteryHtml = '';
      if (state.isSpinning) {

          <div class="lottery-box">
            <div style="font-size:0.85rem;font-weight:800;color:var(--muted-card);">⏳ تیروپشک لە نێوان دۆڕاوەکاندا دەکرێت...</div>
            <div class="bouncing-name-pill" id="bouncingNameEl">🎲 ${state.bouncingName || (losers[0]?.name ?? '...')}</div>
          </div>
        `;
      } else if (state.taskResult) {
        lotteryHtml = `
          <div class="comedy-card task-box">
            <div class="comedy-head">
              <span>${vibeObj.spinLabel}:</span>
              ${isHostOrProj ? `<button class="mini-icon-btn" onclick="spinVibePenaltyTask()">🎲 دووبارەکردنەوە</button>` : ''}
            </div>
            <div style="font-size:1.12rem;color:var(--amber);font-weight:900;margin:6px 0;">${state.spunPlayerName}</div>
            <div style="font-size:0.94rem;">${state.spunTask}</div>
          </div>
        `;
      } else if (isHostOrProj) {
        lotteryHtml = `
          <div class="lottery-box">
            <div style="font-size:0.8rem;color:var(--muted-card);margin-bottom:8px;">ناوی دۆڕاوەکان بۆ تیروپشک (براوەی یەکەم بەخشراوە):</div>
            <div class="chips-wrap" style="margin-bottom:12px;">
              ${losers.map(p => `<span class="p-badge">👤 ${p.name}</span>`).join('')}

          <h2 style="font-size:1.35rem;margin-bottom:4px;color:var(--emerald);">🏆 پاڵەوانی دیوەخان</h2>
          ${podiumHtml}
          <div class="comedy-grid">
            <div class="comedy-card winner-box">
              <div class="comedy-head">
                <span>👑 قسەی دیوەخان بۆ براوە:</span>
                ${isHostOrProj ? `<button class="mini-icon-btn" onclick="regenerateComedyNow()">🔄 گۆڕین</button>` : ''}
              </div>
              <div>"${state.comedyResult.winnerJoke || 'بژی پاڵەوان!'}"</div>
            </div>
            <div class="comedy-card loser-box">
              <div class="comedy-head"><span>☕ بۆ دۆڕاوەکان:</span></div>
              <div>"${state.comedyResult.loserJoke || 'جاری داهاتوو هەوڵ بدەنەوە!'}"</div>
            </div>
            ${lotteryHtml}
          </div>
          ${remainingRanks ? `<div style="text-align:right;margin:16px 0;"><h3 style="font-size:0.95rem;margin-bottom:8px;">📋 ڕیزبەندییەکانی تر:</h3>${remainingRanks}</div>` : ''}
          ${isHostOrProj ? `<button class="btn btn-emerald" style="margin-top:14px;margin-bottom:0;" onclick="hostStartCompetition()">🔄 خولێکی نوێ لەگەڵ هاوڕێیان</button>` : ''}
        </div>
      `;
    }

    function drawQRCode() {
      const box = document.getElementById('qrcode');
      if (!box) return;
      box.innerHTML = '';
      new QRCode(box, { text: `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`, width: 175, height: 175, colorDark: "#0f172a", colorLight: "#ffffff" });
    }

    function copyInvite(url) {
      navigator.clipboard.writeText(url);
      showToast('📋 لینکی دیوەخان کۆپی کرا!');
    }

    function shareInviteWA(url) {
      const msg = `🎲 وەرنە ناو پێشبڕکێی دیوەخان! کۆدی ژوور: (${state.roomCode})\nکلیک لەم لینکە بکەن:\n${url}`;
      if (navigator.share) navigator.share({ title: 'دیوەخان', text: msg, url }).catch(() => {});
      else window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function kickPlayer(playerId) {
      state.players = state.players.filter(p => p.id !== playerId);
      syncAllPlayers(); render();
    }

    function connectMqttBroker(onConnected) {
      try { state.mqttClient?.end(true); } catch (e) {}
      const brokers = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
      let bIdx = 0, connected = false;

      function tryConnect() {
        const client = mqtt.connect(brokers[bIdx % brokers.length], {
          clientId: 'diwaxan_' + state.myId + '_' + Math.random().toString(16).slice(2, 6),
          clean: true, connectTimeout: 4500, reconnectPeriod: 2000
        });
        state.mqttClient = client;

        const failTimer = setTimeout(() => {
          if (!connected) {
            try { client.end(true); } catch (e) {}
            if (++bIdx < brokers.length) tryConnect();
            else if (isHostRole()) onConnected(client);
          }
        }, 4600);

        client.on('connect', () => {
          if (!connected) { connected = true; clearTimeout(failTimer); onConnected(client); }
        });
      }
      tryConnect();
    }

    function startRoom() {
      const isProj = state.isProjector;
      const nameEl = document.getElementById('nameInp');
      if (nameEl) state.myName = nameEl.value.trim();
      const name = (state.myName || '').trim();
      if (!isProj && !name) return showToast('⚠️ تکایە سەرەتا ناوی خۆت بنووسە!');
      if (!isProj) localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();

      Object.assign(state, {
        role: isProj ? 'projector_host' : 'host',
        connecting: false,
        roomCode: String(Math.floor(1000 + Math.random() * 9000)),
        players: isProj ? [] : [{ id: state.myId, name: state.myName, score: 0, lastGain: 0, hasAnswered: false, currentAnswer: null }],
        screen: 'lobby'
      });
      render();

      const actionTopic = `diwaxan_ku_v1/room/${state.roomCode}/action`;
      connectMqttBroker(client => {
        client.subscribe(actionTopic, { qos: 1 }, syncAllPlayers);
        client.on('message', (t, msg) => {
          if (t === actionTopic) try { onHostReceiveData(JSON.parse(msg.toString())); } catch (e) {}
        });
      });
    }

    function joinHostRoom() {
      const nameEl = document.getElementById('nameInp');
      const codeEl = document.getElementById('codeInp');
      if (nameEl) state.myName = nameEl.value.trim();
      if (codeEl) state.roomCode = normalizeDigits(codeEl.value);

      const name = (state.myName || '').trim(), code = normalizeDigits(state.roomCode);
      state.roomCode = code;
      if (!name || !code) return showToast('⚠️ تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();
      Object.assign(state, { role: 'player', isProjector: false, connecting: true });
      render();

      const stateTopic = `diwaxan_ku_v1/room/${code}/state`, actionTopic = `diwaxan_ku_v1/room/${code}/action`;
      connectMqttBroker(client => {
        let received = false;
        const joinTimeout = setTimeout(() => {
          if (!received && state.connecting) {
            state.connecting = false;
            showToast('⚠️ ئەم کۆدی ژوورە نەدۆزرایەوە! دڵنیابە لە کۆدەکە.');
            render();
          }
        }, 7500);

        const pubJoin = () => client.publish(actionTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name: state.myName }), { qos: 1 });
        client.subscribe(stateTopic, { qos: 1 }, () => {
          pubJoin();
          setTimeout(() => { if (!received) pubJoin(); }, 1800);
        });
        client.on('message', (t, msg) => {
          if (t === stateTopic) try {
            const data = JSON.parse(msg.toString());
            received = true; clearTimeout(joinTimeout); state.connecting = false;
            onPlayerReceiveData(data);
            if (data.players && !data.players.some(p => p.id === state.myId)) pubJoin();
          } catch (e) {}
        });
      });
    }

    function onHostReceiveData(data) {
      if (data.type === 'JOIN') {
        const existing = state.players.find(p => p.id === data.id);
        if (existing) existing.name = data.name;
        else {
          const cleanName = state.players.some(p => p.name === data.name && p.id !== data.id) ? `${data.name} (${state.players.length + 1})` : data.name;
          state.players.push({ id: data.id, name: cleanName, score: 0, lastGain: 0, hasAnswered: false, currentAnswer: null });
        }
        syncAllPlayers(); render();
      } else if (data.type === 'ANSWER') {
        const p = state.players.find(x => x.id === data.id);
        if (p && !state.revealAnswer) Object.assign(p, { currentAnswer: data.ansIdx, hasAnswered: true });
      }
    }

    function onPlayerReceiveData(data) {
      if (data.type === 'PRE_TICK') { state.countdownVal = data.countdownVal; return setText('preGameCountNum', state.countdownVal); }
      if (data.type === 'TIMER_TICK') { state.timeLeft = data.timeLeft; return updateTimerUI(); }
      if (data.type === 'PAUSE_STATE') { state.isPaused = data.isPaused; state.timeLeft = data.timeLeft; return updateTimerUI(); }
      if (data.type === 'REVEAL_TICK') { state.revealCountdown = data.revealCountdown; return updateRevealUI(); }
      if (data.type !== 'SYNC') return;

      const { revealAnswer: prevReveal, qIndex: prevQIndex, isSpinning: prevSpin, screen: prevScreen } = state;
      Object.assign(state, {
        screen: data.screen, countdownVal: data.countdownVal, qIndex: data.qIndex,
        timeLeft: data.timeLeft, questionDuration: data.questionDuration,
        isPaused: Boolean(data.isPaused), revealAnswer: data.revealAnswer,
        revealCountdown: data.revealCountdown || 4, taskResult: data.taskResult || '',
        difficulty: data.difficulty || 'مامناوەند', vibeId: data.vibeId || 'camping',
        isSpinning: Boolean(data.isSpinning), spunPlayerName: data.spunPlayerName || '', spunTask: data.spunTask || ''
      });
      if (data.comedyResult) state.comedyResult = data.comedyResult;

      const myOld = state.players.find(p => p.id === state.myId);
      const keepMyChoice = !data.revealAnswer && prevQIndex === data.qIndex && myOld;
      state.players = data.players.map(p => (p.id === state.myId && keepMyChoice) ? { ...p, currentAnswer: myOld.currentAnswer, hasAnswered: myOld.hasAnswered } : p);

      if (!state.players.some(p => p.id === state.myId)) {
        state.players.push({ id: state.myId, name: state.myName, score: 0, lastGain: 0, hasAnswered: keepMyChoice ? myOld.hasAnswered : false, currentAnswer: keepMyChoice ? myOld.currentAnswer : null });
      }
      if (data.currentQuestion) {
        state.questions = new Array(data.totalQuestions).fill(null);
        state.questions[state.qIndex] = data.currentQuestion;
      }
      if (!prevReveal && state.revealAnswer && state.screen === 'playing') {
        const me = state.players.find(p => p.id === state.myId), qObj = state.questions[state.qIndex];
        playTone(me && qObj && me.currentAnswer === qObj.ans ? 'correct' : 'wrong');
      }
      if (state.screen === 'countdown') state.historySavedForRound = false;
      if (prevScreen !== 'finished' && state.screen === 'finished') saveCurrentGameToHistory();

      render();

      if (!prevSpin && state.isSpinning) startLocalBounceEffect();
      else if (prevSpin && !state.isSpinning) { stopLocalBounceEffect(); playTone('correct'); }
    }

    function broadcastPayload(payload, retain = false) {
      if (isHostRole() && state.mqttClient && state.roomCode) {
        try { state.mqttClient.publish(`diwaxan_ku_v1/room/${state.roomCode}/state`, JSON.stringify(payload), { qos: 0, retain }); } catch (e) {}
      }
    }

    function syncAllPlayers() {
      if (!isHostRole()) return;
      const qObj = state.questions[state.qIndex];
      broadcastPayload({
        type: 'SYNC', screen: state.screen, countdownVal: state.countdownVal,
        vibeId: state.vibeId, difficulty: state.difficulty, isPaused: state.isPaused,
        isSpinning: state.isSpinning, spunPlayerName: state.spunPlayerName, spunTask: state.spunTask,
        players: state.players.map(p => ({ id: p.id, name: p.name, score: p.score, lastGain: state.revealAnswer ? p.lastGain : 0, hasAnswered: false, currentAnswer: state.revealAnswer ? p.currentAnswer : null })),
        currentQuestion: qObj ? { q: qObj.q, opts: qObj.opts, ans: state.revealAnswer ? qObj.ans : null } : null,
        totalQuestions: state.questions.length, qIndex: state.qIndex, timeLeft: state.timeLeft,
        questionDuration: state.questionDuration, revealAnswer: state.revealAnswer,
        revealCountdown: state.revealCountdown, comedyResult: state.comedyResult, taskResult: state.taskResult
      }, true);
    }

    function hostStartCompetition() {
      requestScreenWakeLock();
      stopLocalBounceEffect();
      Object.assign(state, {
        taskResult: '', spunPlayerName: '', spunTask: '', isPaused: false, isSpinning: false,
        historySavedForRound: false,
        questions: getLocalQuestions(state.selectedTopics, state.questionLimit, state.difficulty),
        qIndex: 0
      });
      state.players.forEach(p => Object.assign(p, { score: 0, lastGain: 0, hasAnswered: false, currentAnswer: null }));
      runPreGameCountdown();
    }

    function runPreGameCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { screen: 'countdown', countdownVal: 5 });
      syncAllPlayers(); render(); playTone('tick');
      state.timerInterval = setInterval(() => {
        if (--state.countdownVal <= 0) {
          clearInterval(state.timerInterval); state.screen = 'playing'; beginQuestionCountdown();
        } else {
          playTone('tick'); setText('preGameCountNum', state.countdownVal);
          broadcastPayload({ type: 'PRE_TICK', countdownVal: state.countdownVal }, false);
        }
      }, 1000);
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { timeLeft: state.questionDuration, revealAnswer: false, isPaused: false });
      state.players.forEach(p => Object.assign(p, { hasAnswered: false, currentAnswer: null, lastGain: 0 }));
      syncAllPlayers(); render();
      state.timerInterval = setInterval(() => {
        if (state.isPaused) return;
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');
        if (state.timeLeft <= 0) revealQuestionResult();
        else {
          updateTimerUI();
          if (isHostRole()) broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft }, false);
        }
      }, 1000);
    }

    function submitPlayerAnswer(optIdx) {
      if (isProjectorRole()) return;
      const me = state.players.find(p => p.id === state.myId);
      if (!me || state.revealAnswer || state.isPaused) return;
      Object.assign(me, { currentAnswer: optIdx, hasAnswered: true });
      render();
      if (state.role === 'player' && state.mqttClient && state.roomCode) {
        state.mqttClient.publish(`diwaxan_ku_v1/room/${state.roomCode}/action`, JSON.stringify({ type: 'ANSWER', id: state.myId, ansIdx: optIdx }), { qos: 1 });
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { revealAnswer: true, revealCountdown: 4, isPaused: false });
      const qObj = state.questions[state.qIndex];

      state.players.forEach(p => {
        if (p.currentAnswer === qObj.ans) {
          p.lastGain = 100;
          p.score += 100;
        } else {
          p.lastGain = 0;
        }
      });

      const me = state.players.find(p => p.id === state.myId);
      if (me) playTone(me.currentAnswer === qObj.ans ? 'correct' : 'wrong');
      else if (isProjectorRole()) playTone('correct');
      syncAllPlayers(); render();

      if (isHostRole()) {
        state.revealInterval = setInterval(() => {
          if (--state.revealCountdown <= 0) { clearInterval(state.revealInterval); advanceToNextQuestion(); }
          else { updateRevealUI(); broadcastPayload({ type: 'REVEAL_TICK', revealCountdown: state.revealCountdown }, false); }
        }, 1000);
      }
    }

    function advanceToNextQuestion() {
      clearInterval(state.revealInterval);
      if (state.qIndex + 1 < state.questions.length) { state.qIndex++; beginQuestionCountdown(); }
      else {
        Object.assign(state, { comedyResult: getLocalComedyCommentary(), screen: 'finished' });
        saveCurrentGameToHistory();
        syncAllPlayers(); render();
      }
    }

    function openCustomQModal() {
      toggleModal('settingsModal', false);
      setText('customQStatus', `کۆی پرسیارە تایبەتەکانت: ${customQuestions.length} پرسیار`);
      toggleModal('customQModal', true);
    }

    function saveCustomQuestion() {
      const ids = ['cqText', 'cqOpt0', 'cqOpt1', 'cqOpt2', 'cqOpt3'];
      const [q, o0, o1, o2, o3] = ids.map(id => document.getElementById(id).value.trim());
      if (!q || !o0 || !o1 || !o2 || !o3) return showToast('⚠️ تکایە پرسیارەکە و هەر ٤ هەڵبژاردەکە پڕ بکەرەوە!');

      const opts = [o0, o1, o2, o3].sort(() => Math.random() - 0.5);
      customQuestions.push({ q, opts, ans: opts.indexOf(o0), diff: state.difficulty });
      localStorage.setItem(KEYS.CUSTOM, JSON.stringify(customQuestions));
      ids.forEach(id => document.getElementById(id).value = '');
      setText('customQStatus', `✅ زیادکرا! کۆی پرسیارە تایبەتەکانت: ${customQuestions.length}`);
      handleTopicChipClick('پرسیارەکانی خۆم (تایبەت)');
    }

    render();
  </script>
</body>
