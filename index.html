<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس AI Pro | پێشبڕکێی هاوڕێیان و خێزان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-dark: #070a14;
      --bg-surface: rgba(17, 24, 39, 0.92);
      --bg-card: rgba(30, 41, 59, 0.78);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.4);
      --accent: #ec4899;
      --emerald: #10b981;
      --danger: #f43f5e;
      --amber: #f59e0b;
      --cyan: #06b6d4;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.24) 0px, transparent 45%),
        radial-gradient(at 90% 85%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.12) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 10, 20, 0.88);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      box-shadow: 0 6px 18px var(--primary-glow);
    }

    .brand-title {
      font-weight: 900;
      font-size: 1.2rem;
      background: linear-gradient(90deg, #e9d5ff, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    main {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 14px 70px;
      flex: 1;
    }

    .card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    h2 {
      font-size: 1.28rem;
      font-weight: 900;
      margin-bottom: 6px;
      text-align: center;
    }

    p.sub {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .welcome-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 16px;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .w-tab {
      padding: 10px 6px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .w-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(9, 13, 24, 0.92);
      color: #fff;
      font-size: 0.94rem;
      font-weight: 700;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: #fff;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
      margin-bottom: 10px;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #059669, #10b981);
      border: none;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
    }

    .btn-cyan {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border: none;
    }

    /* پێوەری شێوازی پرسیار و کەشی دانیشتن (Vibe Selector) */
    .vibe-section {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.2);
      color: #a5f3fc;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.76rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .vibe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
    }

    .vibe-card {
      background: rgba(9, 13, 24, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .vibe-card .v-ico {
      font-size: 1.45rem;
      display: block;
      margin-bottom: 3px;
    }

    .vibe-card strong {
      font-size: 0.82rem;
      display: block;
      color: #fff;
    }

    .vibe-card small {
      font-size: 0.68rem;
      color: var(--muted);
      display: block;
    }

    .vibe-card.active {
      background: linear-gradient(145deg, rgba(6, 182, 212, 0.28), rgba(139, 92, 246, 0.25));
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
    }

    /* تایبەتمەندی زیرەکی دەستکرد AI Topic Box */
    .ai-config-box {
      background: linear-gradient(145deg, rgba(139, 92, 246, 0.14), rgba(236, 72, 153, 0.08));
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.25);
      color: #e9d5ff;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.76rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .topic-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      justify-content: center;
    }

    .topic-chip {
      padding: 7px 12px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .topic-chip.active {
      background: var(--primary);
      border-color: #c084fc;
      color: #fff;
    }

    .settings-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .setting-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 12px;
      text-align: center;
    }

    .setting-box label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .setting-box select {
      background: var(--bg-card);
      color: #fff;
      border: 1px solid var(--border);
      padding: 5px 6px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.8rem;
      width: 100%;
      outline: none;
    }

    .qr-wrap {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      width: fit-content;
      margin: 10px auto 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .room-pin {
      background: rgba(139, 92, 246, 0.16);
      border: 2px dashed var(--primary);
      color: #f3e8ff;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-align: center;
      padding: 8px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 12px 0;
    }

    .p-badge {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid var(--emerald);
      color: #a7f3d0;
      padding: 7px 14px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .quiz-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.88rem;
    }

    .timer-track {
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald), var(--amber), var(--danger));
      transition: width 0.95s linear;
    }

    .q-banner {
      font-size: 1.15rem;
      font-weight: 900;
      text-align: center;
      padding: 20px 14px;
      background: rgba(9, 13, 24, 0.85);
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      line-height: 1.65;
    }

    .opts-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .opt-card {
      padding: 15px 16px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: rgba(30, 41, 59, 0.85);
      color: #fff;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      text-align: right;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s;
    }

    .opt-card.selected {
      border-color: var(--cyan);
      background: rgba(6, 182, 212, 0.22);
    }

    .opt-card.correct {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.32);
      color: #a7f3d0;
    }

    .opt-card.wrong {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.28);
      color: #fecdd3;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(9, 13, 24, 0.75);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .leader-row.first {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.25), rgba(9, 13, 24, 0.85));
      border-color: var(--amber);
    }

    /* بۆکسی ڕستە کۆمیدییەکانی براوە و دۆڕاو */
    .comedy-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 16px 0;
      text-align: right;
    }

    .comedy-card {
      padding: 16px;
      border-radius: 16px;
      position: relative;
      line-height: 1.7;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .comedy-card.winner-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(6, 182, 212, 0.1));
      border: 1px solid var(--emerald);
      color: #d1fae5;
    }

    .comedy-card.loser-box {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(245, 158, 11, 0.1));
      border: 1px solid var(--danger);
      color: #ffe4e6;
    }

    .comedy-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .emoji-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .emoji-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 1.25rem;
      cursor: pointer;
    }

    .floating-emoji {
      position: fixed;
      bottom: 40px;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 300;
      animation: floatUp 2.4s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-340px) scale(1.4); opacity: 0; }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="brand-icon">🎭</div>
      <div>
        <div class="brand-title">مەجلیس AI Pro</div>
      </div>
    </div>
    <div class="header-controls">
      <button class="icon-pill" onclick="openApiModal()">🔑 کلیلی AI</button>
      <button class="icon-pill" onclick="clearAskedHistory()" title="سڕینەوەی مێژووی پرسیارەکان">🔄 نوێکردنەوە</button>
      <button class="icon-pill" id="soundBtn" onclick="toggleSound()">🔊</button>
    </div>
  </header>

  <main id="appContainer"></main>

  <!-- مۆداڵی ڕێکخستنی کلیلی زیرەکی دەستکرد -->
  <div class="modal-backdrop" id="apiModal">
    <div class="modal-box">
      <h3 style="margin-bottom:8px;">🔑 ڕێکخستنی کلیلی Google Gemini AI</h3>
      <p style="font-size:0.8rem; color:var(--muted); margin-bottom:12px;">
        کلیلی زیرەکی دەستکرد بۆ دروستکردنی پرسیاری نوێ و ڕستە کۆمیدییەکانی کۆتایی یاری:
      </p>
      <input type="text" id="apiKeyInput" class="input" dir="ltr" placeholder="AIzaSy... or AQ..." />
      <div style="font-size:0.76rem; color:var(--emerald); margin-bottom:12px; text-align:center;">
        ژمارەی ئەو پرسیارانەی کراون و دووبارە نابنەوە: <strong id="seenCountTxt">0</strong> پرسیار
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="closeApiModal()">داخستن</button>
        <button class="btn btn-primary" onclick="saveApiKey()">💾 پاشەکەوتکردن</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_EMBEDDED_KEY = 'AQ.Ab8RN6KV3PsKNjTiFmCST8EVqVrIgvCY4O_I5lnzHzqtlwoE6g';
    const STORAGE_API_KEY = 'MAJLIS_GEMINI_KEY_V4';
    const STORAGE_SEEN_Q = 'MAJLIS_SEEN_QUESTIONS_V4';
    const USER_NAME_KEY = 'MAJLIS_USER_NAME_V4';

    // پێوەرەکانی کەش و شێوازی پرسیار (Majlis Vibes / Styles)
    const QUESTION_VIBES = [
      {
        id: 'friends',
        icon: '☕',
        title: 'دانیشتنی هاوڕێیان',
        desc: 'گەنجانە و گەعدە و قسەی خۆش',
        promptHint: 'بە شێوازی دانیشتنی گەنجانە و هاوڕێیانە، پرسیارەکان با سەرنجڕاکێش و کۆمەڵایەتی و پڕ جۆش و خرۆش بن'
      },
      {
        id: 'camping',
        icon: '🏕️',

      },
      {

        icon: '👨‍👩‍👧‍👦',
        title: 'دانیشتنی خێزانی',
        desc: 'کەلتووری، پەند و هەموو تەمەنێک',
        promptHint: 'بە شێوازی دانیشتنی خێزانیی کوردەواری، پرسیار لەسەر کەلتوور و خواردنی کوردی و پەندی پێشینان و زانیاری گونجاو بۆ هەموو ئەندامانی خێزان'
      },
      {
        id: 'funny',
        icon: '😂',
        title: 'قەشمەری و کۆمیدی',
        desc: 'پرسیاری سەیر و پێکەنیناوی',
        promptHint: 'بە شێوازێکی زۆر کۆمیدی و قەشمەری و تەنزئامێز، کە هەڵبژاردە هەڵەکانیش زۆر پێکەنیناوی بن'
      },
      {
        id: 'academic',
        icon: '🎓',
        title: 'زانکۆ و ڕۆشنبیری',
        desc: 'پرسیاری قووڵ، زانستی و یاسایی',
        promptHint: 'بە شێوازی ئەکادیمی و خوێندکارانی زانکۆ و ڕۆشنبیریی بەرز و مێژوو و یاسا و بیرکردنەوەی ورد'
      },
      {
        id: 'challenge',
        icon: '🔥',
        title: 'تەحەدای بلیمەتەکان',
        desc: 'پرسیاری قورس و فێڵاوی',
        promptHint: 'بە شێوازی تەحەدای قورس و پرسیاری زیرەکی و مەتەڵی وا کە تەنها کەسە زۆر زیرەکەکان بتوانن وەڵامی بدەنەوە'
      }
    ];

    const PRESET_TOPICS = [
      'بەپێی شێوازی دانیشتنەکە (خۆکارانە)',
      'زانیاری گشتی جۆراوجۆر',
      'مێژوو و جوگرافیای کوردستان',
      'زانیاری ئایینی و قورئان',
      'تۆپی پێ و وەرزشی جیهانی',
      'مەتەڵ و زیرەکی',
      'یاسا و دادگا و دەستوور',
      'گەشتوگوزار و شوێنەکانی کوردستان'
    ];

    // بانکی پرسیاری یەدەگ
    const FALLBACK_BANK = [
      { q: 'لە کاتی کامپینگ و چادر هەڵدان لە شەودا، گرنگترین شت بۆ دوورخستنەوەی مێروو لە ناو چادرەکە چییە؟', opts: ['داگیرساندنی گڵۆپی سپی لە ناو چادر', 'داخستنی زنجیری تۆڕی چادرەکە و کوژاندنەوەی ڕووناکی ناوەوە', 'ڕشتنی ئاو لە ناو چادر', 'دانانی خواردن لە ناو چادر'], ans: 1 },
      { q: 'لە گەشت و سەیرانی کوردەواریدا، خۆشترین چا لەسەر چی لێدەنرێت؟', opts: ['سۆپای کارەبایی', 'پۆلوو و خەڵووزی دار (چای ڕەشکە)', 'مایکرۆوەیڤ', 'ئاوی سارد'], ans: 1 },
      { q: 'پایتەختی ڕۆشنبیری هەرێمی کوردستان کام شارە؟', opts: ['هەولێر', 'سلێمانی', 'دهۆک', 'هەڵەبجە'], ans: 1 },
      { q: 'شاعیری گەورەی کورد "نالی" ناوی تەواوی چییە؟', opts: ['مەلا خدری ئەحمەدی شاوەیسی مکایەڵی', 'عەبدولڕەحمان بەگی ساحێبقڕان', 'تاهیر بەگی جاف', 'مەلا محەمەدی کۆیی'], ans: 0 },
      { q: 'داستانی "مەم و زین" شاکاری کام شاعیری ناوداری کوردە؟', opts: ['ئەحمەدی خانی', 'مەلای جزیری', 'فەقێ تەیران', 'وەفایی'], ans: 0 },
      { q: 'بەرزترین لووتکە چیا لە هەرێمی کوردستان کامەیە؟', opts: ['پیرەمەگروون', 'هەڵگورد', 'کۆڕەک', 'گارە'], ans: 1 },
      { q: 'پردی مێژوویی "دەلال" دەکەوێتە کام شاری کوردستان؟', opts: ['ئامێدی', 'زاخۆ', 'ئاکرێ', 'ڕواندز'], ans: 1 },
      { q: 'درێژترین سورەتی قورئانی پیرۆز کامەیە؟', opts: ['ئالی عیمران', 'نیساء', 'بەقەرە', 'مائیدە'], ans: 2 },
      { q: 'کام سورەتی قورئانی پیرۆز بە "دڵی قورئان" ناسراوە؟', opts: ['سورەتی کەهف', 'سورەتی یس (یاسین)', 'سورەتی مولک', 'سورەتی ڕەحمان'], ans: 1 },
      { q: 'ئەو شتە چییە کە تا زیاتری لێ ببەیت، گەورەتر دەبێت؟', opts: ['ئاگر', 'چاڵ', 'شاخ', 'بەفر'], ans: 1 },
      { q: 'ئەگەر لە پێشبڕکێیەکدا پێش کەسی دووەم بکەویت، تۆ لە پلەی چەندەمیت؟', opts: ['یەکەم', 'دووەم', 'سێیەم', 'چوارەم'], ans: 1 },
      { q: 'لە یاسادا، کام دەسەڵات بەرپرسە لە دەرکردنی یاساکان؟', opts: ['دەسەڵاتی جێبەجێکردن', 'دەسەڵاتی یاسادانان (پەرلەمان)', 'دەسەڵاتی دادوەری', 'شارەوانی'], ans: 1 },
      { q: 'زێی بچووک بە کام لەم شارەدێ و ناوچانەدا تێدەپەڕێت؟', opts: ['تەقتەق', 'زاخۆ', 'عەربەت', 'ئامێدی'], ans: 0 },
      { q: 'کام وڵات زۆرترین جار جامی جیهانی (مۆندیال)ی بردووەتەوە؟', opts: ['ئەڵمانیا', 'بەڕازیل', 'ئەرجەنتین', 'ئیتاڵیا'], ans: 1 }
    ];

    // بانکی ڕستەی کۆمیدیی یەدەگ (ئەگەر ئینتەرنێت خاو بوو)
    const FALLBACK_WINNER_JOKES = [
      'ماشەڵڵا لە مێشکت {winner}! دەڵێی هارد دیسکی گووگڵت قووت داوە، ئەوانی تر هەر سەیری پەنجەکانی تۆیان دەکرد!',
      'بژی {winner}! بەم زیرەکییەت دەبێت بکرێیتە ڕاوێژکاری تایبەتی مەجلیس، ئەمشەو چا و میوە بێننە بەردەمی!',
      'ئافەرین {winner}! سەلماندت کە تەنها بۆ چا خواردنەوە نەهاتوویتەتە ئەم مەجلیسە و مێشکت وەک کاتژمێری سویسری کار دەکات!'
    ];

    const FALLBACK_LOSER_JOKES = [
      'بەداخەوە بۆ ({losers})! دیارە شەبەکەی مێشکتان خەتی 2G بووە، ئەمشەو تێچووی مەجلیسەکە و قاپ شۆردن لەسەر ئێوەیە!',
      'کاکە ({losers})، ئێوە هاتوون بۆ پێشبڕکێ یان هاتوون سەیری دیزاینی دوگمەکان بکەن؟ دەستێک چەپڵە بۆ خۆتان لێبدەن لە کۆتایی لیستەکەوە!',
      'پرسیارەکان زۆر ئاسان بوون، بەڵام دیارە ({losers}) چاویان لەسەر سینی چایەکە بووە نەک شاشەی مۆبایلەکە!'
    ];

    let seenQuestions = [];
    try {
      const rawSeen = localStorage.getItem(STORAGE_SEEN_Q);
      if (rawSeen) seenQuestions = JSON.parse(rawSeen);
    } catch (e) {}

    let state = {
      welcomeTab: 'host',
      role: null,
      screen: 'welcome',
      myId: 'U_' + Math.random().toString(36).substring(2, 9),
      myName: localStorage.getItem(USER_NAME_KEY) || '',
      apiKey: localStorage.getItem(STORAGE_API_KEY) || DEFAULT_EMBEDDED_KEY,
      roomCode: '',
      selectedVibeId: 'friends',
      selectedTopic: 'بەپێی شێوازی دانیشتنەکە (خۆکارانە)',
      customTopicText: '',
      difficulty: 'مامناوەند',
      questionLimit: 8,
      questionDuration: 15,
      soundOn: true,
      generatingAI: false,
      generatingComedy: false,
      connecting: false,
      peer: null,
      hostConn: null,
      connections: {},
      players: [],
      questions: [],
      qIndex: 0,
      timeLeft: 15,
      timerInterval: null,
      revealAnswer: false,
      comedyResult: {
        winnerJoke: '',
        loserJoke: ''
      }
    };

    const params = new URLSearchParams(window.location.search);
    const urlRoom = params.get('room');
    if (urlRoom) {
      state.roomCode = urlRoom.toUpperCase();
      state.welcomeTab = 'join';
    }

    let audioCtx = null;
    function playTone(type) {
      if (!state.soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.32);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, audioCtx.currentTime);
          osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'tick') {
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        }
      } catch (e) {}
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      document.getElementById('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
    }

    function markQuestionSeen(qText) {
      if (!seenQuestions.includes(qText)) {
        seenQuestions.push(qText);
        if (seenQuestions.length > 250) seenQuestions.shift();
        try { localStorage.setItem(STORAGE_SEEN_Q, JSON.stringify(seenQuestions)); } catch (e) {}
      }
    }

    function clearAskedHistory() {
      seenQuestions = [];
      localStorage.removeItem(STORAGE_SEEN_Q);
      alert('✅ مێژووی پرسیارەکان پاککرایەوە!');
    }

    // ١. دروستکردنی پرسیار بەپێی پێوەری شێواز (Vibe) و بابەت بە زیرەکی دەستکرد
    async function generateAIQuestions(vibeObj, topic, count, difficulty) {
      const avoidSample = seenQuestions.slice(-20).join(' | ');
      const randomSeed = Math.floor(Math.random() * 999999);
      const effectiveTopic = topic === 'بەپێی شێوازی دانیشتنەکە (خۆکارانە)' ? vibeObj.title : topic;

      const prompt = `تۆ پسپۆڕی دروستکردنی پرسیاری پێشبڕکێیت بۆ یاریی "مەجلیس" بە زمانی کوردیی سۆرانیی پاراو.
تکایە رێک ${count} پرسیاری هەڵبژاردن (٤ هەڵبژاردەیی) دروست بکە.
- شێواز و کەشی دانیشتنەکە: "${vibeObj.title}" (${vibeObj.promptHint}).
- بابەتی پرسیارەکان: "${effectiveTopic}".
- ئاستی قورسی: "${difficulty}".
- ژمارەی هەڕەمەکی بۆ جیاوازی: ${randomSeed}.
- هەرگیز ئەم پرسیارانە دووبارە مەکەرەوە: [${avoidSample}].
تەنها و تەنها بە شێوازی JSON Array وەڵام بدەرەوە بەبێ هیچ قسەیەکی زیادە، بەم فۆرماتە:
[{"q":"دەقی پرسیار؟","opts":["وەڵامی ١","وەڵامی ٢","وەڵامی ٣","وەڵامی ٤"],"ans":0}]`;

      // هەوڵی یەکەم: Google Gemini API
      if (state.apiKey && state.apiKey.trim().length > 10) {
        try {
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(state.apiKey.trim())}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.92 }
            })
          });
          if (resp.ok) {
            const data = await resp.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const parsed = extractValidQuestions(rawText);
            if (parsed.length >= 3) return parsed.slice(0, count);
          }
        } catch (e) {}
      }

      // هەوڵی دووەم: زیرەکی دەستکردی کراوەی Pollinations AI
      try {
        const resp2 = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'You are a Kurdish Sorani quiz generator. Output ONLY valid JSON array.' },
              { role: 'user', content: prompt }
            ],
            seed: randomSeed
          })
        });
        if (resp2.ok) {
          const rawText2 = await resp2.text();
          const parsed2 = extractValidQuestions(rawText2);
          if (parsed2.length >= 3) return parsed2.slice(0, count);
        }
      } catch (e) {}

      // یەدەگ
      let unseenPool = FALLBACK_BANK.filter(item => !seenQuestions.includes(item.q));
      if (unseenPool.length < count) unseenPool = [...FALLBACK_BANK];
      return unseenPool.sort(() => Math.random() - 0.5).slice(0, count);
    }

    // ٢. دروستکردنی ڕستەی کۆمیدیی نوێ بۆ براوە و دۆڕاوەکان بە زیرەکی دەستکرد
    async function generateAIComedyCommentary() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0] || { name: 'براوە', score: 0 };
      const losers = sorted.slice(1);
      const loserNames = losers.length > 0 ? losers.map(p => p.name).join(' و ') : 'ڕکابەرە خەیاڵییەکان';
      const vibeObj = QUESTION_VIBES.find(v => v.id === state.selectedVibeId) || QUESTION_VIBES[0];
      const randomSeed = Math.floor(Math.random() * 999999);

      const fallbackWin = FALLBACK_WINNER_JOKES[randomSeed % FALLBACK_WINNER_JOKES.length].replace('{winner}', winner.name);
      const fallbackLose = FALLBACK_LOSER_JOKES[randomSeed % FALLBACK_LOSER_JOKES.length].replace('{losers}', loserNames);

      const prompt = `تۆ پێشکەشکارێکی زۆر قسەخۆش و کۆمیدیی کوردیت لە یاریی "مەجلیس".
یارییەکە تەواو بوو لە کەشی "${vibeObj.title}".
- براوەی یەکەم: "${winner.name}" بە (${winner.score} خاڵ).
- دۆڕاوەکان: "${loserNames}".
تکایە دوو ڕستەی زۆر کۆمیدی و نوێ و پێکەنیناوی بە کوردیی سۆرانیی پاراو بنووسە (ژمارەی هەڕەمەکی: ${randomSeed}):
١. winnerJoke: پیاهەڵدانێکی زۆر کۆمیدی و گەورەکردنێکی خۆش بۆ براوەکە (${winner.name}).
٢. loserJoke: تەعلیقێکی هاوڕێیانەی زۆر کۆمیدی و سزایەکی خۆش بۆ دۆڕاوەکان (${loserNames}) گونجاو لەگەڵ کەشی (${vibeObj.title} - بۆ نموونە چا لێنان، قاپ شۆردن، دەعوەتکردن...).
تەنها بە شێوازی JSON Object وەڵام بدەرەوە بەم فۆرماتە:
{"winnerJoke":"...","loserJoke":"..."}`;

      // هەوڵی یەکەم: Gemini API
      if (state.apiKey && state.apiKey.trim().length > 10) {
        try {
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(state.apiKey.trim())}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.95 }
            })
          });
          if (resp.ok) {
            const data = await resp.json();
            const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const parsed = extractComedyJson(raw);
            if (parsed) return parsed;
          }
        } catch (e) {}
      }

      // هەوڵی دووەم: Pollinations Open AI
      try {
        const resp2 = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'You are a funny Kurdish comedian. Output ONLY valid JSON object with winnerJoke and loserJoke.' },
              { role: 'user', content: prompt }
            ],
            seed: randomSeed
          })
        });
        if (resp2.ok) {
          const raw2 = await resp2.text();
          const parsed2 = extractComedyJson(raw2);
          if (parsed2) return parsed2;
        }
      } catch (e) {}

      return { winnerJoke: fallbackWin, loserJoke: fallbackLose };
    }

    function extractComedyJson(rawText) {
      try {
        const start = rawText.indexOf('{');
        const end = rawText.lastIndexOf('}');
        if (start === -1 || end === -1) return null;
        const obj = JSON.parse(rawText.substring(start, end + 1));
        if (obj && obj.winnerJoke && obj.loserJoke) return obj;
        return null;
      } catch (e) {
        return null;
      }
    }

    function extractValidQuestions(rawText) {
      try {
        const start = rawText.indexOf('[');
        const end = rawText.lastIndexOf(']');
        if (start === -1 || end === -1) return [];
        const arr = JSON.parse(rawText.substring(start, end + 1));
        if (!Array.isArray(arr)) return [];

        return arr.filter(item => item && typeof item.q === 'string' && Array.isArray(item.opts) && item.opts.length === 4).map(item => {
          const correctText = item.opts[item.ans] || item.opts[0];
          const shuffledOpts = [...item.opts].sort(() => Math.random() - 0.5);
          const newAns = shuffledOpts.indexOf(correctText);
          markQuestionSeen(item.q);
          return {
            q: item.q,
            opts: shuffledOpts,
            ans: newAns >= 0 ? newAns : 0
          };
        });
      } catch (e) {
        return [];
      }
    }

    function resetToHome() {
      clearInterval(state.timerInterval);
      if (state.peer) {
        try { state.peer.destroy(); } catch (e) {}
      }
      window.history.replaceState({}, document.title, window.location.pathname);
      state.screen = 'welcome';
      state.role = null;
      state.connecting = false;
      state.generatingAI = false;
      render();
    }

    function showFloatingEmoji(emoji, senderName) {
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.style.left = (15 + Math.random() * 70) + '%';
      el.innerHTML = `${emoji} <small style="font-size:0.75rem; background:rgba(0,0,0,0.75); padding:2px 8px; border-radius:20px; color:#fff;">${senderName}</small>`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2400);
    }

    function sendEmojiReaction(emoji) {
      showFloatingEmoji(emoji, state.myName || 'تۆ');
      if (state.role === 'host') {
        broadcastPayload({ type: 'EMOJI', emoji, sender: state.myName });
      } else if (state.role === 'player' && state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'EMOJI', emoji, sender: state.myName });
      }
    }

    function updateTimerUIOnly() {
      const timeLabel = document.getElementById('liveTimeLabel');
      const timeFill = document.getElementById('liveTimeFill');
      if (timeLabel) timeLabel.textContent = `⏱️ ${state.timeLeft} چرکە`;
      if (timeFill) {
        const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);
        timeFill.style.width = `${pct}%`;
      }
    }

    function render() {
      const box = document.getElementById('appContainer');
      if (state.screen === 'welcome') box.innerHTML = renderWelcomeScreen();
      else if (state.screen === 'lobby') box.innerHTML = renderLobbyScreen();
      else if (state.screen === 'playing') box.innerHTML = renderPlayingScreen();
      else if (state.screen === 'finished') box.innerHTML = renderFinishedScreen();

      if (state.screen === 'lobby' && state.role === 'host') {
        setTimeout(drawQRCode, 50);
      }
    }

    function renderWelcomeScreen() {
      const tabsHtml = `
        <div class="welcome-tabs">
          <button class="w-tab ${state.welcomeTab === 'host' ? 'active' : ''}" onclick="state.welcomeTab='host'; render();">👑 دروستکردنی مەجلیس</button>
          <button class="w-tab ${state.welcomeTab === 'join' ? 'active' : ''}" onclick="state.welcomeTab='join'; render();">📲 چوونە ژوورەوە</button>
          <button class="w-tab ${state.welcomeTab === 'solo' ? 'active' : ''}" onclick="state.welcomeTab='solo'; render();">🎮 یاریی تاکەکەسی</button>
        </div>
      `;

      const vibesCardsHtml = QUESTION_VIBES.map(v => `
        <div class="vibe-card ${state.selectedVibeId === v.id ? 'active' : ''}"
             onclick="state.selectedVibeId='${v.id}'; render();">
          <span class="v-ico">${v.icon}</span>
          <strong>${v.title}</strong>
          <small>${v.desc}</small>
        </div>
      `).join('');

      const vibeSelectorBox = `
        <div class="vibe-section">
          <div style="text-align:center;">
            <span class="section-tag">🎭 پێوەری شێوازی پرسیار و کەشی دانیشتنەکە هەڵبژێرە</span>
          </div>
          <div class="vibe-grid">${vibesCardsHtml}</div>
        </div>
      `;

      const topicChipsHtml = PRESET_TOPICS.map(t => `
        <button class="topic-chip ${state.selectedTopic === t && !state.customTopicText ? 'active' : ''}"
                onclick="state.selectedTopic='${t}'; state.customTopicText=''; render();">
          ${t}
        </button>
      `).join('');

      const aiTopicBox = `
        <div class="ai-config-box">
          <div style="text-align:center;">
            <span class="ai-badge">✨ بابەتی پرسیارەکانی زیرەکی دەستکرد</span>
          </div>
          <div class="topic-chips">${topicChipsHtml}</div>
          <input type="text" class="input" style="margin-bottom:0; font-size:0.85rem;"
                 placeholder="✍️ یان هەر بابەتێکی دڵخواز دەتەوێت لێرە بینووسە..."
                 value="${state.customTopicText}"
                 oninput="state.customTopicText = this.value;" />
        </div>
      `;

      const settingsHtml = `
        <div class="settings-row">
          <div class="setting-box">
            <label>ژمارەی پرسیار</label>
            <select onchange="state.questionLimit = parseInt(this.value, 10);">
              <option value="5" ${state.questionLimit === 5 ? 'selected' : ''}>٥ پرسیار</option>
              <option value="8" ${state.questionLimit === 8 ? 'selected' : ''}>٨ پرسیار</option>
              <option value="10" ${state.questionLimit === 10 ? 'selected' : ''}>١٠ پرسیار</option>

            <input type="text" id="nameInp" class="input" placeholder="ناوی خۆت بنووسە..." value="${state.myName}" />

    function renderPlayingScreen() {
      const qObj = state.questions[state.qIndex];
      const me = state.players.find(p => p.id === state.myId);
      const myAns = me ? me.currentAnswer : null;
      const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);
      const answeredCount = state.players.filter(p => p.currentAnswer !== null).length;

      const optsHtml = qObj.opts.map((opt, idx) => {
        let cls = 'opt-card';
        if (state.revealAnswer) {
          if (idx === qObj.ans) cls += ' correct';
          else if (myAns === idx) cls += ' wrong';
        } else if (myAns === idx) {
          cls += ' selected';
        }

        return `
          <button class="${cls}" ${myAns !== null || state.revealAnswer ? 'disabled' : ''} onclick="submitPlayerAnswer(${idx})">
            <span>${idx + 1}. ${opt}</span>
            <span>${state.revealAnswer && idx === qObj.ans ? '✅' : (state.revealAnswer && myAns === idx ? '❌' : (myAns === idx ? '👈' : ''))}</span>
          </button>
        `;
      }).join('');

      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const leaderboardHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">

        </div>

      return `
        <div class="card">
          <div class="quiz-top-meta">

            </button>
          ` : ''}

          <div class="emoji-bar">
            <button class="emoji-btn" onclick="sendEmojiReaction('🔥')">🔥</button>
            <button class="emoji-btn" onclick="sendEmojiReaction('😂')">😂</button>
            <button class="emoji-btn" onclick="sendEmojiReaction('👏')">👏</button>
            <button class="emoji-btn" onclick="sendEmojiReaction('😱')">😱</button>

          ${leaderboardHtml}
        </div>
      `;
    }

    function renderFinishedScreen() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0];

      const ranksHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">
          <span>${i === 0 ? '🥇 براوەی یەکەم:' : (i === 1 ? '🥈 دووەم:' : (i === 2 ? '🥉 سێیەم:' : `🐢 ${i + 1}.`))} ${p.name}</span>

      `).join('');

      return `
        <div class="card" style="text-align:center;">

            </div>

              <div class="comedy-head">😂 تەعلیقی AI بۆ دۆڕاوەکان:</div>
              <div>"${state.comedyResult.loserJoke || 'جاری داهاتوو هەوڵ بدەنەوە!'}"</div>
            </div>
          </div>

          <div style="text-align:right; margin:16px 0;">
            <h3 style="font-size:0.95rem; margin-bottom:8px;">📋 ڕیزبەندی کۆتایی یاریزانەکان:</h3>
            ${ranksHtml}
          </div>

          ${(state.role === 'host' || state.role === 'solo') ? `
            <button class="btn" onclick="regenerateComedyNow()" ${state.generatingComedy ? 'disabled' : ''}>
              ${state.generatingComedy ? '<span class="spinner"></span> خەریکی نووسینی قسەیەکی ترە...' : '🎲 گۆڕینی قسە کۆمیدییەکە (شتێکی تر بڵێ!)'}
            </button>
          ` : ''}

          ${state.role === 'host' ? `
            <button class="btn btn-primary" ${state.generatingAI ? 'disabled' : ''} onclick="hostStartCompetition()">
              ${state.generatingAI ? '<span class="spinner"></span> خەریکی ئامادەکردنی پرسیاری نوێیە...' : '✨ خولێکی نوێ لەگەڵ هاوڕێیان'}
            </button>
          ` : ''}
          ${state.role === 'solo' ? `
            <button class="btn btn-primary" ${state.generatingAI ? 'disabled' : ''} onclick="startSoloGame()">
              ${state.generatingAI ? '<span class="spinner"></span> خەریکی ئامادەکردنی پرسیاری نوێیە...' : '✨ خولێکی نوێ بە پرسیاری نوێ'}
            </button>
          ` : ''}
          <button class="btn" onclick="resetToHome()">🏠 گەڕانەوە بۆ پەڕەی سەرەکی</button>

      `;

    function drawQRCode() {
      const box = document.getElementById('qrcode');
      if (!box) return;
      box.innerHTML = '';
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      new QRCode(box, {
        text: joinUrl,
        width: 185,
        height: 185,
        colorDark: "#070a14",
        colorLight: "#ffffff"
      });
    }

    function copyInvite(url) {
      navigator.clipboard.writeText(url);
      alert('لینکی مەجلیس کۆپی کرا!');
    }

    function shareInviteWA(url) {
      const msg = `🎲 وەرنە ناو پێشبڕکێی مەجلیس! کۆدی ژوور: (${state.roomCode})\nکلیک لەم لینکە بکەن:\n${url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // دەستپێکردنی یاریی تاکەکەسی
    async function startSoloGame() {
      const nameEl = document.getElementById('nameInp');
      const name = nameEl ? nameEl.value.trim() || 'یاریزان' : state.myName || 'یاریزان';
      state.myName = name;
      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'solo';
      state.generatingAI = true;
      render();

      const vibeObj = QUESTION_VIBES.find(v => v.id === state.selectedVibeId) || QUESTION_VIBES[0];
      const topic = state.customTopicText.trim() || state.selectedTopic;
      state.questions = await generateAIQuestions(vibeObj, topic, state.questionLimit, state.difficulty);
      state.generatingAI = false;

      state.players = [{ id: state.myId, name: state.myName, score: 0, streak: 0, currentAnswer: null, answerTime: 0 }];
      state.qIndex = 0;
      state.screen = 'playing';
      beginQuestionCountdown();
    }

    // دروستکردنی ژوور لەلایەن Host
    function startHostRoom() {
      const name = document.getElementById('nameInp').value.trim();
      if (!name) return alert('تکایە سەرەتا ناوی خۆت بنووسە!');
      state.myName = name;
      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'host';
      state.connecting = true;
      render();

      state.roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      const peerId = 'MAJLIS_V4_' + state.roomCode;
      state.peer = new Peer(peerId);

      state.peer.on('open', () => {
        state.connecting = false;
        state.players = [{ id: state.myId, name: state.myName, score: 0, streak: 0, currentAnswer: null, answerTime: 0 }];
        state.screen = 'lobby';
        render();
      });

      state.peer.on('error', () => {
        state.connecting = false;
        alert('کێشەیەک لە هێڵی ئینتەرنێتدا هەیە، تکایە دووبارە هەوڵ بدەرەوە.');
        render();
      });

      state.peer.on('connection', (conn) => {
        conn.on('data', (data) => onHostReceiveData(conn, data));
      });
    }

    // پەیوەستبوونی یاریزان
    function joinHostRoom() {
      const name = document.getElementById('nameInp').value.trim();
      const code = document.getElementById('codeInp').value.trim().toUpperCase();
      if (!name || !code) return alert('تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');

      state.myName = name;
      state.roomCode = code;
      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'player';
      state.connecting = true;
      render();

      state.peer = new Peer();
      state.peer.on('open', () => {
        const conn = state.peer.connect('MAJLIS_V4_' + code, { reliable: true });
        state.hostConn = conn;

        const timeout = setTimeout(() => {
          if (state.connecting) {
            state.connecting = false;
            alert('ئەم کۆدی ژوورە نەدۆزرایەوە! دڵنیابە لە کۆدەکە.');
            render();
          }
        }, 8000);

        conn.on('open', () => {
          clearTimeout(timeout);
          state.connecting = false;
          conn.send({ type: 'JOIN', id: state.myId, name: state.myName });
        });

        conn.on('data', (data) => onPlayerReceiveData(data));
      });
    }

    function onHostReceiveData(conn, data) {
      if (data.type === 'JOIN') {
        state.connections[data.id] = conn;
        const exists = state.players.find(p => p.id === data.id);
        if (!exists) {
          let cleanName = data.name;
          if (state.players.some(p => p.name === cleanName)) {
            cleanName = `${data.name} (${state.players.length + 1})`;
          }
          state.players.push({ id: data.id, name: cleanName, score: 0, streak: 0, currentAnswer: null, answerTime: 0 });
        }
        syncAllPlayers(true);
        render();
      } else if (data.type === 'ANSWER') {
        const p = state.players.find(x => x.id === data.id);
        if (p && p.currentAnswer === null && !state.revealAnswer) {
          p.currentAnswer = data.ansIdx;
          p.answerTime = state.timeLeft;
          checkAllPlayersAnswered();
          syncAllPlayers(false);
          render();
        }
      } else if (data.type === 'EMOJI') {
        showFloatingEmoji(data.emoji, data.sender);
        broadcastPayload(data);
      }
    }

    function onPlayerReceiveData(data) {
      if (data.type === 'EMOJI') {
        showFloatingEmoji(data.emoji, data.sender);
        return;
      }
      if (data.type === 'TIMER_TICK') {
        state.timeLeft = data.timeLeft;
        updateTimerUIOnly();
        return;
      }
      if (data.type === 'SYNC') {
        const prevReveal = state.revealAnswer;
        state.screen = data.screen;
        state.players = data.players;
        if (data.questions) state.questions = data.questions;
        state.qIndex = data.qIndex;
        state.timeLeft = data.timeLeft;
        state.questionDuration = data.questionDuration;
        state.revealAnswer = data.revealAnswer;
        if (data.comedyResult) state.comedyResult = data.comedyResult;

        if (!prevReveal && state.revealAnswer && state.screen === 'playing') {
          const me = state.players.find(p => p.id === state.myId);
          const qObj = state.questions[state.qIndex];
          if (me && me.currentAnswer === qObj.ans) playTone('correct');
          else playTone('wrong');
        }
        render();
      }
    }

    function broadcastPayload(payload) {
      Object.values(state.connections).forEach(c => {
        if (c && c.open) c.send(payload);
      });
    }

    function syncAllPlayers(includeQuestions = false) {
      if (state.role !== 'host') return;
      broadcastPayload({
        type: 'SYNC',
        screen: state.screen,
        players: state.players,
        questions: includeQuestions ? state.questions : null,
        qIndex: state.qIndex,
        timeLeft: state.timeLeft,
        questionDuration: state.questionDuration,
        revealAnswer: state.revealAnswer,
        comedyResult: state.comedyResult
      });
    }

    async function hostStartCompetition() {
      state.generatingAI = true;
      render();

      const vibeObj = QUESTION_VIBES.find(v => v.id === state.selectedVibeId) || QUESTION_VIBES[0];
      const topic = state.customTopicText.trim() || state.selectedTopic;
      state.questions = await generateAIQuestions(vibeObj, topic, state.questionLimit, state.difficulty);
      state.generatingAI = false;

      state.qIndex = 0;
      state.players.forEach(p => { p.score = 0; p.streak = 0; p.currentAnswer = null; });
      state.screen = 'playing';
      syncAllPlayers(true);
      beginQuestionCountdown();
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval);
      state.timeLeft = state.questionDuration;
      state.revealAnswer = false;
      state.players.forEach(p => { p.currentAnswer = null; p.answerTime = 0; });
      syncAllPlayers(false);
      render();

      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');

        if (state.timeLeft <= 0) {
          revealQuestionResult();
        } else {
          updateTimerUIOnly();
          if (state.role === 'host') {
            broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft });
          }
        }
      }, 1000);
    }

    function submitPlayerAnswer(optIdx) {
      const me = state.players.find(p => p.id === state.myId);
      if (!me || me.currentAnswer !== null || state.revealAnswer) return;

      me.currentAnswer = optIdx;
      me.answerTime = state.timeLeft;
      render();

      if (state.role === 'host' || state.role === 'solo') {
        checkAllPlayersAnswered();
        syncAllPlayers(false);
      } else if (state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'ANSWER', id: state.myId, ansIdx: optIdx });
      }
    }

    function checkAllPlayersAnswered() {
      if (state.players.every(p => p.currentAnswer !== null)) {
        revealQuestionResult();
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval);
      state.revealAnswer = true;
      const qObj = state.questions[state.qIndex];

      state.players.forEach(p => {
        if (p.currentAnswer === qObj.ans) {
          p.streak = (p.streak || 0) + 1;
          const speedBonus = Math.round((p.answerTime / state.questionDuration) * 60);
          const streakBonus = p.streak >= 2 ? 25 : 0;
          p.score += 100 + speedBonus + streakBonus;
        } else {
          p.streak = 0;
        }
      });

      const me = state.players.find(p => p.id === state.myId);
      if (me && me.currentAnswer === qObj.ans) playTone('correct');
      else playTone('wrong');

      syncAllPlayers(false);
      render();
    }

    async function advanceToNextQuestion() {
      if (state.qIndex + 1 < state.questions.length) {
        state.qIndex++;
        beginQuestionCountdown();
      } else {
        // دروستکردنی قسە کۆمیدییەکەی کۆتایی یاری بە زیرەکی دەستکرد
        state.generatingComedy = true;
        render();
        state.comedyResult = await generateAIComedyCommentary();
        state.generatingComedy = false;
        state.screen = 'finished';
        syncAllPlayers(false);
        render();
      }
    }

    async function regenerateComedyNow() {
      state.generatingComedy = true;
      render();
      state.comedyResult = await generateAIComedyCommentary();
      state.generatingComedy = false;
      syncAllPlayers(false);
      render();
    }

    function openApiModal() {
      document.getElementById('apiKeyInput').value = state.apiKey;
      document.getElementById('seenCountTxt').textContent = seenQuestions.length;
      document.getElementById('apiModal').classList.add('open');
    }

    function closeApiModal() {
      document.getElementById('apiModal').classList.remove('open');
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      state.apiKey = val;
      localStorage.setItem(STORAGE_API_KEY, val);
      closeApiModal();
      alert('✅ کلیلی زیرەکی دەستکرد پاشەکەوت کرا!');
    }

    render();
  </script>
</body>
</html>
