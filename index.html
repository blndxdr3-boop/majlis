<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #0f172a;
      --bg-elevated: #334155;
      --border: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-card: #f8fafc;
      --muted-main: #94a3b8;
      --muted-card: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.28);
      --emerald: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius: 18px;
    }

    body.light-mode {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #f1f5f9;
      --bg-elevated: #e2e8f0;
      --border: rgba(15, 23, 42, 0.1);
      --text-main: #0f172a;
      --text-card: #0f172a;
      --muted-main: #64748b;
      --muted-card: #475569;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow: rgba(124, 58, 237, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; transition: background 0.25s, color 0.25s; }

    .flex-center, .splash-logo, .brand-icon, .menu-lines-btn, .proj-toggle-btn, .btn, .pin-digit, .opt-num, .modal-backdrop.open {
      display: flex; align-items: center; justify-content: center;
    }

    #splashScreen { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; flex-direction: column; gap: 14px; animation: autoHideSplash 0.4s ease 1.7s forwards; }
    @keyframes autoHideSplash { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    .splash-logo { width: 82px; height: 82px; border-radius: 24px; background: var(--accent); color: #fff; font-size: 2.5rem; box-shadow: 0 10px 30px var(--accent-glow); }
    .splash-title { font-weight: 900; font-size: 2.2rem; }

    header { padding: 10px 14px; border-bottom: 1.5px solid var(--border); background: var(--bg-surface); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 1.2rem; box-shadow: 0 4px 12px var(--accent-glow); }
    .brand-title { font-weight: 900; font-size: 1.25rem; }

    .menu-lines-btn { width: 40px; height: 40px; border-radius: 11px; background: var(--bg-card); border: 1.5px solid var(--border); flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
    .menu-lines-btn span { width: 20px; height: 2.8px; background: var(--text-card); border-radius: 3px; }
    .menu-lines-btn:active, .cycle-btn:active, .mini-icon-btn:active { transform: scale(0.94); }

    main { max-width: 640px; width: 100%; margin: 0 auto; padding: 12px 12px 50px; flex: 1; }
    .card { background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 14px; margin-bottom: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14); }
    h2 { font-size: 1.15rem; font-weight: 900; margin-bottom: 4px; text-align: center; }
    p.sub { color: var(--muted-main); font-size: 0.8rem; text-align: center; margin-bottom: 12px; line-height: 1.45; font-weight: 600; }

    .welcome-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 12px; background: var(--bg-card); padding: 5px; border-radius: 13px; border: 1px solid var(--border); }
    .w-tab { padding: 9px 6px; border-radius: 9px; border: none; background: transparent; color: var(--muted-card); font-weight: 800; font-size: 0.82rem; cursor: pointer; transition: 0.2s; }
    .w-tab.active, .proj-toggle-btn.active, .chip-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

    .host-top-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .host-top-row .input { margin-bottom: 0; flex: 1; }
    .proj-toggle-btn { padding: 0 13px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--muted-card); font-size: 0.78rem; font-weight: 800; cursor: pointer; gap: 5px; white-space: nowrap; }
    .proj-toggle-btn.active { width: 100%; padding: 11px 14px; }

    .input { width: 100%; padding: 11px 13px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; margin-bottom: 10px; outline: none; text-align: center; transition: 0.2s; }
    .input::placeholder { color: var(--muted-card); opacity: 0.85; }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .btn { width: 100%; padding: 12px 16px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; cursor: pointer; gap: 8px; margin-bottom: 8px; transition: 0.15s; }
    .btn:active:not(:disabled) { transform: translateY(2px); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .btn-primary { background: var(--accent); color: #fff; border: none; box-shadow: 0 6px 18px var(--accent-glow); }
    .btn-emerald { background: var(--emerald); border: none; color: #fff; }

    .section-box, .cycle-btn, .q-banner, .next-auto-banner, .comedy-card, .about-info-box { background: var(--bg-card); color: var(--text-card); border-radius: 14px; }
    .section-box { border: 1.5px solid var(--border); padding: 10px; margin-bottom: 10px; }
    .section-label { font-size: 0.74rem; font-weight: 800; color: var(--muted-card); text-align: center; margin-bottom: 7px; }

    .chips-wrap, .players-wrap { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .chip-btn { padding: 6px 11px; border-radius: 50px; border: 1.5px solid transparent; background: var(--bg-elevated); color: var(--text-card); font-size: 0.77rem; font-weight: 800; cursor: pointer; transition: 0.15s; }

    .cycle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 12px; }
    .cycle-btn { border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 6px; text-align: center; cursor: pointer; }
    .cycle-btn small { display: block; font-size: 0.66rem; color: var(--muted-card); font-weight: 700; margin-bottom: 2px; }
    .cycle-btn strong { display: block; font-size: 0.82rem; font-weight: 900; color: var(--accent); }

    .qr-wrap { background: #fff; padding: 11px; border-radius: 16px; width: fit-content; margin: 6px auto 12px; border: 3px solid var(--accent); }
    .pin-boxes { display: flex; justify-content: center; gap: 8px; margin: 4px 0 12px; direction: ltr; }
    .pin-digit { width: 46px; height: 52px; border-radius: 12px; background: var(--bg-card); color: var(--accent); border: 2px solid var(--accent); font-size: 1.5rem; font-weight: 900; }

    .players-wrap { margin: 8px 0; }
    .p-badge { background: var(--bg-card); color: var(--text-card); border: 1.5px solid var(--accent); padding: 5px 12px; border-radius: 50px; font-weight: 800; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; }
    .kick-btn { background: var(--danger); border: none; color: #fff; width: 19px; height: 19px; border-radius: 50%; font-size: 0.68rem; cursor: pointer; }

    .quiz-top-meta, .opt-card, .leader-row, .comedy-head { display: flex; justify-content: space-between; align-items: center; }
    .quiz-top-meta { margin-bottom: 7px; font-weight: 800; font-size: 0.82rem; }
    .source-tag { font-size: 0.72rem; padding: 3px 9px; border-radius: 50px; background: var(--bg-card); color: var(--accent); border: 1px solid var(--border); }
    .timer-track { height: 9px; background: var(--bg-card); border-radius: 50px; overflow: hidden; margin-bottom: 12px; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--accent), var(--danger)); transition: width 0.95s linear; }

    .q-banner { font-size: 1.08rem; font-weight: 900; text-align: center; padding: 16px 12px; margin-bottom: 12px; line-height: 1.6; border: 1.5px solid var(--border); }
    .opts-list, .comedy-grid { display: grid; gap: 9px; }
    .opt-card { padding: 12px 13px; border-radius: 13px; border: 2px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; cursor: pointer; gap: 10px; transition: 0.15s; }
    .opt-right { display: flex; align-items: center; gap: 9px; text-align: right; }
    .opt-num { width: 28px; height: 28px; border-radius: 8px; background: var(--bg-elevated); color: var(--text-card); font-weight: 900; font-size: 0.82rem; flex-shrink: 0; }
    .opt-card.selected { border-color: var(--accent); background: var(--accent-glow); }
    .opt-card.selected .opt-num { background: var(--accent); color: #fff; }
    .opt-card.correct { background: #059669 !important; color: #fff !important; border-color: #10b981 !important; }
    .opt-card.correct .opt-num { background: rgba(255,255,255,0.2) !important; color: #fff !important; }
    .opt-card.wrong { background: #dc2626 !important; color: #fff !important; border-color: #ef4444 !important; }
    .opt-card.wrong .opt-num { background: rgba(255,255,255,0.2) !important; color: #fff !important; }

    .gain-badge { background: var(--emerald); color: #fff; padding: 2px 7px; border-radius: 50px; font-size: 0.72rem; margin-right: 5px; }
    .next-auto-banner { margin-top: 12px; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--accent); text-align: center; font-weight: 800; font-size: 0.82rem; }

    .leader-row { padding: 10px 12px; border-radius: 11px; background: var(--bg-card); color: var(--text-card); border: 1.5px solid var(--border); margin-bottom: 7px; font-weight: 800; font-size: 0.86rem; gap: 6px; flex-wrap: wrap; }
    .leader-row.first { border: 2px solid var(--amber); }
    .vibe-rank-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 50px; background: var(--bg-elevated); color: var(--text-card); margin-right: 5px; }

    .comedy-grid { margin: 12px 0; text-align: right; }
    .comedy-card { padding: 12px 14px; line-height: 1.6; font-size: 0.88rem; font-weight: 700; }
    .comedy-card.winner-box { border: 2px solid var(--emerald); }
    .comedy-card.loser-box { border: 2px solid var(--accent); }
    .comedy-card.task-box { border: 2px dashed var(--amber); }
    .comedy-head { gap: 8px; font-weight: 900; font-size: 0.88rem; margin-bottom: 4px; }
    .mini-icon-btn { background: var(--bg-elevated); color: var(--text-card); border: 1px solid var(--accent); border-radius: 8px; padding: 2px 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }

    .countdown-overlay { text-align: center; padding: 40px 16px; }
    .countdown-num { font-size: 4.5rem; font-weight: 900; color: var(--accent); }
    .toast-msg { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); color: var(--text-main); border: 2px solid var(--accent); padding: 9px 16px; border-radius: 50px; font-size: 0.82rem; font-weight: 800; z-index: 400; text-align: center; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72); display: none; z-index: 250; padding: 14px; }
    .modal-box { background: var(--bg-surface); border: 2px solid var(--border); border-radius: var(--radius); max-width: 460px; width: 100%; padding: 18px; max-height: 88vh; overflow-y: auto; }
    .about-info-box { padding: 16px; text-align: center; line-height: 1.9; margin: 12px 0; font-weight: 800; border: 1.5px solid var(--border); }
  </style>
</head>
<body>

  <div id="splashScreen" class="flex-center" onclick="this.remove()">
    <div class="splash-logo">🎲</div>
    <div class="splash-title">مەجلیس</div>
  </div>

  <header>
    <div class="brand" onclick="if(state.role!=='player')resetToHome()">
      <div class="brand-icon" id="headerBrandIcon">🎲</div>
      <div class="brand-title">مەجلیس</div>
    </div>
    <div id="headerMenuContainer"></div>
  </header>

  <main id="appContainer"></main>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <h3 style="margin-bottom:12px;text-align:center;">لیستی سەرەکی</h3>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <button class="btn" onclick="toggleThemeMode()">🌓 گۆڕینی دۆخی شەو / ڕۆژ</button>
        <button class="btn" onclick="toggleSound()" id="soundBtnLabel">🔊 دەنگی یاری: چالاکە</button>
        <button class="btn" onclick="openCustomQModal()">✍️ زیادکردنی پرسیاری تایبەت</button>
        <button class="btn" onclick="clearAskedHistory();toggleModal('settingsModal',false);">🔄 سفرکردنەوەی مێژووی پرسیارەکان</button>
        <button class="btn" onclick="toggleModal('settingsModal',false);toggleModal('aboutModal',true);">ℹ️ دەربارە</button>
      </div>
      <button class="btn btn-primary" style="margin-top:10px;margin-bottom:0;" onclick="toggleModal('settingsModal',false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="aboutModal">
    <div class="modal-box">
      <h3 style="margin-bottom:10px;text-align:center;">ℹ️ دەربارەی مەجلیس</h3>
      <div class="about-info-box">
        <div>بەرهەم هێنراوە لەلایەن بڵند خضر</div>
        <div style="direction:ltr;margin-top:6px;font-size:0.95rem;color:var(--accent);">Blndxdr3@gmail.com</div>
      </div>
      <button class="btn btn-primary" style="margin-bottom:0;" onclick="toggleModal('aboutModal',false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="customQModal">
    <div class="modal-box">
      <h3 style="margin-bottom:6px;">✍️ زیادکردنی پرسیاری تایبەتی خۆت</h3>
      <p style="font-size:0.78rem;color:var(--muted-main);margin-bottom:10px;">پرسیار لەسەر هاوڕێکانت بنووسە بۆ ئەوەی لە بەشی (پرسیارەکانی خۆم) یاری پێ بکەن:</p>
      <input type="text" id="cqText" class="input" placeholder="دەقی پرسیارەکە بنووسە..." style="text-align:right;" />
      <input type="text" id="cqOpt0" class="input" placeholder="وەڵامی ڕاست ✅" style="text-align:right;" />
      <input type="text" id="cqOpt1" class="input" placeholder="هەڵبژاردەی هەڵەی ١" style="text-align:right;" />
      <input type="text" id="cqOpt2" class="input" placeholder="هەڵبژاردەی هەڵەی ٢" style="text-align:right;" />
      <input type="text" id="cqOpt3" class="input" placeholder="هەڵبژاردەی هەڵەی ٣" style="text-align:right;" />
      <div id="customQStatus" style="font-size:0.78rem;color:var(--emerald);text-align:center;margin-bottom:8px;font-weight:800;"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="toggleModal('customQModal',false);render();">داخستن</button>
        <button class="btn btn-primary" onclick="saveCustomQuestion()">➕ زیادکردن</button>
      </div>
    </div>
  </div>

  <script>
    const KEYS = { SEEN: 'MAJLIS_SEEN_HISTORY', CUSTOM: 'MAJLIS_CUSTOM_QUESTIONS', NAME: 'MAJLIS_PLAYER_NAME', ID: 'MAJLIS_PLAYER_ID', THEME: 'MAJLIS_THEME_MODE' };
    setTimeout(() => document.getElementById('splashScreen')?.remove(), 1900);

    let wakeLock = null;
    async function requestScreenWakeLock() {
      try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {}
    }

    let persistentId = localStorage.getItem(KEYS.ID) || ('U_' + Math.random().toString(36).substring(2, 10));
    localStorage.setItem(KEYS.ID, persistentId);

    const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
    let customQuestions = loadJSON(KEYS.CUSTOM), seenQuestions = loadJSON(KEYS.SEEN);
    if (localStorage.getItem(KEYS.THEME) === 'light') document.body.classList.add('light-mode');

    const normalizeDigits = s => String(s || '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776).trim().toUpperCase();
    const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    const toggleModal = (id, show) => document.getElementById(id)?.classList.toggle('open', show);
    const pickRand = arr => arr[Math.floor(Math.random() * arr.length)];
    const Q = (q, opts, diff) => ({ q, opts, ans: 0, diff });

    const QUESTION_VIBES = [
      { id: 'camping', icon: '⛺', title: 'چادرگە' },
      { id: 'friends_funny', icon: '😂', title: 'هاوڕێیان' },
      { id: 'qiyam', icon: '🌙', title: 'شەوبێداری' },
      { id: 'formal', icon: '💼', title: 'فەرمی' },
      { id: 'family', icon: '👨‍👩‍👧‍👦', title: 'خێزانی' }
    ];

    const VIBE_RANK_TITLES = {
      friends_funny: { first: '👑 سەرۆکی گەعدە', last: '💸 خاوەنی دەعوەتەکە', secondLast: '☕ چایچیی مەجلیس', mid: '😎 هاوڕێی قسەخۆش' },
      camping: { first: '🔥 فەرماندەی چادرگە', last: '🫖 چایچیی سەر خەڵووز', secondLast: '🧽 قاپشۆری گەشت', mid: '🧭 گەشتیاری کارامە' },
      qiyam: { first: '🌙 پێشەنگی شەوبێداران', last: '😴 خەواڵووی کۆڕەکە', secondLast: '🕯️ بانگبێژی پارشێو', mid: '✨ هاوەڵی بێدار' },
      formal: { first: '🎙️ سەرۆکی دیوان', last: '📝 بڕیاردەری کۆبوونەوە', secondLast: '📂 ڕێکەری پرۆتۆکۆڵ', mid: '💼 ئەندامی کارا' },
      family: { first: '🌟 تاجی سەری خێزان', last: '🍉 میوەپاککەری ماڵ', secondLast: '🫖 سینی هەڵگری دیوان', mid: '🌺 گوڵی مەجلیس' }
    };

    const PRESET_TOPICS = [
      'یاسا و دادگا و دەستوور', 'گەشت و کامپینگ و سروشت', 'مێژوو و جوگرافیای کوردستان',
      'زانیاری گشتی جۆراوجۆر', 'تۆپی پێ و وەرزشی جیهانی', 'مەتەڵ و زیرەکی',
      'زانیاری ئایینی و قورئان', 'پرسیارەکانی خۆم (تایبەت)'
    ];

    const QUESTION_BANK = {
      'یاسا و دادگا و دەستوور': [
        Q('لە یاسای شارستانیدا، تەمەنی یاسایی کامڵبوون (سن الرشد) لە عێراق چەند ساڵە؟', ['١٨ ساڵی تەواو', '١٥ ساڵ', '٢١ ساڵ', '٢٠ ساڵ'], 'ئاسان'),
        Q('بەرزترین یاسا لە ناو هەر دەوڵەتێکدا کامەیە کە نابێت هیچ یاسایەکی تر پێچەوانەی بێت؟', ['دەستوور (الدستور)', 'یاسای هاتوچۆ', 'پەیڕەوی ناوخۆ', 'بڕیاری شارەوانی'], 'ئاسان'),

        tasks: ['🪵 ڕۆیشتن و کۆکردنەوەی بڕێک داری وشک و خستنە سەر ئاگرەکە!', '🫖 لێنانی چای ڕەشکە لەسەر پۆلووی ئاگرەکە و تێکردنی بۆ هاوڕێیان!']
      },
      qiyam: {
        win: ['پیرۆزە پێشەنگی شەوبێداران {winner}! ماشەڵڵا لە بێداریی دڵ و ڕووناکیی بیرت لەم شەوە موبارەکەدا!'],
        lose: ['بۆ هاوەڵانی خەواڵوو ({losers}): دیارە چاوتان قورس بووە و خەیاڵتان لای بالیف و بەتانییەکە بووە!'],
        tasks: ['📖 خوێندنەوەی چەند ئایەتێکی قورئانی پیرۆز بە دەنگێکی خۆش!', '💧 هێنانی ئاو بۆ هاوڕێیان و ئامادەکردنی شوێنی دەستنوێژگرتن!']
      },
      formal: {
        win: ['بەڕێز سەرۆکی دیوان {winner}، بە بۆنەی بەدەستهێنانی پلەی یەکەمەوە گەرمترین پیرۆزبایی فەرمیتان ئاراستە دەکەین!'],
        lose: ['ئاگاداریی فەرمی بۆ بەڕێزان ({losers}): بەهۆی کەمیی خاڵەکانتانەوە، ئەرکی نووسینی کۆنووسی دانیشتنەکە دەکەوێتە ئەستۆی ئێوە!'],
        tasks: ['🎙️ پێشکەشکردنی وتارێکی کورتی ١ خولەکی بە زمانی کوردیی پەتی!', '📝 پوختەکردنەوەی گرنگترین خاڵەکانی دانیشتنەکە بە فەرمی!']
      },
      family: {
        win: ['پیرۆزە تاجی سەری خێزان {winner}! سەربەرزی بنەماڵە و مەجلیسەکەیت، جێگەی شانازیی هەمووانیت!'],
        lose: ['ئازیزان ({losers})، دیارە خەیاڵتان لای میوانداری و قسەی خۆشی خزمان بووە، هێنان و بردنی سینی چایەکە لەسەر ئێوەیە!'],
        tasks: ['🫖 هێنان و گێڕانی سینی چا و ئاو بەسەر هەموو ئەندامانی خێزاندا!', '🍎 پاککردن و قاشکردنی میوە و پێشکەشکردنی بە گەورەکانی مەجلیس!']
      }
    };

    let state = {
      welcomeTab: 'host', role: null, screen: 'welcome', myId: persistentId,
      myName: localStorage.getItem(KEYS.NAME) || '', roomCode: '',
      vibeId: 'camping', selectedTopics: [PRESET_TOPICS[0]],
      difficulty: 'مامناوەند', questionLimit: 6, questionDuration: 15,
      soundOn: true, connecting: false, countdownVal: 5, revealCountdown: 4,
      timerInterval: null, revealInterval: null, mqttClient: null,
      players: [], questions: [], qIndex: 0, timeLeft: 15,
      revealAnswer: false, comedyResult: { winnerJoke: '', loserJoke: '' },
      taskResult: '', isProjector: false
    };

    const urlRoom = new URLSearchParams(window.location.search).get('room');
    if (urlRoom) {
      state.roomCode = normalizeDigits(urlRoom);
      state.welcomeTab = 'join';
      setTimeout(() => { if (state.myName.trim() && state.screen === 'welcome') joinHostRoom(); }, 2000);
    }

    const isHostRole = () => state.role === 'host' || state.role === 'projector_host';
    const getActiveTopicsSummary = () => state.selectedTopics.join(' + ');

    function cycleSetting(key, list) {
      state[key] = list[(list.indexOf(state[key]) + 1) % list.length];
      render();
    }

    function getPlayerRankTitle(rankIndex, total) {
      const t = VIBE_RANK_TITLES[state.vibeId] || VIBE_RANK_TITLES.friends_funny;
      return rankIndex === 0 ? t.first : (total > 1 && rankIndex === total - 1) ? t.last : (total > 2 && rankIndex === total - 2) ? t.secondLast : t.mid;
    }

    function showToast(textContent) {
      document.querySelector('.toast-msg')?.remove();
      const t = Object.assign(document.createElement('div'), { className: 'toast-msg', textContent });
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    let audioCtx = null;
    function playTone(type) {
      if (!state.soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), now = audioCtx.currentTime;
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
          [523.25, 659.25, 783.99].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.1));
          gain.gain.setValueAtTime(0.14, now); osc.start(); osc.stop(now + 0.32);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.setValueAtTime(150, now + 0.15);
          gain.gain.setValueAtTime(0.14, now); osc.start(); osc.stop(now + 0.3);
        } else {
          osc.frequency.setValueAtTime(680, now); gain.gain.setValueAtTime(0.04, now); osc.start(); osc.stop(now + 0.05);
        }
      } catch (e) {}
    }

    function toggleThemeMode() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem(KEYS.THEME, isLight ? 'light' : 'dark');
      showToast(isLight ? '☀️ دۆخی ڕۆژ چالاک کرا' : '🌙 دۆخی شەو چالاک کرا');
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      setText('soundBtnLabel', state.soundOn ? '🔊 دەنگی یاری: چالاکە' : '🔇 دەنگی یاری: بێدەنگە');
    }

    function markQuestionSeen(qText) {
      if (!seenQuestions.includes(qText)) {
        seenQuestions.push(qText);
        if (seenQuestions.length > 500) seenQuestions.shift();
        try { localStorage.setItem(KEYS.SEEN, JSON.stringify(seenQuestions)); } catch (e) {}
      }
    }

    function clearAskedHistory() {
      seenQuestions = [];
      localStorage.removeItem(KEYS.SEEN);
      showToast('✅ مێژووی پرسیارە کراوەکان سفر کرایەوە!');
    }

    function handleTopicChipClick(topic) {
      const idx = state.selectedTopics.indexOf(topic);
      if (idx > -1) { if (state.selectedTopics.length > 1) state.selectedTopics.splice(idx, 1); }
      else state.selectedTopics.push(topic);
      render();
    }

    function getLocalQuestions(topicsList, count, difficulty) {
      let pool = [];
      topicsList.forEach(t => pool.push(...(t === 'پرسیارەکانی خۆم (تایبەت)' ? customQuestions : (QUESTION_BANK[t] || []))));
      if (!pool.length) Object.values(QUESTION_BANK).forEach(arr => pool.push(...arr));

      let unseen = pool.filter(i => !seenQuestions.includes(i.q));
      if (unseen.length < count) {
        const poolTexts = pool.map(x => x.q);
        seenQuestions = seenQuestions.filter(q => !poolTexts.includes(q));
        try { localStorage.setItem(KEYS.SEEN, JSON.stringify(seenQuestions)); } catch (e) {}
        unseen = [...pool];
      }

      return unseen
        .sort((a, b) => ((b.diff === difficulty ? 1 : 0) - (a.diff === difficulty ? 1 : 0)) || (Math.random() - 0.5))
        .slice(0, count)
        .map(item => {
          const correctText = item.opts[item.ans ?? 0], opts = [...item.opts].sort(() => Math.random() - 0.5);
          markQuestionSeen(item.q);
          return { q: item.q, opts, ans: opts.indexOf(correctText) };
        });
    }

    function getLocalComedyCommentary() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0] || { name: 'پاڵەوان', score: 0 };
      const bank = VIBE_COMEDY_BANK[state.vibeId] || VIBE_COMEDY_BANK.friends_funny;
      return {
        winnerJoke: pickRand(bank.win).replace('{winner}', winner.name),
        loserJoke: state.players.length <= 1
          ? `چونکە بە تەنها یاریت کرد (${winner.name})، هەم براوەیت و هەم دۆڕاو! دەبێت خۆت چایەک بۆ خۆت تێبکەیت و دەستخۆشی لە خۆت بکەیت!`
          : pickRand(bank.lose).replace('{losers}', sorted.slice(1).map(p => p.name).join(' و '))
      };
    }

    function generateTaskString() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const target = pickRand(sorted.length > 1 ? sorted.slice(1) : sorted);
      const bank = VIBE_COMEDY_BANK[state.vibeId] || VIBE_COMEDY_BANK.friends_funny;
      return `بۆ (${target ? target.name : 'دۆڕاو'}): ${pickRand(bank.tasks)}`;
    }

    function spinVibePenaltyTask() {
      state.taskResult = generateTaskString();
      playTone('correct');
      syncAllPlayers();
      render();
    }

    function resetToHome() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      try { state.mqttClient?.end(true); } catch (e) {}
      state.mqttClient = null;
      window.history.replaceState({}, document.title, window.location.pathname);
      Object.assign(state, { screen: 'welcome', role: null, connecting: false });
      render();
    }

    function updateTimerUI() {
      setText('liveTimeLabel', `⏱️ ${state.timeLeft} چرکە`);
      const fill = document.getElementById('liveTimeFill');
      if (fill) fill.style.width = `${Math.max(0, (state.timeLeft / state.questionDuration) * 100)}%`;
    }

    function updateRevealUI() {
      setText('autoNextBanner', state.qIndex + 1 < state.questions.length
        ? `⏳ پرسیاری دواتر دوای ${state.revealCountdown} چرکە...`
        : `🏆 ئەنجامی کۆتایی دوای ${state.revealCountdown} چرکە...`);
    }

    function render() {
      const vibeObj = QUESTION_VIBES.find(v => v.id === state.vibeId) || QUESTION_VIBES[0];
      setText('headerBrandIcon', vibeObj.icon);

      const headerMenu = document.getElementById('headerMenuContainer');
      if (headerMenu) {
        const hideMenu = state.role === 'player' || (state.screen === 'welcome' && state.welcomeTab === 'join');
        headerMenu.innerHTML = hideMenu ? '' : `<button class="menu-lines-btn" onclick="toggleModal('settingsModal',true)" title="لیستی سەرەکی"><span></span><span></span><span></span></button>`;
      }

      const views = { welcome: renderWelcomeScreen, lobby: renderLobbyScreen, countdown: renderCountdownScreen, playing: renderPlayingScreen, finished: renderFinishedScreen };
      const box = document.getElementById('appContainer');
      if (box && views[state.screen]) box.innerHTML = views[state.screen]();
      if (state.screen === 'lobby' && isHostRole()) setTimeout(drawQRCode, 50);
    }

    function renderWelcomeScreen() {
      const tabsHtml = `
        <div class="welcome-tabs">
          <button class="w-tab ${state.welcomeTab === 'host' ? 'active' : ''}" onclick="state.welcomeTab='host';render();">👑 دروستکردنی مەجلیس</button>
          <button class="w-tab ${state.welcomeTab === 'join' ? 'active' : ''}" onclick="state.welcomeTab='join';render();">📲 چوونە ژوورەوە</button>
        </div>
      `;

      if (state.welcomeTab === 'join') {
        return `
          <div class="card">
            ${tabsHtml}
            <h2>📲 پەیوەستبوون بە مەجلیس</h2>
            <p class="sub">ناوی خۆت و کۆدی ژوورەکە بنووسە:</p>
            <input type="text" id="nameInp" class="input" placeholder="ناوی خۆت بنووسە..." value="${state.myName}" oninput="state.myName=this.value;localStorage.setItem(KEYS.NAME,this.value);" />
            <input type="text" id="codeInp" class="input" inputmode="numeric" placeholder="کۆدی ٤ ژمارەیی ژوور (بۆ نموونە: 6549)" value="${state.roomCode}" oninput="state.roomCode=normalizeDigits(this.value);" style="letter-spacing:3px;direction:ltr;" />
            <button class="btn btn-emerald" ${state.connecting ? 'disabled' : ''} onclick="joinHostRoom()">
              ${state.connecting ? '⏳ خەریکی پەیوەستبوونە...' : '🔗 چوونە ناو یارییەکە'}
            </button>
          </div>
        `;
      }

      const vibesChipsHtml = QUESTION_VIBES.map(v => `
        <button class="chip-btn ${state.vibeId === v.id ? 'active' : ''}" onclick="state.vibeId='${v.id}';render();">${v.icon} ${v.title}</button>
      `).join('');

      const visibleTopics = PRESET_TOPICS.filter(t => t !== 'پرسیارەکانی خۆم (تایبەت)' || customQuestions.length > 0);
      const topicChipsHtml = visibleTopics.map(t => `
        <button class="chip-btn ${state.selectedTopics.includes(t) ? 'active' : ''}" onclick="handleTopicChipClick('${t}')">
          ${t === 'پرسیارەکانی خۆم (تایبەت)' ? `✍️ پرسیاری خۆم (${customQuestions.length})` : t}
        </button>
      `).join('');

      const topRowHtml = state.isProjector
        ? `<div class="host-top-row"><button class="proj-toggle-btn active" onclick="state.isProjector=false;render();">🖥️ دۆخی داتاشۆ چالاکە (تۆ تەنها سەرپەرشتیاریت) ✕</button></div>`
        : `<div class="host-top-row">
             <input type="text" id="nameInp" class="input" placeholder="ناوی خۆت بنووسە..." value="${state.myName}" oninput="state.myName=this.value;localStorage.setItem(KEYS.NAME,this.value);" />
             <button class="proj-toggle-btn" onclick="state.isProjector=true;render();" title="بۆ داتاشۆ بێ بەشداریکردنی خۆت">🖥️ داتاشۆ</button>
           </div>`;

      return `
        <div class="card">
          ${tabsHtml}
          ${topRowHtml}
          <div class="section-box">
            <div class="section-label">🎭 شێوازی دانیشتن</div>
            <div class="chips-wrap">${vibesChipsHtml}</div>
          </div>
          <div class="section-box">
            <div class="section-label">📚 بابەتی پرسیارەکان</div>

          <div class="cycle-grid">
            <button class="cycle-btn" onclick="cycleSetting('questionLimit',[6,8,10,14])"><small>ژمارەی پرسیار</small><strong>${state.questionLimit} پرسیار 🔄</strong></button>
            <button class="cycle-btn" onclick="cycleSetting('difficulty',['ئاسان','مامناوەند','قورس'])"><small>ئاستی پرسیار</small><strong>${state.difficulty} 🔄</strong></button>
            <button class="cycle-btn" onclick="cycleSetting('questionDuration',[12,15,25])"><small>کاتی وەڵام</small><strong>${state.questionDuration} چرکە 🔄</strong></button>
          </div>
          <button class="btn btn-primary" style="margin-bottom:0;" onclick="startRoom()">
            ${state.isProjector ? '🖥️ دروستکردنی ژووری داتاشۆ' : '🚀 دروستکردنی مەجلیس و بارکۆد'}
          </button>
        </div>
      `;
    }

    function renderLobbyScreen() {
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      const pinDigitsHtml = String(state.roomCode).split('').map(d => `<div class="pin-digit">${d}</div>`).join('');
      const playersChips = state.players.length
        ? state.players.map(p => `
            <div class="p-badge">
              <span>👤 ${p.name}</span>
              ${isHostRole() && p.id !== state.myId ? `<button class="kick-btn" onclick="kickPlayer('${p.id}')" title="لادانی یاریزان">✕</button>` : ''}
            </div>
          `).join('')
        : `<p style="font-size:0.8rem;color:var(--muted-main);">چاوەڕوانی هاتنەژوورەوەی یاریزانان...</p>`;

      return isHostRole() ? `
        <div class="card" style="text-align:center;">
          <h2>📱 بارکۆدی هاتنەژوورەوەی هاوڕێیان</h2>
          <p class="sub">${getActiveTopicsSummary()} • ${state.difficulty}</p>
          <div class="qr-wrap" id="qrcode"></div>
          <div class="pin-boxes">${pinDigitsHtml}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
            <button class="btn" onclick="copyInvite('${joinUrl}')">📋 کۆپیکردنی لینک</button>
            <button class="btn btn-emerald" onclick="shareInviteWA('${joinUrl}')">📤 بانگهێشتکردن</button>
          </div>
          <h3 style="font-size:0.9rem;">👥 ئامادەبووان (${state.players.length} کەس):</h3>
          <div class="players-wrap">${playersChips}</div>
          <button class="btn btn-primary" style="margin-top:12px;margin-bottom:0;font-size:1rem;" onclick="hostStartCompetition()">▶️ دەستپێکردنی یاری</button>
        </div>
      ` : `
        <div class="card" style="text-align:center;">
          <h2>✅ تۆ لە ناو مەجلیسەکەدایت!</h2>
          <p class="sub">چاوەڕێ بکە تا سەرپەرشتیاری ژوورەکە یارییەکە دەست پێ دەکات...</p>
          <div class="pin-boxes">${pinDigitsHtml}</div>
          <h3 style="font-size:0.9rem;">👥 هاوڕێیانی ئامادەبوو (${state.players.length}):</h3>
          <div class="players-wrap">${playersChips}</div>
        </div>
      `;
    }

    function renderCountdownScreen() {
      return `
        <div class="card countdown-overlay">
          <h2>🚀 ئامادەبن!</h2>
          <p class="sub">${getActiveTopicsSummary()} • ${state.difficulty}</p>
          <div class="countdown-num" id="preGameCountNum">${state.countdownVal}</div>
        </div>
      `;
    }

    function renderPlayingScreen() {
      const qObj = state.questions[state.qIndex] || { q: '...', opts: ['', '', '', ''], ans: null };
      const myAns = state.players.find(p => p.id === state.myId)?.currentAnswer ?? null;
      const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);
      const vibeObj = QUESTION_VIBES.find(v => v.id === state.vibeId) || QUESTION_VIBES[0];
      const isProjHost = state.role === 'projector_host';

      const optsHtml = qObj.opts.map((opt, idx) => {
        const cls = 'opt-card' + (state.revealAnswer ? (idx === qObj.ans ? ' correct' : (myAns === idx ? ' wrong' : '')) : (myAns === idx ? ' selected' : ''));
        const icon = state.revealAnswer ? (idx === qObj.ans ? '✅' : (myAns === idx ? '❌' : '')) : '';
        return `
          <button class="${cls}" ${state.revealAnswer || isProjHost ? 'disabled' : ''} onclick="submitPlayerAnswer(${idx})">
            <div class="opt-right"><span class="opt-num">${idx + 1}</span><span>${opt}</span></div>
            <span>${icon}</span>
          </button>
        `;
      }).join('');

      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const leaderboardCardHtml = (state.revealAnswer || isProjHost) && sorted.length ? `
        <div class="card">
          <h3 style="margin-bottom:8px;font-size:0.9rem;">📊 ڕیزبەندی خاڵەکان:</h3>
          ${sorted.map((p, i) => `
            <div class="leader-row ${i === 0 ? 'first' : ''}">
              <span>
                ${i === 0 ? '👑' : `${i + 1}.`} ${p.name}
                ${p.streak >= 2 ? `<small style="color:var(--amber);">🔥x${p.streak}</small>` : ''}
                ${state.revealAnswer && p.lastGain > 0 ? `<span class="gain-badge">+${p.lastGain}</span>` : ''}
              </span>
              <span style="color:var(--amber);">${p.score} خاڵ</span>
            </div>
          `).join('')}
        </div>
      ` : '';

      return `
        <div class="card">
          <div class="quiz-top-meta">
            <span>پرسیاری ${state.qIndex + 1} / ${state.questions.length}</span>
            <span class="source-tag">${vibeObj.icon} ژوور: ${state.roomCode}</span>
            <span id="liveTimeLabel" style="color:var(--amber);">⏱️ ${state.timeLeft} چرکە</span>
          </div>
          <div class="timer-track"><div class="timer-fill" id="liveTimeFill" style="width:${pct}%"></div></div>
          <div class="q-banner">${qObj.q}</div>
          <div class="opts-list">${optsHtml}</div>
          ${state.revealAnswer ? `<div class="next-auto-banner" id="autoNextBanner">${state.qIndex + 1 < state.questions.length ? `⏳ پرسیاری دواتر دوای ${state.revealCountdown} چرکە...` : `🏆 ئەنجامی کۆتایی دوای ${state.revealCountdown} چرکە...`}</div>` : ''}
        </div>
        ${leaderboardCardHtml}
      `;
    }

    function renderFinishedScreen() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score), winner = sorted[0];
      const medals = ['🥇', '🥈', '🥉'];
      const ranksHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">
          <span>${medals[i] || `${i + 1}.`} ${p.name} <span class="vibe-rank-tag">${getPlayerRankTitle(i, sorted.length)}</span></span>
          <span style="color:var(--amber);">${p.score} خاڵ</span>
        </div>
      `).join('');

      return `
        <div class="card" style="text-align:center;">
          <h2>🏆 پاڵەوانی مەجلیس: ${winner ? winner.name : 'هیچ'} (${winner ? winner.score : 0} خاڵ)</h2>
          <div class="comedy-grid">
            <div class="comedy-card winner-box">
              <div class="comedy-head">
                <span>👑 براوەی مەجلیس:</span>
                ${isHostRole() ? `<button class="mini-icon-btn" onclick="regenerateComedyNow()" title="گۆڕینی قسە">🔄</button>` : ''}
              </div>
              <div>"${state.comedyResult.winnerJoke || 'بژی پاڵەوان!'}"</div>
            </div>
            <div class="comedy-card loser-box">
              <div class="comedy-head"><span>☕ بۆ دۆڕاوەکان:</span></div>
              <div>"${state.comedyResult.loserJoke || 'جاری داهاتوو هەوڵ بدەنەوە!'}"</div>
            </div>
            <div class="comedy-card task-box">
              <div class="comedy-head">
                <span>🎯 سزای تیروپشک:</span>
                ${isHostRole() ? `<button class="mini-icon-btn" onclick="spinVibePenaltyTask()" title="سزایەکی تر">🎲 گۆڕین</button>` : ''}
              </div>
              <div>${state.taskResult}</div>
            </div>
          </div>
          <div style="text-align:right;margin:12px 0;">
            <h3 style="font-size:0.9rem;margin-bottom:6px;">📋 ڕیزبەندی و نازناوەکان:</h3>
            ${ranksHtml}
          </div>
          ${isHostRole() ? `<button class="btn btn-emerald" style="margin-bottom:0;" onclick="hostStartCompetition()">🔄 خولێکی نوێ لەگەڵ هاوڕێیان</button>` : ''}
        </div>
      `;
    }

    function drawQRCode() {
      const box = document.getElementById('qrcode');
      if (!box) return;
      box.innerHTML = '';
      new QRCode(box, { text: `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`, width: 175, height: 175, colorDark: "#0f172a", colorLight: "#ffffff" });
    }

    function copyInvite(url) {
      navigator.clipboard.writeText(url);
      showToast('📋 لینکی مەجلیس کۆپی کرا!');
    }

    function shareInviteWA(url) {
      const msg = `🎲 وەرنە ناو پێشبڕکێی مەجلیس! کۆدی ژوور: (${state.roomCode})\nکلیک لەم لینکە بکەن:\n${url}`;
      if (navigator.share) navigator.share({ title: 'مەجلیس', text: msg, url }).catch(() => {});
      else window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function kickPlayer(playerId) {
      state.players = state.players.filter(p => p.id !== playerId);
      syncAllPlayers(); render();
    }

    function connectMqttBroker(onConnected) {
      try { state.mqttClient?.end(true); } catch (e) {}
      const brokers = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
      let bIdx = 0, connected = false;

      function tryConnect() {
        const client = mqtt.connect(brokers[bIdx % brokers.length], {
          clientId: 'majlis_' + state.myId + '_' + Math.random().toString(16).slice(2, 6),
          clean: true, connectTimeout: 4500, reconnectPeriod: 2000
        });
        state.mqttClient = client;

        const failTimer = setTimeout(() => {
          if (!connected) {
            try { client.end(true); } catch (e) {}
            if (++bIdx < brokers.length) tryConnect();
            else if (isHostRole()) onConnected(client);
          }
        }, 4600);

        client.on('connect', () => {
          if (!connected) { connected = true; clearTimeout(failTimer); onConnected(client); }
        });
      }
      tryConnect();
    }

    function startRoom() {
      const isProj = state.isProjector;
      const name = (state.myName || '').trim();
      if (!isProj && !name) return showToast('⚠️ تکایە سەرەتا ناوی خۆت بنووسە!');
      if (!isProj) localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();

      Object.assign(state, {
        role: isProj ? 'projector_host' : 'host',
        connecting: false,
        roomCode: String(Math.floor(1000 + Math.random() * 9000)),
        players: isProj ? [] : [{ id: state.myId, name: state.myName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 }],
        screen: 'lobby'
      });
      render();

      const actionTopic = `majlis_ku_v17/room/${state.roomCode}/action`;
      connectMqttBroker(client => {
        client.subscribe(actionTopic, { qos: 1 }, syncAllPlayers);
        client.on('message', (t, msg) => {
          if (t === actionTopic) try { onHostReceiveData(JSON.parse(msg.toString())); } catch (e) {}
        });
      });
    }

    function joinHostRoom() {
      const name = (state.myName || '').trim(), code = normalizeDigits(state.roomCode);
      state.roomCode = code;
      if (!name || !code) return showToast('⚠️ تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();
      Object.assign(state, { role: 'player', isProjector: false, connecting: true });
      render();

      const stateTopic = `majlis_ku_v17/room/${code}/state`, actionTopic = `majlis_ku_v17/room/${code}/action`;
      connectMqttBroker(client => {
        let received = false;
        const joinTimeout = setTimeout(() => {
          if (!received && state.connecting) {
            state.connecting = false;
            showToast('⚠️ ئەم کۆدی ژوورە نەدۆزرایەوە! دڵنیابە لە کۆدەکە.');
            render();
          }
        }, 7500);

        const pubJoin = () => client.publish(actionTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name: state.myName }), { qos: 1 });
        client.subscribe(stateTopic, { qos: 1 }, pubJoin);
        client.on('message', (t, msg) => {
          if (t === stateTopic) try {
            const data = JSON.parse(msg.toString());
            received = true; clearTimeout(joinTimeout); state.connecting = false;
            onPlayerReceiveData(data);
            if (data.players && !data.players.some(p => p.id === state.myId)) pubJoin();
          } catch (e) {}
        });
      });
    }

    function onHostReceiveData(data) {
      if (data.type === 'JOIN') {
        const existing = state.players.find(p => p.id === data.id);
        if (existing) existing.name = data.name;
        else {
          const cleanName = state.players.some(p => p.name === data.name && p.id !== data.id) ? `${data.name} (${state.players.length + 1})` : data.name;
          state.players.push({ id: data.id, name: cleanName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 });
        }
        syncAllPlayers(); render();
      } else if (data.type === 'ANSWER') {
        const p = state.players.find(x => x.id === data.id);
        if (p && !state.revealAnswer) Object.assign(p, { currentAnswer: data.ansIdx, hasAnswered: true, answerTime: state.timeLeft });
      }
    }

    function onPlayerReceiveData(data) {
      if (data.type === 'PRE_TICK') { state.countdownVal = data.countdownVal; return setText('preGameCountNum', state.countdownVal); }
      if (data.type === 'TIMER_TICK') { state.timeLeft = data.timeLeft; return updateTimerUI(); }
      if (data.type === 'REVEAL_TICK') { state.revealCountdown = data.revealCountdown; return updateRevealUI(); }
      if (data.type !== 'SYNC') return;

      const { revealAnswer: prevReveal, qIndex: prevQIndex } = state;
      Object.assign(state, {
        screen: data.screen, countdownVal: data.countdownVal, qIndex: data.qIndex,
        timeLeft: data.timeLeft, questionDuration: data.questionDuration,
        revealAnswer: data.revealAnswer, revealCountdown: data.revealCountdown || 4,
        taskResult: data.taskResult || '', difficulty: data.difficulty || 'مامناوەند',
        vibeId: data.vibeId || 'camping'
      });
      if (data.comedyResult) state.comedyResult = data.comedyResult;

      const myOld = state.players.find(p => p.id === state.myId);
      const keepMyChoice = !data.revealAnswer && prevQIndex === data.qIndex && myOld;
      state.players = data.players.map(p => (p.id === state.myId && keepMyChoice) ? { ...p, currentAnswer: myOld.currentAnswer, hasAnswered: myOld.hasAnswered } : p);

      if (!state.players.some(p => p.id === state.myId)) {
        state.players.push({ id: state.myId, name: state.myName, score: 0, lastGain: 0, streak: 0, hasAnswered: keepMyChoice ? myOld.hasAnswered : false, currentAnswer: keepMyChoice ? myOld.currentAnswer : null });
      }
      if (data.currentQuestion) {
        state.questions = new Array(data.totalQuestions).fill(null);
        state.questions[state.qIndex] = data.currentQuestion;
      }
      if (!prevReveal && state.revealAnswer && state.screen === 'playing') {
        const me = state.players.find(p => p.id === state.myId), qObj = state.questions[state.qIndex];
        playTone(me && qObj && me.currentAnswer === qObj.ans ? 'correct' : 'wrong');
      }
      render();
    }

    function broadcastPayload(payload, retain = false) {
      if (isHostRole() && state.mqttClient && state.roomCode) {
        try { state.mqttClient.publish(`majlis_ku_v17/room/${state.roomCode}/state`, JSON.stringify(payload), { qos: 0, retain }); } catch (e) {}
      }
    }

    function syncAllPlayers() {
      if (!isHostRole()) return;
      const qObj = state.questions[state.qIndex];
      broadcastPayload({
        type: 'SYNC', screen: state.screen, countdownVal: state.countdownVal,
        vibeId: state.vibeId, difficulty: state.difficulty,
        players: state.players.map(p => ({ id: p.id, name: p.name, score: p.score, lastGain: state.revealAnswer ? p.lastGain : 0, streak: p.streak, hasAnswered: false, currentAnswer: state.revealAnswer ? p.currentAnswer : null })),
        currentQuestion: qObj ? { q: qObj.q, opts: qObj.opts, ans: state.revealAnswer ? qObj.ans : null } : null,
        totalQuestions: state.questions.length, qIndex: state.qIndex, timeLeft: state.timeLeft,
        questionDuration: state.questionDuration, revealAnswer: state.revealAnswer,
        revealCountdown: state.revealCountdown, comedyResult: state.comedyResult, taskResult: state.taskResult
      }, true);
    }

    function hostStartCompetition() {
      requestScreenWakeLock();
      Object.assign(state, { taskResult: '', questions: getLocalQuestions(state.selectedTopics, state.questionLimit, state.difficulty), qIndex: 0 });
      state.players.forEach(p => Object.assign(p, { score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null }));
      runPreGameCountdown();
    }

    function runPreGameCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { screen: 'countdown', countdownVal: 5 });
      syncAllPlayers(); render(); playTone('tick');
      state.timerInterval = setInterval(() => {
        if (--state.countdownVal <= 0) {
          clearInterval(state.timerInterval); state.screen = 'playing'; beginQuestionCountdown();
        } else {
          playTone('tick'); setText('preGameCountNum', state.countdownVal);
          broadcastPayload({ type: 'PRE_TICK', countdownVal: state.countdownVal }, false);
        }
      }, 1000);
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { timeLeft: state.questionDuration, revealAnswer: false });
      state.players.forEach(p => Object.assign(p, { hasAnswered: false, currentAnswer: null, answerTime: 0, lastGain: 0 }));
      syncAllPlayers(); render();
      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');
        if (state.timeLeft <= 0) revealQuestionResult();
        else {
          updateTimerUI();
          if (isHostRole()) broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft }, false);
        }
      }, 1000);
    }

    function submitPlayerAnswer(optIdx) {
      if (state.role === 'projector_host') return;
      const me = state.players.find(p => p.id === state.myId);
      if (!me || state.revealAnswer) return;
      Object.assign(me, { currentAnswer: optIdx, hasAnswered: true, answerTime: state.timeLeft });
      render();
      if (state.role === 'player' && state.mqttClient && state.roomCode) {
        state.mqttClient.publish(`majlis_ku_v17/room/${state.roomCode}/action`, JSON.stringify({ type: 'ANSWER', id: state.myId, ansIdx: optIdx }), { qos: 1 });
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { revealAnswer: true, revealCountdown: 4 });
      const qObj = state.questions[state.qIndex];

      state.players.forEach(p => {
        if (p.currentAnswer === qObj.ans) {
          p.streak = (p.streak || 0) + 1;
          p.lastGain = 100 + Math.round((p.answerTime / state.questionDuration) * 60) + (p.streak >= 2 ? 25 : 0);
          p.score += p.lastGain;
        } else { p.streak = 0; p.lastGain = 0; }
      });

      const me = state.players.find(p => p.id === state.myId);
      if (me) playTone(me.currentAnswer === qObj.ans ? 'correct' : 'wrong');
      else if (state.role === 'projector_host') playTone('correct');
      syncAllPlayers(); render();

      if (isHostRole()) {
        state.revealInterval = setInterval(() => {
          if (--state.revealCountdown <= 0) { clearInterval(state.revealInterval); advanceToNextQuestion(); }
          else { updateRevealUI(); broadcastPayload({ type: 'REVEAL_TICK', revealCountdown: state.revealCountdown }, false); }
        }, 1000);
      }
    }

    function advanceToNextQuestion() {
      clearInterval(state.revealInterval);
      if (state.qIndex + 1 < state.questions.length) { state.qIndex++; beginQuestionCountdown(); }
      else {
        Object.assign(state, { comedyResult: getLocalComedyCommentary(), taskResult: generateTaskString(), screen: 'finished' });
        syncAllPlayers(); render();
      }
    }

    function regenerateComedyNow() {
      state.comedyResult = getLocalComedyCommentary();
      syncAllPlayers(); render();
    }

    function openCustomQModal() {
      toggleModal('settingsModal', false);
      setText('customQStatus', `کۆی پرسیارە تایبەتەکانت: ${customQuestions.length} پرسیار`);
      toggleModal('customQModal', true);
    }

    function saveCustomQuestion() {
      const ids = ['cqText', 'cqOpt0', 'cqOpt1', 'cqOpt2', 'cqOpt3'];
      const [q, o0, o1, o2, o3] = ids.map(id => document.getElementById(id).value.trim());
      if (!q || !o0 || !o1 || !o2 || !o3) return showToast('⚠️ تکایە پرسیارەکە و هەر ٤ هەڵبژاردەکە پڕ بکەرەوە!');

      const opts = [o0, o1, o2, o3].sort(() => Math.random() - 0.5);
      customQuestions.push({ q, opts, ans: opts.indexOf(o0), diff: state.difficulty });
      localStorage.setItem(KEYS.CUSTOM, JSON.stringify(customQuestions));
      ids.forEach(id => document.getElementById(id).value = '');
      setText('customQStatus', `✅ زیادکرا! کۆی پرسیارە تایبەتەکانت: ${customQuestions.length}`);
      if (!state.selectedTopics.includes('پرسیارەکانی خۆم (تایبەت)')) state.selectedTopics.push('پرسیارەکانی خۆم (تایبەت)');
    }

    render();
  </script>
</body>
</html>
