<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #18100a;
      --bg-surface: rgba(38, 25, 16, 0.95);
      --bg-card: rgba(58, 39, 25, 0.85);
      --bg-elevated: #4a3220;
      --border: rgba(212, 168, 125, 0.22);
      --text: #fdfaf6;
      --muted: #c7ad94;
      --primary: #c88a4b;
      --primary-dark: #9e652b;
      --primary-glow: rgba(200, 138, 75, 0.35);
      --accent: #e6b88a;
      --emerald: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius: 20px;
    }

    /* دۆخی تایبەتی شەوی دەوری ئاگر و دارستان (Camping Vibe) */
    body.camping-vibe:not(.light-mode) {
      --bg-main: #0c140e;
      --bg-surface: rgba(20, 33, 24, 0.95);
      --bg-card: rgba(30, 49, 36, 0.88);
      --bg-elevated: #284230;
      --border: rgba(234, 88, 12, 0.28);
      --text: #fef3c7;
      --muted: #a7f3d0;
      --primary: #ea580c;
      --primary-dark: #c2410c;
      --primary-glow: rgba(234, 88, 12, 0.42);
      --accent: #fb923c;
    }

    body.light-mode {
      --bg-main: #f6f0e8;
      --bg-surface: rgba(255, 255, 255, 0.96);
      --bg-card: #ede3d5;
      --bg-elevated: #e2d4c1;
      --border: rgba(110, 71, 35, 0.16);
      --text: #291a0d;
      --muted: #785a3f;
      --primary: #8c5523;
      --primary-dark: #663b14;
      --primary-glow: rgba(140, 85, 35, 0.25);
      --accent: #b07238;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main) radial-gradient(at 15% 10%, var(--primary-glow) 0px, transparent 50%) fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.35s, color 0.35s;
    }

    body.camping-vibe:not(.light-mode) {
      background-image: 
        radial-gradient(at 50% 95%, rgba(234, 88, 12, 0.28) 0px, transparent 55%),
        radial-gradient(at 15% 15%, rgba(16, 185, 129, 0.12) 0px, transparent 45%);
    }

    #splashScreen {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      animation: autoHideSplash 0.45s ease 1.8s forwards;
    }
    @keyframes autoHideSplash {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    .splash-logo {
      width: 86px;
      height: 86px;
      border-radius: 26px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      box-shadow: 0 14px 34px var(--primary-glow);
      animation: pulseSplash 0.9s infinite alternate;
    }
    @keyframes pulseSplash {
      from { transform: scale(0.94); }
      to { transform: scale(1.06); }
    }
    .splash-title {
      font-weight: 900;
      font-size: 2.3rem;
      color: var(--text);
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px var(--primary-glow);
      color: #fff;
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.28rem;
    }
    .icon-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .icon-pill:active { transform: scale(0.96); }

    main {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 12px 60px;
      flex: 1;
    }
    .card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
      margin-bottom: 14px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 4px;
      text-align: center;
    }
    p.sub {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .welcome-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
      background: var(--bg-card);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .w-tab {
      padding: 10px 8px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .w-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 700;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }
    .input::placeholder { color: var(--muted); opacity: 0.8; }
    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s, box-shadow 0.2s;
      margin-bottom: 10px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
    }
    .btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.22);
    }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: 1px solid var(--accent);
      color: #fff;
      box-shadow: 0 4px 0 #593310, 0 8px 20px var(--primary-glow);
    }
    .btn-emerald {
      background: linear-gradient(135deg, #059669, #10b981);
      border: none;
      color: #fff;
      box-shadow: 0 4px 0 #065f46;
    }
    .btn-campfire {
      background: linear-gradient(135deg, #ea580c, #b91c1c);
      border: 1px solid #fdba74;
      color: #fff;
      box-shadow: 0 4px 0 #7f1d1d, 0 8px 20px rgba(234, 88, 12, 0.35);
    }

    .section-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.74rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .vibe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .vibe-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      transition: 0.18s;
    }
    .vibe-card .v-ico { font-size: 1.2rem; display: block; margin-bottom: 2px; }
    .vibe-card strong { font-size: 0.76rem; display: block; }
    .vibe-card small { font-size: 0.64rem; color: var(--muted); display: block; margin-top: 2px; }
    .vibe-card.active {
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      border-color: #fff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .vibe-card.active strong, .vibe-card.active small { color: #fff; }

    .topic-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .topic-chip {
      padding: 7px 12px;
      border-radius: 50px;
      border: 1.5px solid var(--border);
      background: var(--bg-surface);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }
    .topic-chip.active {
      background: var(--primary);
      border-color: #fff;
      color: #fff;
      box-shadow: 0 3px 10px var(--primary-glow);
    }

    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .setting-row-inline {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .setting-row-inline label {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--muted);
    }
    .seg-group { display: flex; gap: 5px; }
    .seg-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--accent);
    }

    .qr-wrap {
      background: #fff;
      padding: 12px;
      border-radius: 18px;
      width: fit-content;
      margin: 8px auto 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.3);
      border: 3px solid var(--primary);
    }
    .pin-boxes {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 6px 0 14px;
      direction: ltr;
    }
    .pin-digit {
      width: 48px;
      height: 54px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 2px solid var(--primary);
      font-size: 1.55rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 10px 0;
    }
    .p-badge {
      background: var(--bg-card);
      border: 1.5px solid var(--primary);
      padding: 6px 13px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.84rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .kick-btn {
      background: rgba(239, 68, 68, 0.22);
      border: none;
      color: var(--danger);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .quiz-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.84rem;
    }
    .source-tag {
      font-size: 0.74rem;
      padding: 3px 10px;
      border-radius: 50px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--accent);
    }
    .timer-track {
      height: 10px;
      background: var(--bg-card);
      border-radius: 50px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald), var(--primary), var(--danger));
      transition: width 0.95s linear;
    }

    .q-banner {
      font-size: 1.12rem;
      font-weight: 900;
      text-align: center;
      padding: 18px 14px;
      background: var(--bg-card);
      border-radius: 16px;
      border: 1.5px solid var(--border);
      margin-bottom: 14px;
      line-height: 1.65;
    }
    .opts-list { display: grid; gap: 10px; }
    .opt-card {
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    }
    .opt-right {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
    }
    .opt-num {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .opt-card.selected {
      border-color: var(--primary);
      background: var(--bg-elevated);
    }
    .opt-card.selected .opt-num {
      background: var(--primary);
      color: #fff;
      border-color: #fff;
    }
    .opt-card.correct {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.28);
    }
    .opt-card.correct .opt-num {
      background: var(--emerald);
      color: #fff;
    }
    .opt-card.wrong {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.25);
    }
    .opt-card.wrong .opt-num {
      background: var(--danger);
      color: #fff;
    }

    .gain-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.22);
      color: var(--emerald);
      border: 1px solid var(--emerald);
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.74rem;
      margin-right: 6px;
    }
    .next-auto-banner {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--primary);
      text-align: center;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      gap: 8px;
      flex-wrap: wrap;
    }
    .leader-row.first {
      background: linear-gradient(90deg, rgba(200, 138, 75, 0.28), var(--bg-card));
      border-color: var(--primary);
    }
    .camp-rank-tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 50px;
      background: rgba(234, 88, 12, 0.2);
      border: 1px solid var(--primary);
      color: var(--accent);
      margin-right: 6px;
    }

    .comedy-grid {
      display: grid;
      gap: 12px;
      margin: 16px 0;
      text-align: right;
    }
    .comedy-card {
      padding: 15px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 0.92rem;
      font-weight: 700;
    }
    .comedy-card.winner-box {
      background: rgba(16, 185, 129, 0.14);
      border: 1.5px solid var(--emerald);
    }
    .comedy-card.loser-box {
      background: rgba(200, 138, 75, 0.15);
      border: 1.5px solid var(--primary);
    }
    .comedy-card.camp-task-box {
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.22), rgba(20, 83, 45, 0.25));
      border: 2px dashed var(--accent);
      text-align: center;
      animation: popIn 0.35s ease;
    }
    .comedy-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 0.96rem;
      margin-bottom: 5px;
    }

    .countdown-overlay { text-align: center; padding: 46px 20px; }
    .countdown-num {
      font-size: 4.8rem;
      font-weight: 900;
      color: var(--primary);
      animation: popIn 0.4s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .confetti-piece {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      z-index: 280;
      pointer-events: none;
      animation: fallDown 3.2s linear forwards;
    }
    @keyframes fallDown {
      to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    .toast-msg {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      border: 1.5px solid var(--primary);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 800;
      z-index: 400;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      animation: popIn 0.25s ease;
      text-align: center;
      max-width: 90vw;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 400px) { .vibe-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <div id="splashScreen" onclick="this.remove()">
    <div class="splash-logo">☕</div>
    <div class="splash-title">مەجلیس</div>
  </div>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="brand-icon" id="headerBrandIcon">☕</div>
      <div class="brand-title">مەجلیس</div>
    </div>
    <button class="icon-pill" onclick="toggleModal('settingsModal', true)">⚙️ دەستکاری</button>
  </header>

  <main id="appContainer"></main>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <h3 style="margin-bottom:14px; text-align:center;">⚙️ دەستکاری و ڕێکخستن</h3>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn" onclick="toggleThemeMode()">🌓 گۆڕینی دۆخی تاریک / ڕووناک</button>
        <button class="btn" onclick="toggleSound()" id="soundBtnLabel">🔊 دەنگی یاری: چالاکە</button>
        <button class="btn" onclick="openCustomQModal()">✍️ زیادکردنی پرسیاری تایبەت</button>
        <button class="btn" onclick="clearAskedHistory(); toggleModal('settingsModal', false);">🔄 سفرکردنەوەی مێژووی پرسیارەکان</button>
      </div>
      <button class="btn btn-primary" style="margin-top:12px; margin-bottom:0;" onclick="toggleModal('settingsModal', false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="customQModal">
    <div class="modal-box">
      <h3 style="margin-bottom:8px;">✍️ زیادکردنی پرسیاری تایبەتی خۆت</h3>
      <p style="font-size:0.78rem; color:var(--muted); margin-bottom:10px;">

    function playTone(type) {
      if (!state.soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        const campMode = isCampingActive();

        if (type === 'correct') {
          osc.type = campMode ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(campMode ? 440 : 523.25, now);
          osc.frequency.setValueAtTime(campMode ? 554.37 : 659.25, now + 0.1);
          osc.frequency.setValueAtTime(campMode ? 659.25 : 783.99, now + 0.2);
          gain.gain.setValueAtTime(0.15, now);
          osc.start();
          osc.stop(now + 0.36);
        } else if (type === 'wrong') {
          osc.type = campMode ? 'sine' : 'sawtooth';
          osc.frequency.setValueAtTime(campMode ? 160 : 200, now);
          osc.frequency.setValueAtTime(campMode ? 115 : 150, now + 0.15);
          gain.gain.setValueAtTime(0.14, now);
          osc.start();
          osc.stop(now + 0.3);
        } else {
          // دەنگی نەرمی تەختەیی و سروشتی لە مۆدی کامپینگدا
          osc.type = campMode ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(campMode ? 520 : 800, now);
          gain.gain.setValueAtTime(campMode ? 0.06 : 0.04, now);
          osc.start();
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    }

    function getLocalQuestions(topicsList, count) {
      let combinedBank = [];
      topicsList.forEach(t => {
        if (t === 'پرسیارەکانی خۆم (تایبەت)') combinedBank.push(...customQuestions);
        else if (QUESTION_BANK[t]) combinedBank.push(...QUESTION_BANK[t]);
      });

      if (combinedBank.length === 0) {
        Object.values(QUESTION_BANK).forEach(arr => combinedBank.push(...arr));
      }

      let unseenSpecific = combinedBank.filter(item => !seenQuestions.includes(item.q));
      if (unseenSpecific.length < count) {
        const topicQTexts = combinedBank.map(x => x.q);
        seenQuestions = seenQuestions.filter(q => !topicQTexts.includes(q));
        try { localStorage.setItem(KEYS.SEEN, JSON.stringify(seenQuestions)); } catch (e) {}
        unseenSpecific = [...combinedBank];
      }

      return unseenSpecific.sort(() => Math.random() - 0.5).slice(0, count).map(item => {
        const correctText = item.opts[item.ans];
        const shuffledOpts = [...item.opts].sort(() => Math.random() - 0.5);
        markQuestionSeen(item.q);
        return {
          q: item.q,
          opts: shuffledOpts,
          ans: shuffledOpts.indexOf(correctText)
        };
      });
    }

      const loseTemplate = losePool[Math.floor(Math.random() * losePool.length)];

      return {
        winnerJoke: winTemplate.replace('{winner}', winner.name),
        loserJoke: isSolo
          ? `چونکە بە تەنها یاریت کرد (${winner.name})، هەم براوەیت و هەم دۆڕاو! دەبێت خۆت چایەک بۆ خۆت تێبکەیت و دەستخۆشی لە خۆت بکەیت!`
          : loseTemplate.replace('{losers}', loserNames)
      };
    }

    function spinCampingPenaltyTask() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const losers = sorted.length > 1 ? sorted.slice(1) : sorted;
      const targetPlayer = losers[Math.floor(Math.random() * losers.length)];
      const randomTask = CAMPING_PENALTY_TASKS[Math.floor(Math.random() * CAMPING_PENALTY_TASKS.length)];
      state.campTaskResult = `🎯 ئەرکی سەیران بۆ (${targetPlayer ? targetPlayer.name : 'دۆڕاو'}): ${randomTask}`;
      playTone('correct');
      syncAllPlayers();
      render();
    }

    function resetToHome() {
      clearInterval(state.timerInterval);
      clearInterval(state.revealInterval);
      if (state.mqttClient) {
        try { state.mqttClient.end(true); } catch (e) {}
        state.mqttClient = null;
      }
      window.history.replaceState({}, document.title, window.location.pathname);
      state.screen = 'welcome';
      state.role = null;
      state.connecting = false;
      render();
    }

    function updateTimerUIOnly() {
      const timeLabel = document.getElementById('liveTimeLabel');
      const timeFill = document.getElementById('liveTimeFill');
      if (timeLabel) timeLabel.textContent = `⏱️ ${state.timeLeft} چرکە`;
      if (timeFill) {
        const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);
        timeFill.style.width = `${pct}%`;
      }
    }

    function updateRevealCountdownUIOnly() {
      const el = document.getElementById('autoNextBanner');
      if (el) {
        el.textContent = state.qIndex + 1 < state.questions.length
          ? `⏳ پرسیاری دواتر دوای ${state.revealCountdown} چرکەی تر دەست پێ دەکات...`
          : `🏆 ئەنجامی کۆتایی دوای ${state.revealCountdown} چرکەی تر پیشان دەدرێت...`;
      }
    }

    function render() {
      applyCampingAtmosphere();
      const box = document.getElementById('appContainer');
      if (state.screen === 'welcome') box.innerHTML = renderWelcomeScreen();
      else if (state.screen === 'lobby') box.innerHTML = renderLobbyScreen();
      else if (state.screen === 'countdown') box.innerHTML = renderCountdownScreen();
      else if (state.screen === 'playing') box.innerHTML = renderPlayingScreen();
      else if (state.screen === 'finished') box.innerHTML = renderFinishedScreen();

      if (state.screen === 'lobby' && state.role === 'host') {
        setTimeout(drawQRCode, 50);
      }
    }

    function renderWelcomeScreen() {
      const tabsHtml = `
        <div class="welcome-tabs">
          <button class="w-tab ${state.welcomeTab === 'host' ? 'active' : ''}" onclick="state.welcomeTab='host'; render();">👑 دروستکردنی مەجلیس</button>
          <button class="w-tab ${state.welcomeTab === 'join' ? 'active' : ''}" onclick="state.welcomeTab='join'; render();">📲 چوونە ژوورەوە</button>
        </div>
      `;

      const vibesCardsHtml = QUESTION_VIBES.map(v => `
        <div class="vibe-card ${state.selectedVibeIds.includes(v.id) ? 'active' : ''}"
             onclick="toggleMultiSelect(state.selectedVibeIds, '${v.id}')">
          <span class="v-ico">${v.icon}</span>
          <strong>${v.title}</strong>
          <small>${v.desc}</small>
        </div>
      `).join('');

      const topicChipsHtml = PRESET_TOPICS.map(t => `
        <button class="topic-chip ${state.selectedTopics.includes(t) ? 'active' : ''}"
                onclick="handleTopicChipClick('${t}')">
          ${t === 'پرسیارەکانی خۆم (تایبەت)' ? `✍️ پرسیارەکانی خۆم (${customQuestions.length})` : t}
        </button>
      `).join('');

      const settingsHtml = `
        <div class="settings-stack">
          <div class="setting-row-inline">
            <label>ژمارەی پرسیار:</label>
            <div class="seg-group">
              ${[6, 8, 10, 14].map(n => `<button class="seg-btn ${state.questionLimit === n ? 'active' : ''}" onclick="state.questionLimit=${n}; render();">${n}</button>`).join('')}
            </div>
          </div>
          <div class="setting-row-inline">
            <label>کاتی وەڵام:</label>
            <div class="seg-group">
              ${[12, 15, 25].map(s => `<button class="seg-btn ${state.questionDuration === s ? 'active' : ''}" onclick="state.questionDuration=${s}; render();">${s} چرکە</button>`).join('')}
            </div>
          </div>
        </div>
      `;

      if (state.welcomeTab === 'host') {
        return `
          <div class="card">
            ${tabsHtml}
            <h2>${isCampingActive() ? '🏕️ مەجلیسی گەشت و دەوری ئاگر' : '👑 دروستکردنی مەجلیس لەگەڵ هاوڕێیان'}</h2>
            <p class="sub">کەشی دانیشتنەکە و بابەتەکان دیاری بکە، بارکۆدەکە پیشان بدە و با پێشبڕکێ دەست پێ بکات!</p>
            <input type="text" id="nameInp" class="input" placeholder="ناوی خۆت بنووسە..." value="${state.myName}" oninput="state.myName=this.value; localStorage.setItem(KEYS.NAME, this.value);" />
            
            <div class="section-box">
              <div style="text-align:center;">
                <span class="section-tag">🎭 ١. شێوازی دانیشتنەکە هەڵبژێرە</span>
              </div>
              <div class="vibe-grid">${vibesCardsHtml}</div>
            </div>

            <div class="section-box">
              <div style="text-align:center;">
                <span class="section-tag">📚 ٢. بابەتی پرسیارەکان دیاری بکە</span>
              </div>
              <div class="topic-chips">${topicChipsHtml}</div>
            </div>

            ${settingsHtml}

            <button class="btn btn-primary" ${state.connecting ? 'disabled' : ''} onclick="startHostRoom()">
              ${state.connecting ? '<span class="spinner"></span> خەریکی دروستکردنی ژوورە...' : '🚀 دروستکردنی مەجلیس و بارکۆد'}
            </button>
          </div>
        `;
      } else {
        return `
          <div class="card">
            ${tabsHtml}
            <h2>📲 پەیوەستبوون بە مەجلیسی هاوڕێکەت</h2>
            <p class="sub">ناوی خۆت و کۆدی ژوورەکە بنووسە:</p>
            <input type="text" id="nameInp" class="input" placeholder="ناوی خۆت بنووسە..." value="${state.myName}" oninput="state.myName=this.value; localStorage.setItem(KEYS.NAME, this.value);" />
            <input type="text" id="codeInp" class="input" inputmode="numeric" placeholder="کۆدی ٤ ژمارەیی ژوور (بۆ نموونە: 6549)" value="${state.roomCode}" oninput="state.roomCode=normalizeDigits(this.value);" style="letter-spacing:3px; direction:ltr;" />
            <button class="btn btn-emerald" ${state.connecting ? 'disabled' : ''} onclick="joinHostRoom()">
              ${state.connecting ? '<span class="spinner"></span> خەریکی پەیوەستبوونە...' : '🔗 چوونە ناو یارییەکە'}
            </button>
          </div>
        `;
      }

    function renderLobbyScreen() {
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      const activeTopic = getActiveTopicsSummary();
      const pinDigitsHtml = String(state.roomCode).split('').map(d => `<div class="pin-digit">${d}</div>`).join('');

      const playersChips = state.players.map(p => `
        <div class="p-badge">
          <span>👤 ${p.name}</span>
          ${state.role === 'host' && p.id !== state.myId ? `<button class="kick-btn" onclick="kickPlayer('${p.id}')" title="لادانی یاریزان">✕</button>` : ''}
        </div>
      `).join('');

      if (state.role === 'host') {
        return `
          <div class="card" style="text-align:center;">
            <h2>📱 بارکۆدی هاتنەژوورەوەی هاوڕێیان</h2>
            <p class="sub">بابەت: <strong style="color:var(--primary);">${activeTopic}</strong></p>
            
            <div class="qr-wrap" id="qrcode"></div>

            <div style="font-size:0.8rem; color:var(--muted); margin-bottom:4px;">کۆدی ژوور:</div>
            <div class="pin-boxes">${pinDigitsHtml}</div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
              <button class="btn" onclick="copyInvite('${joinUrl}')">📋 کۆپیکردنی لینک</button>
              <button class="btn btn-emerald" onclick="shareInviteWA('${joinUrl}')">📤 بانگهێشتکردنی هاوڕێیان</button>

            <h3>👥 ئامادەبووانی ناو مەجلیس (${state.players.length} کەس):</h3>
            <div class="players-wrap">${playersChips}</div>

            <button class="btn btn-primary" style="margin-top:16px; font-size:1.02rem;" onclick="hostStartCompetition()">
              ▶️ دەستپێکردنی یاری
            </button>
          </div>
        `;
      } else {
        return `
          <div class="card" style="text-align:center;">
            <h2>✅ تۆ لە ناو مەجلیسەکەدایت!</h2>
            <p class="sub">چاوەڕێ بکە تا سەرپەرشتیاری ژوورەکە پێشبڕکێکە دەست پێ دەکات...</p>
            <div class="pin-boxes">${pinDigitsHtml}</div>
            <h3>👥 هاوڕێیانی ئامادەبوو (${state.players.length}):</h3>
            <div class="players-wrap">${playersChips}</div>
          </div>
        `;
      }
    }

    function renderCountdownScreen() {
      const activeTopic = getActiveTopicsSummary();
      return `
        <div class="card countdown-overlay">
          <h2>${isCampingActive() ? '🔥 لە دەوری ئاگرەکە ئامادەبن!' : '🚀 ئامادەبن! پێشبڕکێ دەست پێ دەکات'}</h2>
          <p class="sub">بابەت: <strong style="color:var(--primary);">${activeTopic}</strong></p>
          <div class="countdown-num">${state.countdownVal}</div>
        </div>
      `;
    }

    function renderPlayingScreen() {
      const qObj = state.questions[state.qIndex] || { q: '...', opts: ['', '', '', ''], ans: null };
      const me = state.players.find(p => p.id === state.myId);
      const myAns = me ? me.currentAnswer : null;
      const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);

      const optsHtml = qObj.opts.map((opt, idx) => {
        let cls = 'opt-card';
        if (state.revealAnswer) {
          if (idx === qObj.ans) cls += ' correct';
          else if (myAns === idx) cls += ' wrong';
        } else if (myAns === idx) {
          cls += ' selected';
        }

        return `
          <button class="${cls}" ${state.revealAnswer ? 'disabled' : ''} onclick="submitPlayerAnswer(${idx})">
            <div class="opt-right">
              <span class="opt-num">${idx + 1}</span>
              <span>${opt}</span>
            </div>
            <span>${state.revealAnswer && idx === qObj.ans ? '✅' : (state.revealAnswer && myAns === idx ? '❌' : '')}</span>
          </button>
        `;
      }).join('');

      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const leaderboardHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">
          <span>
            ${i === 0 ? '👑' : `${i + 1}.`} ${p.name}
            ${p.streak >= 2 ? `<small style="color:var(--amber);">🔥x${p.streak}</small>` : ''}
            ${state.revealAnswer && p.lastGain > 0 ? `<span class="gain-badge">+${p.lastGain}</span>` : ''}
          </span>
          <span style="color:var(--amber);">${p.score} خاڵ</span>
        </div>
      `).join('');

      return `
        <div class="card">
          <div class="quiz-top-meta">
            <span>پرسیاری ${state.qIndex + 1} لە ${state.questions.length}</span>
            <span class="source-tag">${isCampingActive() ? '🏕️ ژووری کامپ:' : 'ژوور:'} ${state.roomCode}</span>
            <span id="liveTimeLabel" style="color:var(--amber);">⏱️ ${state.timeLeft} چرکە</span>
          </div>
          <div class="timer-track">
            <div class="timer-fill" id="liveTimeFill" style="width:${pct}%"></div>
          </div>

          <div class="q-banner">${qObj.q}</div>
          <div class="opts-list">${optsHtml}</div>

          ${state.revealAnswer ? `
            <div class="next-auto-banner" id="autoNextBanner">
              ${state.qIndex + 1 < state.questions.length
                ? `⏳ پرسیاری دواتر دوای ${state.revealCountdown} چرکەی تر دەست پێ دەکات...`
                : `🏆 ئەنجامی کۆتایی دوای ${state.revealCountdown} چرکەی تر پیشان دەدرێت...`}
            </div>
          ` : ''}
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px; font-size:0.95rem;">📊 ڕیزبەندی خاڵەکان:</h3>
          ${leaderboardHtml}
        </div>
      `;
    }

    function renderFinishedScreen() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0];
      const campMode = isCampingActive();

      const ranksHtml = sorted.map((p, i) => {
        const campTitle = getCampingRankTitle(i, sorted.length);
        return `
          <div class="leader-row ${i === 0 ? 'first' : ''}">
            <span>
              ${i === 0 ? '🥇 یەکەم:' : (i === 1 ? '🥈 دووەم:' : (i === 2 ? '🥉 سێیەم:' : `🐢 ${i + 1}.`))} ${p.name}
              ${campTitle ? `<span class="camp-rank-tag">${campTitle}</span>` : ''}
            </span>
            <span style="color:var(--emerald);">${p.score} خاڵ</span>
          </div>
        `;
      }).join('');

      return `
        <div class="card" style="text-align:center;">
          <div style="font-size:3.5rem; margin-bottom:2px;">${campMode ? '🏕️' : '🏆'}</div>
          <h2>${campMode ? `فەرماندەی کامپ: ${winner ? winner.name : ''}!` : `پاڵەوانی مەجلیس: ${winner ? winner.name : ''}!`}</h2>
          <p class="sub">کۆی خاڵی بەدەستهاتوو: <strong>${winner ? winner.score : 0} خاڵ</strong></p>

          <div class="comedy-grid">
            <div class="comedy-card winner-box">
              <div class="comedy-head">${campMode ? '🔥 براوەی دەوری ئاگر:' : '👑 براوەی مەجلیس:'}</div>
              <div>"${state.comedyResult.winnerJoke || 'بژی پاڵەوان!'}"</div>
            </div>
            <div class="comedy-card loser-box">
              <div class="comedy-head">${campMode ? '🫖 بڕیاری کامپ بۆ ئەوانی تر:' : '☕ بڕیاری مەجلیس بۆ دۆڕاوەکان:'}</div>
              <div>"${state.comedyResult.loserJoke || 'جاری داهاتوو هەوڵ بدەنەوە!'}"</div>
            </div>
            ${state.campTaskResult ? `
              <div class="comedy-card camp-task-box">
                <div style="font-weight:900; font-size:0.98rem; color:var(--accent); margin-bottom:4px;">🏕️ تیروپشکی سزای سەیران:</div>
                <div>${state.campTaskResult}</div>
              </div>
            ` : ''}
          </div>

          <div style="text-align:right; margin:16px 0;">
            <h3 style="font-size:0.95rem; margin-bottom:8px;">📋 ڕیزبەندی کۆتایی یاریزانەکان:</h3>
            ${ranksHtml}
          </div>

          ${state.role === 'host' ? `
            ${campMode ? `
              <button class="btn btn-campfire" onclick="spinCampingPenaltyTask()">
                🎯 دیاریکردنی سزای کامپ (تیروپشکی ئەرکی سەیران)
              </button>
            ` : ''}
            <button class="btn" onclick="regenerateComedyNow()">
              🎲 گۆڕینی قسەی مەجلیس (شتێکی تر بڵێ!)
            </button>
            <button class="btn btn-primary" onclick="hostStartCompetition()">
              🔄 خولێکی نوێ لەگەڵ هاوڕێیان
            </button>
          ` : ''}
          <button class="btn" onclick="resetToHome()">🏠 گەڕانەوە بۆ پەڕەی سەرەکی</button>
        </div>
      `;
    }

    function drawQRCode() {
      const box = document.getElementById('qrcode');
      if (!box) return;
      box.innerHTML = '';
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      new QRCode(box, {
        text: joinUrl,
        width: 185,
        height: 185,
        colorDark: isCampingActive() ? "#14532d" : "#291a0d",
        colorLight: "#ffffff"
      });
    }

    function copyInvite(url) {
      navigator.clipboard.writeText(url);
      showToast('📋 لینکی مەجلیس کۆپی کرا!');
    }

    function shareInviteWA(url) {
      const msg = `☕ وەرنە ناو پێشبڕکێی مەجلیس! کۆدی ژوور: (${state.roomCode})\nکلیک لەم لینکە بکەن:\n${url}`;
      if (navigator.share) {
        navigator.share({ title: 'مەجلیس', text: msg, url }).catch(() => {});
      } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
      }
    }

    function kickPlayer(playerId) {
      state.players = state.players.filter(p => p.id !== playerId);
      syncAllPlayers();
      render();
    }

    function connectMqttBroker(onConnected) {
      if (state.mqttClient) {
        try { state.mqttClient.end(true); } catch (e) {}
      }
      const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: 'majlis_' + state.myId + '_' + Math.random().toString(16).slice(2, 6),
        clean: true,
        connectTimeout: 7000,
        reconnectPeriod: 1500
      });
      state.mqttClient = client;

      client.on('connect', () => {
        onConnected(client);
      });

      client.on('error', () => {
        if (state.connecting) {
          state.connecting = false;
          showToast('⚠️ کێشە لە پەیوەندیی ئینتەرنێتدا هەیە.');
          render();
        }
      });
    }

    function startHostRoom() {
      const name = (state.myName || '').trim();
      if (!name) return showToast('⚠️ تکایە سەرەتا ناوی خۆت بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();
      state.role = 'host';
      state.connecting = true;
      render();

      state.roomCode = String(Math.floor(1000 + Math.random() * 9000));
      const actionTopic = `majlis_ku_v11/room/${state.roomCode}/action`;

      connectMqttBroker((client) => {
        client.subscribe(actionTopic, { qos: 1 }, () => {
          state.connecting = false;
          state.players = [{ id: state.myId, name: state.myName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 }];
          state.screen = 'lobby';
          syncAllPlayers();
          render();
        });

        client.on('message', (topic, message) => {
          if (topic === actionTopic) {
            try {
              const data = JSON.parse(message.toString());
              onHostReceiveData(data);
            } catch (e) {}
          }
        });
      });
    }

    function joinHostRoom() {
      const name = (state.myName || '').trim();
      const code = normalizeDigits(state.roomCode);
      state.roomCode = code;
      if (!name || !code) return showToast('⚠️ تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');

      localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();
      state.role = 'player';
      state.connecting = true;
      render();

      const stateTopic = `majlis_ku_v11/room/${code}/state`;
      const actionTopic = `majlis_ku_v11/room/${code}/action`;

      connectMqttBroker((client) => {
        let receivedRoomState = false;

        const joinTimeout = setTimeout(() => {
          if (!receivedRoomState && state.connecting) {
            state.connecting = false;
            showToast('⚠️ ئەم کۆدی ژوورە نەدۆزرایەوە! دڵنیابە لە کۆدەکە.');
            render();
          }
        }, 7000);

        client.subscribe(stateTopic, { qos: 1 }, () => {
          client.publish(actionTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name: state.myName }), { qos: 1 });
        });

        client.on('message', (topic, message) => {
          if (topic === stateTopic) {
            try {
              const data = JSON.parse(message.toString());
              receivedRoomState = true;
              clearTimeout(joinTimeout);
              state.connecting = false;
              onPlayerReceiveData(data);

              if (data.players && !data.players.some(p => p.id === state.myId)) {
                client.publish(actionTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name: state.myName }), { qos: 1 });
              }
            } catch (e) {}
          }
        });
      });
    }

    function onHostReceiveData(data) {
      if (data.type === 'JOIN') {
        let existing = state.players.find(p => p.id === data.id);
        if (existing) {
          existing.name = data.name;
        } else {
          let cleanName = data.name;
          if (state.players.some(p => p.name === cleanName && p.id !== data.id)) {
            cleanName = `${data.name} (${state.players.length + 1})`;
          }
          state.players.push({ id: data.id, name: cleanName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 });
        }
        syncAllPlayers();
        render();
      } else if (data.type === 'ANSWER') {
        const p = state.players.find(x => x.id === data.id);
        if (p && !state.revealAnswer) {
          p.currentAnswer = data.ansIdx;
          p.hasAnswered = true;
          p.answerTime = state.timeLeft;
        }
      }
    }

    function onPlayerReceiveData(data) {
      if (data.type === 'TIMER_TICK') {
        state.timeLeft = data.timeLeft;
        updateTimerUIOnly();
        return;
      }
      if (data.type === 'REVEAL_TICK') {
        state.revealCountdown = data.revealCountdown;
        updateRevealCountdownUIOnly();
        return;
      }
      if (data.type === 'SYNC') {
        const prevReveal = state.revealAnswer;
        const prevScreen = state.screen;
        const prevQIndex = state.qIndex;

        state.screen = data.screen;
        state.countdownVal = data.countdownVal;
        state.qIndex = data.qIndex;
        state.timeLeft = data.timeLeft;
        state.questionDuration = data.questionDuration;
        state.revealAnswer = data.revealAnswer;
        state.revealCountdown = data.revealCountdown || 5;
        if (Array.isArray(data.selectedVibeIds)) state.selectedVibeIds = data.selectedVibeIds;
        if (data.comedyResult) state.comedyResult = data.comedyResult;
        state.campTaskResult = data.campTaskResult || '';

        const myOld = state.players.find(p => p.id === state.myId);
        const keepMyChoice = !data.revealAnswer && prevQIndex === data.qIndex && myOld;
        state.players = data.players.map(p => {
          if (p.id === state.myId && keepMyChoice) {
            return { ...p, currentAnswer: myOld.currentAnswer, hasAnswered: myOld.hasAnswered };
          }
          return p;
        });

        if (!state.players.some(p => p.id === state.myId)) {
          state.players.push({
            id: state.myId,
            name: state.myName,
            score: 0,
            lastGain: 0,
            streak: 0,
            hasAnswered: keepMyChoice ? myOld.hasAnswered : false,
            currentAnswer: keepMyChoice ? myOld.currentAnswer : null
          });
        }

        if (data.currentQuestion) {
          state.questions = new Array(data.totalQuestions).fill(null);
          state.questions[state.qIndex] = data.currentQuestion;
        }

        if (!prevReveal && state.revealAnswer && state.screen === 'playing') {
          const me = state.players.find(p => p.id === state.myId);
          const qObj = state.questions[state.qIndex];
          if (me && qObj && me.currentAnswer === qObj.ans) playTone('correct');
          else playTone('wrong');
        }

        if (prevScreen !== 'finished' && state.screen === 'finished') {
          launchConfetti();
        }
        render();
      }
    }

    function broadcastPayload(payload, retain = false) {
      if (state.role !== 'host' || !state.mqttClient || !state.roomCode) return;
      const stateTopic = `majlis_ku_v11/room/${state.roomCode}/state`;
      state.mqttClient.publish(stateTopic, JSON.stringify(payload), { qos: 0, retain });
    }

    function syncAllPlayers() {
      if (state.role !== 'host') return;
      const qObj = state.questions[state.qIndex];
      const safeQuestion = qObj ? {
        q: qObj.q,
        opts: qObj.opts,
        ans: state.revealAnswer ? qObj.ans : null
      } : null;

      const safePlayers = state.players.map(p => ({
        id: p.id,
        name: p.name,
        score: p.score,
        lastGain: state.revealAnswer ? p.lastGain : 0,
        streak: p.streak,
        hasAnswered: false,
        currentAnswer: state.revealAnswer ? p.currentAnswer : null
      }));

      broadcastPayload({
        type: 'SYNC',
        screen: state.screen,
        countdownVal: state.countdownVal,
        selectedVibeIds: state.selectedVibeIds,
        players: safePlayers,
        currentQuestion: safeQuestion,
        totalQuestions: state.questions.length,
        qIndex: state.qIndex,
        timeLeft: state.timeLeft,
        questionDuration: state.questionDuration,
        revealAnswer: state.revealAnswer,
        revealCountdown: state.revealCountdown,
        comedyResult: state.comedyResult,
        campTaskResult: state.campTaskResult
      }, true);
    }

    function hostStartCompetition() {
      requestScreenWakeLock();
      state.campTaskResult = '';
      state.questions = getLocalQuestions(state.selectedTopics, state.questionLimit);
      state.qIndex = 0;
      state.players.forEach(p => { p.score = 0; p.lastGain = 0; p.streak = 0; p.hasAnswered = false; p.currentAnswer = null; });
      runPreGameCountdown();
    }

    function runPreGameCountdown() {
      clearInterval(state.timerInterval);
      clearInterval(state.revealInterval);
      state.screen = 'countdown';
      state.countdownVal = 10;
      syncAllPlayers();
      render();
      playTone('tick');

      state.timerInterval = setInterval(() => {
        state.countdownVal--;
        if (state.countdownVal <= 0) {
          clearInterval(state.timerInterval);
          state.screen = 'playing';
          beginQuestionCountdown();
        } else {
          playTone('tick');
          syncAllPlayers();
          render();
        }
      }, 1000);
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval);
      clearInterval(state.revealInterval);
      state.timeLeft = state.questionDuration;
      state.revealAnswer = false;
      state.players.forEach(p => { p.hasAnswered = false; p.currentAnswer = null; p.answerTime = 0; p.lastGain = 0; });
      syncAllPlayers();
      render();

      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');

        if (state.timeLeft <= 0) {
          revealQuestionResult();
        } else {
          updateTimerUIOnly();
          if (state.role === 'host') {
            broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft }, false);
          }
        }
      }, 1000);
    }

    function submitPlayerAnswer(optIdx) {
      const me = state.players.find(p => p.id === state.myId);
      if (!me || state.revealAnswer) return;

      me.currentAnswer = optIdx;
      me.hasAnswered = true;
      me.answerTime = state.timeLeft;
      render();

      if (state.role === 'player' && state.mqttClient && state.roomCode) {
        const actionTopic = `majlis_ku_v11/room/${state.roomCode}/action`;
        state.mqttClient.publish(actionTopic, JSON.stringify({ type: 'ANSWER', id: state.myId, ansIdx: optIdx }), { qos: 1 });
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval);
      clearInterval(state.revealInterval);
      state.revealAnswer = true;
      state.revealCountdown = 5;
      const qObj = state.questions[state.qIndex];

      state.players.forEach(p => {
        if (p.currentAnswer === qObj.ans) {
          p.streak = (p.streak || 0) + 1;
          const speedBonus = Math.round((p.answerTime / state.questionDuration) * 60);
          const streakBonus = p.streak >= 2 ? 25 : 0;
          const totalGain = 100 + speedBonus + streakBonus;
          p.lastGain = totalGain;
          p.score += totalGain;
        } else {
          p.streak = 0;
          p.lastGain = 0;
        }
      });

      const me = state.players.find(p => p.id === state.myId);
      if (me && me.currentAnswer === qObj.ans) playTone('correct');
      else playTone('wrong');

      syncAllPlayers();
      render();

      if (state.role === 'host') {
        state.revealInterval = setInterval(() => {
          state.revealCountdown--;
          if (state.revealCountdown <= 0) {
            clearInterval(state.revealInterval);
            advanceToNextQuestion();
          } else {
            updateRevealCountdownUIOnly();
            broadcastPayload({ type: 'REVEAL_TICK', revealCountdown: state.revealCountdown }, false);
          }
        }, 1000);
      }
    }

    function advanceToNextQuestion() {
      clearInterval(state.revealInterval);
      if (state.qIndex + 1 < state.questions.length) {
        state.qIndex++;
        beginQuestionCountdown();
      } else {
        state.comedyResult = getLocalComedyCommentary();
        state.screen = 'finished';
        launchConfetti();
        syncAllPlayers();
        render();
      }
    }

    function regenerateComedyNow() {
      state.comedyResult = getLocalComedyCommentary();
      syncAllPlayers();
      render();
    }

    function openCustomQModal() {
      toggleModal('settingsModal', false);
      document.getElementById('customQStatus').textContent = `کۆی پرسیارە تایبەتەکانت: ${customQuestions.length} پرسیار`;
      toggleModal('customQModal', true);
    }

    function saveCustomQuestion() {
      const q = document.getElementById('cqText').value.trim();
      const o0 = document.getElementById('cqOpt0').value.trim();
      const o1 = document.getElementById('cqOpt1').value.trim();
      const o2 = document.getElementById('cqOpt2').value.trim();
      const o3 = document.getElementById('cqOpt3').value.trim();

      if (!q || !o0 || !o1 || !o2 || !o3) {
        return showToast('⚠️ تکایە پرسیارەکە و هەر ٤ هەڵبژاردەکە پڕ بکەرەوە!');
      }

      const opts = [o0, o1, o2, o3].sort(() => Math.random() - 0.5);
      customQuestions.push({
        q,
        opts,
        ans: opts.indexOf(o0)
      });
      localStorage.setItem(KEYS.CUSTOM, JSON.stringify(customQuestions));
      document.getElementById('cqText').value = '';
      document.getElementById('cqOpt0').value = '';
      document.getElementById('cqOpt1').value = '';
      document.getElementById('cqOpt2').value = '';
      document.getElementById('cqOpt3').value = '';
      document.getElementById('customQStatus').textContent = `✅ زیادکرا! کۆی پرسیارە تایبەتەکانت: ${customQuestions.length}`;
      if (!state.selectedTopics.includes('پرسیارەکانی خۆم (تایبەت)')) {
        state.selectedTopics.push('پرسیارەکانی خۆم (تایبەت)');
      }
    }

    render();
  </script>
</body>
