<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #0f172a;
      --bg-elevated: #334155;
      --border: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-card: #f8fafc;
      --muted-main: #94a3b8;
      --muted-card: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.28);
      --emerald: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius: 18px;
    }

    body.light-mode {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #f1f5f9;
      --bg-elevated: #e2e8f0;
      --border: rgba(15, 23, 42, 0.1);
      --text-main: #0f172a;
      --text-card: #0f172a;
      --muted-main: #64748b;
      --muted-card: #475569;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-glow: rgba(124, 58, 237, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; transition: background 0.25s, color 0.25s; }

    .flex-center, .splash-logo, .brand-icon, .menu-lines-btn, .proj-toggle-btn, .btn, .pin-digit, .opt-num, .modal-backdrop.open {
      display: flex; align-items: center; justify-content: center;
    }

    #splashScreen { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; flex-direction: column; gap: 14px; animation: autoHideSplash 0.4s ease 1.7s forwards; }
    @keyframes autoHideSplash { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    .splash-logo { width: 82px; height: 82px; border-radius: 24px; background: var(--accent); color: #fff; font-size: 2.5rem; box-shadow: 0 10px 30px var(--accent-glow); }
    .splash-title { font-weight: 900; font-size: 2.2rem; }

    header { padding: 10px 14px; border-bottom: 1.5px solid var(--border); background: var(--bg-surface); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .brand-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 1.2rem; box-shadow: 0 4px 12px var(--accent-glow); }
    .brand-title { font-weight: 900; font-size: 1.25rem; }

    .menu-lines-btn { width: 40px; height: 40px; border-radius: 11px; background: var(--bg-card); border: 1.5px solid var(--border); flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
    .menu-lines-btn span { width: 20px; height: 2.8px; background: var(--text-card); border-radius: 3px; }
    .menu-lines-btn:active, .cycle-btn:active, .mini-icon-btn:active { transform: scale(0.94); }

    main { max-width: 640px; width: 100%; margin: 0 auto; padding: 12px 12px 50px; flex: 1; }
    .card { background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 14px; margin-bottom: 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14); }
    h2 { font-size: 1.15rem; font-weight: 900; margin-bottom: 4px; text-align: center; }
    p.sub { color: var(--muted-main); font-size: 0.8rem; text-align: center; margin-bottom: 12px; line-height: 1.45; font-weight: 600; }

    .welcome-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 12px; background: var(--bg-card); padding: 5px; border-radius: 13px; border: 1px solid var(--border); }
    .w-tab { padding: 9px 4px; border-radius: 9px; border: none; background: transparent; color: var(--muted-card); font-weight: 800; font-size: 0.76rem; cursor: pointer; transition: 0.2s; text-align: center; }
    .w-tab.active, .proj-toggle-btn.active, .chip-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

    .host-top-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .host-top-row .input { margin-bottom: 0; flex: 1; }
    .proj-toggle-btn { padding: 0 13px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--muted-card); font-size: 0.78rem; font-weight: 800; cursor: pointer; gap: 5px; white-space: nowrap; }
    .proj-toggle-btn.active { width: 100%; padding: 11px 14px; }

    .input { width: 100%; padding: 11px 13px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; margin-bottom: 10px; outline: none; text-align: center; transition: 0.2s; }
    .input::placeholder { color: var(--muted-card); opacity: 0.85; }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .btn { width: 100%; padding: 12px 16px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; cursor: pointer; gap: 8px; margin-bottom: 8px; transition: 0.15s; }
    .btn:active:not(:disabled) { transform: translateY(2px); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }
    .btn-primary { background: var(--accent); color: #fff; border: none; box-shadow: 0 6px 18px var(--accent-glow); }
    .btn-emerald { background: var(--emerald); border: none; color: #fff; }
    .btn-amber { background: var(--amber); border: none; color: #fff; }

    .section-box, .cycle-btn, .q-banner, .next-auto-banner, .comedy-card, .about-info-box { background: var(--bg-card); color: var(--text-card); border-radius: 14px; }
    .section-box { border: 1.5px solid var(--border); padding: 10px; margin-bottom: 10px; }
    .section-label { font-size: 0.74rem; font-weight: 800; color: var(--muted-card); text-align: center; margin-bottom: 7px; }

    .chips-wrap, .players-wrap { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .chip-btn { padding: 6px 11px; border-radius: 50px; border: 1.5px solid transparent; background: var(--bg-elevated); color: var(--text-card); font-size: 0.77rem; font-weight: 800; cursor: pointer; transition: 0.15s; }

    .cycle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 12px; }
    .cycle-btn { border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 6px; text-align: center; cursor: pointer; }
    .cycle-btn small { display: block; font-size: 0.66rem; color: var(--muted-card); font-weight: 700; margin-bottom: 2px; }
    .cycle-btn strong { display: block; font-size: 0.82rem; font-weight: 900; color: var(--accent); }

    .qr-wrap { background: #fff; padding: 11px; border-radius: 16px; width: fit-content; margin: 6px auto 12px; border: 3px solid var(--accent); }
    .pin-boxes { display: flex; justify-content: center; gap: 8px; margin: 4px 0 12px; direction: ltr; }
    .pin-digit { width: 46px; height: 52px; border-radius: 12px; background: var(--bg-card); color: var(--accent); border: 2px solid var(--accent); font-size: 1.5rem; font-weight: 900; }

    .players-wrap { margin: 8px 0; }
    .p-badge { background: var(--bg-card); color: var(--text-card); border: 1.5px solid var(--accent); padding: 5px 12px; border-radius: 50px; font-weight: 800; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; }
    .kick-btn { background: var(--danger); border: none; color: #fff; width: 19px; height: 19px; border-radius: 50%; font-size: 0.68rem; cursor: pointer; }

    .quiz-top-meta, .opt-card, .leader-row, .comedy-head { display: flex; justify-content: space-between; align-items: center; }
    .quiz-top-meta { margin-bottom: 7px; font-weight: 800; font-size: 0.82rem; }
    .source-tag { font-size: 0.72rem; padding: 3px 9px; border-radius: 50px; background: var(--bg-card); color: var(--accent); border: 1px solid var(--border); }
    .timer-track { height: 9px; background: var(--bg-card); border-radius: 50px; overflow: hidden; margin-bottom: 12px; }
    .timer-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--accent), var(--danger)); transition: width 0.95s linear; }

    .q-banner { font-size: 1.08rem; font-weight: 900; text-align: center; padding: 16px 12px; margin-bottom: 12px; line-height: 1.6; border: 1.5px solid var(--border); }
    .opts-list, .comedy-grid { display: grid; gap: 9px; }
    .opt-card { padding: 12px 13px; border-radius: 13px; border: 2px solid var(--border); background: var(--bg-card); color: var(--text-card); font-size: 0.92rem; font-weight: 800; cursor: pointer; gap: 10px; transition: 0.15s; }
    .opt-right { display: flex; align-items: center; gap: 9px; text-align: right; }
    .opt-num { width: 28px; height: 28px; border-radius: 8px; background: var(--bg-elevated); color: var(--text-card); font-weight: 900; font-size: 0.82rem; flex-shrink: 0; }
    .opt-card.selected { border-color: var(--accent); background: var(--accent-glow); }
    .opt-card.selected .opt-num { background: var(--accent); color: #fff; }
    .opt-card.correct { background: #059669 !important; color: #fff !important; border-color: #10b981 !important; }
    .opt-card.correct .opt-num { background: rgba(255,255,255,0.2) !important; color: #fff !important; }
    .opt-card.wrong { background: #dc2626 !important; color: #fff !important; border-color: #ef4444 !important; }
    .opt-card.wrong .opt-num { background: rgba(255,255,255,0.2) !important; color: #fff !important; }

    .gain-badge { background: var(--emerald); color: #fff; padding: 2px 7px; border-radius: 50px; font-size: 0.72rem; margin-right: 5px; }
    .next-auto-banner { margin-top: 12px; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--accent); text-align: center; font-weight: 800; font-size: 0.82rem; }

    .leader-row { padding: 10px 12px; border-radius: 11px; background: var(--bg-card); color: var(--text-card); border: 1.5px solid var(--border); margin-bottom: 7px; font-weight: 800; font-size: 0.86rem; gap: 6px; flex-wrap: wrap; }
    .leader-row.first { border: 2px solid var(--amber); }
    .vibe-rank-tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 50px; background: var(--bg-elevated); color: var(--text-card); margin-right: 5px; }

    .comedy-grid { margin: 12px 0; text-align: right; }
    .comedy-card { padding: 12px 14px; line-height: 1.6; font-size: 0.88rem; font-weight: 700; }
    .comedy-card.winner-box { border: 2px solid var(--emerald); }
    .comedy-card.loser-box { border: 2px solid var(--accent); }
    .comedy-card.task-box { border: 2px dashed var(--amber); }
    .comedy-head { gap: 8px; font-weight: 900; font-size: 0.88rem; margin-bottom: 4px; }
    .mini-icon-btn { background: var(--bg-elevated); color: var(--text-card); border: 1px solid var(--accent); border-radius: 8px; padding: 2px 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; }

    .countdown-overlay { text-align: center; padding: 40px 16px; }
    .countdown-num { font-size: 4.5rem; font-weight: 900; color: var(--accent); }
    .toast-msg { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); color: var(--text-main); border: 2px solid var(--accent); padding: 9px 16px; border-radius: 50px; font-size: 0.82rem; font-weight: 800; z-index: 400; text-align: center; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72); display: none; z-index: 250; padding: 14px; }
    .modal-box { background: var(--bg-surface); border: 2px solid var(--border); border-radius: var(--radius); max-width: 460px; width: 100%; padding: 18px; max-height: 88vh; overflow-y: auto; }
    .about-info-box { padding: 16px; text-align: center; line-height: 1.9; margin: 12px 0; font-weight: 800; border: 1.5px solid var(--border); }
  </style>
</head>
<body>

  <div id="splashScreen" class="flex-center" onclick="this.remove()">
    <div class="splash-logo">🎲</div>
    <div class="splash-title">مەجلیس</div>
  </div>

  <header>
    <div class="brand" onclick="if(state.role!=='player')resetToHome()">
      <div class="brand-icon" id="headerBrandIcon">🎲</div>
      <div class="brand-title">مەجلیس</div>
    </div>
    <div id="headerMenuContainer"></div>
  </header>

  <main id="appContainer"></main>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <h3 style="margin-bottom:12px;text-align:center;">لیستی سەرەکی</h3>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <button class="btn" onclick="toggleThemeMode()">🌓 گۆڕینی دۆخی شەو / ڕۆژ</button>
        <button class="btn" onclick="toggleSound()" id="soundBtnLabel">🔊 دەنگی یاری: چالاکە</button>
        <button class="btn" onclick="openCustomQModal()">✍️ زیادکردنی پرسیاری تایبەت</button>
        <button class="btn" onclick="toggleModal('settingsModal',false);toggleModal('aboutModal',true);">ℹ️ دەربارە</button>
      </div>
      <button class="btn btn-primary" style="margin-top:10px;margin-bottom:0;" onclick="toggleModal('settingsModal',false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="aboutModal">
    <div class="modal-box">
      <h3 style="margin-bottom:10px;text-align:center;">ℹ️ دەربارەی مەجلیس</h3>
      <div class="about-info-box">
        <div>بەرهەم هێنراوە لەلایەن بڵند خضر</div>
        <div style="direction:ltr;margin-top:6px;font-size:0.95rem;color:var(--accent);">Blndxdr3@gmail.com</div>
      </div>
      <button class="btn btn-primary" style="margin-bottom:0;" onclick="toggleModal('aboutModal',false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="customQModal">
    <div class="modal-box">
      <h3 style="margin-bottom:6px;">✍️ زیادکردنی پرسیاری تایبەتی خۆت</h3>
      <p style="font-size:0.78rem;color:var(--muted-main);margin-bottom:10px;">پرسیار لەسەر هاوڕێکانت بنووسە بۆ ئەوەی لە بەشی (پرسیارەکانی خۆم) یاری پێ بکەن:</p>
      <input type="text" id="cqText" class="input" placeholder="دەقی پرسیارەکە بنووسە..." style="text-align:right;" />
      <input type="text" id="cqOpt0" class="input" placeholder="وەڵامی ڕاست ✅" style="text-align:right;" />
      <input type="text" id="cqOpt1" class="input" placeholder="هەڵبژاردەی هەڵەی ١" style="text-align:right;" />
      <input type="text" id="cqOpt2" class="input" placeholder="هەڵبژاردەی هەڵەی ٢" style="text-align:right;" />
      <input type="text" id="cqOpt3" class="input" placeholder="هەڵبژاردەی هەڵەی ٣" style="text-align:right;" />
      <div id="customQStatus" style="font-size:0.78rem;color:var(--emerald);text-align:center;margin-bottom:8px;font-weight:800;"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="toggleModal('customQModal',false);render();">داخستن</button>
        <button class="btn btn-primary" onclick="saveCustomQuestion()">➕ زیادکردن</button>
      </div>
    </div>
  </div>

  <script>
    const KEYS = { SEEN: 'MAJLIS_SEEN_HISTORY', CUSTOM: 'MAJLIS_CUSTOM_QUESTIONS', NAME: 'MAJLIS_PLAYER_NAME', ID: 'MAJLIS_PLAYER_ID', THEME: 'MAJLIS_THEME_MODE' };
    setTimeout(() => document.getElementById('splashScreen')?.remove(), 1900);

    let wakeLock = null;
    async function requestScreenWakeLock() {
      try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {}
    }

    let persistentId = localStorage.getItem(KEYS.ID) || ('U_' + Math.random().toString(36).substring(2, 10));
    localStorage.setItem(KEYS.ID, persistentId);

    const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
    let customQuestions = loadJSON(KEYS.CUSTOM), seenQuestions = loadJSON(KEYS.SEEN);
    if (localStorage.getItem(KEYS.THEME) === 'light') document.body.classList.add('light-mode');

    const normalizeDigits = s => String(s || '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776).trim().toUpperCase();
    const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    const toggleModal = (id, show) => document.getElementById(id)?.classList.toggle('open', show);
    const pickRand = arr => arr[Math.floor(Math.random() * arr.length)];
    const Q = (q, opts, diff) => ({ q, opts, ans: 0, diff });

    const QUESTION_VIBES = [
      { id: 'camping', icon: '⛺', title: 'چادرگە' },
      { id: 'friends_funny', icon: '😂', title: 'هاوڕێیان' },
      { id: 'qiyam', icon: '🌙', title: 'شەوبێداری' },
      { id: 'formal', icon: '💼', title: 'فەرمی' },
      { id: 'family', icon: '👨‍👩‍👧‍👦', title: 'خێزانی' }
    ];

    const VIBE_RANK_TITLES = {
      friends_funny: { first: '👑 سەرۆکی گەعدە', last: '💸 خاوەنی دەعوەتەکە', secondLast: '☕ چایچیی مەجلیس', mid: '😎 هاوڕێی قسەخۆش' },
      camping: { first: '🔥 فەرماندەی چادرگە', last: '🫖 چایچیی سەر خەڵووز', secondLast: '🧽 قاپشۆری گەشت', mid: '🧭 گەشتیاری کارامە' },
      qiyam: { first: '🌙 پێشەنگی شەوبێداران', last: '😴 خەواڵووی کۆڕەکە', secondLast: '🕯️ بانگبێژی پارشێو', mid: '✨ هاوەڵی بێدار' },
      formal: { first: '🎙️ سەرۆکی دیوان', last: '📝 بڕیاردەری کۆبوونەوە', secondLast: '📂 ڕێکەری پرۆتۆکۆڵ', mid: '💼 ئەندامی کارا' },
      family: { first: '🌟 تاجی سەری خێزان', last: '🍉 میوەپاککەری ماڵ', secondLast: '🫖 سینی هەڵگری دیوان', mid: '🌺 گوڵی مەجلیس' }
    };

    const PRESET_TOPICS = [
      'یاسایی', 'گەشت و چادرگە', 'مێژوویی',
      'زانیاری گشتی جۆراوجۆر', 'وەرزشی', 'مەتەڵ و زیرەکی',
      'ئاینی و قورئان', 'زانستی گشتی', 'تەکنەلۆژیا و ژیریی دەستکرد',
      'ئەدەب و شیعر', 'زیندەزانی و تەندروستی', 'زمانەوانی و پەندی پێشینان',
      'جوگرافیا', 'زانیاری گشتی جیهانی', 'ئاژەڵان و سروشت',
      'پرسیارەکانی خۆم (تایبەت)'
    ];

    const QUESTION_BANK = {
      'یاسایی': [
        Q('لە یاسای شارستانیدا، تەمەنی یاسایی کامڵبوون (سن الرشد) لە عێراق چەند ساڵە؟', ['١٨ ساڵی تەواو', '١٥ ساڵ', '٢١ ساڵ', '٢٠ ساڵ'], 'ئاسان'),
        Q('بەرزترین یاسا لە ناو هەر دەوڵەتێکدا کامەیە کە نابێت هیچ یاسایەکی تر پێچەوانەی بێت؟', ['دەستوور (الدستور)', 'یاسای هاتوچۆ', 'پەیڕەوی ناوخۆ', 'بڕیاری شارەوانی'], 'ئاسان'),
