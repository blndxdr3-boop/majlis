<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس | پێشبڕکێی هاوڕێیان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-dark: #060913;
      --bg-surface: rgba(15, 23, 42, 0.92);
      --bg-card: rgba(30, 41, 59, 0.78);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.42);
      --accent: #ec4899;
      --emerald: #10b981;
      --danger: #f43f5e;
      --amber: #f59e0b;
      --cyan: #06b6d4;
      --radius: 20px;
    }

    body.light-mode {
      --bg-dark: #f1f5f9;
      --bg-surface: rgba(255, 255, 255, 0.92);
      --bg-card: rgba(226, 232, 240, 0.85);
      --border: rgba(15, 23, 42, 0.12);
      --text: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.25) 0px, transparent 45%),
        radial-gradient(at 90% 85%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.12) 0px, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    /* شاشەی دەستپێک (Splash Screen) */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.5s ease;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 10px 30px var(--primary-glow);
      animation: pulseSplash 1.2s infinite alternate;
    }

    @keyframes pulseSplash {
      from { transform: scale(0.92); }
      to { transform: scale(1.08); }
    }

    .splash-title {
      font-weight: 900;
      font-size: 2rem;
      background: linear-gradient(90deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      backdrop-filter: blur(14px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .brand-title {
      font-weight: 900;
      font-size: 1.2rem;
      background: linear-gradient(90deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }

    .icon-pill:hover { border-color: var(--primary); }

    main {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 14px 70px;
      flex: 1;
    }

    .card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 900;
      margin-bottom: 6px;
      text-align: center;
    }

    p.sub {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.55;
    }

    .welcome-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 16px;
      background: var(--bg-card);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .w-tab {
      padding: 10px 6px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .w-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
      transition: 0.2s;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.22);
    }

    .input.custom-active {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
    }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
      margin-bottom: 10px;
    }

    .btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--primary); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      color: #fff;
      box-shadow: 0 8px 24px var(--primary-glow);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #059669, #10b981);
      border: none;
      color: #fff;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
    }

    .btn-cyan {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border: none;
      color: #fff;
    }

    .btn-amber {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--amber);
      color: #fde68a;
    }

    .vibe-section {
      background: var(--bg-card);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.2);
      color: #a5f3fc;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .vibe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }

    .vibe-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .vibe-card strong {
      font-size: 0.8rem;
      display: block;
      color: var(--text);
    }

    .vibe-card small {
      font-size: 0.68rem;
      color: var(--muted);
      display: block;
    }

    .vibe-card.active {
      background: linear-gradient(145deg, rgba(6, 182, 212, 0.28), rgba(139, 92, 246, 0.25));
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
    }

    .ai-config-box {
      background: linear-gradient(145deg, rgba(139, 92, 246, 0.14), rgba(236, 72, 153, 0.08));
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.25);
      color: #e9d5ff;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .topic-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      justify-content: center;
    }

    .topic-chip {
      padding: 7px 12px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    .topic-chip.active {
      background: var(--primary);
      border-color: #c084fc;
      color: #fff;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
    }

    .settings-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .setting-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 12px;
      text-align: center;
    }

    .setting-box label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .setting-box select {
      background: var(--bg-surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 6px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.8rem;
      width: 100%;
      outline: none;
    }

    .qr-wrap {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      width: fit-content;
      margin: 10px auto 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .room-pin {
      background: rgba(139, 92, 246, 0.16);
      border: 2px dashed var(--primary);
      color: #9333ea;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-align: center;
      padding: 8px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 12px 0;
    }

    .p-badge {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      padding: 6px 12px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .kick-btn {
      background: rgba(244, 63, 94, 0.25);
      border: none;
      color: var(--danger);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.7rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      flex-wrap: wrap;
      gap: 6px;
    }

    .source-tag {
      font-size: 0.72rem;
      padding: 3px 9px;
      border-radius: 50px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #a855f7;
    }

    .timer-track {
      height: 10px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 50px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--emerald), var(--amber), var(--danger));
      transition: width 0.95s linear;
    }

    .q-banner {
      font-size: 1.14rem;
      font-weight: 900;
      text-align: center;
      padding: 20px 14px;
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      line-height: 1.65;
      color: var(--text);
    }

    .opts-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .opt-card {
      padding: 15px 16px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      text-align: right;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.15s;
    }

    .opt-card:hover:not(:disabled) { border-color: var(--primary); }

    .opt-card.selected {
      border-color: var(--cyan);
      background: rgba(6, 182, 212, 0.22);
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.2);
    }

    .opt-card.correct {
      border-color: var(--emerald);
      background: rgba(16, 185, 129, 0.32);
      color: #065f46;
    }

    .opt-card.wrong {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.28);
      color: #9f1239;
    }

    body.light-mode .opt-card.correct { color: #065f46; }
    body.light-mode .opt-card.wrong { color: #9f1239; }

    .gain-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.22);
      color: var(--emerald);
      border: 1px solid var(--emerald);
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.74rem;
      margin-right: 6px;
      animation: popIn 0.3s ease;
    }

    .next-auto-banner {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: var(--primary);
      text-align: center;
      font-weight: 800;
      font-size: 0.86rem;
    }

    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text);
    }

    .leader-row.first {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.25), var(--bg-card));
      border-color: var(--amber);
    }

    .comedy-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 16px 0;
      text-align: right;
    }

    .comedy-card {
      padding: 16px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 0.94rem;
      font-weight: 700;
    }

    .comedy-card.winner-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(6, 182, 212, 0.1));
      border: 1px solid var(--emerald);
      color: var(--emerald);
    }

    .comedy-card.loser-box {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(245, 158, 11, 0.1));
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .comedy-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 0.98rem;
      margin-bottom: 6px;
    }

    .emoji-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .emoji-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      font-size: 1.25rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .emoji-btn:active { transform: scale(1.25); }

    .floating-emoji {
      position: fixed;
      bottom: 40px;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 300;
      animation: floatUp 2.4s ease-out forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-340px) scale(1.4); opacity: 0; }
    }

    .countdown-overlay {
      text-align: center;
      padding: 50px 20px;
    }

    .countdown-num {
      font-size: 5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: popIn 0.4s ease;
    }

    .confetti-piece {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      z-index: 280;
      pointer-events: none;
      animation: fallDown 3.2s linear forwards;
    }

    @keyframes fallDown {
      to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    .toast-msg {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 800;
      z-index: 400;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      animation: popIn 0.25s ease;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 500px;
      width: 100%;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
      color: var(--text);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- شاشەی دەستپێک (Splash Screen) -->
  <div id="splashScreen">
    <div class="splash-logo">🎲</div>
    <div class="splash-title">مەجلیس</div>
  </div>

  <header>
    <div class="brand" onclick="resetToHome()">
      <div class="brand-icon">🎲</div>
      <div class="brand-title">مەجلیس</div>
    </div>
    <div class="header-controls">
      <button class="icon-pill" onclick="openSettingsModal()">⚙️ دەستکاری</button>
    </div>
  </header>

  <main id="appContainer"></main>

  <!-- مۆداڵی ڕێکخستنەکان و دەستکاری (Settings & Tools Modal) -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <h3 style="margin-bottom:14px;">⚙️ ڕێکخستن و دەستکاری</h3>
      
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn" onclick="closeSettingsModal(); openCustomQModal();">✍️ زیادکردنی پرسیاری تایبەت</button>
        <button class="btn" onclick="toggleThemeMode()" id="themeModalBtn">🌓 گۆڕینی دۆخی شەو و ڕۆژ</button>
        <button class="btn" onclick="closeSettingsModal(); openApiModal();">🔑 کلیلی زیرەکی دەستکرد (AI)</button>
        <button class="btn" onclick="clearAskedHistory(); closeSettingsModal();">🔄 سفرکردنەوەی مێژووی پرسیارەکان</button>
      </div>

      <div style="display:flex; justify-content:flex-end; margin-top:16px;">
        <button class="btn btn-primary" style="width:auto;" onclick="closeSettingsModal()">داخستن</button>
      </div>
    </div>
  </div>

  <!-- مۆداڵی کلیلی AI -->
  <div class="modal-backdrop" id="apiModal">
    <div class="modal-box">

    const params = new URLSearchParams(window.location.search);

    function showToast(msg) {
      const old = document.querySelector('.toast-msg');
      if (old) old.remove();
      const t = document.createElement('div');
      t.className = 'toast-msg';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function launchConfetti() {
      const colors = ['#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#06b6d4'];
      for (let i = 0; i < 40; i++) {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.backgroundColor = colors[i % colors.length];
        c.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }

    let audioCtx = null;
    function playTone(type) {
      if (!state.soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.32);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, audioCtx.currentTime);
          osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'tick') {
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        }
      } catch (e) {}
    }

    function toggleSound() {
      state.soundOn = !state.soundOn;
      document.getElementById('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
    }

    function markQuestionSeen(qText) {
      if (!seenQuestions.includes(qText)) {
        seenQuestions.push(qText);
        if (seenQuestions.length > 300) seenQuestions.shift();
        try { localStorage.setItem(STORAGE_SEEN_Q, JSON.stringify(seenQuestions)); } catch (e) {}
      }
    }

    function clearAskedHistory() {
      seenQuestions = [];
      localStorage.removeItem(STORAGE_SEEN_Q);
      showToast('✅ مێژووی پرسیارە کراوەکان سفر کرایەوە!');
    }

    function selectVibe(vibeId) {
      state.selectedVibeId = vibeId;
      render();
    }

    function handleTopicChipClick(topic) {
      state.selectedTopic = topic;
      state.customTopicText = '';
      render();
    }

    function handleCustomTopicInput(val) {
      state.customTopicText = val;
      const inp = document.getElementById('customTopicInp');
      const chips = document.querySelectorAll('.topic-chip');
      if (val.trim().length > 0) {
        state.selectedTopic = '';
        chips.forEach(c => c.classList.remove('active'));
        if (inp) inp.classList.add('custom-active');
      } else {
        state.selectedTopic = PRESET_TOPICS[0];
        if (chips[0]) chips[0].classList.add('active');
        if (inp) inp.classList.remove('custom-active');
      }
    }

    function fetchWithTimeout(url, options, timeoutMs = 9500) {
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeoutMs))
      ]);
    }

    async function generateAIQuestions(topic, count, difficulty) {
      if (topic === 'پرسیارەکانی خۆم (تایبەت)' && customQuestions.length > 0) {
        state.questionSourceLabel = '✍️ پرسیاری تایبەتی خۆت';
        return [...customQuestions].sort(() => Math.random() - 0.5).slice(0, count);
      }

      const avoidSample = seenQuestions.slice(-18).join(' | ');
      const randomSeed = Math.floor(Math.random() * 999999);

      const prompt = `تۆ پسپۆڕی دروستکردنی پرسیاری پێشبڕکێیت بە زمانی کوردیی سۆرانیی پاراو.
تکایە رێک ${count} پرسیاری هەڵبژاردن (٤ هەڵبژاردەیی) تەنها و تەنها لەسەر ئەم بابەتە دروست بکە: "${topic}".
مەرجی توند: دەبێت ١٠٠٪ی پرسیارەکان راستەوخۆ و بە پاکی لەسەر "${topic}" بن بە ئاستی قورسی "${difficulty}".
ژمارەی هەڕەمەکی: ${randomSeed}.
ئەم پرسیارانە دووبارە مەکەرەوە: [${avoidSample}].
تەنها بە شێوازی JSON Array وەڵام بدەرەوە بەم فۆرماتە:
[{"q":"دەقی پرسیار؟","opts":["وەڵامی ١","وەڵامی ٢","وەڵامی ٣","وەڵامی ٤"],"ans":0}]`;

      if (state.apiKey && state.apiKey.trim().startsWith('AIza')) {
        try {
          const resp = await fetchWithTimeout(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(state.apiKey.trim())}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.9 }
            })
          }, 9000);
          if (resp.ok) {
            const data = await resp.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const parsed = extractValidQuestions(rawText);
            if (parsed.length >= 3) {
              state.questionSourceLabel = '✨ Gemini AI';
              return parsed.slice(0, count);
            }
          }
        } catch (e) {}
      }

      try {
        const resp2 = await fetchWithTimeout('https://text.pollinations.ai/openai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'openai',
            messages: [
              { role: 'system', content: 'You are an expert Kurdish Sorani quiz generator. Generate questions strictly about the requested topic. Return ONLY a raw JSON array.' },
              { role: 'user', content: prompt }
            ],
            seed: randomSeed
          })
        }, 9500);
        if (resp2.ok) {
          const data2 = await resp2.json();
          const rawText2 = data2?.choices?.[0]?.message?.content || '';
          const parsed2 = extractValidQuestions(rawText2);
          if (parsed2.length >= 3) {
            state.questionSourceLabel = '🤖 زیرەکی دەستکردی ڕاستەوخۆ';
            return parsed2.slice(0, count);
          }
        }
      } catch (e) {}

      state.questionSourceLabel = `📚 بانکی ناوخۆیی (${topic})`;
      const specificBank = TOPIC_BANKS[topic] || TOPIC_BANKS['زانیاری گشتی جۆراوجۆر'];
      let unseenSpecific = specificBank.filter(item => !seenQuestions.includes(item.q));
      if (unseenSpecific.length < count) {
        unseenSpecific = [...specificBank];
      }

      return unseenSpecific.sort(() => Math.random() - 0.5).slice(0, count).map(item => {
        const correctText = item.opts[item.ans];
        const shuffledOpts = [...item.opts].sort(() => Math.random() - 0.5);
        markQuestionSeen(item.q);
        return {
          q: item.q,
          opts: shuffledOpts,
          ans: shuffledOpts.indexOf(correctText)
        };
      });
    }

    async function generateAIComedyCommentary() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0] || { name: 'پاڵەوان', score: 0 };
      const losers = sorted.slice(1);
      const isSolo = state.players.length <= 1;
      const loserNames = !isSolo ? losers.map(p => p.name).join(' و ') : '';
      const vibeObj = QUESTION_VIBES.find(v => v.id === state.selectedVibeId) || QUESTION_VIBES[0];
      const randomSeed = Math.floor(Math.random() * 999999);

      const fallbackWin = FALLBACK_WINNER_JOKES[randomSeed % FALLBACK_WINNER_JOKES.length].replace('{winner}', winner.name);
      const fallbackLose = isSolo
        ? `چونکە بە تەنها یاریت کرد (${winner.name})، هەم براوەیت و هەم دۆڕاو! دەبێت خۆت چایەک بۆ خۆت تێبکەیت و دەستخۆشی لە خۆت بکەیت!`
        : FALLBACK_LOSER_JOKES[randomSeed % FALLBACK_LOSER_JOKES.length].replace('{losers}', loserNames);

      const prompt = isSolo
        ? `یاریزان "${winner.name}" بە تەنها خۆی تاقیکردەوە و (${winner.score} خاڵ)ی هێنا لە کەشی "${vibeObj.title}" (${vibeObj.comedyHint}). دوو ڕستەی کۆمیدیی کوردی بنووسە: winnerJoke بۆ دەستخۆشیلێکردنی بەپێی ئەو کەشە، و loserJoke قسەیەکی خۆش لەسەر ئەوەی کە بە تەنها یاری دەکات. تەنها JSON: {"winnerJoke":"...","loserJoke":"..."}`
        : `تۆ پێشکەشکارێکی کۆمیدیی کوردیت لە یاریی "مەجلیس". بارودۆخ و شێوازی دانیشتنەکە بریتییە لە: "${vibeObj.title}" (${vibeObj.comedyHint}). براوە: "${winner.name}" (${winner.score} خاڵ). دۆڕاوەکان: "${loserNames}". دوو ڕستەی زۆر کۆمیدی و نوێ بە کوردیی سۆرانی ڕێک بەپێی کەشی "${vibeObj.title}" بنووسە (ژمارە: ${randomSeed}): winnerJoke بۆ پیرۆزبایی و پیاهەڵدانی براوە، و loserJoke تەعلیق و سزایەکی کۆمیدی بۆ دۆڕاوەکان گونجاو لەگەڵ بارودۆخی دانیشتنەکە. تەنها JSON: {"winnerJoke":"...","loserJoke":"..."}`;

      if (state.apiKey && state.apiKey.trim().startsWith('AIza')) {
        try {
          const resp = await fetchWithTimeout(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(state.apiKey.trim())}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          }, 7500);
          if (resp.ok) {
            const data = await resp.json();
            const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            const parsed = extractComedyJson(raw);
            if (parsed) return parsed;
          }
        } catch (e) {}
      }

      try {
        const resp2 = await fetchWithTimeout('https://text.pollinations.ai/openai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'openai',
            messages: [{ role: 'user', content: prompt }],
            seed: randomSeed
          })
        }, 8000);
        if (resp2.ok) {
          const data2 = await resp2.json();
          const raw2 = data2?.choices?.[0]?.message?.content || '';
          const parsed2 = extractComedyJson(raw2);
          if (parsed2) return parsed2;
        }
      } catch (e) {}

      return { winnerJoke: fallbackWin, loserJoke: fallbackLose };
    }

    function extractComedyJson(rawText) {
      try {
        const start = rawText.indexOf('{');
        const end = rawText.lastIndexOf('}');
        if (start === -1 || end === -1) return null;
        const obj = JSON.parse(rawText.substring(start, end + 1));
        if (obj && obj.winnerJoke && obj.loserJoke) return obj;
        return null;
      } catch (e) {
        return null;
      }
    }

    function extractValidQuestions(rawText) {
      try {
        const start = rawText.indexOf('[');
        const end = rawText.lastIndexOf(']');
        if (start === -1 || end === -1) return [];
        const arr = JSON.parse(rawText.substring(start, end + 1));
        if (!Array.isArray(arr)) return [];

        return arr.filter(item => item && typeof item.q === 'string' && Array.isArray(item.opts) && item.opts.length === 4).map(item => {
          const correctText = item.opts[item.ans] || item.opts[0];
          const shuffledOpts = [...item.opts].sort(() => Math.random() - 0.5);
          const newAns = shuffledOpts.indexOf(correctText);
          markQuestionSeen(item.q);
          return {
            q: item.q,
            opts: shuffledOpts,
            ans: newAns >= 0 ? newAns : 0
          };
        });
      } catch (e) {
        return [];
      }
    }

      window.history.replaceState({}, document.title, window.location.pathname);

    function renderLobbyScreen() {
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      const vibeObj = QUESTION_VIBES.find(v => v.id === state.selectedVibeId) || QUESTION_VIBES[0];
      const activeTopic = state.customTopicText.trim() || state.selectedTopic || PRESET_TOPICS[0];

      const playersChips = state.players.map(p => `
        <div class="p-badge">
          <span>👤 ${p.name}</span>
          ${state.role === 'host' && p.id !== state.myId ? `<button class="kick-btn" onclick="kickPlayer('${p.id}')" title="لادانی یاریزان">✕</button>` : ''}
        </div>
      `).join('');

      if (state.role === 'host') {
        return `
          <div class="card" style="text-align:center;">
            <h2>📱 بارکۆدی هاتنەژوورەوەی هاوڕێیان</h2>
            <p class="sub">کەش: <strong style="color:var(--cyan);">${vibeObj.icon} ${vibeObj.title}</strong> • بابەت: <strong style="color:var(--primary);">${activeTopic}</strong></p>
            
            <div class="qr-wrap" id="qrcode"></div>

            <div style="font-size:0.78rem; color:var(--muted); margin-bottom:4px;">کۆدی ژوور:</div>
            <div class="room-pin">${state.roomCode}</div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
              <button class="btn" onclick="copyInvite('${joinUrl}')">📋 کۆپیکردنی لینک</button>
              <button class="btn btn-emerald" onclick="shareInviteWA('${joinUrl}')">💬 ناردن لە واتسئەپ</button>
            </div>

            <h3>👥 ئامادەبووانی ناو مەجلیس (${state.players.length} کەس):</h3>
            <div class="players-wrap">${playersChips}</div>

            <button class="btn btn-primary" style="margin-top:16px; font-size:1.02rem;" ${state.generatingAI ? 'disabled' : ''} onclick="hostStartCompetition()">
              ${state.generatingAI ? '<span class="spinner"></span> خەریکی ئامادەکردنی پرسیارەکانە...' : '✨ دروستکردنی پرسیار و دەستپێکردن!'}
            </button>
          </div>
        `;
      } else {
        return `
          <div class="card" style="text-align:center;">
            <h2>✅ تۆ لە ناو مەجلیسەکەدایت!</h2>
            <p class="sub">چاوەڕێ بکە تا سەرپەرشتیاری ژوورەکە پێشبڕکێکە دەست پێ دەکات...</p>
            <div class="room-pin">${state.roomCode}</div>
            <h3>👥 هاوڕێیانی ئامادەبوو (${state.players.length}):</h3>
            <div class="players-wrap">${playersChips}</div>
          </div>
        `;
      }
    }

    function renderCountdownScreen() {
      const activeTopic = state.customTopicText.trim() || state.selectedTopic || PRESET_TOPICS[0];
      return `
        <div class="card countdown-overlay">
          <h2>🚀 ئامادەبن! پێشبڕکێ دەست پێ دەکات</h2>
          <p class="sub">بابەت: <strong style="color:var(--primary);">${activeTopic}</strong> (${state.questionSourceLabel})</p>
          <div class="countdown-num">${state.countdownVal}</div>
        </div>
      `;
    }

    function renderPlayingScreen() {
      const qObj = state.questions[state.qIndex];
      const me = state.players.find(p => p.id === state.myId);
      const myAns = me ? me.currentAnswer : null;
      const pct = Math.max(0, (state.timeLeft / state.questionDuration) * 100);

      const optsHtml = qObj.opts.map((opt, idx) => {
        let cls = 'opt-card';
        if (state.revealAnswer) {
          if (idx === qObj.ans) cls += ' correct';
          else if (myAns === idx) cls += ' wrong';
        } else if (myAns === idx) {
          cls += ' selected';
        }

        return `
          <button class="${cls}" ${state.revealAnswer ? 'disabled' : ''} onclick="submitPlayerAnswer(${idx})">
            <span>${idx + 1}. ${opt}</span>
            <span>${state.revealAnswer && idx === qObj.ans ? '✅' : (state.revealAnswer && myAns === idx ? '❌' : '')}</span>
          </button>
        `;
      }).join('');

      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const leaderboardHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">
          <span>
            ${i === 0 ? '👑' : `${i + 1}.`} ${p.name}
            ${p.streak >= 2 ? `<small style="color:var(--amber);">🔥x${p.streak}</small>` : ''}
            ${state.revealAnswer && p.lastGain > 0 ? `<span class="gain-badge">+${p.lastGain}</span>` : ''}
          </span>
          <span style="color:var(--amber);">${p.score} خاڵ</span>
        </div>
      `).join('');

      return `
        <div class="card">
          <div class="quiz-top-meta">
            <span>پرسیاری ${state.qIndex + 1} لە ${state.questions.length}</span>
            <span class="source-tag">${state.questionSourceLabel}</span>
            <span id="liveTimeLabel" style="color:var(--amber);">⏱️ ${state.timeLeft} چرکە</span>
          </div>
          <div class="timer-track">
            <div class="timer-fill" id="liveTimeFill" style="width:${pct}%"></div>
          </div>

          <div class="q-banner">${qObj.q}</div>
          <div class="opts-list">${optsHtml}</div>

          ${state.revealAnswer ? `
            <div class="next-auto-banner" id="autoNextBanner">
              ${state.generatingComedy
                ? '<span class="spinner"></span> خەریکی ئامادەکردنی قسە کۆمیدییەکەی کۆتاییە...'
                : (state.qIndex + 1 < state.questions.length
                    ? `⏳ پرسیاری دواتر دوای ${state.revealCountdown} چرکەی تر دەست پێ دەکات...`
                    : `🏆 ئەنجامی کۆتایی دوای ${state.revealCountdown} چرکەی تر پیشان دەدرێت...`)}
            </div>
          ` : ''}
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px; font-size:0.95rem;">📊 ڕیزبەندی خاڵەکان:</h3>
          ${leaderboardHtml}
        </div>
      `;
    }

    function renderFinishedScreen() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      const winner = sorted[0];
      const isSolo = state.players.length <= 1;

      const ranksHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">
          <span>${i === 0 ? '🥇 براوەی یەکەم:' : (i === 1 ? '🥈 دووەم:' : (i === 2 ? '🥉 سێیەم:' : `🐢 ${i + 1}.`))} ${p.name}</span>
          <span style="color:var(--emerald);">${p.score} خاڵ</span>
        </div>
      `).join('');

      return `
        <div class="card" style="text-align:center;">
          <div style="font-size:3.5rem; margin-bottom:2px;">🏆</div>
          <h2>${isSolo ? `ئەنجامی تاقیکردنەوەی ${winner ? winner.name : ''}` : `پاڵەوانی مەجلیس: ${winner ? winner.name : ''}!`}</h2>
          <p class="sub">کۆی خاڵی بەدەستهاتوو: <strong>${winner ? winner.score : 0} خاڵ</strong></p>

          <div class="comedy-grid">
            <div class="comedy-card winner-box">
              <div class="comedy-head">👑 پەیامی AI بۆ براوەی مەجلیس:</div>
              <div>"${state.comedyResult.winnerJoke || 'بژی پاڵەوان!'}"</div>
            </div>
            <div class="comedy-card loser-box">
              <div class="comedy-head">${isSolo ? '😄 پەیامی کۆمیدیی تاکەکەسی:' : '😂 تەعلیقی AI بۆ دۆڕاوەکان:'}</div>
              <div>"${state.comedyResult.loserJoke || 'جاری داهاتوو هەوڵ بدەنەوە!'}"</div>
            </div>
          </div>

          <div style="text-align:right; margin:16px 0;">
            <h3 style="font-size:0.95rem; margin-bottom:8px;">📋 ڕیزبەندی کۆتایی یاریزانەکان:</h3>
            ${ranksHtml}
          </div>

          ${(state.role === 'host' || state.role === 'solo') ? `
            <button class="btn" onclick="regenerateComedyNow()" ${state.generatingComedy ? 'disabled' : ''}>
              ${state.generatingComedy ? '<span class="spinner"></span> خەریکی نووسینی قسەیەکی ترە...' : '🎲 گۆڕینی قسە کۆمیدییەکە (شتێکی تر بڵێ!)'}
            </button>
          ` : ''}

          ${state.role === 'host' ? `
            <button class="btn btn-primary" ${state.generatingAI ? 'disabled' : ''} onclick="hostStartCompetition()">
              ${state.generatingAI ? '<span class="spinner"></span> خەریکی ئامادەکردنی پرسیاری نوێیە...' : '✨ خولێکی نوێ لەگەڵ هاوڕێیان'}
            </button>
          ` : ''}
          ${state.role === 'solo' ? `
            <button class="btn btn-primary" ${state.generatingAI ? 'disabled' : ''} onclick="startSoloGame()">
              ${state.generatingAI ? '<span class="spinner"></span> خەریکی ئامادەکردنی پرسیاری نوێیە...' : '✨ خولێکی نوێ بە پرسیاری نوێ'}
            </button>
          ` : ''}
          <button class="btn" onclick="resetToHome()">🏠 گەڕانەوە بۆ پەڕەی سەرەکی</button>
        </div>
      `;
    }

    function drawQRCode() {
      const box = document.getElementById('qrcode');
      if (!box) return;
      box.innerHTML = '';
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`;
      const isLight = document.body.classList.contains('light-mode');
      new QRCode(box, {
        text: joinUrl,
        width: 185,
        height: 185,
        colorDark: isLight ? "#0f172a" : "#060913",
        colorLight: "#ffffff"
      });
    }

    function copyInvite(url) {
      navigator.clipboard.writeText(url);
      showToast('📋 لینکی مەجلیس کۆپی کرا!');
    }

    function shareInviteWA(url) {
      const msg = `🎲 وەرنە ناو پێشبڕکێی مەجلیس! کۆدی ژوور: (${state.roomCode})\nکلیک لەم لینکە بکەن:\n${url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function kickPlayer(playerId) {
      state.players = state.players.filter(p => p.id !== playerId);
      delete state.connections[playerId];
      syncAllPlayers();
      render();
    }

    async function startSoloGame() {
      const name = (state.myName || '').trim() || 'بڵند';
      state.myName = name;
      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'solo';
      state.generatingAI = true;
      render();

      const topic = state.customTopicText.trim() || state.selectedTopic || PRESET_TOPICS[0];
      state.questions = await generateAIQuestions(topic, state.questionLimit, state.difficulty);
      state.generatingAI = false;

      state.players = [{ id: state.myId, name: state.myName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 }];
      state.qIndex = 0;
      runPreGameCountdown();
    }

    function startHostRoom() {
      const name = (state.myName || '').trim();
      if (!name) return showToast('⚠️ تکایە سەرەتا ناوی خۆت بنووسە!');
      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'host';
      state.connecting = true;
      render();

      state.roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      const peerId = 'MAJLIS_V8_' + state.roomCode;
      state.peer = new Peer(peerId);

      state.peer.on('open', () => {
        state.connecting = false;
        state.players = [{ id: state.myId, name: state.myName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 }];
        state.screen = 'lobby';
        render();
      });

      state.peer.on('error', () => {
        state.connecting = false;
        showToast('⚠️ کێشە لە هێڵی ئینتەرنێتدا هەیە، دووبارە هەوڵ بدەرەوە.');
        render();
      });

      state.peer.on('connection', (conn) => {
        conn.on('data', (data) => onHostReceiveData(conn, data));
      });
    }

    function joinHostRoom() {
      const name = (state.myName || '').trim();
      const code = (state.roomCode || '').trim().toUpperCase();
      if (!name || !code) return showToast('⚠️ تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');

      localStorage.setItem(USER_NAME_KEY, name);
      state.role = 'player';
      state.connecting = true;
      render();

      if (state.peer) {
        try { state.peer.destroy(); } catch (e) {}
      }
      state.peer = new Peer();
      state.peer.on('open', () => {
        const conn = state.peer.connect('MAJLIS_V8_' + code, { reliable: true });
        state.hostConn = conn;

        const timeout = setTimeout(() => {
          if (state.connecting) {
            state.connecting = false;
            showToast('⚠️ ئەم کۆدی ژوورە نەدۆزرایەوە! دڵنیابە لە کۆدەکە.');
            render();
          }
        }, 8000);

        conn.on('open', () => {
          clearTimeout(timeout);
          state.connecting = false;
          conn.send({ type: 'JOIN', id: state.myId, name: state.myName });
        });

        conn.on('data', (data) => onPlayerReceiveData(data));
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.role === 'player' && state.roomCode) {
        if (!state.hostConn || !state.hostConn.open) {
          joinHostRoom();
        }
      }
    });

    function onHostReceiveData(conn, data) {
      if (data.type === 'JOIN') {
        state.connections[data.id] = conn;
        let existing = state.players.find(p => p.id === data.id || p.name === data.name);
        if (existing) {
          existing.id = data.id;
          existing.name = data.name;
        } else {
          state.players.push({ id: data.id, name: data.name, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 });
        }
        syncAllPlayers();
        render();
      } else if (data.type === 'ANSWER') {
        const p = state.players.find(x => x.id === data.id);
        if (p && !state.revealAnswer) {
          p.currentAnswer = data.ansIdx;
          p.hasAnswered = true;
          p.answerTime = state.timeLeft;
        }
      }
    }

    function onPlayerReceiveData(data) {
      if (data.type === 'TIMER_TICK') {
        state.timeLeft = data.timeLeft;
        updateTimerUIOnly();
        return;
      }
      if (data.type === 'REVEAL_TICK') {
        state.revealCountdown = data.revealCountdown;
        updateRevealCountdownUIOnly();
        return;
      }
      if (data.type === 'SYNC') {
        const prevReveal = state.revealAnswer;
        const prevScreen = state.screen;
        const prevQIndex = state.qIndex;

        state.screen = data.screen;
        state.countdownVal = data.countdownVal;
        state.questionSourceLabel = data.questionSourceLabel;
        state.qIndex = data.qIndex;
        state.timeLeft = data.timeLeft;
        state.questionDuration = data.questionDuration;
        state.revealAnswer = data.revealAnswer;
        state.revealCountdown = data.revealCountdown || 3;
        if (data.comedyResult) state.comedyResult = data.comedyResult;

        const myOld = state.players.find(p => p.id === state.myId);
        const keepMyChoice = !data.revealAnswer && prevQIndex === data.qIndex && myOld;
        state.players = data.players.map(p => {
          if (p.id === state.myId && keepMyChoice) {
            return { ...p, currentAnswer: myOld.currentAnswer, hasAnswered: myOld.hasAnswered };
          }
          return p;
        });

        if (data.currentQuestion) {
          state.questions = new Array(data.totalQuestions).fill(null);
          state.questions[state.qIndex] = data.currentQuestion;
        }

        if (!prevReveal && state.revealAnswer && state.screen === 'playing') {
          const me = state.players.find(p => p.id === state.myId);
          const qObj = state.questions[state.qIndex];
          if (me && qObj && me.currentAnswer === qObj.ans) playTone('correct');
          else playTone('wrong');
        }

        if (prevScreen !== 'finished' && state.screen === 'finished') {
          launchConfetti();
        }
        render();
      }
    }

    function broadcastPayload(payload) {
      Object.values(state.connections).forEach(c => {
        if (c && c.open) c.send(payload);
      });
    }

    function syncAllPlayers() {
      if (state.role !== 'host') return;
      const qObj = state.questions[state.qIndex];
      const safeQuestion = qObj ? {
        q: qObj.q,
        opts: qObj.opts,
        ans: state.revealAnswer ? qObj.ans : null
      } : null;

      const safePlayers = state.players.map(p => ({
        id: p.id,
        name: p.name,
        score: p.score,
        lastGain: state.revealAnswer ? p.lastGain : 0,
        streak: p.streak,
        hasAnswered: false,
        currentAnswer: state.revealAnswer ? p.currentAnswer : null
      }));

      broadcastPayload({
        type: 'SYNC',
        screen: state.screen,
        countdownVal: state.countdownVal,
        questionSourceLabel: state.questionSourceLabel,
        players: safePlayers,
        currentQuestion: safeQuestion,
        totalQuestions: state.questions.length,
        qIndex: state.qIndex,
        timeLeft: state.timeLeft,
        questionDuration: state.questionDuration,
        revealAnswer: state.revealAnswer,
        revealCountdown: state.revealCountdown,
        comedyResult: state.comedyResult
      });
    }

    async function hostStartCompetition() {
      state.generatingAI = true;
      render();

      const topic = state.customTopicText.trim() || state.selectedTopic || PRESET_TOPICS[0];
      state.questions = await generateAIQuestions(topic, state.questionLimit, state.difficulty);
      state.generatingAI = false;

      state.qIndex = 0;
      state.players.forEach(p => { p.score = 0; p.lastGain = 0; p.streak = 0; p.hasAnswered = false; p.currentAnswer = null; });
      runPreGameCountdown();
    }

    function runPreGameCountdown() {
      clearInterval(state.timerInterval);
      clearInterval(state.revealInterval);
      state.screen = 'countdown';
      state.countdownVal = 3;
      syncAllPlayers();
      render();
      playTone('tick');

      state.timerInterval = setInterval(() => {
        state.countdownVal--;
        if (state.countdownVal <= 0) {
          clearInterval(state.timerInterval);
          state.screen = 'playing';
          beginQuestionCountdown();
        } else {
          playTone('tick');
          syncAllPlayers();
          render();
        }
      }, 1000);
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval);
      clearInterval(state.revealInterval);
      state.timeLeft = state.questionDuration;
      state.revealAnswer = false;
      state.players.forEach(p => { p.hasAnswered = false; p.currentAnswer = null; p.answerTime = 0; p.lastGain = 0; });
      syncAllPlayers();
      render();

      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');

        if (state.timeLeft <= 0) {
          revealQuestionResult();
        } else {
          updateTimerUIOnly();
          if (state.role === 'host') {
            broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft });
          }
        }
      }, 1000);
    }

    function submitPlayerAnswer(optIdx) {
      const me = state.players.find(p => p.id === state.myId);
      if (!me || state.revealAnswer) return;

      me.currentAnswer = optIdx;
      me.hasAnswered = true;
      me.answerTime = state.timeLeft;
      render();

      if (state.role === 'player' && state.hostConn && state.hostConn.open) {
        state.hostConn.send({ type: 'ANSWER', id: state.myId, ansIdx: optIdx });
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval);
      clearInterval(state.revealInterval);
      state.revealAnswer = true;
      state.revealCountdown = 3;
      const qObj = state.questions[state.qIndex];

      state.players.forEach(p => {
        if (p.currentAnswer === qObj.ans) {
          p.streak = (p.streak || 0) + 1;
          const speedBonus = Math.round((p.answerTime / state.questionDuration) * 60);
          const streakBonus = p.streak >= 2 ? 25 : 0;
          const totalGain = 100 + speedBonus + streakBonus;
          p.lastGain = totalGain;
          p.score += totalGain;
        } else {
          p.streak = 0;
          p.lastGain = 0;
        }
      });

      const me = state.players.find(p => p.id === state.myId);
      if (me && me.currentAnswer === qObj.ans) playTone('correct');
      else playTone('wrong');

      syncAllPlayers();
      render();

      if (state.role === 'host' || state.role === 'solo') {
        state.revealInterval = setInterval(() => {
          state.revealCountdown--;
          if (state.revealCountdown <= 0) {
            clearInterval(state.revealInterval);
            advanceToNextQuestion();
          } else {
            updateRevealCountdownUIOnly();
            if (state.role === 'host') {
              broadcastPayload({ type: 'REVEAL_TICK', revealCountdown: state.revealCountdown });
            }
          }
        }, 1000);
      }
    }

    async function advanceToNextQuestion() {
      clearInterval(state.revealInterval);
      if (state.qIndex + 1 < state.questions.length) {
        state.qIndex++;
        beginQuestionCountdown();
      } else {
        state.generatingComedy = true;
        render();
        state.comedyResult = await generateAIComedyCommentary();
        state.generatingComedy = false;
        state.screen = 'finished';
        launchConfetti();
        syncAllPlayers();
        render();
      }
    }

    async function regenerateComedyNow() {
      state.generatingComedy = true;
      render();
      state.comedyResult = await generateAIComedyCommentary();
      state.generatingComedy = false;
      syncAllPlayers();
      render();
    }

    function openSettingsModal() {
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function openApiModal() {
      closeSettingsModal();
      document.getElementById('apiKeyInput').value = state.apiKey;
      document.getElementById('seenCountTxt').textContent = seenQuestions.length;
      document.getElementById('apiModal').classList.add('open');
    }

    function closeApiModal() {
      document.getElementById('apiModal').classList.remove('open');
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      state.apiKey = val;
      localStorage.setItem(STORAGE_API_KEY, val);
      closeApiModal();
      showToast('✅ کلیلی زیرەکی دەستکرد پاشەکەوت کرا!');
    }

    function openCustomQModal() {
      closeSettingsModal();
      document.getElementById('customQStatus').textContent = `کۆی پرسیارە تایبەتەکانت: ${customQuestions.length} پرسیار`;
      document.getElementById('customQModal').classList.add('open');
    }

    function closeCustomQModal() {
      document.getElementById('customQModal').classList.remove('open');
      render();
    }

    function saveCustomQuestion() {
      const q = document.getElementById('cqText').value.trim();
      const o0 = document.getElementById('cqOpt0').value.trim();
      const o1 = document.getElementById('cqOpt1').value.trim();
      const o2 = document.getElementById('cqOpt2').value.trim();
      const o3 = document.getElementById('cqOpt3').value.trim();

      if (!q || !o0 || !o1 || !o2 || !o3) {
        return showToast('⚠️ تکایە پرسیارەکە و هەر ٤ هەڵبژاردەکە پڕ بکەرەوە!');
      }

      const opts = [o0, o1, o2, o3].sort(() => Math.random() - 0.5);
      customQuestions.push({
        q,
        opts,
        ans: opts.indexOf(o0)
      });
      localStorage.setItem(STORAGE_CUSTOM_Q, JSON.stringify(customQuestions));
      document.getElementById('cqText').value = '';
      document.getElementById('cqOpt0').value = '';
      document.getElementById('cqOpt1').value = '';
      document.getElementById('cqOpt2').value = '';
      document.getElementById('cqOpt3').value = '';
      document.getElementById('customQStatus').textContent = `✅ زیادکرا! کۆی پرسیارە تایبەتەکانت: ${customQuestions.length}`;
      state.selectedTopic = 'پرسیارەکانی خۆم (تایبەت)';
      state.customTopicText = '';
    }

    render();
  </script>
</body>
</html>
