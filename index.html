<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مەجلیس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-main: #f6f0e6;
      --bg-surface: #ece2d2;
      --bg-card: #5a381e;
      --bg-elevated: #704728;
      --border: rgba(90, 56, 30, 0.25);
      --text-main: #291a0d;
      --text-card: #fdfaf6;
      --muted-main: #6e5239;
      --muted-card: #e2cfb8;
      --primary: #422611;
      --primary-dark: #291608;
      --accent: #c88a4b;
      --emerald: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --radius: 20px;
    }

    body.dark-mode {
      --bg-main: #18100a;
      --bg-surface: #261910;
      --bg-card: #f3ece1;
      --bg-elevated: #e2d5c1;
      --border: rgba(243, 236, 225, 0.22);
      --text-main: #f6f0e6;
      --text-card: #291a0d;
      --muted-main: #c7ad94;
      --muted-card: #6e5239;
      --primary: #c88a4b;
      --primary-dark: #9e652b;
      --accent: #8c5523;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.25s, color 0.25s;
    }

    #splashScreen {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      animation: autoHideSplash 0.45s ease 1.8s forwards;
    }
    @keyframes autoHideSplash {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    .splash-logo {
      width: 86px;
      height: 86px;
      border-radius: 26px;
      background: var(--bg-card);
      color: var(--text-card);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
    }
    .splash-title {
      font-weight: 900;
      font-size: 2.3rem;
      color: var(--text-main);
    }

    header {
      padding: 12px 16px;
      border-bottom: 1.5px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-card);
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.3rem;
      color: var(--text-main);
    }

    .menu-lines-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 8px;
    }
    .menu-lines-btn span {
      display: block;
      width: 22px;
      height: 3px;
      background-color: var(--text-card);
      border-radius: 3px;
    }
    .menu-lines-btn:active {
      transform: scale(0.94);
    }

    main {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 12px 60px;
      flex: 1;
    }

    .card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 4px;
      text-align: center;
      color: var(--text-main);
    }
    p.sub {
      color: var(--muted-main);
      font-size: 0.84rem;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.5;
      font-weight: 600;
    }

    .welcome-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 14px;
      background: var(--bg-card);
      padding: 5px;
      border-radius: 14px;
    }
    .w-tab {
      padding: 10px 4px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--muted-card);
      font-weight: 800;
      font-size: 0.76rem;
      cursor: pointer;
      text-align: center;
    }
    .w-tab.active {
      background: var(--bg-main);
      color: var(--text-main);
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg-card);
      color: var(--text-card);
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
    }
    .input::placeholder {
      color: var(--muted-card);
      opacity: 0.85;
    }
    .input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      color: var(--text-card);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn:active:not(:disabled) {
      transform: translateY(2px);
    }
    .btn:disabled {
      opacity: 0.55;
      pointer-events: none;
    }
    .btn-primary {
      background: var(--bg-card);
      color: var(--text-card);
      border: 2px solid var(--accent);
    }
    .btn-emerald {
      background: #059669;
      border: none;
      color: #fff;
    }

    .section-box {
      background: var(--bg-card);
      color: var(--text-card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      color: var(--text-card);
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.76rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .vibe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .vibe-card {
      background: var(--bg-elevated);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      color: var(--text-card);
    }
    .vibe-card .v-ico {
      font-size: 1.25rem;
      display: block;
      margin-bottom: 2px;
    }
    .vibe-card strong {
      font-size: 0.76rem;
      display: block;
      color: var(--text-card);
    }
    .vibe-card small {
      font-size: 0.64rem;
      color: var(--muted-card);
      display: block;
      margin-top: 2px;
    }
    .vibe-card.active {
      background: var(--bg-main);
      color: var(--text-main);
      border-color: var(--accent);
    }
    .vibe-card.active strong,
    .vibe-card.active small {
      color: var(--text-main);
    }

    .topic-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .topic-chip {
      padding: 7px 12px;
      border-radius: 50px;
      border: 1.5px solid transparent;
      background: var(--bg-elevated);
      color: var(--text-card);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
    }
    .topic-chip.active {
      background: var(--bg-main);
      color: var(--text-main);
      border-color: var(--accent);
    }

    .settings-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .setting-row-inline {
      background: var(--bg-card);
      color: var(--text-card);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .setting-row-inline label {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-card);
    }
    .seg-group {
      display: flex;
      gap: 5px;
    }
    .seg-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1.5px solid transparent;
      background: var(--bg-elevated);
      color: var(--text-card);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--bg-main);
      color: var(--text-main);
      border-color: var(--accent);
    }

    .qr-wrap {
      background: #fff;
      padding: 12px;
      border-radius: 18px;
      width: fit-content;
      margin: 8px auto 14px;
      border: 3px solid var(--bg-card);
    }
    .pin-boxes {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 6px 0 14px;
      direction: ltr;
    }
    .pin-digit {
      width: 48px;
      height: 54px;
      border-radius: 14px;
      background: var(--bg-card);
      color: var(--text-card);
      border: 2px solid var(--accent);
      font-size: 1.55rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .players-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 10px 0;
    }
    .p-badge {
      background: var(--bg-card);
      color: var(--text-card);
      padding: 6px 13px;
      border-radius: 50px;
      font-weight: 800;
      font-size: 0.84rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .kick-btn {
      background: var(--danger);
      border: none;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .quiz-top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.84rem;
    }
    .source-tag {
      font-size: 0.74rem;
      padding: 4px 10px;
      border-radius: 50px;
      background: var(--bg-card);
      color: var(--text-card);
    }
    .timer-track {
      height: 10px;
      background: var(--bg-card);
      border-radius: 50px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .timer-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.95s linear;
    }

    .q-banner {
      font-size: 1.12rem;
      font-weight: 900;
      text-align: center;
      padding: 18px 14px;
      background: var(--bg-card);
      color: var(--text-card);
      border-radius: 16px;
      margin-bottom: 14px;
      line-height: 1.65;
    }
    .opts-list {
      display: grid;
      gap: 10px;
    }
    .opt-card {
      padding: 13px 14px;
      border-radius: 14px;
      border: 2.5px solid transparent;
      background: var(--bg-card);
      color: var(--text-card);
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .opt-right {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
    }
    .opt-num {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--bg-main);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .opt-card.selected {
      border-color: var(--amber);
      background: var(--bg-elevated);
    }
    .opt-card.correct {
      background: #059669 !important;
      color: #fff !important;
      border-color: #10b981 !important;
    }
    .opt-card.wrong {
      background: #dc2626 !important;
      color: #fff !important;
      border-color: #ef4444 !important;
    }

    .gain-badge {
      display: inline-block;
      background: #10b981;
      color: #fff;
      padding: 2px 8px;
      border-radius: 50px;
      font-size: 0.74rem;
      margin-right: 6px;
    }
    .next-auto-banner {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-card);
      text-align: center;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-card);
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      gap: 8px;
      flex-wrap: wrap;
    }
    .leader-row.first {
      border: 2px solid var(--amber);
    }
    .vibe-rank-tag {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 50px;
      background: var(--bg-elevated);
      color: var(--text-card);
      margin-right: 6px;
    }

    .comedy-grid {
      display: grid;
      gap: 12px;
      margin: 16px 0;
      text-align: right;
    }
    .comedy-card {
      padding: 15px;
      border-radius: 16px;
      line-height: 1.7;
      font-size: 0.92rem;
      font-weight: 700;
      background: var(--bg-card);
      color: var(--text-card);
    }
    .comedy-card.winner-box {
      border: 2px solid var(--emerald);
    }
    .comedy-card.loser-box {
      border: 2px solid var(--accent);
    }
    .comedy-card.task-box {
      border: 2px dashed var(--amber);
      text-align: center;
    }
    .comedy-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 0.96rem;
      margin-bottom: 5px;
    }

    .countdown-overlay {
      text-align: center;
      padding: 46px 20px;
    }
    .countdown-num {
      font-size: 4.8rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .toast-msg {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      color: var(--text-card);
      border: 2px solid var(--accent);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.84rem;
      font-weight: 800;
      z-index: 400;
      text-align: center;
      max-width: 90vw;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 14px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-box {
      background: var(--bg-surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      max-width: 480px;
      width: 100%;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
      color: var(--text-main);
    }
    .about-info-box {
      background: var(--bg-card);
      color: var(--text-card);
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      line-height: 1.9;
      margin: 12px 0;
      font-weight: 800;
    }
    @media (max-width: 400px) {
      .vibe-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div id="splashScreen" onclick="this.remove()">
    <div class="splash-logo">☕</div>
    <div class="splash-title">مەجلیس</div>
  </div>

  <header>
    <div class="brand" onclick="onBrandClick()">
      <div class="brand-icon" id="headerBrandIcon">☕</div>
      <div class="brand-title">مەجلیس</div>
    </div>
    <div id="headerMenuContainer"></div>
  </header>

  <main id="appContainer"></main>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-box">
      <h3 style="margin-bottom:14px; text-align:center;">لیستی سەرەکی</h3>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn" onclick="toggleThemeMode()">🌓 گۆڕینی دۆخی ڕۆژ (شیری) / شەو (قاوەیی)</button>
        <button class="btn" onclick="toggleSound()" id="soundBtnLabel">🔊 دەنگی یاری: چالاکە</button>
        <button class="btn" onclick="openCustomQModal()">✍️ زیادکردنی پرسیاری تایبەت</button>
        <button class="btn" onclick="clearAskedHistory(); toggleModal('settingsModal', false);">🔄 سفرکردنەوەی مێژووی پرسیارەکان</button>
        <button class="btn" onclick="openAboutModal()">ℹ️ دەربارە</button>
      </div>
      <button class="btn btn-primary" style="margin-top:12px; margin-bottom:0;" onclick="toggleModal('settingsModal', false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="aboutModal">
    <div class="modal-box">
      <h3 style="margin-bottom:10px; text-align:center;">ℹ️ دەربارەی مەجلیس</h3>
      <div class="about-info-box">
        <div>بەرهەم هێنراوە لەلایەن بڵند خضر</div>
        <div style="direction:ltr; margin-top:6px; font-size:0.95rem;">Blndxdr3@gmail.com</div>
      </div>
      <button class="btn btn-primary" style="margin-bottom:0;" onclick="toggleModal('aboutModal', false)">داخستن</button>
    </div>
  </div>

  <div class="modal-backdrop" id="customQModal">
    <div class="modal-box">
      <h3 style="margin-bottom:8px;">✍️ زیادکردنی پرسیاری تایبەتی خۆت</h3>
      <p style="font-size:0.8rem; color:var(--muted-main); margin-bottom:10px;">پرسیار لەسەر هاوڕێکانت بنووسە بۆ ئەوەی لە بەشی (پرسیارەکانی خۆم) یاری پێ بکەن:</p>
      <input type="text" id="cqText" class="input" placeholder="دەقی پرسیارەکە بنووسە..." style="text-align:right;" />
      <input type="text" id="cqOpt0" class="input" placeholder="وەڵامی ڕاست ✅" style="text-align:right;" />
      <input type="text" id="cqOpt1" class="input" placeholder="هەڵبژاردەی هەڵەی ١" style="text-align:right;" />
      <input type="text" id="cqOpt2" class="input" placeholder="هەڵبژاردەی هەڵەی ٢" style="text-align:right;" />
      <input type="text" id="cqOpt3" class="input" placeholder="هەڵبژاردەی هەڵەی ٣" style="text-align:right;" />
      <div id="customQStatus" style="font-size:0.8rem; color:var(--emerald); text-align:center; margin-bottom:8px; font-weight:800;"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="toggleModal('customQModal', false); render();">داخستن</button>
        <button class="btn btn-primary" onclick="saveCustomQuestion()">➕ زیادکردن</button>
      </div>
    </div>
  </div>

  <script>
    const KEYS = { SEEN: 'MAJLIS_SEEN_HISTORY', CUSTOM: 'MAJLIS_CUSTOM_QUESTIONS', NAME: 'MAJLIS_PLAYER_NAME', ID: 'MAJLIS_PLAYER_ID', THEME: 'MAJLIS_THEME_MODE' };
    setTimeout(() => document.getElementById('splashScreen')?.remove(), 2000);

    let wakeLock = null;
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => wakeLock = null);
        }
      } catch (e) {}
    }

    let persistentId = localStorage.getItem(KEYS.ID) || ('U_' + Math.random().toString(36).substring(2, 10));
    localStorage.setItem(KEYS.ID, persistentId);

    const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
    let customQuestions = loadJSON(KEYS.CUSTOM), seenQuestions = loadJSON(KEYS.SEEN);

    if (localStorage.getItem(KEYS.THEME) === 'dark') document.body.classList.add('dark-mode');

    function normalizeDigits(str) {
      return String(str || '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776).trim().toUpperCase();
    }

      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), now = audioCtx.currentTime;
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
          [523.25, 659.25, 783.99].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.1));
          gain.gain.setValueAtTime(0.14, now); osc.start(); osc.stop(now + 0.32);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now); osc.frequency.setValueAtTime(150, now + 0.15);
          gain.gain.setValueAtTime(0.14, now); osc.start(); osc.stop(now + 0.3);
        } else {
          osc.frequency.setValueAtTime(680, now);

    function getLocalQuestions(topicsList, count, difficulty) {
      let combinedBank = [];
      topicsList.forEach(t => combinedBank.push(...(t === 'پرسیارەکانی خۆم (تایبەت)' ? customQuestions : (QUESTION_BANK[t] || []))));
      if (!combinedBank.length) Object.values(QUESTION_BANK).forEach(arr => combinedBank.push(...arr));

      let diffFiltered = combinedBank.filter(item => !item.diff || item.diff === difficulty);
      let otherDiff = combinedBank.filter(item => item.diff && item.diff !== difficulty);

      let unseen = diffFiltered.filter(item => !seenQuestions.includes(item.q));
      if (unseen.length < count) {
        const extraUnseen = otherDiff.filter(item => !seenQuestions.includes(item.q));
        unseen = [...unseen, ...extraUnseen];
      }

      if (unseen.length < count) {
        const topicQTexts = combinedBank.map(x => x.q);
        seenQuestions = seenQuestions.filter(q => !topicQTexts.includes(q));
        try { localStorage.setItem(KEYS.SEEN, JSON.stringify(seenQuestions)); } catch (e) {}
        unseen = [...diffFiltered, ...otherDiff];
      }

      const selected = [
        ...unseen.filter(i => !i.diff || i.diff === difficulty).sort(() => Math.random() - 0.5),
        ...unseen.filter(i => i.diff && i.diff !== difficulty).sort(() => Math.random() - 0.5)
      ].slice(0, count);

      return selected.map(item => {
        const correctText = item.opts[item.ans], opts = [...item.opts].sort(() => Math.random() - 0.5);
        markQuestionSeen(item.q);
        return { q: item.q, opts, ans: opts.indexOf(correctText) };
      });
    }

    function renderPlayingScreen() {

        return `
          <button class="${cls}" ${state.revealAnswer || isProjHost ? 'disabled' : ''} onclick="submitPlayerAnswer(${idx})">

        : `<p style="text-align:center;font-size:0.82rem;color:var(--muted-main);">هیچ یاریزانێک لە لیستەکەدا نییە.</p>`;

          ${state.revealAnswer ? `
            <div class="next-auto-banner" id="autoNextBanner">
              ${state.qIndex + 1 < state.questions.length
                ? `⏳ پرسیاری دواتر دوای ${state.revealCountdown} چرکەی تر دەست پێ دەکات...`
                : `🏆 ئەنجامی کۆتایی دوای ${state.revealCountdown} چرکەی تر پیشان دەدرێت...`}

          ` : ''}

        <div class="card"><h3 style="margin-bottom:10px;font-size:0.95rem;">📊 ڕیزبەندی خاڵەکان:</h3>${leaderboardHtml}</div>
      `;

    function renderFinishedScreen() {
      const sorted = [...state.players].sort((a, b) => b.score - a.score), winner = sorted[0];
      const vibeObj = QUESTION_VIBES.find(v => v.id === getPrimaryVibeId()) || QUESTION_VIBES[0];
      const medals = ['🥇 یەکەم:', '🥈 دووەم:', '🥉 سێیەم:'];
      const isHostOrProj = state.role === 'host' || state.role === 'projector_host';

      const ranksHtml = sorted.map((p, i) => `
        <div class="leader-row ${i === 0 ? 'first' : ''}">
          <span>${medals[i] || `🐢 ${i + 1}.`} ${p.name} <span class="vibe-rank-tag">${getPlayerRankTitle(i, sorted.length)}</span></span>
          <span>${p.score} خاڵ</span>
        </div>
      `).join('');

      return `
        <div class="card" style="text-align:center;">
          <div style="font-size:3.2rem;margin-bottom:2px;">${vibeObj.icon}</div>
          <h2>پاڵەوانی مەجلیس: ${winner ? winner.name : 'هیچ'}!</h2>
          <p class="sub">کۆی خاڵی بەدەستهاتوو: <strong>${winner ? winner.score : 0} خاڵ</strong></p>
          <div class="comedy-grid">
            <div class="comedy-card winner-box"><div class="comedy-head">👑 براوەی مەجلیس:</div><div>"${state.comedyResult.winnerJoke || 'بژی پاڵەوان!'}"</div></div>
            <div class="comedy-card loser-box"><div class="comedy-head">☕ بڕیاری مەجلیس بۆ دۆڕاوەکان:</div><div>"${state.comedyResult.loserJoke || 'جاری داهاتوو هەوڵ بدەنەوە!'}"</div></div>
            ${state.taskResult ? `<div class="comedy-card task-box"><div style="font-weight:900;font-size:0.98rem;margin-bottom:4px;">${vibeObj.icon} بڕیاری تیروپشکی مەجلیس:</div><div>${state.taskResult}</div></div>` : ''}
          </div>
          <div style="text-align:right;margin:16px 0;"><h3 style="font-size:0.95rem;margin-bottom:8px;">📋 ڕیزبەندی و نازناوی یاریزانەکان:</h3>${ranksHtml}</div>
          ${isHostOrProj ? `
            <button class="btn btn-primary" onclick="spinVibePenaltyTask()">${vibeObj.spinBtnLabel}</button>
            <button class="btn" onclick="regenerateComedyNow()">🎲 گۆڕینی قسەی مەجلیس (شتێکی تر بڵێ!)</button>
            <button class="btn btn-emerald" onclick="hostStartCompetition()">🔄 خولێکی نوێ لەگەڵ هاوڕێیان</button>
            <button class="btn" onclick="resetToHome()">🏠 گەڕانەوە بۆ پەڕەی سەرەکی</button>
          ` : ''}
        </div>

    }

    function drawQRCode() {
      const box = document.getElementById('qrcode');
      if (!box) return;
      box.innerHTML = '';
      new QRCode(box, { text: `${window.location.origin}${window.location.pathname}?room=${state.roomCode}`, width: 185, height: 185, colorDark: "#291a0d", colorLight: "#ffffff" });
    }

    function copyInvite(url) {
      navigator.clipboard.writeText(url);
      showToast('📋 لینکی مەجلیس کۆپی کرا!');
    }

    function shareInviteWA(url) {
      const msg = `☕ وەرنە ناو پێشبڕکێی مەجلیس! کۆدی ژوور: (${state.roomCode})\nکلیک لەم لینکە بکەن:\n${url}`;
      if (navigator.share) {
        navigator.share({ title: 'مەجلیس', text: msg, url }).catch(() => {});
      } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
      }
    }

    function kickPlayer(playerId) {
      state.players = state.players.filter(p => p.id !== playerId);
      syncAllPlayers();
      render();
    }

    function connectMqttBroker(onConnected) {
      try { state.mqttClient?.end(true); } catch (e) {}
      const brokers = [
        'wss://broker.emqx.io:8084/mqtt',
        'wss://broker.hivemq.com:8884/mqtt'
      ];
      let bIdx = 0;
      let connected = false;

      function tryConnect() {
        const url = brokers[bIdx % brokers.length];
        const client = mqtt.connect(url, {
          clientId: 'majlis_' + state.myId + '_' + Math.random().toString(16).slice(2, 6),
          clean: true,
          connectTimeout: 4500,
          reconnectPeriod: 2000
        });
        state.mqttClient = client;

        const failTimer = setTimeout(() => {
          if (!connected) {
            try { client.end(true); } catch (e) {}
            bIdx++;
            if (bIdx < brokers.length) tryConnect();
            else if (state.role === 'host' || state.role === 'projector_host') {
              onConnected(client);
            }
          }
        }, 4600);

        client.on('connect', () => {
          if (!connected) {
            connected = true;
            clearTimeout(failTimer);
            onConnected(client);
          }
        });
      }

      tryConnect();
    }

    function startHostRoom() {
      const name = (state.myName || '').trim();
      if (!name) return showToast('⚠️ تکایە سەرەتا ناوی خۆت بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();
      Object.assign(state, {
        role: 'host',
        isProjector: false,
        connecting: false,
        roomCode: String(Math.floor(1000 + Math.random() * 9000)),
        players: [{ id: state.myId, name: state.myName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 }],
        screen: 'lobby'
      });
      render();

      const actionTopic = `majlis_ku_v16/room/${state.roomCode}/action`;
      connectMqttBroker(client => {
        client.subscribe(actionTopic, { qos: 1 }, () => {
          syncAllPlayers();
        });
        client.on('message', (t, msg) => {
          if (t === actionTopic) try { onHostReceiveData(JSON.parse(msg.toString())); } catch (e) {}
        });
      });
    }

    function startProjectorRoom() {
      requestScreenWakeLock();
      Object.assign(state, {
        role: 'projector_host',
        isProjector: true,
        connecting: false,
        roomCode: String(Math.floor(1000 + Math.random() * 9000)),
        players: [],
        screen: 'lobby'
      });
      render();

      const actionTopic = `majlis_ku_v16/room/${state.roomCode}/action`;
      connectMqttBroker(client => {
        client.subscribe(actionTopic, { qos: 1 }, () => {
          syncAllPlayers();
        });
        client.on('message', (t, msg) => {
          if (t === actionTopic) try { onHostReceiveData(JSON.parse(msg.toString())); } catch (e) {}
        });
      });
    }

    function joinHostRoom() {
      const name = (state.myName || '').trim(), code = normalizeDigits(state.roomCode);
      state.roomCode = code;
      if (!name || !code) return showToast('⚠️ تکایە ناوی خۆت و کۆدی ژوورەکە بنووسە!');
      localStorage.setItem(KEYS.NAME, name);
      requestScreenWakeLock();
      Object.assign(state, { role: 'player', isProjector: false, connecting: true });
      render();

      const stateTopic = `majlis_ku_v16/room/${code}/state`, actionTopic = `majlis_ku_v16/room/${code}/action`;
      connectMqttBroker(client => {
        let received = false;
        const joinTimeout = setTimeout(() => {
          if (!received && state.connecting) {
            state.connecting = false;
            showToast('⚠️ ئەم کۆدی ژوورە نەدۆزرایەوە! دڵنیابە لە کۆدەکە.');
            render();
          }
        }, 7500);

        const pubJoin = () => client.publish(actionTopic, JSON.stringify({ type: 'JOIN', id: state.myId, name: state.myName }), { qos: 1 });
        client.subscribe(stateTopic, { qos: 1 }, pubJoin);
        client.on('message', (t, msg) => {
          if (t === stateTopic) try {
            const data = JSON.parse(msg.toString());
            received = true; clearTimeout(joinTimeout); state.connecting = false;
            onPlayerReceiveData(data);
            if (data.players && !data.players.some(p => p.id === state.myId)) pubJoin();
          } catch (e) {}
        });
      });
    }

    function onHostReceiveData(data) {
      if (data.type === 'JOIN') {
        const existing = state.players.find(p => p.id === data.id);
        if (existing) existing.name = data.name;
        else {
          const cleanName = state.players.some(p => p.name === data.name && p.id !== data.id) ? `${data.name} (${state.players.length + 1})` : data.name;
          state.players.push({ id: data.id, name: cleanName, score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null, answerTime: 0 });
        }
        syncAllPlayers(); render();
      } else if (data.type === 'ANSWER') {
        const p = state.players.find(x => x.id === data.id);
        if (p && !state.revealAnswer) Object.assign(p, { currentAnswer: data.ansIdx, hasAnswered: true, answerTime: state.timeLeft });
      }
    }

    function onPlayerReceiveData(data) {
      if (data.type === 'TIMER_TICK') { state.timeLeft = data.timeLeft; return updateTimerUIOnly(); }
      if (data.type === 'REVEAL_TICK') { state.revealCountdown = data.revealCountdown; return updateRevealCountdownUIOnly(); }
      if (data.type !== 'SYNC') return;

      const { revealAnswer: prevReveal, screen: prevScreen, qIndex: prevQIndex } = state;
      Object.assign(state, {
        screen: data.screen, countdownVal: data.countdownVal, qIndex: data.qIndex,
        timeLeft: data.timeLeft, questionDuration: data.questionDuration,
        revealAnswer: data.revealAnswer, revealCountdown: data.revealCountdown || 5,
        taskResult: data.taskResult || '', difficulty: data.difficulty || 'مامناوەند'
      });
      if (Array.isArray(data.selectedVibeIds)) state.selectedVibeIds = data.selectedVibeIds;
      if (data.comedyResult) state.comedyResult = data.comedyResult;

      const myOld = state.players.find(p => p.id === state.myId);
      const keepMyChoice = !data.revealAnswer && prevQIndex === data.qIndex && myOld;
      state.players = data.players.map(p => (p.id === state.myId && keepMyChoice) ? { ...p, currentAnswer: myOld.currentAnswer, hasAnswered: myOld.hasAnswered } : p);

      if (!state.players.some(p => p.id === state.myId)) {
        state.players.push({ id: state.myId, name: state.myName, score: 0, lastGain: 0, streak: 0, hasAnswered: keepMyChoice ? myOld.hasAnswered : false, currentAnswer: keepMyChoice ? myOld.currentAnswer : null });
      }
      if (data.currentQuestion) {
        state.questions = new Array(data.totalQuestions).fill(null);
        state.questions[state.qIndex] = data.currentQuestion;
      }
      if (!prevReveal && state.revealAnswer && state.screen === 'playing') {
        const me = state.players.find(p => p.id === state.myId), qObj = state.questions[state.qIndex];
        playTone(me && qObj && me.currentAnswer === qObj.ans ? 'correct' : 'wrong');
      }
      render();
    }

    function broadcastPayload(payload, retain = false) {
      if ((state.role === 'host' || state.role === 'projector_host') && state.mqttClient && state.roomCode) {
        try {
          state.mqttClient.publish(`majlis_ku_v16/room/${state.roomCode}/state`, JSON.stringify(payload), { qos: 0, retain });
        } catch (e) {}
      }
    }

    function syncAllPlayers() {
      if (state.role !== 'host' && state.role !== 'projector_host') return;
      const qObj = state.questions[state.qIndex];
      broadcastPayload({
        type: 'SYNC', screen: state.screen, countdownVal: state.countdownVal,
        selectedVibeIds: state.selectedVibeIds, difficulty: state.difficulty,
        players: state.players.map(p => ({ id: p.id, name: p.name, score: p.score, lastGain: state.revealAnswer ? p.lastGain : 0, streak: p.streak, hasAnswered: false, currentAnswer: state.revealAnswer ? p.currentAnswer : null })),
        currentQuestion: qObj ? { q: qObj.q, opts: qObj.opts, ans: state.revealAnswer ? qObj.ans : null } : null,
        totalQuestions: state.questions.length, qIndex: state.qIndex, timeLeft: state.timeLeft,
        questionDuration: state.questionDuration, revealAnswer: state.revealAnswer,
        revealCountdown: state.revealCountdown, comedyResult: state.comedyResult, taskResult: state.taskResult
      }, true);
    }

    function hostStartCompetition() {
      requestScreenWakeLock();
      Object.assign(state, {
        taskResult: '',
        questions: getLocalQuestions(state.selectedTopics, state.questionLimit, state.difficulty),
        qIndex: 0
      });
      state.players.forEach(p => Object.assign(p, { score: 0, lastGain: 0, streak: 0, hasAnswered: false, currentAnswer: null }));
      runPreGameCountdown();
    }

    function runPreGameCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { screen: 'countdown', countdownVal: 10 });
      syncAllPlayers(); render(); playTone('tick');
      state.timerInterval = setInterval(() => {
        if (--state.countdownVal <= 0) {
          clearInterval(state.timerInterval); state.screen = 'playing'; beginQuestionCountdown();
        } else { playTone('tick'); syncAllPlayers(); render(); }
      }, 1000);
    }

    function beginQuestionCountdown() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { timeLeft: state.questionDuration, revealAnswer: false });
      state.players.forEach(p => Object.assign(p, { hasAnswered: false, currentAnswer: null, answerTime: 0, lastGain: 0 }));
      syncAllPlayers(); render();
      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 3 && state.timeLeft > 0) playTone('tick');
        if (state.timeLeft <= 0) revealQuestionResult();
        else {
          updateTimerUIOnly();
          if (state.role === 'host' || state.role === 'projector_host') broadcastPayload({ type: 'TIMER_TICK', timeLeft: state.timeLeft }, false);
        }
      }, 1000);
    }

    function submitPlayerAnswer(optIdx) {
      if (state.role === 'projector_host') return;
      const me = state.players.find(p => p.id === state.myId);
      if (!me || state.revealAnswer) return;
      Object.assign(me, { currentAnswer: optIdx, hasAnswered: true, answerTime: state.timeLeft });
      render();
      if (state.role === 'player' && state.mqttClient && state.roomCode) {
        state.mqttClient.publish(`majlis_ku_v16/room/${state.roomCode}/action`, JSON.stringify({ type: 'ANSWER', id: state.myId, ansIdx: optIdx }), { qos: 1 });
      }
    }

    function revealQuestionResult() {
      clearInterval(state.timerInterval); clearInterval(state.revealInterval);
      Object.assign(state, { revealAnswer: true, revealCountdown: 5 });
      const qObj = state.questions[state.qIndex];

      state.players.forEach(p => {
        if (p.currentAnswer === qObj.ans) {
          p.streak = (p.streak || 0) + 1;
          p.lastGain = 100 + Math.round((p.answerTime / state.questionDuration) * 60) + (p.streak >= 2 ? 25 : 0);
          p.score += p.lastGain;
        } else { p.streak = 0; p.lastGain = 0; }
      });

      const me = state.players.find(p => p.id === state.myId);
      if (me) {
        playTone(me.currentAnswer === qObj.ans ? 'correct' : 'wrong');
      } else if (state.role === 'projector_host') {
        playTone('correct');
      }
      syncAllPlayers(); render();

      if (state.role === 'host' || state.role === 'projector_host') {
        state.revealInterval = setInterval(() => {
          if (--state.revealCountdown <= 0) { clearInterval(state.revealInterval); advanceToNextQuestion(); }
          else { updateRevealCountdownUIOnly(); broadcastPayload({ type: 'REVEAL_TICK', revealCountdown: state.revealCountdown }, false); }
        }, 1000);
      }
    }

    function advanceToNextQuestion() {
      clearInterval(state.revealInterval);
      if (state.qIndex + 1 < state.questions.length) { state.qIndex++; beginQuestionCountdown(); }
      else {
        Object.assign(state, { comedyResult: getLocalComedyCommentary(), screen: 'finished' });
        syncAllPlayers(); render();
      }
    }

    function regenerateComedyNow() {
      state.comedyResult = getLocalComedyCommentary();
      syncAllPlayers(); render();
    }

    function openCustomQModal() {
      toggleModal('settingsModal', false);
      document.getElementById('customQStatus').textContent = `کۆی پرسیارە تایبەتەکانت: ${customQuestions.length} پرسیار`;
      toggleModal('customQModal', true);
    }

    function saveCustomQuestion() {
      const ids = ['cqText', 'cqOpt0', 'cqOpt1', 'cqOpt2', 'cqOpt3'];
      const [q, o0, o1, o2, o3] = ids.map(id => document.getElementById(id).value.trim());
      if (!q || !o0 || !o1 || !o2 || !o3) return showToast('⚠️ تکایە پرسیارەکە و هەر ٤ هەڵبژاردەکە پڕ بکەرەوە!');

      const opts = [o0, o1, o2, o3].sort(() => Math.random() - 0.5);
      customQuestions.push({ q, opts, ans: opts.indexOf(o0), diff: state.difficulty });
      localStorage.setItem(KEYS.CUSTOM, JSON.stringify(customQuestions));
      ids.forEach(id => document.getElementById(id).value = '');
      document.getElementById('customQStatus').textContent = `✅ زیادکرا! کۆی پرسیارە تایبەتەکانت: ${customQuestions.length}`;
      if (!state.selectedTopics.includes('پرسیارەکانی خۆم (تایبەت)')) state.selectedTopics.push('پرسیارەکانی خۆم (تایبەت)');
    }

    render();
  </script>
</body>
</html>
